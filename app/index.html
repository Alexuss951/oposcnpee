            $("btnExport").onclick = exportProgress;
            $("btnImport").onclick = () => $("importFile").click();
            $("importFile").onchange = e => {
                const f = e.target.files[0];
                if (!f) return;
                const r = new FileReader();
                r.onload = () => importProgress(r.result);
                r.readAsText(f);
            };

            $("btnClearProg").onclick = () => {
                if (!confirm("¿Borrar TODO el progreso?\n\nSe perderán: temas leídos, racha, stats, marcadas, repasos pendientes, historial, examen en curso.\n\nEsta acción no se puede deshacer.")) return;
                if (!confirm("Confirmación final: ¿seguro que quieres borrar todo?")) return;
                clearAllProgress();
                alert("Progreso borrado. La página se va a recargar.");
                location.reload();
            };
        }

        function exportProgress() {
            const dump = {};
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith(LS_PREFIX)) dump[k] = localStorage.getItem(k);
            }
            const blob = new Blob([JSON.stringify({ app: "opos-cnp", v: 1, exportedAt: new Date().toISOString(), data: dump }, null, 2)],
                { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `opos-cnp-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function importProgress(text) {
            let obj;
            try { obj = JSON.parse(text); } catch { alert("Archivo no válido (no es JSON)."); return; }
            if (!obj || obj.app !== "opos-cnp" || !obj.data) { alert("Archivo no reconocido."); return; }
            if (!confirm("Esto sobrescribirá tu progreso actual con el del archivo. ¿Continuar?")) return;
            // wipe current opos-cnp keys, then load new ones
            const toDel = [];
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith(LS_PREFIX)) toDel.push(k);
            }
            toDel.forEach(k => localStorage.removeItem(k));
            for (const k in obj.data) {
                if (k.startsWith(LS_PREFIX)) localStorage.setItem(k, obj.data[k]);
            }
            alert("Progreso importado. La página se va a recargar.");
            location.reload();
        }

        function clearAllProgress() {
            const toDel = [];
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith(LS_PREFIX)) toDel.push(k);
            }
            toDel.forEach(k => localStorage.removeItem(k));
        }

        function renderResumeBanner() {
            const st = lsGet("test:current", null);
            const banner = $("resumeBanner");
            if (!st || !st.qids || !st.qids.length) { banner.innerHTML = ""; return; }
            const answered = st.answers.filter(a => a !== null).length;
            banner.innerHTML = `
    <div class="resume-banner">
      <div class="txt">Hay un examen en curso: <b>${escapeHtml(st.label)}</b> · ${answered}/${st.qids.length} contestadas</div>
      <button id="btnResume">Continuar</button>
      <button id="btnDiscard" class="discard">Descartar</button>
    </div>`;
            $("btnResume").onclick = () => { resumeExam(); };
            $("btnDiscard").onclick = () => {
                if (confirm("¿Descartar el examen en curso?")) { lsDel("test:current"); renderResumeBanner(); }
            };
        }

        function renderHistory() {
            const hist = lsGet("test:history", []);
            const cont = $("historyList");
            if (!hist.length) { cont.innerHTML = `<div class="empty-line">Aún no hay resultados guardados.</div>`; return; }
            cont.innerHTML = hist.slice(0, 8).map(h => {
                const cls = h.nota >= 5 ? "ok" : h.nota >= 3 ? "warn" : "bad";
                const d = new Date(h.date);
                const dStr = d.toLocaleDateString("es-ES", { day: "2-digit", month: "short" }) + " " +
                    d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
                return `<div class="row">
      <div>
        <div>${escapeHtml(h.label)}</div>
        <div class="meta">${dStr} · A:${h.aciertos} E:${h.fallos} B:${h.blancos}</div>
      </div>
      <div class="nota ${cls}">${h.nota.toFixed(2)}</div>
    </div>`;
            }).join("");
        }

        function onSelectMode(mode) {
            const panel = $("examConfigPanel");
            if (mode === "completo") {
                panel.innerHTML = configHtml("Simulacro completo",
                    `<p style="margin:0 0 12px;font-size:13px;color:var(--muted)">100 preguntas aleatorias del banco. 50 minutos. Fórmula oficial: (Aciertos − Errores/2) × 10/100.</p>`,
                    "Empezar simulacro completo");
                $("btnStart").onclick = () => startExam(buildExam({ type: "completo" }));
            } else if (mode === "oficial") {
                const opts = PREGUNTAS_META.sources.map(s =>
                    `<option value="${s.key}">${escapeHtml(s.label)} (${s.count}p)</option>`).join("");
                panel.innerHTML = configHtml("Examen oficial",
                    `<div class="row"><label>Promoción</label>
         <select id="cfgSrc">${opts}</select></div>`,
                    "Empezar examen oficial");
                $("btnStart").onclick = () => startExam(buildExam({ type: "oficial", srcKey: $("cfgSrc").value }));
            } else if (mode === "bloque") {
                const temaOpts = TEMAS.map(t => {
                    const c = PREGUNTAS.filter(q => q.t === t.n).length;
                    return `<option value="${t.n}" ${c ? "" : "disabled"}>Tema ${t.n} — ${escapeHtml(t.a)}${c ? ` (${c}p)` : " (sin preguntas)"}</option>`;
                }).join("");
                panel.innerHTML = configHtml("Por bloque o tema",
                    `<div class="row"><label>Filtro</label>
         <select id="cfgFiltro">
           <option value="all">Todos los bloques</option>
           <option value="A">Bloque A · Jurídicas</option>
           <option value="B">Bloque B · Sociales</option>
           <option value="C">Bloque C · Técnico-cient.</option>
           <option value="tema">Un tema concreto…</option>
         </select></div>
       <div class="row" id="rowTema" style="display:none"><label>Tema</label>
         <select id="cfgTema">${temaOpts}</select></div>
       <div class="row"><label>Preguntas</label>
         <select id="cfgN">
           <option value="10">10</option>
           <option value="25" selected>25</option>
           <option value="50">50</option>
           <option value="100">100</option>
         </select></div>`,
                    "Empezar");
                $("cfgFiltro").onchange = e => {
                    $("rowTema").style.display = e.target.value === "tema" ? "flex" : "none";
                };
                $("btnStart").onclick = () => {
                    const f = $("cfgFiltro").value;
                    const n = parseInt($("cfgN").value, 10);
                    if (f === "tema") startExam(buildExam({ type: "tema", tema: parseInt($("cfgTema").value, 10), limit: n }));
                    else startExam(buildExam({ type: "bloque", bloque: f, limit: n }));
                };
            } else if (mode === "practica") {
                panel.innerHTML = configHtml("Práctica rápida",
                    `<p style="margin:0 0 12px;font-size:13px;color:var(--muted)">20 preguntas aleatorias. Sin cronómetro. Ves la respuesta correcta tras contestar cada pregunta.</p>`,
                    "Empezar práctica");
                $("btnStart").onclick = () => startExam(buildExam({ type: "practica" }));
            }
            panel.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function configHtml(title, body, btnText) {
            return `<div class="exam-config">
    <h3>${escapeHtml(title)}</h3>
    ${body}
    <button class="start-btn" id="btnStart">${escapeHtml(btnText)}</button>
  </div>`;
        }

        // ====== EXAM BUILDER ======
        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function buildExam(cfg) {
            // Returns {label, qids, timeLimitSec, isPractice}
            let pool = PREGUNTAS.filter(q => q.c !== null);  // only questions with a known answer
            let label = "", limit = 100, time = 50 * 60, prac = false, oficialOrdered = false;
            if (cfg.type === "completo") {
                label = "Simulacro completo (100 preguntas)"; limit = 100; time = 50 * 60;
            } else if (cfg.type === "oficial") {
                const src = PREGUNTAS_META.sources.find(s => s.key === cfg.srcKey);
                label = src ? `Oficial — ${src.label}` : "Examen oficial";
                pool = pool.filter(q => q.id.startsWith(cfg.srcKey));
                limit = pool.length; time = 50 * 60; oficialOrdered = true;
            } else if (cfg.type === "bloque") {
                const bloqueTemas = new Set(TEMAS.filter(t => cfg.bloque === "all" || t.b === cfg.bloque).map(t => t.n));
                pool = pool.filter(q => q.t == null || bloqueTemas.has(q.t));
                // if "all" we don't filter by tema (some questions have t=null)
                if (cfg.bloque !== "all") pool = pool.filter(q => q.t != null && bloqueTemas.has(q.t));
                limit = Math.min(cfg.limit || 25, pool.length); time = 0; prac = true;
                label = `Bloque ${cfg.bloque === "all" ? "todos" : cfg.bloque} — ${limit} preguntas`;
            } else if (cfg.type === "tema") {
                pool = pool.filter(q => q.t === cfg.tema);
                limit = Math.min(cfg.limit || pool.length, pool.length); time = 0; prac = true;
                const t = TEMAS.find(x => x.n === cfg.tema);
                label = `Tema ${cfg.tema}${t ? ` — ${t.a}` : ""} (${limit}p)`;
            } else if (cfg.type === "practica") {
                limit = Math.min(20, pool.length); time = 0; prac = true;
                label = "Práctica rápida (20 preguntas)";
            } else if (cfg.type === "express") {
                limit = Math.min(25, pool.length); time = 12 * 60; prac = false;
                label = "Express — 25 preguntas en 12 minutos";
            } else if (cfg.type === "fallos") {
                const fails = new Set(failedQids());
                pool = pool.filter(q => fails.has(q.id));
                if (pool.length === 0) {
                    alert("Aún no tienes fallos registrados. Haz algún test primero.");
                    return null;
                }
                limit = Math.min(cfg.limit || pool.length, pool.length); time = 0; prac = true;
                label = `Repaso de fallos (${limit}p)`;
            } else if (cfg.type === "marcadas") {
                if (cfg.qids && cfg.qids.length) {
                    // Custom list (e.g. from tag filter): use exactly these ids.
                    const want = new Set(cfg.qids);
                    pool = pool.filter(q => want.has(q.id));
                    label = cfg.label || `Etiquetadas (${pool.length}p)`;
                } else {
                    const m = getMarked();
                    pool = pool.filter(q => m.has(q.id));
                    label = `Marcadas (${pool.length}p)`;
                }
                if (pool.length === 0) {
                    alert("No tienes preguntas marcadas.\n\nDurante cualquier examen, pulsa 🚩 para marcar las dudosas.");
                    return null;
                }
                limit = pool.length; time = 0; prac = true;
            } else if (cfg.type === "srs") {
                const due = new Set(srsDue());
                pool = pool.filter(q => due.has(q.id));
                if (pool.length === 0) {
                    alert("Sin preguntas pendientes de repaso por hoy.\n\nHaz cualquier test y el SRS irá programando repasos.");
                    return null;
                }
                limit = Math.min(cfg.limit || 20, pool.length); time = 0; prac = true;
                label = `Repaso espaciado (${limit}p)`;
            }
            if (pool.length === 0) {
                alert("No hay preguntas que coincidan con ese filtro.");
                return null;
            }
            const picked = oficialOrdered
                ? pool.slice().sort((a, b) => a.n - b.n).slice(0, limit)
                : shuffle(pool).slice(0, limit);
            return { label, qids: picked.map(q => q.id), timeLimitSec: time, isPractice: prac };
        }

        // ====== EXAM RUNNER ======
        let examState = null;
        let timerInterval = null;

        function startExam(cfg) {
            if (!cfg) return;
            examState = {
                label: cfg.label,
                qids: cfg.qids,
                answers: new Array(cfg.qids.length).fill(null),
                // initial flag state mirrors the persistent marked set so users see prior marks
                marked: cfg.qids.map(id => isMarked(id)),
                idx: 0,
                startedAt: Date.now(),
                timeLimitSec: cfg.timeLimitSec,
                elapsedSec: 0,
                isPractice: !!cfg.isPractice,
                isReview: false,
                // F1.1 — per-question timing (ms). qShownAt is the wall-clock when current
                // question was first painted on screen. Accumulator pushes into perQTimeMs[idx]
                // every time we leave (next/prev/finish/exit/palette) or change answer.
                perQTimeMs: new Array(cfg.qids.length).fill(0),
                qShownAt: 0,
            };
            saveExam();
            openExamUI();
        }

        function resumeExam() {
            const st = lsGet("test:current", null);
            if (!st) return;
            examState = Object.assign({ isPractice: false, isReview: false, elapsedSec: 0 }, st);
            // Backwards-compat: prior exams may not have per-question timing fields.
            if (!Array.isArray(examState.perQTimeMs) || examState.perQTimeMs.length !== examState.qids.length) {
                examState.perQTimeMs = new Array(examState.qids.length).fill(0);
            }
            examState.qShownAt = 0;
            // adjust elapsed for time-bound exams: don't extend the deadline beyond the original wall-clock budget.
            // We track elapsedSec explicitly so closing the tab pauses the clock.
            openExamUI();
        }

        function saveExam() {
            if (!examState) return;
            lsSet("test:current", examState);
        }

        // F1.1 — accumulate time spent on current question into perQTimeMs[idx]
        // and reset qShownAt. Safe to call repeatedly; no-op if nothing started.
        function accumulateQTime() {
            if (!examState || !examState.qShownAt) return;
            const ms = Date.now() - examState.qShownAt;
            if (ms > 0 && ms < 24 * 60 * 60 * 1000) {  // ignore absurd gaps (paused tab > 1d)
                examState.perQTimeMs[examState.idx] = (examState.perQTimeMs[examState.idx] || 0) + ms;
            }
            examState.qShownAt = 0;
        }

        function openExamUI() {
            $("examOverlay").classList.add("open");
            $("examOverlay").setAttribute("aria-hidden", "false");
            renderExamCurrent();
            if (!examState.isPractice && !examState.isReview && examState.timeLimitSec > 0) {
                startTimer();
            }
        }

        function closeExamUI() {
            stopTimer();
            $("examOverlay").classList.remove("open");
            $("examOverlay").setAttribute("aria-hidden", "true");
            $("examRoot").innerHTML = "";
        }

        function startTimer() {
            stopTimer();
            timerInterval = setInterval(() => {
                if (!examState) return;
                examState.elapsedSec = Math.floor((Date.now() - examState.startedAt) / 1000);
                saveExam();
                const remain = Math.max(0, examState.timeLimitSec - examState.elapsedSec);
                const el = $("examTimer");
                if (el) {
                    el.textContent = fmtTime(remain);
                    el.classList.toggle("warn", remain < 600 && remain >= 60);
                    el.classList.toggle("bad", remain < 60);
                }
                if (remain === 0) finishExam(true);
            }, 1000);
        }
        function stopTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = null; }

        function fmtTime(s) {
            const m = Math.floor(s / 60), r = s % 60;
            return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
        }

        function getQ(idx) {
            const id = examState.qids[idx];
            return PREGUNTAS.find(q => q.id === id);
        }

        function renderExamCurrent() {
            const st = examState;
            const q = getQ(st.idx);
            if (!q) { $("examRoot").innerHTML = ""; return; }
            const isReview = st.isReview;
            const userAns = st.answers[st.idx];
            const correctAns = q.c;
            const showCorrect = isReview || (st.isPractice && userAns !== null);

            const tema = q.t ? TEMAS.find(t => t.n === q.t) : null;
            const dif = q.d ? q.d : "";
            const remain = st.timeLimitSec > 0 ? Math.max(0, st.timeLimitSec - st.elapsedSec) : null;

            $("examRoot").innerHTML = `
    <div class="exam-bar">
      ${remain !== null
                    ? `<span class="timer" id="examTimer">${fmtTime(remain)}</span>`
                    : `<span class="timer" style="background:transparent;color:var(--muted);font-size:13px;font-weight:400">sin tiempo</span>`}
      <span class="pos">${st.idx + 1} / ${st.qids.length}</span>
      <div class="right">
        <button id="btnPalette">Índice</button>
        ${isReview
                    ? `<button id="btnExit">Salir</button>`
                    : `<button id="btnExit">Pausar</button>
             <button class="finish" id="btnFinish">Terminar</button>`}
      </div>
    </div>
    <div class="exam-body">
      <div class="exam-q-meta">
        <span class="qid">${escapeHtml(q.id)}</span>
        <span>${escapeHtml(q.src)}</span>
        ${dif ? `<span>· ${escapeHtml(dif)}</span>` : ""}
        ${tema ? `<span>· Tema ${tema.n} — ${escapeHtml(tema.a)}</span>` : ""}
      </div>
      <div class="exam-statement">${escapeHtml(q.e)}</div>
      <div class="exam-options" id="opts">
        ${["a", "b", "c"].map((letter, i) => {
                        const cls = ["exam-option"];
                        if (userAns === i) cls.push("selected");
                        if (showCorrect && i === correctAns) cls.push("correct");
                        if (showCorrect && userAns === i && userAns !== correctAns) cls.push("wrong");
                        return `<button class="${cls.join(" ")}" data-i="${i}"${isReview ? " disabled" : ""}>
            <span class="letter">${letter}</span>
            <span class="text">${escapeHtml(q.o[i])}</span>
          </button>`;
                    }).join("")}
      </div>

      ${showCorrect && q.x ? `<div class="exam-explain"><b>Explicación:</b> ${escapeHtml(q.x)}</div>` : ""}
      ${showCorrect && tema ? `<div class="exam-explain"><b>Estudiar:</b> <a href="#tema-${tema.n}" id="goTema">Tema ${tema.n} — ${escapeHtml(tema.t)}</a></div>` : ""}

      ${!isReview ? `<div class="exam-actions">
        <button id="btnClear">⊘ Dejar en blanco</button>
        <button id="btnMark" class="${st.marked[st.idx] ? "marked" : ""}">${st.marked[st.idx] ? "🚩 Quitar marca" : "🚩 Marcar para revisar"}</button>
      </div>
      <div class="exam-tags" data-qid="${q.id}">
        <span class="tag-lbl">Etiqueta:</span>
        ${TAG_ORDER.map(tg => {
                        const m = TAG_META[tg];
                        const cur = getQTag(q.id);
                        return `<button class="tag-btn ${m.cls} ${cur === tg ? "active" : ""}" data-tag="${tg}" title="${escapeHtml(m.lbl)}">${m.icon} ${escapeHtml(m.lbl)}</button>`;
                    }).join("")}
      </div>` : ""}
    </div>
    <div class="exam-nav">
      <button id="btnPrev" ${st.idx === 0 ? "disabled" : ""}>← Anterior</button>
      <span class="pos-mid">${st.idx + 1}/${st.qids.length}</span>
      <button id="btnNext" class="primary" ${st.idx === st.qids.length - 1 ? "disabled" : ""}>Siguiente →</button>
    </div>
  `;

            // wire events. accumulateQTime() runs on every interaction that ends the
            // current visit to this question (answer click, prev/next, palette jump, exit, finish).
            $("opts").querySelectorAll(".exam-option").forEach(b => {
                b.onclick = () => {
                    accumulateQTime();
                    const i = parseInt(b.dataset.i, 10);
                    examState.answers[examState.idx] = (examState.answers[examState.idx] === i) ? null : i;
                    saveExam();
                    renderExamCurrent();
                };
            });
            $("btnPrev").onclick = () => { if (examState.idx > 0) { accumulateQTime(); examState.idx--; saveExam(); renderExamCurrent(); window.scrollTo(0, 0); } };
            $("btnNext").onclick = () => { if (examState.idx < examState.qids.length - 1) { accumulateQTime(); examState.idx++; saveExam(); renderExamCurrent(); window.scrollTo(0, 0); } };
            $("btnPalette").onclick = togglePalette;
            $("btnExit").onclick = () => {
                if (isReview) { closeExamUI(); return; }
                // Pausing: save state and close. Resume via menu banner.
                accumulateQTime();
                saveExam(); stopTimer(); closeExamUI();
                showView("examenes");
            };
            const fin = $("btnFinish"); if (fin) fin.onclick = () => {
                const unanswered = examState.answers.filter(a => a === null).length;
                if (unanswered > 0 && !confirm(`Quedan ${unanswered} preguntas sin contestar. ¿Terminar igualmente?`)) return;
                finishExam(false);
            };
            const c = $("btnClear"); if (c) c.onclick = () => { examState.answers[examState.idx] = null; saveExam(); renderExamCurrent(); };
            const mk = $("btnMark"); if (mk) mk.onclick = () => {
                examState.marked[examState.idx] = !examState.marked[examState.idx];
                toggleMarked(getQ(examState.idx).id);  // mirror to persistent set
                saveExam(); renderExamCurrent();
            };
            // Tag chips — click toggles tag (re-click same tag clears it).
            document.querySelectorAll(".exam-tags .tag-btn").forEach(b => {
                b.onclick = () => {
                    const qid = b.closest(".exam-tags").dataset.qid;
                    const tag = b.dataset.tag;
                    const cur = getQTag(qid);
                    setQTag(qid, cur === tag ? null : tag);
                    renderExamCurrent();
                };
            });
            const gt = $("goTema"); if (gt) gt.onclick = (e) => { e.preventDefault(); closeExamUI(); showView("temario"); openTema(tema.n); };

            // F1.1 — mark when this question became visible. Anchor only in non-review mode
            // (review = walkthrough, time spent reading explanations is not "thinking time").
            if (!isReview) examState.qShownAt = Date.now();
        }

        function togglePalette() {
            // shows a modal-like grid; toggles on second click
            const existing = document.getElementById("palette");
            if (existing) { existing.remove(); return; }
            const st = examState;
            const grid = document.createElement("div");
            grid.id = "palette";
            grid.className = "palette";
            grid.style.margin = "0 16px 14px";
            grid.innerHTML = st.qids.map((id, i) => {
                const cls = ["btn"];
                const ans = st.answers[i];
                if (st.isReview) {
                    const q = PREGUNTAS.find(x => x.id === id);
                    if (ans === null) cls.push("blank");
                    else if (ans === q.c) cls.push("right");
                    else cls.push("bad");
                } else {
                    if (ans !== null) cls.push("answered");
                }
                if (st.marked[i]) cls.push("marked");
                if (i === st.idx) cls.push("current");
                return `<button class="${cls.join(" ")}" data-i="${i}">${i + 1}</button>`;
            }).join("");
            // insert below exam-bar
            $("examRoot").querySelector(".exam-body").prepend(grid);
            grid.querySelectorAll("button").forEach(b => {
                b.onclick = () => { accumulateQTime(); examState.idx = parseInt(b.dataset.i, 10); saveExam(); renderExamCurrent(); window.scrollTo(0, 0); };
            });
        }

        function finishExam(timeUp) {
            stopTimer();
            accumulateQTime();   // F1.1 — close out the last question's visit before computing stats
            const st = examState;
            let A = 0, E = 0, B = 0;
            st.qids.forEach((id, i) => {
                const q = PREGUNTAS.find(x => x.id === id);
                const ans = st.answers[i];

            const times = (st.perQTimeMs || []).map(ms => ms || 0);
            const totalAnswerMs = times.reduce((a, b) => a + b, 0);
            const answeredCount = st.qids.length - B;
            const avgMsPerAnswered = answeredCount > 0 ? Math.round(totalAnswerMs / answeredCount) : 0;
            // top-3 slowest questions (only those actually visited)
            const slowest = times
                .map((ms, i) => ({ i, ms, id: st.qids[i] }))
                .filter(x => x.ms > 0)
                .sort((a, b) => b.ms - a.ms)
                .slice(0, 3);
            const result = {
                date: Date.now(),
                label: st.label,
                aciertos: A, fallos: E, blancos: B,
                total: st.qids.length,
                nota,
                timeUp: !!timeUp,
                elapsedSec: st.elapsedSec,
                avgMsPerAnswered,
                slowest,
            };

            const hist = lsGet("test:history", []);
            hist.unshift(result);
            lsSet("test:history", hist.slice(0, 25));
            lsDel("test:current");

            // Only counts if user actually engaged (at least one answered or skipped).
            st.qids.forEach((id, i) => {
                const q = PREGUNTAS.find(x => x.id === id);
                const ans = st.answers[i];
                const ms = (st.perQTimeMs && st.perQTimeMs[i]) || 0;
                recordAttempt(id, ans, q.c, ms);
                if (ans !== null) srsUpdate(id, ans === q.c);
            });
            // F1.2 — push wrong answers into the error notebook. Blank answers are NOT
            // logged (they're a separate problem: time management, not knowledge).
            const temaB = new Map(TEMAS.map(t => [t.n, t.b]));
            const newErrors = [];
            st.qids.forEach((id, i) => {
                const q = PREGUNTAS.find(x => x.id === id);
                const ans = st.answers[i];
                if (ans === null || ans === q.c) return;
                newErrors.push({
                    date: Date.now(),
                    qid: id,
                    snippet: q.e.slice(0, 140),
                    given: ans,
                    correct: q.c,
                    tema: q.t || null,
                    bloque: q.t ? (temaB.get(q.t) || null) : null,
                    src: q.src || "",
                    ms: (st.perQTimeMs && st.perQTimeMs[i]) || 0,
                    examLabel: st.label || "",
                    resolved: false,
                });
            });
            pushErrors(newErrors);
            const answeredNow = st.qids.length - B;
            if (answeredNow > 0) { bumpToday(answeredNow); markActivity(); }
            renderStreak();

            renderResults(result);
        }

        // Deterministic daily picker — same item all day, different per array.
        // Hashes "YYYY-MM-DD" + salt to a stable index.
        function dailyPick(arr, salt) {
            const key = new Date().toISOString().slice(0, 10) + (salt || "");
            let h = 2166136261;
            for (let i = 0; i < key.length; i++) {
                h ^= key.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return arr[Math.abs(h) % arr.length];
        }

        // Override for "shuffle" button — lets user cycle without waiting until tomorrow.
        // Initialized to a random index per page load so the home doesn't always open
        // on the same quote (was previously deterministic per day).
        let QUOTE_OVERRIDE_IDX = Math.floor(Math.random() * QUOTES.length);
        function currentQuote() {
            if (QUOTE_OVERRIDE_IDX != null) return QUOTES[QUOTE_OVERRIDE_IDX];
            return dailyPick(QUOTES, "q");
        }
        function shuffleQuote() {
            const cur = currentQuote();
            let i;
            do { i = Math.floor(Math.random() * QUOTES.length); } while (QUOTES[i] === cur && QUOTES.length > 1);
            QUOTE_OVERRIDE_IDX = i;
            renderHome();
        }

        // Same pattern for the daily study tip.
        let TIP_OVERRIDE_IDX = Math.floor(Math.random() * TIPS.length);
        function currentTip() {
            if (TIP_OVERRIDE_IDX != null) return TIPS[TIP_OVERRIDE_IDX];
            return dailyPick(TIPS, "t");
        }
        function shuffleTip() {
            const cur = currentTip();
            let i;
            do { i = Math.floor(Math.random() * TIPS.length); } while (TIPS[i] === cur && TIPS.length > 1);
            TIP_OVERRIDE_IDX = i;
            renderHome();
        }

        // Stable per-quote key (FNV-1a on text+author). Survives array reorderings.
        function quoteKey(q) {
            const s = (q.q || "") + "|" + (q.a || "");
            let h = 2166136261;
            for (let i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return (h >>> 0).toString(36);
        }
        function getFavQuotes() { return lsGet("favquotes", []); }   // array of {k, q, a}
        function isFav(q) {
            const k = quoteKey(q);
            return getFavQuotes().some(f => f.k === k);
        }
        function toggleFav(q) {
            const k = quoteKey(q);
            const cur = getFavQuotes();
            const i = cur.findIndex(f => f.k === k);
            if (i >= 0) cur.splice(i, 1);
            else cur.unshift({ k, q: q.q, a: q.a });
            lsSet("favquotes", cur);
            renderHome();
        }
        // UI state for the favorites panel (open/closed). Not persisted — resets per session.
        let FAV_PANEL_OPEN = false;
        function toggleFavPanel() { FAV_PANEL_OPEN = !FAV_PANEL_OPEN; renderHome(); }
        function removeFav(k) {
            const cur = getFavQuotes().filter(f => f.k !== k);
            lsSet("favquotes", cur);
            if (!cur.length) FAV_PANEL_OPEN = false;
            renderHome();
        }

        // F1.2 — Cuaderno de errores view.
        // Session-scoped UI filters (not persisted on purpose: each visit starts fresh).
        const ERR_FILTERS = { bloque: "all", range: "all", repeats: false, query: "" };
        function errFilteredList() {
            const list = getErrorLog();
            const now = Date.now();
            const ranges = { all: Infinity, "7": 7 * 86400000, "30": 30 * 86400000 };
            const cut = ranges[ERR_FILTERS.range] != null ? ranges[ERR_FILTERS.range] : Infinity;
            const counts = errorCountByQid();
            const qLow = ERR_FILTERS.query.trim().toLowerCase();
            return list
                .map((e, idx) => ({ e, idx, repeats: counts.get(e.qid) || 1 }))
                .filter(x => {
                    if (ERR_FILTERS.bloque !== "all" && x.e.bloque !== ERR_FILTERS.bloque) return false;
                    if (now - x.e.date > cut) return false;
                    if (ERR_FILTERS.repeats && x.repeats < 2) return false;
                    if (qLow && !x.e.snippet.toLowerCase().includes(qLow)) return false;
                    return true;
                });
        }
        function renderErrores() {
            const host = $("erroresContent");
            if (!host) return;
            const all = getErrorLog();
            const filtered = errFilteredList();
            const total = all.length;
            const unresolved = all.filter(e => !e.resolved).length;
            // group by date (YYYY-MM-DD) for readability
            const groups = new Map();
            for (const x of filtered) {
                const d = new Date(x.e.date);
                const key = d.toISOString().slice(0, 10);
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(x);
            }
            const groupKeys = [...groups.keys()].sort().reverse();

            const chip = (val, label, group) => {
                const active = ERR_FILTERS[group] === val;
                return `<button class="err-chip ${active ? "on" : ""}" data-fchip data-group="${group}" data-val="${val}">${escapeHtml(label)}</button>`;
            };

            host.innerHTML = `
              <div class="err-head">
                <div class="err-title">
                  <h2>🔖 Cuaderno de errores</h2>
                  <div class="err-sub">${total} ${total === 1 ? "fallo registrado" : "fallos registrados"}${total ? ` · ${unresolved} sin resolver` : ""}</div>
                </div>
                ${total ? `<button class="err-clear" id="errClearBtn" title="Vaciar el cuaderno">Vaciar</button>` : ""}
              </div>

              ${total === 0 ? `
                <div class="err-empty">
                  <div class="ic">📭</div>
                  <p>Aún no tienes fallos guardados.<br><span class="muted">Cada pregunta que falles en un test se guardará aquí automáticamente.</span></p>
                  <button class="primary" data-go-exam>Hacer un test</button>
                </div>
              ` : `
                <div class="err-filters">
                  <div class="err-search">
                    <input type="search" id="errSearch" placeholder="Buscar en el enunciado…" value="${escapeHtml(ERR_FILTERS.query)}">
                  </div>
                  <div class="err-chips">
                    <span class="err-chips-lbl">Bloque</span>
                    ${chip("all", "Todos", "bloque")}${chip("A", "A", "bloque")}${chip("B", "B", "bloque")}${chip("C", "C", "bloque")}
                  </div>
                  <div class="err-chips">
                    <span class="err-chips-lbl">Cuándo</span>
                    ${chip("all", "Todo", "range")}${chip("7", "7 días", "range")}${chip("30", "30 días", "range")}
                  </div>
                  <div class="err-chips">
                    <label class="err-toggle"><input type="checkbox" id="errRepeats" ${ERR_FILTERS.repeats ? "checked" : ""}> Solo fallados 2+ veces</label>
                  </div>
                </div>

                ${filtered.length === 0 ? `<div class="err-empty"><p>Ningún fallo coincide con el filtro.</p></div>` : `
                  <div class="err-groups">
                    ${groupKeys.map(k => {
                const items = groups.get(k);
                const d = new Date(k + "T00:00:00");
                const label = d.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
                return `
                        <div class="err-group">
                          <div class="err-group-head">${escapeHtml(label.charAt(0).toUpperCase() + label.slice(1))} <small>· ${items.length} ${items.length === 1 ? "fallo" : "fallos"}</small></div>
                          <ul class="err-list">
                            ${items.map(x => renderErrorItem(x)).join("")}
                          </ul>
                        </div>`;
            }).join("")}
                  </div>
                `}
              `}
            `;

            // wire filters
            host.querySelectorAll("[data-fchip]").forEach(b => {
                b.onclick = () => {
                    ERR_FILTERS[b.dataset.group] = b.dataset.val;
                    renderErrores();
                };
            });
            const search = $("errSearch");
            if (search) {
                search.oninput = () => {
                    ERR_FILTERS.query = search.value;
                    // soft re-render without losing focus
                    clearTimeout(search._t);
                    search._t = setTimeout(() => {
                        const pos = search.selectionStart;
                        renderErrores();
                        const s2 = $("errSearch");
                        if (s2) { s2.focus(); s2.setSelectionRange(pos, pos); }
                    }, 180);
                };
            }
            const rep = $("errRepeats");
            if (rep) rep.onchange = () => { ERR_FILTERS.repeats = rep.checked; renderErrores(); };
            const clr = $("errClearBtn");
            if (clr) clr.onclick = () => {
                if (confirm(`¿Vaciar el cuaderno? Se eliminarán ${total} fallos. Esto no afecta a tus estadísticas.`)) {
                    clearErrorLog();
                    renderErrores();
                }
            };
            host.querySelectorAll("[data-go-exam]").forEach(b => b.onclick = () => showView("examenes"));

            // per-item actions
            host.querySelectorAll("[data-err-resolve]").forEach(b => {
                b.onclick = () => { toggleErrorResolved(parseInt(b.dataset.errResolve, 10)); renderErrores(); };
            });
            host.querySelectorAll("[data-err-remove]").forEach(b => {
                b.onclick = () => { removeErrorAt(parseInt(b.dataset.errRemove, 10)); renderErrores(); };
            });
            host.querySelectorAll("[data-err-tema]").forEach(b => {
                b.onclick = () => { const n = parseInt(b.dataset.errTema, 10); showView("temario"); openTema(n); };
            });
            host.querySelectorAll("[data-err-expand]").forEach(b => {
                b.onclick = () => {
                    const li = b.closest("li.err-item");
                    if (li) li.classList.toggle("expanded");
                };
            });
        }
        function renderErrorItem(x) {
            const e = x.e;
            const q = PREGUNTAS.find(p => p.id === e.qid);
            const letters = ["A", "B", "C"];
            const tema = e.tema ? TEMAS.find(t => t.n === e.tema) : null;
            const date = new Date(e.date);
            const time = date.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
            return `
              <li class="err-item ${e.resolved ? "resolved" : ""}" data-qid="${escapeHtml(e.qid)}">
                <div class="err-item-row" data-err-expand>
                  ${e.bloque ? `<span class="err-pill ${e.bloque}">${e.bloque}${e.tema || ""}</span>` : `<span class="err-pill u">?</span>`}
                  <div class="err-snippet">${escapeHtml(e.snippet)}${e.snippet.length >= 140 ? "…" : ""}</div>
                  <div class="err-meta">
                    <span title="Tu respuesta · correcta" class="err-ans"><b class="bad">${letters[e.given] || "?"}</b>→<b class="ok">${letters[e.correct] || "?"}</b></span>
                    ${x.repeats > 1 ? `<span class="err-rep" title="Fallada ${x.repeats} veces">×${x.repeats}</span>` : ""}
                    ${e.resolved ? `<span class="err-res">✓</span>` : ""}
                  </div>
                </div>
                <div class="err-expand">
                  ${q ? `
                    <div class="err-q">${escapeHtml(q.e)}</div>
                    <ol class="err-opts">
                      ${q.o.map((opt, i) => `<li class="${i === e.correct ? "ok" : i === e.given ? "bad" : ""}">
                        <b>${letters[i]}.</b> ${escapeHtml(opt)}
                        ${i === e.correct ? `<span class="tag ok">Correcta</span>` : ""}
                        ${i === e.given ? `<span class="tag bad">Tu respuesta</span>` : ""}
                      </li>`).join("")}
                    </ol>
                    ${q.x ? `<div class="err-x"><b>Explicación.</b> ${escapeHtml(q.x)}</div>` : ""}
                  ` : `<div class="err-q muted">Esta pregunta ya no está en el banco.</div>`}
                  <div class="err-foot">
                    <span class="err-when">${time} · ${escapeHtml(e.examLabel || "")}${e.ms ? ` · ${(e.ms / 1000).toFixed(1)}s` : ""}</span>
                    <span class="err-actions">
                      ${tema ? `<button class="link" data-err-tema="${tema.n}">Ir al tema ${tema.n}</button>` : ""}
                      <button class="link" data-err-resolve="${x.idx}">${e.resolved ? "Marcar pendiente" : "Marcar resuelta"}</button>
                      <button class="link danger" data-err-remove="${x.idx}">Eliminar</button>
                    </span>
                  </div>
                </div>
              </li>`;

        // ===== BUSQUEDA view (global search across temas + tips + flashcards + glosario) =====
        // Single input filters all study content. Empty query shows the glosario alphabetically.
        let busquedaQuery = "";
        function busquedaResults(q) {
            const ql = q.trim().toLowerCase();
            if (!ql) {
                return {
                    temas: [], tips: [], cards: [], preguntas: [],
                    gloss: GLOSARIO.slice().sort((a, b) => a.term.localeCompare(b.term, "es"))
                };
            }
            const temas = TEMAS.filter(t => {
                const hay = (t.n + " " + t.t + " " + t.a + " " + t.norma + " " + t.keys.join(" ")).toLowerCase();
                return hay.includes(ql);
            }).slice(0, 30);
            const tips = [];
            for (const k in TEMA_TIPS) {
                TEMA_TIPS[k].forEach((tip, i) => {
                    if ((tip.q + " " + tip.a).toLowerCase().includes(ql)) tips.push({ n: parseInt(k, 10), tip, i });
                });
            }
            const cards = [];
            for (const k in TEMA_FLASHCARDS) {
                TEMA_FLASHCARDS[k].forEach((c, i) => {
                    if ((c.front + " " + c.back).toLowerCase().includes(ql)) cards.push({ n: parseInt(k, 10), c, i });
                });
            }
            const gloss = GLOSARIO.filter(g => (g.term + " " + g.def).toLowerCase().includes(ql))
                .sort((a, b) => a.term.localeCompare(b.term, "es"));
            // Bank questions: search in id + statement + options + source. Min 3 chars to avoid noise.
            const preguntas = ql.length >= 3
                ? PREGUNTAS.filter(p => (p.id + " " + p.e + " " + p.o.join(" ") + " " + (p.src || "")).toLowerCase().includes(ql)).slice(0, 30)
                : [];
            return { temas, tips: tips.slice(0, 30), cards: cards.slice(0, 30), gloss, preguntas };
        }

            const glossCard = g => `

                  <div class="gloss-term">${escapeHtml(g.term)}<span class="b ${g.b}">${g.b}</span></div>

            `;

            const input = $("busquedaInput");
            if (input) {
                input.addEventListener("input", e => {

            });

            const totalTemas = TEMAS.length;

            const pct = Math.round((doneCount / totalTemas) * 100);
            const examDays = Math.max(0, Math.ceil((parseYmd(PLAN_EXAM) - today) / 86400000));
            const ui = getPlanUI();
            const tab = ui.tab || "cal";

            host.innerHTML = `
    <div class="plan-hero">
      <h2>📅 Plan de estudio</h2>
      <p>21 semanas · 25 may → 18 oct 2026 · examen estimado ~18 oct</p>
      <div class="meta">
        <span><b>${doneCount}</b>/${totalTemas} temas</span>
        <span><b>${examDays}</b> días al examen</span>
        <span>Semana actual: <b>${curIdx >= 0 && curIdx < PLAN_WEEKS.length ? "W" + PLAN_WEEKS[curIdx].w : "—"}</b></span>
      </div>
      <div class="progress"><div class="fill" style="width:${pct}%"></div></div>
    </div>
    <div class="plan-tabs" role="tablist">
      <button data-ptab="cal" class="${tab === "cal" ? "active" : ""}">📆 Calendario</button>
      <button data-ptab="weeks" class="${tab === "weeks" ? "active" : ""}">📋 Semanas</button>
      <button data-ptab="why" class="${tab === "why" ? "active" : ""}">📖 Por qué</button>
    </div>
    <div id="planTabBody"></div>`;

            host.querySelectorAll(".plan-tabs button").forEach(b => {
                b.onclick = () => { setPlanUI({ tab: b.dataset.ptab }); renderPlan(); };
            });

            if (tab === "cal") renderPlanCalendar();
            else if (tab === "weeks") renderPlanWeeks();
            else renderPlanWhy();
        }

        // ===== Sub-tab: Calendar =====
        // Physical training rotation (CNP exam-oriented).
        // L: agilidad · M: barra · X: agilidad · J: barra · V: 1000 m.
        const FISICO = [
            { title: "Agilidad (circuito CNP)", desc: "Calentamiento 10'. 4 vueltas al circuito (saltos vallas + giros + cambios de dirección + paso muro). Vuelta a la calma 5'." },
            { title: "Fuerza barra supina", desc: "Calentamiento dorsal 10'. 5x5 dominadas supinas progresivas (lastrar si llega). Accesorio: remo invertido 3x10." },
            { title: "Agilidad + pliometría", desc: "Calentamiento 10'. 6x saltos al cajón + 6x skipping + 6x burpees. 3 rondas. Vuelta a la calma 5'." },
            { title: "Fuerza barra supina (tempo)", desc: "Calentamiento 10'. 4x6 dominadas supinas tempo 3-1-1 (bajada lenta). Accesorio: face pull 3x12." },
            { title: "1000 m lisos", desc: "Calentamiento 15' suave + movilidad. Tirada 1000 m al 90% (objetivo bajo 4:30). Vuelta a la calma 10'." }
        ];

        // Distribute the week's temas across L-V (0..4) deterministically.
        // tema i -> day (i % 5).
        function pickDayTemas(week, dow) {
            if (!week.temas.length) return [];
            const out = [];
            week.temas.forEach((tn, i) => { if (i % 5 === dow) out.push(tn); });
            return out;
        }

        // Split a day's temas into morning (abstract / A-leaning) and afternoon (concrete / C-leaning).
        function splitTemas(dayTemas) {
            if (!dayTemas.length) return { morning: [], afternoon: [] };
            const enriched = dayTemas.map(n => {
                const t = TEMAS.find(x => x.n === n);
                // Order: A=0 (morning), B=1, C=2 (afternoon)
                const ord = t ? { A: 0, B: 1, C: 2 }[t.b] : 1;
                return { n, ord };
            }).sort((a, b) => a.ord - b.ord);
            if (enriched.length === 1) {
                const only = enriched[0];
                return only.ord <= 1 ? { morning: [only.n], afternoon: [] } : { morning: [], afternoon: [only.n] };
            }
            const mid = Math.ceil(enriched.length / 2);
            return {
                morning: enriched.slice(0, mid).map(x => x.n),
                afternoon: enriched.slice(mid).map(x => x.n)
            };
        }

        function temasLabel(arr) {
            if (!arr.length) return "";
            return arr.map(n => "T" + n).join(" · ");
        }

        function temasDesc(arr) {
            if (!arr.length) return "";
            return arr.map(n => {
                const t = TEMAS.find(x => x.n === n);
                return t ? `T${n} ${t.t}` : "T" + n;
            }).join(" / ");
        }

        // Build full day schedule (array of blocks). Drives both cell preview and detail panel.
        function buildDaySchedule(d) {
            const dow = (d.getDay() + 6) % 7; // 0=Mon..6=Sun
            const wIdx = planWeekIndexForDate(d);
            const week = (wIdx >= 0 && wIdx < PLAN_WEEKS.length) ? PLAN_WEEKS[wIdx] : null;
            if (!week) return [];

            // Sunday → rest (all-day)
            if (dow === 6) return [{
                allDay: true, kind: "rst",
                title: "Descanso total",
                desc: "Nada de temario. Vida personal, deporte ligero, dormir mucho. Mañana se vuelve."
            }];

            // Saturday → físico temprano + routine + repaso + simulacro + reescritura + test (~5 h study)
            if (dow === 5) {
                const simKind = week.repaso === "SIM" ? "Simulacro completo (100 preg / 50 min)" : "Simulacro temático (50 preg / 25 min)";
                const simDesc = week.repaso === "SIM" ? "Simulacro real cronometrado." : `Foco: ${week.title}.`;
                return [
                    { start: "06:30", end: "07:30", kind: "fis", title: "Físico · técnica de carrera", desc: "Calentamiento + 5x100 m suaves + movilidad. Sirve a la prueba de 1000 m." },
                    { start: "07:30", end: "09:00", kind: "com", title: "Ducha + desayuno", desc: "Proteína + carbo lento. Hidratar bien tras el físico." },
                    { start: "09:00", end: "10:00", kind: "rep", title: "Repaso de la semana · SRS + literalidad", desc: "Recorrer fichas pendientes + memorizar artículos y plazos vistos esta semana." },
                    { start: "10:00", end: "10:10", kind: "pau", title: "Snack movimiento · 10 min", desc: "Movilidad cervical + escaleras + hidratar. No te sientes seguido más de 90 min." },
                    { start: "10:10", end: "11:10", kind: "sim", title: simKind, desc: simDesc },
                    { start: "11:10", end: "13:00", kind: "pau", title: "Tiempo personal", desc: "Salir, recados, vida. Bajar revoluciones antes de comer." },
                    { start: "13:00", end: "14:30", kind: "com", title: "Comida + descanso", desc: "Siesta corta opcional (20 min máx)." },
                    { start: "14:30", end: "15:45", kind: "stu", title: `Reescritura de esquemas · ${escapeHtml(week.title)}`, desc: "Construir esquema propio de los temas de la semana, con tus palabras. Sintetiza la literalidad." },
                    { start: "15:45", end: "15:55", kind: "pau", title: "Snack movimiento · 10 min", desc: "Levantarse, estirar caderas, sentadillas suaves, hidratar." },
                    { start: "15:55", end: "17:10", kind: "stu", title: `Reescritura de esquemas · continuación`, desc: "Cierra el esquema. Una hoja por tema, máximo." },
                    { start: "17:10", end: "18:00", kind: "tst", title: "30 preguntas tipo test mixtas", desc: "Mezcla temas vistos en la semana. Marca fallos para mañana lunes." }
                ];
            }

            // L-V — físico temprano 06:30-07:30 (mejor adherencia, libera el resto del día).
            // Bloques de estudio de ~75-90 min separados por snacks de movimiento de 10 min
            // (evita estancamiento postural, mantiene atención según ciclos ultradianos).
            const blocks = [];
            const fis = FISICO[dow];
            blocks.push({ start: "06:30", end: "07:30", kind: "fis", title: `Físico · ${fis.title}`, desc: fis.desc });
            blocks.push({ start: "07:30", end: "09:00", kind: "com", title: "Ducha + desayuno", desc: "Proteína + carbo lento. Hidratar bien tras el físico. Cafeína 90-120 min después de despertar." });

            // Study slots vary by week type.
            let morningBlock, afternoonBlock;
            if (week.repaso) {
                const r = week.repaso;
                if (r === "A") {
                    morningBlock = { kind: "rep", title: "Repaso Bloque A · tanda mañana", desc: "Lee resúmenes A en orden. Marca dudas." };
                    afternoonBlock = { kind: "sim", title: "Simulacro temático A (50 preg)", desc: "Cronometrado. Revisión al final." };
                } else if (r === "BC") {
                    const isB = (dow % 2 === 0); // L/X/V → B, M/J → C
                    morningBlock = { kind: "rep", title: isB ? "Repaso Bloque B (sociales)" : "Repaso Bloque C (técnico)", desc: isB ? "Conceptos psico/socio. Mapas conceptuales." : "Glosario + ejemplos. Re-leer resúmenes densos." };
                    afternoonBlock = { kind: "sim", title: isB ? "Simulacro temático B" : "Simulacro temático C", desc: "50 preg / 25 min. Revisión razonada." };
                } else if (r === "SIM") {
                    const isSim = (dow === 0 || dow === 2 || dow === 4); // L/X/V
                    morningBlock = isSim
                        ? { kind: "sim", title: "Simulacro completo (100 preg / 50 min)", desc: "Cronometrado, condiciones de examen." }
                        : { kind: "rep", title: "Revisión profunda de fallos del día anterior", desc: "Releer cada tema fallado. Crear flashcard." };
                    afternoonBlock = isSim
                        ? { kind: "rep", title: "Revisión razonada del simulacro", desc: "Por cada fallo: regla + tema + flashcard." }
                        : { kind: "rep", title: "Repaso de literalidad (artículos, plazos, números)", desc: "Bloque A: lo que más cae." };
                } else if (r === "LIT") {
                    morningBlock = { kind: "rep", title: "Literalidad · artículos y plazos", desc: "CE, LOFCS, LSC, Procesal. Memoria activa." };
                    afternoonBlock = { kind: "rep", title: "Repaso ligero por bloque", desc: "Alterna A/B/C. No agotarse." };
                } else if (r === "ERR") {
                    morningBlock = { kind: "rep", title: "Errores recurrentes (top 20)", desc: "Releer + flashcard + ejemplo." };
                    afternoonBlock = { kind: "rep", title: "Repaso suave por bloque", desc: "Sin presión. Dormir 8 h." };
                } else if (r === "EX") {
                    if (dow <= 2) {
                        morningBlock = { kind: "rep", title: "Repaso ligero (1 h)", desc: "Solo literalidad clave. Sin estrés." };
                        afternoonBlock = { kind: "rst", title: "Descanso mental", desc: "Pasear, dormir siesta. Bajar revoluciones." };
                    } else {
                        morningBlock = { kind: "rst", title: "Descanso mental", desc: "Sin temario. Pasear, leer ficción, dormir." };
                        afternoonBlock = { kind: "rst", title: "Descanso mental", desc: "Material listo para el día del examen. Dormir mucho." };
                    }
                }
            } else {
                // Avance puro: distribute week's temas across L-V.
                const dayTemas = pickDayTemas(week, dow);
                const split = splitTemas(dayTemas);
                if (split.morning.length) {
                    morningBlock = {
                        kind: "stu",
                        title: `Estudio profundo · ${temasLabel(split.morning)}`,
                        desc: temasDesc(split.morning) || "Leer resumen + esquema propio + 10 preguntas."
                    };
                } else if (split.afternoon.length) {
                    morningBlock = { kind: "rep", title: "Repaso SRS extra de la semana", desc: "Adelantar fichas pendientes." };
                } else {
                    morningBlock = { kind: "rep", title: "Repaso libre", desc: "Día sin tema nuevo asignado. Repaso de la semana." };
                }
                if (split.afternoon.length) {
                    afternoonBlock = {
                        kind: "stu",
                        title: `Estudio aplicado · ${temasLabel(split.afternoon)}`,
                        desc: temasDesc(split.afternoon) || "Resumen aplicado + 10 preguntas tipo test."
                    };
                } else if (split.morning.length) {
                    afternoonBlock = {
                        kind: "stu",
                        title: `Ampliar · esquema y preguntas de ${temasLabel(split.morning)}`,
                        desc: "Construir esquema propio + preguntas tipo test del tema."
                    };
                } else {
                    afternoonBlock = { kind: "rep", title: "Repaso libre", desc: "Sin tema nuevo. Aprovecha para SRS." };
                }
            }

            blocks.push({ start: "09:00", end: "10:30", ...morningBlock });
            blocks.push({ start: "10:30", end: "10:40", kind: "pau", title: "Snack movimiento · 10 min", desc: "Levantarse, movilidad cervical y hombros, subir y bajar escaleras, hidratar. Sin móvil." });
            blocks.push({ start: "10:40", end: "12:10", kind: morningBlock.kind, title: morningBlock.title + " · continuación", desc: morningBlock.desc });
            blocks.push({ start: "12:10", end: "12:30", kind: "pau", title: "Pausa larga", desc: "Aire libre 15-20 min. Mirar lejos, caminar." });
            blocks.push({ start: "12:30", end: "14:00", kind: "com", title: "Comida + descanso", desc: "Comer bien, sin pantallas. 20-30 min de relax antes de volver." });
            blocks.push({ start: "14:00", end: "15:15", ...afternoonBlock });
            blocks.push({ start: "15:15", end: "15:25", kind: "pau", title: "Snack movimiento · 10 min", desc: "Sentadillas suaves, estiramiento de psoas y cadera (clave si estudias sentada), hidratar." });
            blocks.push({ start: "15:25", end: "16:40", kind: afternoonBlock.kind, title: afternoonBlock.title + " · continuación", desc: afternoonBlock.desc });
            blocks.push({ start: "16:40", end: "17:00", kind: "pau", title: "Pausa", desc: "Caminar, hidratar, mirar lejos." });
            blocks.push({ start: "17:00", end: "18:00", kind: "tst", title: "SRS + 30 preguntas tipo test", desc: "Repaso espaciado de fichas pendientes + 30 preguntas de los temas del día. Marca fallos para revisar mañana." });
            return blocks;
        }

        // Cell preview: 2-3 short event lines.
        function dayCellEvents(d) {
            const dow = (d.getDay() + 6) % 7;
            const wIdx = planWeekIndexForDate(d);
            const week = (wIdx >= 0 && wIdx < PLAN_WEEKS.length) ? PLAN_WEEKS[wIdx] : null;
            if (!week) return [];
            if (dow === 6) return [{ kind: "rst", text: "Descanso" }];
            if (dow === 5) return [
                { kind: "fis", text: "6:30 Físico" },
                { kind: "sim", text: "10:10 Simulacro" },
                { kind: "stu", text: "14:30 Esquemas+Test" }
            ];
            const out = [];
            if (week.repaso) {
                const labels = { A: "Repaso A", BC: (dow % 2 === 0 ? "Repaso B" : "Repaso C"), SIM: (dow === 0 || dow === 2 || dow === 4 ? "Simulacro 100p" : "Revisión fallos"), LIT: "Literalidad", ERR: "Errores top", EX: "Repaso ligero" };
                out.push({ kind: week.repaso === "SIM" && (dow === 0 || dow === 2 || dow === 4) ? "sim" : "stu", text: "9:00 " + (labels[week.repaso] || "Repaso") });
            } else {
                const dayTemas = pickDayTemas(week, dow);
                if (dayTemas.length) {
                    out.push({ kind: "stu", text: "9:00 " + dayTemas.map(n => "T" + n).join(" ") });
                } else {
                    out.push({ kind: "rep", text: "9:00 Repaso libre" });
                }
            }
            out.push({ kind: "fis", text: "6:30 Físico" });
            out.push({ kind: "tst", text: "17:00 Test" });
            return out;
        }

        function renderPlanCalendar() {
            const body = $("planTabBody"); if (!body) return;
            const today = new Date(); today.setHours(0, 0, 0, 0);
            const ui = getPlanUI();
            let monthAnchor;
            if (ui.month) {
                monthAnchor = parseYmd(ui.month + "-01");
            } else {
                const planStart = parseYmd(PLAN_START);
                monthAnchor = today < planStart ? planStart : today;
                monthAnchor = new Date(monthAnchor.getFullYear(), monthAnchor.getMonth(), 1);
            }
            const monthLabel = monthAnchor.toLocaleDateString("es-ES", { month: "long", year: "numeric" });

            const firstOfMonth = new Date(monthAnchor.getFullYear(), monthAnchor.getMonth(), 1);
            const dowMonFirst = (firstOfMonth.getDay() + 6) % 7;
            const gridStart = new Date(firstOfMonth);
            gridStart.setDate(gridStart.getDate() - dowMonFirst);

            const dows = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
            const selectedYmd = ui.selectedDay || ymd(today);

            let html = `
    <div class="cal-nav">
      <button id="calPrev" aria-label="Mes anterior">‹</button>
      <div class="cal-title">${monthLabel}</div>
      <button id="calToday" title="Hoy">Hoy</button>
      <button id="calIcs" class="ics-btn" title="Descargar .ics para Google/Android Calendar">📥 .ics</button>
      <button id="calNext" aria-label="Mes siguiente">›</button>
    </div>
    <div class="cal-grid">
      ${dows.map(d => `<div class="cal-dow">${d}</div>`).join("")}`;

            for (let i = 0; i < 42; i++) {
                const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
                const ds = ymd(d);
                const inMonth = d.getMonth() === monthAnchor.getMonth();
                const isToday = ds === ymd(today);
                const isSelected = ds === selectedYmd;
                const isExam = ds === PLAN_EXAM;
                const wIdx = planWeekIndexForDate(d);
                const week = (wIdx >= 0 && wIdx < PLAN_WEEKS.length) ? PLAN_WEEKS[wIdx] : null;
                const dow = (d.getDay() + 6) % 7;
                const isRest = dow === 6;
                const classes = ["cal-cell"];
                if (!inMonth) classes.push("out");
                if (isToday) classes.push("today");
                if (isSelected) classes.push("selected");
                if (isExam) classes.push("exam");
                if (week) classes.push("p" + phaseNum(week));
                if (isRest && week) classes.push("rest");
                const wLabel = week ? `W${week.w}` : "";
                const events = inMonth && week ? dayCellEvents(d) : [];
                const evsHtml = events.map(e => `<span class="ev ${e.kind}">${escapeHtml(e.text)}</span>`).join("");
                html += `<div class="${classes.join(" ")}" data-ymd="${ds}">
        <div class="cal-head">
          <span class="cal-day-num">${d.getDate()}</span>
          <span class="cal-w">${wLabel}</span>
        </div>
        <div class="cal-events">${evsHtml}</div>
      </div>`;
            }
            html += `</div>
    <div class="cal-legend">
      <span><i style="background:rgba(122,184,255,.4)"></i>F1 Cimientos</span>
      <span><i style="background:rgba(255,200,100,.4)"></i>F2 Penal Gen</span>
      <span><i style="background:rgba(255,150,100,.5)"></i>F3 Penal Esp</span>
      <span><i style="background:rgba(255,100,100,.5)"></i>F4 Cierre C</span>
      <span><i style="background:rgba(150,220,150,.5)"></i>F5 Repaso</span>
      <span><i style="background:rgba(200,170,255,.5)"></i>F6 Pulido</span>
      <span><i style="background:var(--bad)"></i>Examen</span>
    </div>
    <div id="dayDetail"></div>`;

            body.innerHTML = html;

            $("calPrev").onclick = () => {
                const m = new Date(monthAnchor.getFullYear(), monthAnchor.getMonth() - 1, 1);
                setPlanUI({ month: `${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, "0")}` });
                renderPlanCalendar();
            };
            $("calNext").onclick = () => {
                const m = new Date(monthAnchor.getFullYear(), monthAnchor.getMonth() + 1, 1);
                setPlanUI({ month: `${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, "0")}` });
                renderPlanCalendar();
            };
            $("calToday").onclick = () => {
                setPlanUI({ month: null, selectedDay: ymd(today) });
                renderPlanCalendar();
            };
            $("calIcs").onclick = () => downloadICS();

            body.querySelectorAll(".cal-cell:not(.out)").forEach(cell => {
                cell.onclick = () => {
                    setPlanUI({ selectedDay: cell.dataset.ymd });
                    renderPlanCalendar();
                };
            });

            renderDayDetail(parseYmd(selectedYmd));
        }

        function renderDayDetail(d) {
            const host = $("dayDetail"); if (!host) return;
            const wIdx = planWeekIndexForDate(d);
            const week = (wIdx >= 0 && wIdx < PLAN_WEEKS.length) ? PLAN_WEEKS[wIdx] : null;
            const dateLabel = d.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

            let html = `<div class="cal-day-detail"><h3>${escapeHtml(dateLabel)}</h3>`;

            if (d.getTime() === parseYmd(PLAN_EXAM).getTime()) {
                html += `<div class="day-sub" style="color:var(--bad);font-weight:700">🎯 Día del examen (estimado).</div>`;
            }
            if (!week) {
                if (d < parseYmd(PLAN_START)) {
                    html += `<div class="day-sub">Antes del inicio del plan (25 may 2026). Aprovecha para descansar, preparar materiales y revisar las pruebas físicas.</div>`;
                } else {
                    html += `<div class="day-sub">Después del examen. ¡Suerte! 🍀</div>`;
                }
                html += `</div>`;
                host.innerHTML = html;
                return;
            }

            html += `<div class="day-sub"><b>${escapeHtml(week.phase)}</b> · W${week.w} — ${escapeHtml(week.title)}</div>`;
            html += `<div class="day-sub">${escapeHtml(week.note)}</div>`;

            const schedule = buildDaySchedule(d);
            if (schedule.length) {
                // Sum study-related blocks (everything except físico, comida, pausa, descanso).
                const studyKinds = new Set(["stu", "rep", "tst", "sim"]);
                let mins = 0;
                for (const b of schedule) {
                    if (b.allDay || !studyKinds.has(b.kind)) continue;
                    const [h1, m1] = b.start.split(":").map(Number);
                    const [h2, m2] = b.end.split(":").map(Number);
                    mins += (h2 * 60 + m2) - (h1 * 60 + m1);
                }
                const hours = Math.round(mins / 60 * 10) / 10;
                const items = schedule.map(b => {
                    if (b.allDay) {
                        return `<li class="${b.kind}"><span class="t">Todo el día</span><span class="lbl"><b>${escapeHtml(b.title)}</b><span class="desc">${escapeHtml(b.desc)}</span></span></li>`;
                    }
                    return `<li class="${b.kind}"><span class="t">${b.start}–${b.end}</span><span class="lbl"><b>${escapeHtml(b.title)}</b>${b.desc ? `<span class="desc">${escapeHtml(b.desc)}</span>` : ""}</span></li>`;
                }).join("");
                const totalLine = mins > 0
                    ? `<div class="wk-min" style="margin-top:8px">⏱️ <b>${hours} h de estudio</b> (sin contar físico ni comidas)</div>`
                    : "";
                html += `<div class="day-block"><h4>Cronograma</h4><ul class="sched">${items}</ul>${totalLine}</div>`;
            }

            // Tema chips for the week (clickable to open detail)
            if (week.temas.length) {
                const done = getPlanDone();
                const chips = week.temas.map(tn => {
                    const t = TEMAS.find(x => x.n === tn); if (!t) return "";
                    const isDone = !!done[tn];
                    return `<span class="wk-tema ${isDone ? "done" : ""}" data-tema="${tn}">
            <span class="pill ${t.b}">${t.n}</span>${escapeHtml(t.t.length > 36 ? t.t.slice(0, 34) + "…" : t.t)}
          </span>`;
                }).join("");
                const bud = planWeekBudget(week);
                html += `<div class="day-block"><h4>Temas de la semana</h4>
          <div class="wk-temas">${chips}</div>
          <div class="wk-min">⏱️ ${Math.round(bud.total / 60 * 10) / 10} h estimadas (A:${bud.byB.A} · B:${bud.byB.B} · C:${bud.byB.C} min)</div>
          <div class="muted" style="font-size:12px;color:var(--muted);margin-top:6px">Tap = abrir tema · long-press / click derecho = marcar hecho.</div>
        </div>`;
            }

            html += `</div>`;
            host.innerHTML = html;

            host.querySelectorAll(".wk-tema[data-tema]").forEach(el => {
                const n = parseInt(el.dataset.tema, 10);
                let pressTimer = null;
                const toggle = (e) => { e.preventDefault(); e.stopPropagation(); togglePlanDone(n); renderPlanCalendar(); };
                el.addEventListener("click", e => {
                    if (e.shiftKey) { toggle(e); return; }
                    showView("temario"); openTema(n);
                });
                el.addEventListener("contextmenu", toggle);
                el.addEventListener("touchstart", () => {
                    pressTimer = setTimeout(() => { togglePlanDone(n); renderPlanCalendar(); pressTimer = null; }, 600);
                }, { passive: true });
                el.addEventListener("touchend", () => { if (pressTimer) clearTimeout(pressTimer); });
                el.addEventListener("touchmove", () => { if (pressTimer) clearTimeout(pressTimer); });
            });
        }

        // ===== ICS export (Google / Android / Apple Calendar) =====
        function icsEsc(s) {
            return (s || "").replace(/\\/g, "\\\\").replace(/,/g, "\\,").replace(/;/g, "\\;").replace(/\r?\n/g, "\\n");
        }
        function icsNowUTC() {
            const d = new Date();
            const p = n => String(n).padStart(2, "0");
            return `${d.getUTCFullYear()}${p(d.getUTCMonth() + 1)}${p(d.getUTCDate())}T${p(d.getUTCHours())}${p(d.getUTCMinutes())}${p(d.getUTCSeconds())}Z`;
        }
        function icsFold(line) {
            // RFC 5545: lines >75 octets must be folded with CRLF + space.
            if (line.length <= 75) return line;
            const out = []; let i = 0;
            while (i < line.length) {
                const chunk = line.slice(i, i + (i === 0 ? 75 : 74));
                out.push((i === 0 ? "" : " ") + chunk);
                i += (i === 0 ? 75 : 74);
            }
            return out.join("\r\n");
        }
        function buildICS() {
            const tz = "Europe/Madrid";
            const out = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//Opos CNP//Plan estudio//ES",
                "CALSCALE:GREGORIAN",
                "METHOD:PUBLISH",
                "X-WR-CALNAME:Opos CNP · Plan de estudio",
                "X-WR-TIMEZONE:" + tz,
                // Minimal VTIMEZONE for Madrid (CET/CEST)
                "BEGIN:VTIMEZONE",
                "TZID:" + tz,
                "BEGIN:STANDARD",
                "DTSTART:19701025T030000",
                "RRULE:FREQ=YEARLY;BYDAY=-1SU;BYMONTH=10",
                "TZOFFSETFROM:+0200",
                "TZOFFSETTO:+0100",
                "TZNAME:CET",
                "END:STANDARD",
                "BEGIN:DAYLIGHT",
                "DTSTART:19700329T020000",
                "RRULE:FREQ=YEARLY;BYDAY=-1SU;BYMONTH=3",
                "TZOFFSETFROM:+0100",
                "TZOFFSETTO:+0200",
                "TZNAME:CEST",
                "END:DAYLIGHT",
                "END:VTIMEZONE"
            ];
            const dtstamp = icsNowUTC();
            const start = parseYmd(PLAN_START);
            const end = parseYmd(PLAN_EXAM);
            let uid = 0;
            const d = new Date(start);
            while (d <= end) {
                const schedule = buildDaySchedule(d);
                const ymdCompact = ymd(d).replace(/-/g, "");
                for (const b of schedule) {
                    out.push("BEGIN:VEVENT");
                    out.push(`UID:opos-cnp-${ymd(d)}-${uid++}@local`);
                    out.push(`DTSTAMP:${dtstamp}`);
                    if (b.allDay) {
                        const nd = new Date(d); nd.setDate(nd.getDate() + 1);
                        out.push(`DTSTART;VALUE=DATE:${ymdCompact}`);
                        out.push(`DTEND;VALUE=DATE:${ymd(nd).replace(/-/g, "")}`);
                    } else {
                        out.push(`DTSTART;TZID=${tz}:${ymdCompact}T${b.start.replace(":", "")}00`);
                        out.push(`DTEND;TZID=${tz}:${ymdCompact}T${b.end.replace(":", "")}00`);
                    }
                    out.push(icsFold(`SUMMARY:${icsEsc(b.title)}`));
                    if (b.desc) out.push(icsFold(`DESCRIPTION:${icsEsc(b.desc)}`));
                    out.push("END:VEVENT");
                }
                d.setDate(d.getDate() + 1);
            }
            // Exam day all-day event
            const examCompact = PLAN_EXAM.replace(/-/g, "");
            const examNext = new Date(parseYmd(PLAN_EXAM)); examNext.setDate(examNext.getDate() + 1);
            out.push("BEGIN:VEVENT");
            out.push("UID:opos-cnp-exam@local");
            out.push(`DTSTAMP:${dtstamp}`);
            out.push(`DTSTART;VALUE=DATE:${examCompact}`);
            out.push(`DTEND;VALUE=DATE:${ymd(examNext).replace(/-/g, "")}`);
            out.push("SUMMARY:🎯 Examen Inspector CNP (estimado)");
            out.push("END:VEVENT");
            out.push("END:VCALENDAR");
            return out.join("\r\n");
        }
        function downloadICS() {
            const ics = buildICS();
            const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "opos-cnp-plan.ics";
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
        }

        // ===== Sub-tab: Weeks (vertical list, previous behaviour) =====
        function renderPlanWeeks() {
            const body = $("planTabBody"); if (!body) return;
            const today = new Date(); today.setHours(0, 0, 0, 0);
            const curIdx = planWeekIndexForDate(today);
            const done = getPlanDone();

            let html = "";
            let lastPhase = "";
            PLAN_WEEKS.forEach((w, i) => {
                if (w.phase !== lastPhase) {
                    html += `<div class="plan-phase">${escapeHtml(w.phase)}</div>`;
                    lastPhase = w.phase;
                }
                const state = i < curIdx ? "past" : i === curIdx ? "current" : "";
                const badge = i === curIdx ? `<span class="wk-badge now">Esta semana</span>`
                    : i < curIdx ? `<span class="wk-badge">Pasada</span>`
