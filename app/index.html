            {
                n: 15, b: "A", a: "Extranjería", t: "Entrada, circulación y residencia de extranjeros", norma: "LO 4/2000; RD 557/2011", keys: ["extranjería", "residencia", "reagrupación", "menores"], rel: [3, 16, 17], d: 4, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-2000-544", rec: "https://extranjeros.inclusion.gob.es/",
                resumen: [
                    "NORMATIVA: LO 4/2000, de 11 enero, sobre Derechos y Libertades de los Extranjeros en España y su Integración Social (modificada varias veces; la más relevante por LO 2/2009). Desarrollada por RD 557/2011 (Reglamento). Acervo Schengen: Reglamento (UE) 2016/399 — Código de Fronteras; Reglamento (CE) 810/2009 — Código de Visados.",
                    "ÁMBITO de aplicación (art. 1 LO 4/2000): son extranjeros los que CAREZCAN de la nacionalidad española. NO se aplica a los nacionales de Estados de la UE ni a aquellos a quienes sea de aplicación el régimen comunitario (RD 240/2007), salvo que sea más favorable. Tampoco al personal diplomático acreditado.",
                    "ENTRADA EN ESPAÑA (art. 25 LO 4/2000): por puestos habilitados (frontera) con pasaporte o documento de viaje en vigor; con visado cuando se exija; acreditando objeto y condiciones de la estancia; medios de vida suficientes; no estar sujeto a prohibiciones de entrada. Los menores de 18 años requerirán además autorización escrita.",
                    "PROHIBICIóN DE ENTRADA (art. 26 LO 4/2000): a quienes hayan sido previamente expulsados (durante el periodo de prohibición); a quienes pretendan entrar ilegalmente; a aquellos sobre los que recaiga prohibición internacional (sistema SIS) o que supongan un riesgo grave para el orden público, la seguridad nacional o la salud pública.",
                    "VISADO SCHENGEN — tipos (Reglamento 810/2009): VISADO 'TIPO A' — TRÁNSITO AEROPORTUARIO (tránsito por zona internacional de un aeropuerto Schengen sin entrar). VISADO 'TIPO C' — ESTANCIA O TRÁNSITO en el territorio de los Estados Schengen por un período NO SUPERIOR a 90 DÍAS dentro de un período de 180 días. VISADO 'TIPO D' — ESTANCIA DE LARGA DURACIÓN o NACIONAL (>90 días), expedido por un solo Estado miembro y válido sólo en su territorio (con habilitación para circular por Schengen 90/180).",
                    "IDENTIFICADORES BIOMÉTRICOS para el visado Schengen: el solicitante deberá facilitar una FOTOGRAFÍA y DIEZ IMPRESIONES DACTILARES (las 10 huellas). Quedan exentos: menores de 12 años, personas para quienes la toma sea físicamente imposible, Jefes de Estado y miembros de gobiernos.",
                    "SITUACIONES de los extranjeros (LO 4/2000): a) ESTANCIA — permanencia hasta 90 días en cualquier período de 180; estancia por estudios, móvil o investigación; b) RESIDENCIA TEMPORAL — autorización para permanecer por período SUPERIOR A 90 DÍAS E INFERIOR A 5 AÑOS; c) RESIDENCIA DE LARGA DURACIÓN — autorización para residir indefinidamente y trabajar en igualdad con españoles; se accede tras 5 AÑOS de residencia temporal continuada.",
                    "RESIDENCIA DE LARGA DURACIÓN-UE (art. 32.2 LO 4/2000): la solicitada por extranjeros residentes legales y continuadamente durante 5 años; concede el derecho de residencia y trabajo en cualquier Estado de la UE en las condiciones de su normativa.",
                    "REAGRUPACIÓN FAMILIAR (arts. 16-19 LO 4/2000): los extranjeros residentes tienen derecho a reagrupar a sus familiares previa solicitud de residencia temporal por reagrupación. FAMILIARES REAGRUPABLES (art. 17): a) CÓNYUGE no separado de hecho ni de derecho (cuando el matrimonio no se haya celebrado en fraude de ley); pareja con la que mantenga una relación de afectividad análoga; b) HIJOS del residente y del cónyuge (menores de 18 años o que tengan una discapacidad); c) MENORES de 18 años sobre los que ostente la representación legal; d) ASCENDIENTES en primer grado a su cargo cuando sean mayores de 65 años y existan razones que justifiquen la necesidad de autorizar su residencia.",
                    "MENORES EXTRANJEROS NO ACOMPAÑADOS (MENAS) (art. 35 LO 4/2000): localizados sin representante legal, la Administración adoptará las medidas de protección previstas en la legislación de protección jurídica del menor. El Ministerio Fiscal dispondrá la determinación de la edad mediante pruebas médicas. Cuando se determine que es menor, será puesto a disposición de los servicios de protección de menores de la CCAA. Se preferirá el RETORNO con su familia o repatriación a su país; en su defecto, la permanencia en España.",
                    "COMPARECENCIA PERSONAL (RD 557/2011): la regla general es la comparecencia personal del extranjero en las oficinas competentes para los trámites. Excepcionalmente, se podrá eximir cuando se trate de un solicitante de un pasaporte provisional en una MisiÓn diplomática por razones justificadas de enfermedad u otras de igual entidad que le imposibiliten para hacerlo.",
                    "NIE — NÚMero de Identidad de Extranjero (art. 6 LO 4/2000 y RD 557/2011): todos los extranjeros a los que se expida un visado o autorización para permanecer en España por período superior a 6 meses, obtendrán una TARJETA DE IDENTIDAD DE EXTRANJERO (TIE), que deberá ser solicitada personalmente en el plazo de 1 MES desde su entrada en España o desde que se conceda la autorización.",
                    "DERECHOS Y LIBERTADES de los extranjeros (Título I LO 4/2000): los extranjeros gozarán en España de los derechos y libertades reconocidos en el Título I CE en los términos establecidos en los Tratados y en esta Ley. Derecho a la educación (obligatoria y gratuita para menores 16 años, incluidos en situación irregular). Derecho a la asistencia sanitaria. Derecho de reunión, asociación, sindicación y huelga. Derecho a la asistencia jurídica gratuita en procedimientos administrativos o judiciales que puedan llevar a la denegación de entrada, devolución o expulsión.",
                    "Truco examen: Visado C = hasta 90 días / Visado D = larga duración nacional / Visado A = tránsito aeroportuario. Biométricos = FOTO + 10 huellas dactilares. Residencia temporal = >90 días y <5 años. Larga duración = tras 5 años. Reagrupación ASCENDIENTES = sólo si mayores 65 y a su cargo. TIE = solicitar en 1 MES desde entrada/concesión."
                ]
            },
            {
                n: 16, b: "A", a: "Extranjería", t: "Sanciones y expulsión de extranjeros", norma: "LO 4/2000 Título III", keys: ["infracciones", "expulsión", "devolución", "trata"], rel: [15, 17, 19, 35], d: 3, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-2000-544", rec: "https://extranjeros.inclusion.gob.es/",
                resumen: [
                    "Régimen sancionador (Título III LO 4/2000, arts. 50-66). Tres categorías de infracciones: LEVES, GRAVES y MUY GRAVES (art. 51). Distinguir bien: las sanciones son MULTA (regla) o EXPULSIÓN (graves y muy graves, alternativa a la multa, motivada).",
                    "INFRACCIONES LEVES (art. 52): a) encontrarse trabajando en España sin haber solicitado autorización administrativa para trabajar por cuenta propia; b) encontrarse trabajando en una ocupación, sector de actividad o ámbito geográfico no contemplados; c) incurrir en demora, hasta 3 meses, en la solicitud de renovación de las autorizaciones una vez hayan caducado; d) las descritas en el art. 53 cuando concurran determinadas circunstancias; e) cualquier otro incumplimiento o vulneración de las disposiciones.",
                    "INFRACCIONES GRAVES (art. 53.1): a) encontrarse irregularmente en territorio español por no haber obtenido la prórroga de estancia, carecer de autorización de residencia o tener caducada más de 3 meses la mencionada autorización; b) encontrarse trabajando en España sin haber obtenido autorización de trabajo o autorización administrativa previa para trabajar; c) incurrir en ocultación dolosa o falsedad grave en el cumplimiento de la obligación de poner en conocimiento del Ministerio del Interior los cambios; d) incumplimiento de las medidas impuestas por razón de seguridad pública; e) cometer una tercera infracción leve en plazo de 1 año.",
                    "Otras infracciones GRAVES (art. 53.2): contraer matrimonio, simular relación afectiva análoga o constituirse en representante legal de un menor cuando dichas conductas se realicen con ánimo de obtener un beneficio económico o de obtener indebidamente un derecho de residencia; promover la PERMANENCIA IRREGULAR en España de un extranjero, cuando su entrada legal haya contado con una invitación; consentir la inscripción de un extranjero en el padrón municipal por parte del titular de una vivienda habilitada al efecto, sin que dicho extranjero resida.",
                    "INFRACCIONES MUY GRAVES (art. 54): a) participar en actividades CONTRARIAS A LA SEGURIDAD NACIONAL o que pueden perjudicar las relaciones de España con otros países, o estar implicados en actividades contrarias al orden público; b) INDUCIR, promover, favorecer o facilitar con ánimo de lucro, individualmente o formando parte de una organización, la INMIGRACIÓN CLANDESTINA de personas en tránsito o con destino al territorio español o su permanencia; c) la realización de conductas de DISCRIMINACIÓN por motivos raciales, étnicos, nacionales o religiosos; d) la contratación de trabajadores extranjeros sin haber obtenido con carácter previo la correspondiente autorización de residencia y trabajo, incurriéndose en una infracción por cada uno de los trabajadores extranjeros ocupados.",
                    "SANCIONES — MULTAS (art. 55.1): infracciones LEVES — multa de hasta 500 €; GRAVES — de 501 a 10.000 € (al transportista 5.001-10.000 por cada viajero); MUY GRAVES — de 10.001 a 100.000 € (transportista 10.001 hasta 750.000).",
                    "PRESCRIPCIÓN de las INFRACCIONES (art. 56 LO 4/2000): MUY GRAVES — 3 AÑOS; GRAVES — 2 AÑOS; LEVES — 6 MESES. Prescripción de las SANCIONES: MUY GRAVES — 5 AÑOS; GRAVES — 2 AÑOS; LEVES — 1 AÑO. Plazos contados desde la firmeza en vía administrativa.",
                    "EXPULSIÓN del territorio (art. 57 LO 4/2000): cuando los infractores sean extranjeros y realicen conductas de las tipificadas como MUY GRAVES, o conductas graves de las previstas en a), b), c), d) y f) del art. 53.1, podrá aplicarse, EN ATENCIÓN AL PRINCIPIO DE PROPORCIONALIDAD, EN LUGAR DE LA SANCIóN DE MULTA, la EXPULSIóN del territorio español, previa tramitación del correspondiente expediente administrativo y mediante la resolución motivada que valore los hechos. Conlleva PROHIBICIóN de entrada en territorio español y al espacio Schengen DE 5 AÑOS (máximo prorrogable hasta 10 si el extranjero supone una amenaza grave).",
                    "EXPULSIÓN (art. 57.2 LO 4/2000) — supuesto especial: constituye CAUSA DE EXPULSIÓN que el extranjero haya sido CONDENADO, dentro o fuera de España, por una conducta dolosa que constituya en nuestro país delito sancionado con pena privativa de libertad SUPERIOR A 1 AÑO, salvo que los antecedentes penales hubieran sido cancelados.",
                    "EXCLUSIONES de la expulsión (art. 57.5): no se podrá imponer a los extranjeros que se encuentren en los siguientes supuestos: a) NACIDOS EN ESPAÑA que hayan residido legalmente en los últimos 5 años; b) RESIDENTES DE LARGA DURACIÓN (con matizaciones); c) que hayan sido españoles de origen y hubieran perdido la nacionalidad; d) BENEFICIARIOS DE PRESTACIÓN por INCAPACIDAD PERMANENTE como consecuencia de un accidente de trabajo o enfermedad profesional ocurridos en España, así como los que perciban una prestación contributiva por desempleo o asistencia económica de carácter público. Tampoco se podrá expulsar a las MUJERES EMBARAZADAS cuando suponga un riesgo para la gestación.",
                    "DEVOLUCIóN (art. 58.3 LO 4/2000): no será preciso expediente de expulsión para la DEVOLUCIÓN de los extranjeros que: a) habiendo sido expulsados contravengan la prohibición de entrada; b) pretendan ENTRAR ILEGALMENTE en el país (incluidos los interceptados en la frontera o en sus inmediaciones). En el plazo máximo de 72 HORAS desde la entrada, el extranjero será puesto en libertad o internado, en su caso, en un CIE.",
                    "REGRESO (art. 60 LO 4/2000): a los extranjeros a los que en frontera no se les permita el ingreso en el país (denegación de entrada) serán RETORNADOS a su punto de origen en el plazo más breve posible. La autoridad gubernativa podrá acordar su INGRESO en un CIE hasta que se produzca el retorno (máximo 72 horas).",
                    "CENTROS DE INTERNAMIENTO DE EXTRANJEROS (CIE) (arts. 62 y ss.): incoado el expediente de expulsión, devolución o retorno, el instructor podrá solicitar al Juez de Instrucción el INTERNAMIENTO. El internamiento no podrá prolongarse por más tiempo del imprescindible y NO PODRÁ EXCEDER DE 60 DÍAS. CIE tienen carácter NO PENITENCIARIO; depende de la DGP (Comisaría General de Extranjería y Fronteras).",
                    "TRATA DE SERES HUMANOS (art. 59 bis LO 4/2000): la autoridad competente, en cuanto tenga indicios razonables de que un extranjero en situación irregular ha sido víctima de trata de seres humanos, le informará de sus derechos y le ofrecerá un PERÍODO DE RESTABLECIMIENTO Y REFLEXIÓN de al menos 90 DÍAS. Durante este período, se le AUTORIZARÁ LA ESTANCIA TEMPORAL Y SE SUSPENDERÁN EL EXPEDIENTE administrativo sancionador.",
                    "Truco examen: 3 niveles infracción con plazos prescriptivos LEVES 6 meses / GRAVES 2 años / MUY GRAVES 3 años. EXPULSIÓN: prohibición 5-10 años; alternativa a multa. DEVOLUCIÓN: no necesita expediente (entrada ilegal o quebrantamiento). REGRESO: denegación en frontera. CIE máximo 60 DÍAS. Trata = 90 días restablecimiento."
                ]

            {
                n: 17, b: "A", a: "Extranjería", t: "Protección internacional. Asilo y apátridas", norma: "Ley 12/2009", keys: ["asilo", "refugiado", "apátrida", "protección temporal"], rel: [3, 15, 16], d: 3, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-2009-17242", rec: "https://www.acnur.org/es-es",
                resumen: [
                    "REGULACIÓN: Ley 12/2009, de 30 oct, reguladora del DERECHO DE ASILO Y DE LA PROTECCIÓN SUBSIDIARIA. Marco internacional: Convención de Ginebra de 1951 y Protocolo de Nueva York de 1967 (Convención del Estatuto de los Refugiados). Marco UE: Directiva 2011/95/UE (cualificación), Reglamento Dublín III 604/2013 (Estado responsable).",
                    "ASILO (art. 2 L 12/2009): la protección dispensada a los nacionales no comunitarios o a los apátridas a quienes se reconozca la condición de REFUGIADO en los términos definidos en el art. 3.",
                    "REFUGIADO (art. 3 L 12/2009): toda persona que, debido a fundados TEMORES de ser PERSEGUIDA por motivos de raza, religión, nacionalidad, opiniones políticas, pertenencia a determinado grupo social, de género u orientación sexual, se encuentra fuera del país de su nacionalidad y no puede o, a causa de dichos temores, no quiere acogerse a la protección de tal país. España incluye expresamente la PERSECUCIÓN POR GÉNERO y ORIENTACIÓN SEXUAL.",
                    "ACTOS DE PERSECUCIÓN (art. 6 L 12/2009): para ser considerados como tales deben ser SUFICIENTEMENTE GRAVES por su naturaleza o carácter REITERADO. Formas: actos de violencia física o psíquica, incluidos los de naturaleza sexual; medidas legales, administrativas, policiales o judiciales discriminatorias; procesamientos o penas desproporcionadas o discriminatorias; denegación de tutela judicial; procesamientos por la negativa a prestar servicio militar en un conflicto cuando éste pudiera implicar crimines; actos de naturaleza sexual que afecten a adultos o niños.",
                    "PROTECCIÓN SUBSIDIARIA (art. 4 L 12/2009): el derecho dispensado a las personas de otros países y a los apátridas que, sin reunir los requisitos para obtener el asilo, se den motivos fundados para creer que si regresasen a su país de origen se enfrentarían a un riesgo real de sufrir alguno de los DAÑOS GRAVES previstos en el art. 10: a) condena a pena de muerte o riesgo de su ejecución; b) tortura o tratos inhumanos o degradantes; c) amenazas graves contra la vida o integridad por razón de violencia indiscriminada en situaciones de conflicto internacional o interno.",
                    "CLÁUSULAS DE EXCLUSIÓN (arts. 8 y 11 L 12/2009): NO se concederá asilo ni protección subsidiaria a quien haya cometido: a) un delito CONTRA LA PAZ, un delito de GUERRA o un delito CONTRA LA HUMANIDAD; b) un delito GRAVE COMÚN fuera del país de refugio antes de ser admitido; c) actos contrarios a las finalidades y a los principios de Naciones Unidas. Tampoco quien constituya un peligro para la seguridad de España.",
                    "PROCEDIMIENTO — SOLICITUD (art. 17): se formula mediante COMPARECENCIA PERSONAL del interesado en los lugares habilitados (Oficina de Asilo y Refugio, puestos fronterizos de entrada, CIE, Oficinas de Extranjería, comisarías autorizadas) o ante representación diplomática/consular española. La presentación debe hacerse SIN DEMORA y en cualquier caso en el PLAZO DE 1 MES desde la entrada en territorio español o desde que se produzcan los acontecimientos que justifiquen su temor.",
                    "FASES del procedimiento: 1) ADMISIÓN A TRÁMITE (Oficina de Asilo y Refugio resuelve en 1 MES; si no, se entiende admitida); 2) INSTRUCCIÓN (Oficina de Asilo y Refugio, dependiente de la Dirección General de Política Interior del Min. Interior); 3) PROPUESTA DE RESOLUCIÓN por la Comisión Interministerial de Asilo y Refugio (CIAR); 4) RESOLUCIÓN por el Ministro del Interior. Plazo máximo procedimiento ORDINARIO: 6 MESES; URGENTE: 3 MESES.",
                    "DERECHOS de los SOLICITANTES (art. 18): a ser documentado como solicitante de protección internacional; a asistencia jurídica gratuita e intérprete; a que se comunique su solicitud al ACNUR; a la suspensión de cualquier proceso de devolución, expulsión o extradición. La Administración adoptará las medidas necesarias para asegurar la atención de las necesidades BÁSICAS y para garantizar la unidad familiar.",
                    "CENTROS DE ACOGIDA DE REFUGIADOS (CAR): los solicitantes de protección internacional que carezcan de recursos pueden ser acogidos en CAR (Madrid, Sevilla, Valencia, Vallecas, Mislata, Alcobendas, etc.). El periodo máximo de estancia es de 6 MESES, prorrogable según circunstancias personales.",
                    "PROTECCIÓN TEMPORAL (art. 46 L 12/2009 + RD 1325/2003): procedimiento de carácter excepcional que garantiza la protección inmediata y de duración limitada a personas desplazadas que no puedan regresar a su país, en caso de afluencia masiva. Activada por el Consejo de la UE. Aplicada en 2022 para ciudadanos UCRANIANOS (Decisión UE 2022/382 — prorrogada por la UE).",

                    "NATURALEZA (art. 2 Ley 5/2014): la seguridad privada es el conjunto de actividades, servicios, funciones y medidas de seguridad adoptadas, de forma VOLUNTARIA u OBLIGATORIA, por personas físicas o jurídicas, públicas o privadas, realizadas o prestadas por empresas de seguridad, despachos de detectives privados y personal de seguridad privada para hacer frente a actos delictivos o infracciones administrativas relacionadas con la seguridad. Es COMPLEMENTARIA y SUBORDINADA respecto de la seguridad pública.",

                    "SERVICIOS COMPATIBLES con seguridad pública (art. 41 Ley 5/2014): a) servicios de vigilancia y protección en POLIGONOS INDUSTRIALES y URBANIZACIONES AISLADAS; b) servicios de vigilancia en COMPLEJOS COMERCIALES y de OCIO; c) servicios en acontecimientos DEPORTIVOS, CULTURALES o de cualquier otra índole; d) servicios de protección del transporte y de las INFRAESTRUCTURAS DE LOS MEDIOS DE TRANSPORTE; e) servicios de vigilancia y protección en URBANIZACIONES.",
                    "PERSONAL DE SEGURIDAD PRIVADA (art. 26) — 6 categorías: 1) VIGILANTES DE SEGURIDAD y su especialidad de Vigilantes de Explosivos; 2) ESCOLTAS PRIVADOS; 3) GUARDAS RURALES y sus especialidades (Guardas de Caza y Guardapescas Marítimos); 4) JEFES DE SEGURIDAD; 5) DIRECTORES DE SEGURIDAD; 6) DETECTIVES PRIVADOS.",
                    "HABILITACIÓN PROFESIONAL (art. 27): el ejercicio profesional requiere HABILITACIÓN PREVIA por el Ministerio del Interior, otorgada por la Subdirección General de Personal del CNP. Requisitos generales: nacionalidad española o de un Estado UE; mayoría de edad; no haber sido CONDENADO por delito doloso; no haber sido sancionado en los últimos 2-4 años por infracción grave/muy grave en seguridad; capacidad psicofísica.",
                    "FORMACIÓN (art. 29): los aspirantes deben superar las pruebas de comprobación de los conocimientos y capacidad necesarios, previa formación teórico-práctica. La formación se imparte en CENTROS DE FORMACIÓN de seguridad privada autorizados por el Min. Interior. Para detective privado: título de Grado o Bachiller + formación específica + pruebas de la Subdirección General de Personal CNP.",
                    "UNIFORME, ARMAS y DISTINTIVOS (art. 28): el personal con uniforme deberá portar el distintivo de su categoría y, durante el servicio, su TARJETA DE IDENTIDAD PROFESIONAL. Los vigilantes prestarán sus servicios uniformados y portando los medios de defensa que reglamentariamente se determinen. Los vigilantes de seguridad pueden portar ARMAS (revólver) cuando lo exija la naturaleza del servicio.",
                    "FUNCIONES de los VIGILANTES (art. 32 Ley 5/2014): a) ejercer la vigilancia y protección de bienes, establecimientos, lugares y eventos, tanto privados como públicos; b) efectuar controles de identidad, de objetos personales, paquetería, mercancías o vehículos, incluido el interior de éstos, en el ACCESO O EN EL INTERIOR DE INMUEBLES o propiedades donde presten servicio, sin que en ningún caso puedan retener la documentación personal; c) EVITAR la comisión de actos delictivos o infracciones administrativas; d) en relación con el OBJETO de su protección o de su actuación, DETENER y poner inmediatamente a disposición de las FCS a los delincuentes; e) protección del almacenamiento, recuento, clasificación y transporte de dinero, valores y objetos valiosos.",
                    "DETECTIVES PRIVADOS (art. 48 Ley 5/2014): se encargan de la ejecución personal de los servicios de INVESTIGACIÓN PRIVADA. NO pueden investigar delitos perseguibles de oficio (sólo a instancia de parte). Deben colaborar con las FCS cuando sean requeridos o cuando lo precise el ejercicio de sus funciones. Las investigaciones se realizarán con respeto a los derechos fundamentales (intimidad, propia imagen, secreto comunicaciones).",
                    "RÉGIMEN SANCIONADOR (Tit. VII, arts. 56 y ss. Ley 5/2014). Infracciones MUY GRAVES (art. 57.1.b empresas / art. 57.2.b personal): multa 30.001-600.000 € (empresas) o 5.001-30.000 € (personal); cancelación autorización / inhabilitación 2-4 años. GRAVES: 3.001-30.000 € empresas / 1.001-5.000 € personal; cancelación / suspensión hasta 1 año. LEVES: hasta 3.000 € / hasta 1.000 €.",

                    "IDENTIFICACIÓN DE PERSONAS (art. 16 LO 4/2015): en el cumplimiento de sus funciones de indagación o prevención, los agentes podrán requerir la identificación de las personas en los siguientes supuestos: a) cuando existan INDICIOS de que han podido participar en la comisión de una INFRACCIÓN; b) cuando, en atención a las CIRCUNSTANCIAS CONCURRENTES, se considere razonablemente necesario para PREVENIR LA COMISIÓN DE UN DELITO. En estos supuestos, los agentes podrán realizar las COMPROBACIONES NECESARIAS en la vía pública o en el lugar donde se hubiese hecho el requerimiento.",
                    "TRASLADO A DEPENDENCIAS (art. 16.2): cuando no fuera posible la identificación por cualquier medio, incluida la vía telemática o telefónica, o si la persona se negase a identificarse, los agentes podrán requerir a quienes no pudieran ser identificados a que les acompañen a las dependencias policiales más próximas en las que se disponga de los medios adecuados para la práctica de esta diligencia. El traslado se hará saber al MINISTERIO FISCAL. Duración máxima: TIEMPO IMPRESCINDIBLE; en ningún caso MÁS DE 6 HORAS. Se llevará LIBRO-REGISTRO de las identificaciones realizadas.",

                    "DISOLUCIÓN DE REUNIONES Y MANIFESTACIONES (art. 23): los agentes pueden disolver reuniones en lugares de tránsito público y manifestaciones que se celebren incumpliendo lo previsto en la LO 9/1983, cuando se produzcan alteraciones del orden público, con peligro para personas o bienes, o cuando se hicieren uso de uniformes paramilitares.",
                    "INFRACCIONES — LEVES (art. 37, multa 100-600 €): la celebración de reuniones en lugares de tránsito público o manifestaciones, incumpliendo la obligación de COMUNICACIÓN PREVIA; exhibición de objetos peligrosos para la vida o integridad física de las personas; el incumplimiento de la obligación de obtener la documentación personal; las faltas de respeto y consideración cuyo destinatario sea un agente; etc.",
                    "INFRACCIONES — GRAVES (art. 36, multa 601-30.000 €): la PERTURBACIÓN de la seguridad ciudadana en actos públicos, espectáculos deportivos o culturales, solemnidades, oficinas públicas; los actos de obstrucción que pretendan impedir el cumplimiento de resoluciones administrativas o judiciales; la PERTURBACIÓN DEL DESARROLLO DE UNA REUNIÓN O MANIFESTACIÓN LÍCITA, cuando no constituya infracción penal; las reuniones en centros oficiales sin autorización; los actos de DESOBEDIENCIA o resistencia a la autoridad; la negativa a identificarse o la alegación de datos falsos; el uso no autorizado de IMÁGENES o DATOS de agentes que pongan en peligro su seguridad; consumo o tenencia ilícita de drogas en lugares públicos.",
                    "INFRACCIONES — MUY GRAVES (art. 35, multa 30.001-600.000 €): reuniones o manifestaciones no comunicadas o prohibidas en infraestructuras o instalaciones en las que se prestan servicios básicos para la comunidad; la fabricación, reparación, almacenamiento, comercio o uso no autorizado de armas o explosivos; la celebración de espectáculos públicos o actividades recreativas quebrantando la prohibición o suspensión; la proyección de haces de luz, mediante cualquier tipo de dispositivo, sobre los pilotos o conductores de medios de transporte.",
                    "GRADUACIÓN de SANCIONES (art. 39): la multa se impondrá en GRADO MÍNIMO, MEDIO o MÁXIMO. La COMISIÓN DE UNA INFRACCIÓN DETERMINARÁ la imposición de la MULTA CORRESPONDIENTE EN GRADO MÍNIMO (regla general). Para subir de grado deben concurrir circunstancias agravantes (intencionalidad, reincidencia, perjuicio causado, riesgo o peligrosidad).",

                resumen: [
                    "TRES normas convergen: 1) RGPD — Reglamento (UE) 2016/679 del Parlamento y Consejo, de 27 abril 2016, aplicable desde 25 mayo 2018; 2) LOPDGDD — LO 3/2018, de 5 diciembre, de Protección de Datos Personales y Garantía de los Derechos Digitales; 3) LO 7/2021, de 26 mayo, de protección de datos personales tratados para FINES DE PREVENCIÓN, DETECCIÓN, INVESTIGACIÓN Y ENJUICIAMIENTO DE INFRACCIONES PENALES y de EJECUCIÓN DE SANCIONES PENALES (transpone Directiva UE 2016/680).",
                    "DERECHO FUNDAMENTAL (art. 18.4 CE): la ley limitará el uso de la informática para garantizar el honor y la intimidad personal y familiar y el pleno ejercicio de sus derechos. STC 292/2000: la protección de datos es DERECHO FUNDAMENTAL AUTÓNOMO, distinto del derecho a la intimidad.",
                    "ÁMBITO del RGPD (art. 2): tratamiento total o parcialmente AUTOMATIZADO de datos personales, así como el TRATAMIENTO NO AUTOMATIZADO de datos personales contenidos o destinados a ser incluidos en un fichero. NO se aplica al tratamiento por una persona física en el ejercicio de actividades exclusivamente personales o domésticas; ni a tratamientos con FINES POLICIALES (que se rigen por LO 7/2021).",
                    "DEFINICIONES clave (art. 4 RGPD): DATOS PERSONALES — toda información sobre una persona física identificada o identificable. TRATAMIENTO — cualquier operación sobre datos personales. RESPONSABLE DEL TRATAMIENTO — quien determina los fines y medios. ENCARGADO DEL TRATAMIENTO — quien trata datos por cuenta del responsable. CONSENTIMIENTO — manifestación de voluntad LIBRE, ESPECÍFICA, INFORMADA E INEQUÍVOCA.",
                    "PRINCIPIOS (art. 5 RGPD): LICITUD, LEALTAD Y TRANSPARENCIA; LIMITACIÓN DE LA FINALIDAD; MINIMIZACIÓN DE DATOS (adecuados, pertinentes y limitados); EXACTITUD; LIMITACIÓN DEL PLAZO DE CONSERVACIÓN; INTEGRIDAD Y CONFIDENCIALIDAD (seguridad); RESPONSABILIDAD PROACTIVA (el responsable es responsable y debe poder demostrar el cumplimiento).",
                    "BASES JURÍDICAS del tratamiento (art. 6 RGPD): a) CONSENTIMIENTO del interesado; b) ejecución de un CONTRATO; c) cumplimiento de una OBLIGACIÓN LEGAL aplicable al responsable; d) protección de INTERESES VITALES; e) cumplimiento de una MISIÓN realizada en INTERÉS PÚBLICO o en ejercicio de PODERES PÚBLICOS; f) INTERESES LEGÍTIMOS perseguidos por el responsable o por un tercero (no aplicable a tratamientos por autoridades públicas en el ejercicio de sus funciones).",
                    "EDAD del consentimiento (art. 7 LOPDGDD): el tratamiento de los datos personales de un menor de edad únicamente podrá fundarse en su consentimiento cuando sea MAYOR DE 14 AÑOS. Los menores de 14 años: consentimiento del titular de la PATRIA POTESTAD o TUTELA.",
                    "CATEGORÍAS ESPECIALES de datos (art. 9 RGPD): origen étnico o racial, opiniones políticas, convicciones religiosas o filosóficas, afiliación sindical, datos GENÉTICOS y BIOMÉTRICOS, datos relativos a la SALUD, vida sexual u orientación sexual. Regla: PROHIBICIÓN. Excepciones tasadas (consentimiento explícito, obligaciones laborales, intereses vitales, datos manifiestamente públicos, etc.).",
                    "DERECHOS del INTERESADO (Capítulo III RGPD) — mnemotécnica 'ARCO-POL': A) ACCESO (art. 15); R) RECTIFICACIÓN (art. 16); S) SUPRESIÓN o derecho al OLVIDO (art. 17); L) LIMITACIÓN del tratamiento (art. 18); O) OPOSICIÓN (art. 21); P) PORTABILIDAD (art. 20); decisiones AUTOMATIZADAS y elaboración de perfiles (art. 22). Plazo máximo de respuesta del responsable: 1 MES (prorrogable 2 más si complejidad).",
                    "DELEGADO DE PROTECCIÓN DE DATOS (DPD/DPO) — art. 37 RGPD y art. 34 LOPDGDD: designación OBLIGATORIA cuando el tratamiento lo lleve a cabo una autoridad u organismo público (excepto tribunales en ejercicio judicial); cuando las actividades principales requieran una OBSERVACIÓN HABITUAL Y SISTEMÁTICA a gran escala; o cuando consistan en el tratamiento a gran escala de categorías especiales o relativos a condenas y delitos.",
                    "AGENCIA ESPAÑOLA DE PROTECCIÓN DE DATOS (AEPD) — arts. 44 y ss. LOPDGDD: autoridad administrativa independiente de ámbito estatal, con personalidad jurídica propia y plena capacidad. Funciones: supervisión y control, recepción y resolución de reclamaciones, sanción. Presidencia: nombramiento por RD a propuesta del Ministro de Justicia, MANDATO DE 5 AÑOS no renovable. Hay también autoridades autonómicas (Cataluña APDCAT, País Vasco AVPD, Andalucía CTPDA).",
                    "SANCIONES (art. 83 RGPD) — dos niveles: 1) hasta 10 MILLONES DE EUROS o el 2% del VOLUMEN DE NEGOCIO ANUAL GLOBAL del ejercicio financiero anterior (la cantidad superior); infracciones del art. 83.4 (DPD, encargado, brechas, etc.); 2) hasta 20 MILLONES DE EUROS o el 4% (la mayor); infracciones del art. 83.5 (principios, bases jurídicas, derechos, transferencias internacionales). LOPDGDD califica como muy graves / graves / leves a efectos de prescripción (3/2/1 años).",
                    "BRECHAS DE SEGURIDAD (arts. 33-34 RGPD): el responsable notificará a la AEPD las violaciones de seguridad SIN DILACIÓN INDEBIDA Y, DE SER POSIBLE, A MÁS TARDAR 72 HORAS después de que haya tenido constancia. Si supone alto riesgo para los derechos y libertades, COMUNICACIÓN AL INTERESADO sin dilación indebida.",
                    "USO POLICIAL DE CÁMARAS y DISPOSITIVOS DE IMAGEN Y SONIDO (LO 4/1997 + LO 7/2021): las FCS pueden utilizar dispositivos fijos previa autorización y comisión de garantías. Los dispositivos MÓVILES (cámaras corporales, drones) requieren autorización del responsable operativo y se sujetan a la GRABACIóN CONJUNTA Y SUPEDITADA, en todo caso, cuando concurra un PELIGRO o EVENTO CONCRETO. NO se podrá grabar el interior de viviendas ni lugares reservados (salvo consentimiento o autorización judicial).",
                    "Truco examen: Edad consentimiento menor = 14 años. Derechos ARCOPOL + decisiones automatizadas. DPD obligatorio en organismos públicos. Sanciones RGPD = hasta 20M€ o 4% facturación. Brecha = notificar AEPD en 72H. Cámaras móviles FCS = peligro o evento concreto. AEPD presidente = 5 años no renovable."

                resumen: [

                    "OBJETO (art. 1 Ley 8/2011): establecer estrategias y estructuras adecuadas que permitan dirigir y coordinar las actuaciones de los distintos órganos de las Administraciones Públicas en materia de protección de infraestructuras críticas, previa identificación y designación de las mismas.",
                    "DEFINICIONES (art. 2 Ley 8/2011): INFRAESTRUCTURA CRÍTICA — las infraestructuras estratégicas cuyo funcionamiento es indispensable y NO permite soluciones alternativas, por lo que su perturbación o destrucción tendría un grave impacto sobre los servicios esenciales. INFRAESTRUCTURA ESTRATÉGICA — instalaciones, redes, sistemas y equipos físicos y de tecnología de la información sobre las que descansa el funcionamiento de los servicios esenciales. SERVICIO ESENCIAL — servicio necesario para el mantenimiento de las funciones sociales básicas, la salud, la seguridad, el bienestar social y económico, o el eficaz funcionamiento de las Instituciones del Estado y las AAPP.",
                    "12 SECTORES ESTRATÉGICOS (Anexo Ley 8/2011): 1) Administración; 2) Espacio; 3) Industria Nuclear; 4) Industria Química; 5) Instalaciones de Investigación; 6) Agua; 7) Energía; 8) Salud; 9) Tecnologías de la Información y las Comunicaciones (TIC); 10) Transporte; 11) Alimentación; 12) Sistema Financiero y Tributario.",
                    "SISTEMA DE PROTECCIÓN (art. 5 Ley 8/2011) — órganos: 1) SECRETARÍA DE ESTADO DE SEGURIDAD (Min. Interior) — órgano superior; 2) CENTRO NACIONAL DE PROTECCIÓN DE INFRAESTRUCTURAS CRÍTICAS Y CIBERSEGURIDAD (CNPIC) — órgano de asistencia del SES, adscrito a la SES, integrado en la estructura de la DGP/GC. 3) COMISIÓN NACIONAL PARA LA PROTECCIÓN DE LAS INFRAESTRUCTURAS CRÍTICAS — órgano colegiado, presidido por el SES; 4) GRUPO DE TRABAJO INTERDEPARTAMENTAL; 5) Ministerios y organismos del Sistema; 6) CCAA y Ciudades de Ceuta y Melilla; 7) DELEGACIONES DEL GOBIERNO; 8) OPERADORES CRÍTICOS.",
                    "OPERADOR CRÍTICO (art. 2 Ley 8/2011): entidades u organismos responsables de las inversiones o del funcionamiento diario de una instalación, red, sistema o equipo físico o de tecnología de la información DESIGNADA COMO INFRAESTRUCTURA CRÍTICA. Obligaciones (art. 13): designar un RESPONSABLE DE SEGURIDAD Y ENLACE; designar un DELEGADO DE SEGURIDAD; elaborar el PLAN DE SEGURIDAD DEL OPERADOR (PSO); elaborar el PLAN DE PROTECCIÓN ESPECÍFICO (PPE) por cada infraestructura crítica; facilitar las inspecciones del CNPIC; colaborar con el SES.",
                    "INSTRUMENTOS DE PLANIFICACIÓN (art. 14 RD 704/2011): 1) PLAN NACIONAL DE PROTECCIÓN DE INFRAESTRUCTURAS CRÍTICAS (PNPIC) — instrumento de programación del Gobierno; 2) PLANES ESTRATÉGICOS SECTORIALES (PES) por cada uno de los 12 sectores estratégicos; 3) PLAN DE SEGURIDAD DEL OPERADOR (PSO) — estrategia global; 4) PLAN DE PROTECCIÓN ESPECÍFICO (PPE) — medidas concretas por infraestructura; 5) PLAN DE APOYO OPERATIVO (PAO) — elaborado por las FCS competentes.",
                    "CLASIFICACIÓN (LEY 9/1968 de SECRETOS OFICIALES, vigente al cierre): los Planes de Seguridad y los datos sensibles del Catálogo Nacional de Infraestructuras Estratégicas se consideran INFORMACIÓN CLASIFICADA. El acceso al Catálogo está restringido. La Ley 5/2014 prevé obligaciones reforzadas para los vigilantes que prestan servicio en PIC.",
                    "CIBERSEGURIDAD — RD-Ley 12/2018 + RD 43/2021 (NIS): transpone Directiva (UE) 2016/1148 (NIS). Ámbito: OPERADORES DE SERVICIOS ESENCIALES (energía, transporte, banca, mercados financieros, salud, agua potable, infraestructuras digitales) + PROVEEDORES DE SERVICIOS DIGITALES (mercados en línea, motores de búsqueda, servicios de computación en la nube). Obligación: notificación de INCIDENTES significativos al CSIRT competente.",
                    "CSIRTs DE REFERENCIA EN ESPAÑA: 1) CCN-CERT (Centro Criptológico Nacional) — adscrito al CNI — ámbito del SECTOR PÚBLICO ESTATAL; 2) INCIBE-CERT (Instituto Nacional de Ciberseguridad, León) — ciudadanos y empresas; 3) ESPDEF-CERT — Ministerio de Defensa; 4) CNPIC-CERT (gestionado conjuntamente por INCIBE-CERT y CNPIC) — operadores críticos.",
                    "OFICINA DE COORDINACIÓN CIBERNÉTICA (OCC): integrada en el CNPIC, es el órgano de contacto técnico de la SES con los CSIRTs y los operadores críticos. Coordina la respuesta ante incidentes que afecten a infraestructuras críticas.",
                    "ESTRATEGIA NACIONAL DE CIBERSEGURIDAD 2019 (aprobada por Consejo de Seguridad Nacional el 12 abril 2019) y ESTRATEGIA DE SEGURIDAD NACIONAL 2021 (RD 1150/2021): definen la ciberseguridad como uno de los ámbitos de la Seguridad Nacional. CONSEJO NACIONAL DE CIBERSEGURIDAD (órgano de apoyo del Consejo de Seguridad Nacional).",
                    "ESQUEMA NACIONAL DE SEGURIDAD (ENS) — RD 311/2022: marco para crear las condiciones necesarias de confianza en el uso de los medios electrónicos en el ámbito de las AAPP. Categorías: BÁSICA / MEDIA / ALTA. Principios: seguridad integral, gestión de riesgos, prevención-detección-respuesta-conservación, línea de defensa, vigilancia continua, reevaluación periódica, diferenciación responsabilidades.",
                    "Truco examen: CNPIC = Centro Nacional de Protección de Infraestructuras Críticas Y CIBERSEGURIDAD (depende SES, Interior). 12 SECTORES estratégicos (memorizarlos). 4 planes de protección: PSO operador / PPE por infraestructura / PES sectorial / PAO de las FCS. CSIRTs: CCN-CERT (CNI/público), INCIBE-CERT (privado), CNPIC (críticos), ESPDEF-CERT (Defensa). ENS = RD 311/2022 con 3 categorías Básica/Media/Alta."
                ]

            {
                n: 22, b: "A", a: "Penal — Parte General", t: "Concepto, principios y CP español", norma: "LO 10/1995 (CP)", keys: ["Derecho Penal", "legalidad", "mínima intervención"], rel: [23, 25, 33], d: 3, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444", rec: "https://es.wikipedia.org/wiki/C%C3%B3digo_Penal_de_Espa%C3%B1a",
                resumen: [
                    "CONCEPTO: el DERECHO PENAL es el conjunto de normas jurídicas que asocian a la realización de un delito como presupuesto la aplicación de penas y/o medidas de seguridad como principales consecuencias jurídicas. CÓDIGO PENAL vigente: LO 10/1995, de 23 noviembre. Estructura: Título Preliminar + LIBRO I (arts. 1-137, disposiciones generales) + LIBRO II (arts. 138-616 quater, delitos y sus penas) + LIBRO III (faltas DEROGADO por LO 1/2015, sustituidas por delitos leves). Reformas relevantes: LO 1/2015 (gran reforma + delitos leves + prisión permanente revisable); LO 10/2022 ('solo sí es sí'); LO 14/2022 (libertades digitales); LO 4/2023 (trans, derogación sedición y reforma malversación).",
                    "PRINCIPIO DE LEGALIDAD (art. 25.1 CE + arts. 1, 2, 4, 10 CP): no será castigada ninguna acción ni omisión que no esté prevista como delito por LEY ANTERIOR a su perpetración. Reserva de LO para penas privativas de libertad. Cuatro vertientes: LEX SCRIPTA (excluye costumbre); LEX PRAEVIA (irretroactividad); LEX STRICTA (prohibición analogía in malam partem, art. 4.1 CP); LEX CERTA (taxatividad, mandato de determinación).",
                    "PRINCIPIO DE INTERVENCIÓN MÍNIMA (o de Última ratio): el Derecho Penal solo debe actuar cuando los demás mecanismos de control social (Derecho Civil, Administrativo, Disciplinario) hayan fracasado. Subprincipios: 1) FRAGMENTARIEDAD (sólo los ataques más graves contra los bienes jurídicos más relevantes); 2) SUBSIDIARIEDAD (sólo cuando no haya otro medio menos lesivo).",
                    "PRINCIPIO DE CULPABILIDAD: no hay pena sin culpa. Excluye la responsabilidad objetiva. Manifestaciones: a) PERSONALIDAD de las penas (sólo responde el autor); b) RESPONSABILIDAD POR EL HECHO (no por la forma de ser); c) DOLO O IMPRUDENCIA (art. 5 CP: no hay pena sin dolo o imprudencia); d) IMPUTACIÓN PERSONAL (imputabilidad).",
                    "PRINCIPIO DE PROPORCIONALIDAD (art. 49 CDFUE + jurisprudencia TC): la pena debe ser proporcional a la gravedad del hecho y a la culpabilidad del autor. Tres juicios: idoneidad, necesidad, proporcionalidad en sentido estricto.",
                    "PRINCIPIO NON BIS IN IDEM: nadie puede ser sancionado dos veces por los mismos hechos cuando exista identidad de sujeto, hecho y fundamento. Vertiente material (acumulación de sanciones) y procesal (acumulación de procesos). STC 2/1981. Art. 31 LRJSP.",
                    "PRINCIPIO DE RESOCIALIZACIÓN (art. 25.2 CE): las penas privativas de libertad y las medidas de seguridad estarán orientadas hacia la REEDUCACIÓN y la REINSERCIÓN SOCIAL. Inspira el sistema penitenciario (LO 1/1979 General Penitenciaria) — progresión en grado, permisos, beneficios penitenciarios, libertad condicional.",
                    "PRINCIPIO DE PRESUNCIÓN DE INOCENCIA (art. 24.2 CE): toda persona acusada de un delito tiene derecho a que se presuma su inocencia mientras no se pruebe su culpabilidad conforme a la ley. Vertiente probatoria (carga de la prueba a la acusación) y procesal (in dubio pro reo).",
                    "PRINCIPIO DEL HECHO o DERECHO PENAL DEL HECHO (no del autor): se castigan HECHOS concretos (acciones u omisiones), no formas de ser o estar. Rechazo del Derecho Penal de autor.",
                    "BIEN JURÍDICO PROTEGIDO: interés socialmente valioso que la norma penal protege. Función LIMITADORA del ius puniendi (no se puede tipificar conductas sin lesión de bien jurídico) y SISTEMÁTICA (Libro II CP estructurado por bienes jurídicos: vida, integridad, libertad, patrimonio, etc.).",
                    "FUENTES del Derecho Penal: ÚNICAMENTE la LEY (art. 1 CP + 25.1 CE). En particular LO (art. 81 CE) para penas privativas de libertad. La costumbre, jurisprudencia, doctrina y principios generales NO son fuente directa (sólo complementaria).",
                    "CLASIFICACIÓN DE DELITOS (art. 13 CP): a) DELITOS GRAVES — los que la Ley castiga con pena GRAVE (art. 33.2); b) DELITOS MENOS GRAVES — castigados con pena menos grave (art. 33.3); c) DELITOS LEVES — castigados con pena LEVE (art. 33.4) — incorporados por LO 1/2015 sustituyendo las antiguas FALTAS.",
                    "NORMAS PENALES EN BLANCO: aquellas que para completar su tipo penal necesitan recurrir a otra norma extrapenal (administrativa). Ejemplo: art. 325 CP delito ecológico requiere infracción de leyes ambientales. STC 127/1990 declaró su constitucionalidad si el reenvío es expreso y justificado y la pena queda fijada en la propia ley penal.",
                    "INTERPRETACIÓN (art. 3 CC + jurisprudencia): gramatical, sistemática, histórica, teleológica. En Derecho Penal RIGE LA PROHIBICIÓN DE ANALOGÍA IN MALAM PARTEM (art. 4.1 CP — no se aplicarán a casos distintos las leyes penales). SÍ se admite analogía IN BONAM PARTEM (favorable al reo).",
                    "Truco examen: CP = LO 10/1995. Libro III FALTAS DEROGADO por LO 1/2015 (ahora delitos leves art. 13.4). Reservas LO + cuatro vertientes legalidad. Principios mnemotécnica L-IM-C-P-N-R-P-H-B (Legalidad, Intervención Mínima, Culpabilidad, Proporcionalidad, Non bis, Resocialización, Presunción, Hecho, Bien jurídico). Analogía PROHIBIDA in malam partem; permitida in bonam partem."
                ]

            {
                n: 23, b: "A", a: "Penal — Parte General", t: "Ley penal: tiempo, espacio, personas. Extradición", norma: "CP arts. 1-9; LO 4/1985", keys: ["retroactividad", "extradición", "inmunidad"], rel: [22, 24], d: 3, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444", rec: "https://es.wikipedia.org/wiki/Extradici%C3%B3n",
                resumen: [
                    "ÁMBITO TEMPORAL — IRRETROACTIVIDAD (art. 9.3 CE + art. 1 CP + art. 2.1 CP): no será castigado ningún delito con pena que no se halle prevista por ley anterior a su perpetración. Carecerán, igualmente, de efecto retroactivo las leyes que establezcan medidas de seguridad. Momento de la comisión (art. 7 CP): los delitos se consideran cometidos en el momento en que el sujeto ejecuta la ACCIÓN u OMITE el acto que estaba obligado a realizar (teoría de la acción, no del resultado).",
                    "RETROACTIVIDAD DE LA LEY PENAL MÁS FAVORABLE (art. 2.2 CP): tendrán efecto retroactivo aquellas leyes penales que favorezcan al reo, AUNQUE AL ENTRAR EN VIGOR HUBIERA RECAÍDO SENTENCIA FIRME y el sujeto estuviese cumpliendo condena. En caso de duda sobre la determinación de la Ley más favorable, será oído el reo. Los hechos cometidos bajo la vigencia de una ley temporal serán juzgados conforme a ella, salvo que se disponga expresamente lo contrario (art. 2.2 in fine).",
                    "ÁMBITO ESPACIAL — cuatro principios (LOPJ + CP): 1) PRINCIPIO DE TERRITORIALIDAD (regla general, art. 8.1 CC y art. 23.1 LOPJ): la ley penal española se aplica a los delitos cometidos en TERRITORIO ESPAÑOL o a bordo de BUQUES o AERONAVES ESPAÑOLAS (principio del pabellón). 2) PRINCIPIO DE PERSONALIDAD (art. 23.2 LOPJ); 3) PRINCIPIO REAL o de PROTECCIÓN DE INTERESES (art. 23.3 LOPJ); 4) PRINCIPIO DE JUSTICIA UNIVERSAL (art. 23.4 LOPJ).",
                    "PRINCIPIO DE PERSONALIDAD (art. 23.2 LOPJ): la jurisdicción española conocerá de delitos cometidos fuera del territorio nacional por españoles o extranjeros que hubieran adquirido la nacionalidad después, siempre que CONCURRAN los siguientes requisitos: a) el hecho sea PUNIBLE EN EL LUGAR DE EJECUCIÓN (doble incriminación), salvo Tratado o convenio internacional que exonere; b) el agraviado o el Ministerio Fiscal denuncien o interpongan querella; c) el delincuente no haya sido absuelto, indultado o penado en el extranjero (ne bis in idem).",
                    "PRINCIPIO REAL O DE PROTECCIÓN DE INTERESES (art. 23.3 LOPJ): jurisdicción española sobre delitos cometidos por españoles o extranjeros fuera del territorio nacional cuando atenten contra intereses fundamentales del Estado español: traición, rebelión, falsificación moneda, ataques contra el Rey/sucesor/Familia Real, ataques al Gobierno o Cortes, etc.",
                    "PRINCIPIO DE JUSTICIA UNIVERSAL (art. 23.4 LOPJ, restringido tras LO 1/2014): jurisdicción sobre hechos cometidos por españoles o extranjeros fuera de España susceptibles de tipificarse como: genocidio, lesa humanidad, crimenes de guerra, terrorismo, piratería, trata de seres humanos, tortura, etc. La LO 1/2014 EXIGIÓ conexiones específicas (procedimiento contra español, víctima española, autor extranjero presente en España no extraditable).",
                    "ÁMBITO PERSONAL — INMUNIDADES E INVIOLABILIDADES: 1) REY (art. 56.3 CE): inviolable, no sujeto a responsabilidad. 2) DIPUTADOS y SENADORES (art. 71 CE): inviolabilidad por las opiniones manifestadas en el ejercicio de sus funciones; inmunidad (sólo pueden ser detenidos en caso de flagrante delito; suplicatorio para procesarles). 3) MAGISTRADOS DEL TC, DEFENSOR DEL PUEBLO, MIEMBROS DEL CGPJ, MAGISTRADOS DEL TS — fueros procesales especiales. 4) AGENTES DIPLÓMATICOS — Convenio de Viena de 1961 — inmunidad absoluta de jurisdicción penal del Estado receptor.",
                    "EXTRADICIÓN — CONCEPTO: acto de cooperación internacional por el cual un Estado entrega a otro Estado a una persona que se encuentra en su territorio, para que sea juzgada (extradición PROCESAL) o cumpla la condena impuesta (extradición EJECUTIVA). REGULACIÓN: art. 13.3 CE; Ley 4/1985 de 21 marzo, de Extradición Pasiva; LECrim arts. 824-833 (extradición activa); Tratados bilaterales y multilaterales.",
                    "PRINCIPIOS DE LA EXTRADICIÓN: 1) DOBLE INCRIMINACIÓN (el hecho debe ser delito en ambos Estados); 2) ESPECIALIDAD (la persona sólo puede ser juzgada o ejecutada por los hechos por los que se concedió); 3) NO ENTREGA DE NACIONALES — art. 3 Ley 4/1985 (los españoles no serán extraditados, salvo Tratado o Ley que disponga lo contrario; aplica RECIPROCIDAD); 4) NO EXTRADICIÓN por delitos POLÍTICOS o MILITARES; 5) NO EXTRADICIÓN cuando el delito esté amenazado con la PENA DE MUERTE o con TORTURAS (salvo garantías).",
                    "EXTRADICIÓN PASIVA — PROCEDIMIENTO Ley 4/1985: tres fases. 1) FASE GUBERNATIVA: la solicitud se cursa por vía diplomática al Ministerio de Justicia; el Consejo de Ministros decide si CONTINÚA EL PROCEDIMIENTO; 2) FASE JUDICIAL: ante la AUDIENCIA NACIONAL (Sala de lo Penal). La AN resuelve si procede o no la extradición (auto). 3) FASE GUBERNATIVA FINAL: aun cuando los Tribunales hayan declarado procedente la extradición, el Gobierno PUEDE DENEGARLA mediante acuerdo motivado.",
                    "EXTRADICIÓN ACTIVA (LECrim arts. 824-833): habrá lugar a pedir la extradición cuando: a) en virtud de Tratado vigente, exista la posibilidad; b) en defecto de Tratado, exista reciprocidad. El Juez o Tribunal eleva exposición razonada al Ministerio de Justicia, que tramita por vía diplomática.",
                    "DIFERENCIA con OEDE: la EXTRADICIÓN CLÁSICA aplica con TERCEROS ESTADOS (no UE). Entre Estados de la UE rige la ORDEN EUROPEA DE DETENCIÓN Y ENTREGA (OEDE / 'euroorden') — procedimiento judicial directo, sin intervención gubernativa, ver tema 24.",
                    "INSTITUCIONES AFINES: 1) EXPULSIÓN — extranjeros sancionados (LO 4/2000); 2) DEPORTACIÓN — expulsión de extranjeros indeseables sin proceso penal; 3) ENTREGA — cuando es a Tribunales penales internacionales (CPI); 4) TRASLADO DE PERSONAS CONDENADAS — Convenio Estrasburgo 1983 para cumplimiento de condena en el país de origen.",
                    "Truco examen: Tres principios de validez: 1) temporal — irretroactividad + retroactividad si favorable (incluso sentencia firme); 2) espacial — territorialidad + personalidad + real + universal; 3) personal — inviolabilidad Rey, inmunidad parlamentarios, diplomáticos. EXTRADICIÓN PASIVA — 3 fases (gubernativa-judicial-gubernativa); el Gobierno puede denegar aun con auto favorable AN. NO se extraditan españoles ni por delitos políticos. Entre UE: OEDE, no extradición."
                ]
            },
            {
                n: 24, b: "A", a: "Penal — Parte General", t: "Reconocimiento mutuo penal UE. OEDE, OEP, OEI", norma: "Ley 23/2014", keys: ["OEDE", "euroorden", "OEP", "OEI"], rel: [8, 9, 23], d: 4, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-2014-12029", rec: "https://e-justice.europa.eu/",
                resumen: [
                    "REGULACIÓN: LEY 23/2014, de 20 noviembre, DE RECONOCIMIENTO MUTUO DE RESOLUCIONES PENALES EN LA UE. Transpone numerosas Decisiones Marco y Directivas. Sustituye al sistema de extradición clásico entre Estados miembros. PRINCIPIO INSPIRADOR: confianza mutua entre los Estados miembros + reconocimiento automático de las resoluciones judiciales sin necesidad de procedimiento adicional.",
                    "INSTRUMENTOS regulados (art. 2 Ley 23/2014): 1) ORDEN EUROPEA DE DETENCIÓN Y ENTREGA (OEDE / Euroorden); 2) Resolución por la que se imponga una PENA O MEDIDA PRIVATIVA DE LIBERTAD; 3) Resolución de LIBERTAD VIGILADA; 4) Resolución sobre MEDIDAS ALTERNATIVAS a la prisión provisional; 5) ORDEN EUROPEA DE PROTECCIÓN (OEP); 6) Resolución de EMBARGO PREVENTIVO de bienes y aseguramiento de pruebas; 7) Resolución de DECOMISO; 8) Resolución por la que se imponga una SANCIÓN PECUNIARIA; 9) ORDEN EUROPEA DE INVESTIGACIÓN (OEI).",
                    "AUTORIDADES COMPETENTES (art. 5 Ley 23/2014): para EMITIR — los Jueces, Tribunales o Ministerio Fiscal según la fase del proceso. Para RECIBIR Y EJECUTAR — los Juzgados de Instrucción, los Juzgados de lo Penal, los Juzgados Centrales de Instrucción, los Juzgados Centrales de lo Penal (Audiencia Nacional) y los Juzgados de Vigilancia Penitenciaria. Para EJECUTAR LA DETENCIÓN: las FCS, en particular la SIRENE (CGCI del CNP).",
                    "ORDEN EUROPEA DE DETENCIÓN Y ENTREGA (OEDE) — arts. 34-65 Ley 23/2014. Origen: Decisión Marco 2002/584/JAI. CONCEPTO: resolución judicial dictada en un Estado miembro de la UE con el objeto de DETENER Y ENTREGAR por otro Estado miembro a una persona buscada para el ejercicio de acciones penales o para la ejecución de una pena o medida de seguridad privativas de libertad.",
                    "ÁMBITO DE LA OEDE (art. 47 Ley 23/2014): podrá emitirse por aquellos hechos castigados con: a) pena o medida de seguridad privativa de libertad cuya duración MÁXIMA sea AL MENOS DE 12 MESES (extradición procesal); o b) cuando la reclamación tuviera por objeto el cumplimiento de condena, la pena impuesta no sea inferior a 4 MESES de privación de libertad.",
                    "LISTA DE 32 DELITOS (art. 47.1 Ley 23/2014): para los hechos incluidos en la 'lista de los 32' (terrorismo, trata, explotación sexual menores, tráfico de drogas, armas, blanqueo, corrupción, fraude, cibercrimen, racismo, etc.) NO SE EXIGE EL CONTROL DE LA DOBLE INCRIMINACIÓN, siempre que estén castigados con pena o medida de seguridad privativa de libertad cuya duración máxima sea de AL MENOS 3 AÑOS en el Estado de emisión.",
                    "MOTIVOS DE DENEGACIÓN de la OEDE — OBLIGATORIOS (art. 48 Ley 23/2014): a) amnistía en España; b) cosa juzgada (la persona ya ha sido juzgada en España o en otro Estado por los mismos hechos y la pena se ha cumplido); c) minoría de edad penal en España; d) hechos no constitutivos de delito en España (sólo si NO están en la lista 32); e) prescripción; etc.",
                    "MOTIVOS DE DENEGACIÓN — FACULTATIVOS (art. 48.2): cuando los hechos hayan sido cometidos en España; cuando la persona reclamada SEA ESPAÑOLA y se comprometa a cumplir la condena en España; etc.",
                    "PLAZOS de la OEDE (arts. 54-55 Ley 23/2014): si la persona reclamada CONSIENTE en su entrega — la resolución judicial sobre la ejecución se adoptará en 10 DÍAS desde la celebración de la audiencia. En los demás casos, en el plazo de 60 DÍAS desde la detención. Excepcionalmente, prorrogables 30 días. La entrega material debe producirse en 10 DÍAS desde la resolución firme.",
                    "DIFERENCIAS OEDE vs EXTRADICIÓN CLÁSICA: OEDE es 1) JUDICIAL (no gubernativa); 2) ENTRE ESTADOS UE; 3) SIN doble incriminación en lista 32; 4) ENTREGA DE NACIONALES sí posible (matícese con compromiso de cumplir en país de origen); 5) plazos breves; 6) sustituye Convenio Europeo Extradición 1957 entre Estados UE.",
                    "ORDEN EUROPEA DE PROTECCIÓN (OEP) — arts. 130-141 Ley 23/2014. Origen: Directiva 2011/99/UE. Permite que las medidas de protección adoptadas a favor de las VÍCTIMAS DE DELITOS (órdenes de alejamiento, prohibición de aproximación, prohibición de comunicación) en un Estado miembro tengan eficacia en cualquier otro Estado miembro al que la víctima se traslade. Aplicación especialmente en VIOLENCIA DE GÉNERO Y DOMÉSTICA.",
                    "ORDEN EUROPEA DE INVESTIGACIÓN (OEI) — arts. 186-223 Ley 23/2014. Origen: Directiva 2014/41/UE. CONCEPTO: resolución judicial emitida por la autoridad competente de un Estado miembro para realizar UNA O VARIAS MEDIDAS DE INVESTIGACIÓN en otro Estado miembro con el objetivo de OBTENER PRUEBAS (declaraciones testigos, intervenciones telefónicas, registros bancarios, ADN). Sustituye al auxilio judicial penal tradicional entre Estados UE.",
                    "PLAZOS OEI (art. 199 Ley 23/2014): la autoridad de ejecución deberá RECONOCER la OEI en el plazo de 30 DÍAS desde la recepción y EJECUTARLA en el plazo de 90 DÍAS desde su reconocimiento (regla general). Casos de urgencia: plazos más breves.",
                    "OTROS INSTRUMENTOS UE asociados al sistema: SIS II (Sistema de Información Schengen), EUROPOL (información e inteligencia), EUROJUST (coordinación investigaciones), FISCALÍA EUROPEA (delitos contra intereses financieros UE — tema 9), RED JUDICIAL EUROPEA (apoyo a la cooperación).",
                    "Truco examen: Ley 23/2014 — 9 instrumentos. OEDE: límite 12m proceso / 4m ejecución. Lista 32 = sin doble incriminación si pena ≥3 años. Plazos: 10 días si consiente / 60 días si se opone. AN competente para recibir. OEP = víctimas (violencia género). OEI = pruebas (sustituye comisión rogatoria). Plazos OEI: 30 días reconocer / 90 ejecutar."

            {
                n: 25, b: "A", a: "Penal — Parte General", t: "Delito. Elementos: tipicidad, antijuridicidad, culpabilidad", norma: "CP arts. 10-18", keys: ["delito", "dogmática penal", "tipicidad"], rel: [22, 26, 27, 28, 29], d: 4, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444", rec: "https://es.wikipedia.org/wiki/Teor%C3%ADa_del_delito",
                resumen: [
                    "CONCEPTO LEGAL (art. 10 CP): son DELITOS las acciones y omisiones DOLOSAS o IMPRUDENTES penadas por la Ley. Concepto dogmático: acción u omisión TÍPICA, ANTIJURÍDICA, CULPABLE Y PUNIBLE. La teoría del delito articula estos 4 elementos en escalón: si falla uno, no hay delito.",
                    "1) ACCIÓN / OMISIÓN — sustrato material del delito. ACCIÓN: conducta humana, voluntaria, externa, susceptible de modificar la realidad. OMISIÓN: no realizar la conducta esperada. Causas de exclusión de la acción (no son causas de justificación, son ya pre-típicas): FUERZA IRRESISTIBLE (vis absoluta), MOVIMIENTOS REFLEJOS, ESTADOS DE INCONSCIENCIA (sueño, hipnosis, embriaguez plena letargía).",
                    "OMISIÓN (art. 11 CP) — dos modalidades: a) OMISIÓN PROPIA o pura: el tipo describe directamente la omisión (ej. art. 195 CP omisión del deber de socorro); b) OMISIÓN IMPROPIA o COMISIÓN POR OMISIÓN: el sujeto, en posición de GARANTE, no evita el resultado equivaliendo a su producción activa. Requisitos (art. 11 CP): a) obligación LEGAL o CONTRACTUAL de actuar, o b) creación previa de una ocasión de riesgo por una acción u omisión precedente.",
                    "2) TIPICIDAD: adecuación de la conducta al tipo penal descrito en la Ley (lex stricta). TIPO OBJETIVO (elementos descriptivos: sujeto activo, sujeto pasivo, conducta, resultado, nexo causal, objeto, medios, tiempo, lugar). TIPO SUBJETIVO (DOLO o IMPRUDENCIA).",
                    "DOLO — conocer y querer la realización del tipo. Clases: a) DIRECTO DE 1º GRADO (intención directa, el resultado es el fin perseguido); b) DIRECTO DE 2º GRADO o de CONSECUENCIAS NECESARIAS (el sujeto sabe que el resultado se producirá como consecuencia necesaria de su acción, aunque no sea su fin principal — ej. matar a un escolta para matar al protegido); c) DOLO EVENTUAL (el sujeto se representa el resultado como posible y, asumiéndolo, prosigue — 'lo acepto si pasa').",
                    "IMPRUDENCIA o CULPA (art. 12 CP): las acciones u omisiones imprudentes solo se castigarán cuando expresamente lo disponga la Ley. Clases (CP tras reforma LO 1/2015 + LO 11/2022): a) IMPRUDENCIA GRAVE (cuasi-dolo, infracción grave del deber de cuidado, art. 142.1); b) IMPRUDENCIA MENOS GRAVE (art. 142.2, en homicidio y lesiones); c) IMPRUDENCIA LEVE (sólo subsiste para responsabilidad civil ex art. 1902 CC, ya no es delito).",
                    "ERROR sobre el tipo (art. 14 CP): el error invencible sobre un HECHO CONSTITUTIVO DE LA INFRACCIÓN PENAL excluye la responsabilidad criminal. Si el error fuera vencible, la infracción será castigada, EN SU CASO, COMO IMPRUDENTE (sólo si existe la modalidad imprudente). Error sobre un hecho que cualifica la infracción o sobre una circunstancia agravante: impedirá su apreciación. ERROR EN EL GOLPE (aberratio ictus) y ERROR EN LA PERSONA (error in persona): no se aplica el art. 14.",
                    "3) ANTIJURIDICIDAD: contrariedad de la conducta típica con el ordenamiento jurídico. La tipicidad es INDICIO de antijuridicidad. Solo si concurre una CAUSA DE JUSTIFICACIÓN se excluye la antijuridicidad. Art. 20 CP — causas: 4ª LEGÍTIMA DEFENSA; 5ª ESTADO DE NECESIDAD; 7ª CUMPLIMIENTO DE UN DEBER o EJERCICIO LEGÍTIMO DE UN DERECHO, OFICIO O CARGO. Además: consentimiento (no en CP general pero sí en algunos delitos), miedo insuperable.",
                    "LEGÍTIMA DEFENSA (art. 20.4ª CP): el que obre en defensa de la persona o derechos propios o ajenos, siempre que concurran los REQUISITOS siguientes: 1) AGRESIÓN ILEGÍTIMA (en defensa de los bienes se reputará agresión ilegítima el ATAQUE A LOS MISMOS QUE CONSTITUYA DELITO Y LOS PONGA EN GRAVE PELIGRO DE DETERIORO O PÉRDIDA INMINENTE; en caso de defensa de la morada se reputará agresión ilegítima la entrada indebida en aquélla); 2) NECESIDAD RACIONAL del medio empleado para impedirla o repelerla; 3) FALTA DE PROVOCACIóN SUFICIENTE por parte del defensor. Si concurren todas: eximente completa; si falta una secundaria: eximente incompleta (art. 21.1ª).",
                    "ESTADO DE NECESIDAD (art. 20.5ª CP): el que, en estado de necesidad, para evitar un mal propio o ajeno LESIONE UN BIEN JURÍDICO de otra persona o INFRINJA UN DEBER, siempre que concurran los siguientes REQUISITOS: 1º) que el MAL CAUSADO no sea MAYOR QUE EL QUE SE TRATE DE EVITAR; 2º) que la situación de necesidad NO HAYA SIDO PROVOCADA INTENCIONADAMENTE por el sujeto; 3º) que el necesitado NO TENGA, por su oficio o cargo, OBLIGACIÓN DE SACRIFICARSE.",
                    "4) CULPABILIDAD: juicio de reproche que el ordenamiento dirige al autor de un hecho típico y antijurídico. Tres elementos: a) IMPUTABILIDAD (capacidad de comprender la ilícitud y de actuar conforme a esa comprensión); b) CONOCIMIENTO DE LA ANTIJURIDICIDAD; c) EXIGIBILIDAD DE OTRA CONDUCTA.",
                    "CAUSAS DE INIMPUTABILIDAD — EXIMENTES de art. 20 CP: 1ª ANOMALÍA o ALTERACIÓN PSÍQUICA al tiempo de cometer la infracción; 2ª INTOXICACIÓN PLENA por el consumo de bebidas alcohólicas, drogas tóxicas, estupefacientes, sustancias psicotrópicas o por SUFRIR SÍNDROME DE ABSTINENCIA; 3ª por sufrir ALTERACIONES EN LA PERCEPCIÓN desde el nacimiento o desde la infancia; 6ª MIEDO INSUPERABLE.",
                    "MINORÍA DE EDAD PENAL: art. 19 CP — los MENORES DE 18 AÑOS no serán responsables criminalmente con arreglo al CP. Cuando un menor cometa un hecho delictivo podrá ser responsable con arreglo a la LO 5/2000 REGULADORA DE LA RESPONSABILIDAD PENAL DE LOS MENORES (entre 14 y 17 años). Los menores de 14 años están exentos de cualquier responsabilidad penal.",
                    "5) PUNIBILIDAD (en algunos manuales se incluye como 5º elemento autónomo, en otros como aspecto residual): condiciones objetivas de punibilidad y excusas absolutorias (ej. relaciones familiares en delitos patrimoniales — art. 268 CP).",
                    "Truco examen: 4 ESCALONES: ACCIÓN → TIPICIDAD → ANTIJURIDICIDAD → CULPABILIDAD. Si cae uno, no hay delito. ART 20 CP = 7 EXIMENTES (3 inimputabilidad: enajenación, intoxicación, alteraciones percepción; 3 causas justificación: legítima defensa, estado necesidad, cumplimiento deber; 1 culpabilidad: miedo insuperable). LO 5/2000 menores 14-18. Dolo eventual = se representa y acepta. Error de tipo invencible = atipia; vencible = imprudencia."
                ]

            {
                n: 26, b: "A", a: "Penal — Parte General", t: "Sujetos del delito. Acción y omisión. Comisión por omisión", norma: "CP art. 11", keys: ["sujeto activo", "bien jurídico", "omisión"], rel: [25, 37], d: 3, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444", rec: "",
                resumen: [
                    "SUJETOS DEL DELITO. Distinguir: 1) SUJETO ACTIVO: la persona que realiza la conducta típica (autor o partícipe). Regla: PERSONA FÍSICA (capacidad de acción). Excepción: PERSONAS JURÍDICAS — art. 31 bis CP (introducido por LO 5/2010 y reforzado por LO 1/2015). 2) SUJETO PASIVO: titular del bien jurídico protegido lesionado o puesto en peligro. NO se confunde con el PERJUDICADO (el que sufre las consecuencias civiles) ni con el OBJETO MATERIAL (cosa sobre la que recae la acción).",
                    "DELITOS COMUNES vs ESPECIALES según el sujeto activo: a) DELITOS COMUNES — cualquiera puede ser autor (homicidio, hurto, daños); b) DELITOS ESPECIALES — exigen una cualidad específica del sujeto activo. Se subdividen en: ESPECIALES PROPIOS (sin la cualidad no hay tipo paralelo, ej. prevaricación art. 404 requiere ser autoridad o funcionario) y ESPECIALES IMPROPIOS (sin la cualidad existe un tipo común, pero la cualidad agrava, ej. malversación art. 432 vs apropiación indebida).",
                    "DELITOS PROPIA MANO: requieren ejecución personal e indelegable. Ejemplos clásicos: agresión sexual con acceso carnal, falso testimonio. Implicación: NO ADMITEN AUTORÍA MEDIATA en sentido estricto.",
                    "RESPONSABILIDAD PENAL DE LAS PERSONAS JURÍDICAS — art. 31 bis CP. Modelo de TRANSFERENCIA + AUTORRESPONSABILIDAD: las PJ serán penalmente responsables: a) DE LOS DELITOS COMETIDOS EN SU NOMBRE O POR SU CUENTA, Y EN SU BENEFICIO DIRECTO O INDIRECTO, POR SUS REPRESENTANTES LEGALES O POR AQUELLOS QUE ESTÁN AUTORIZADOS PARA TOMAR DECISIONES (administradores y directivos); b) DE LOS DELITOS COMETIDOS, EN EL EJERCICIO DE ACTIVIDADES SOCIALES Y POR CUENTA Y EN BENEFICIO DIRECTO O INDIRECTO de las mismas, POR QUIENES, ESTANDO SOMETIDOS A LA AUTORIDAD de los anteriores, hayan podido realizar los hechos POR HABERSE INCUMPLIDO GRAVEMENTE LOS DEBERES DE SUPERVISIÓN, VIGILANCIA Y CONTROL.",
                    "EXENCIÓN de la responsabilidad de la PJ (art. 31 bis 2-5 CP): si la PJ acredita que ha implantado y ejecutado eficazmente, ANTES DE LA COMISIÓN DEL DELITO, un MODELO DE ORGANIZACIÓN Y GESTIÓN (compliance program) adecuado para prevenir delitos de la naturaleza del que fue cometido o para reducir significativamente el riesgo de su comisión. Requisitos: identificar actividades de riesgo, protocolos, modelos de gestión de recursos financieros, obligación de informar, sistema disciplinario, verificación periódica.",
                    "PENAS aplicables a PERSONAS JURÍDICAS (art. 33.7 CP): a) MULTA por cuotas o proporcional; b) DISOLUCIÓN de la persona jurídica; c) SUSPENSIÓN de sus actividades por plazo no superior a 5 años; d) CLAUSURA de sus locales y establecimientos por plazo no superior a 5 años; e) PROHIBICIÓN DE REALIZAR EN EL FUTURO las actividades en cuyo ejercicio se haya cometido, favorecido o encubierto el delito; f) INHABILITACIÓN PARA OBTENER SUBVENCIONES Y AYUDAS PÚBLICAS, PARA CONTRATAR CON EL SECTOR PÚBLICO Y PARA GOZAR DE BENEFICIOS E INCENTIVOS FISCALES O DE LA SEGURIDAD SOCIAL; g) INTERVENCIÓN JUDICIAL.",
                    "EXCLUIDAS de responsabilidad penal (art. 31 quinquies CP): el Estado, las AAPP territoriales e institucionales, los Organismos Reguladores, las Agencias y Entidades Públicas Empresariales, las organizaciones internacionales de Derecho público, ni a aquellas otras que ejerzan potestades públicas de soberanía o administrativas. SÍ responden los partidos políticos y los sindicatos (LO 7/2012).",
                    "ACCIÓN (concepto): comportamiento humano externo, voluntario y susceptible de modificar el mundo exterior. Estructura: voluntad (mediato/inmediato) + manifestación externa + resultado (en delitos materiales) + nexo causal. CAUSAS DE EXCLUSIÓN DE LA ACCIÓN (pre-típicas, no son eximentes): FUERZA IRRESISTIBLE (vis absoluta, no vis compulsiva), MOVIMIENTOS REFLEJOS (no controlables por la voluntad), ESTADOS DE INCONSCIENCIA PLENA (sueño profundo, hipnosis, embriaguez letargía).",
                    "OMISIÓN: no realización de la conducta exigida por el ordenamiento. Dos clases: 1) OMISIÓN PROPIA o pura: el tipo describe directamente la omisión y se consuma con el mero NO HACER lo debido. Ejemplos: art. 195 OMISIÓN DEL DEBER DE SOCORRO; art. 408 omisión de perseguir delitos (autoridad o funcionario); art. 450 omisión del deber de impedir delitos. 2) OMISIÓN IMPROPIA o COMISIÓN POR OMISIÓN (art. 11 CP).",
                    "COMISIÓN POR OMISIÓN (art. 11 CP literal): los delitos o faltas que consistan en la PRODUCCIÓN DE UN RESULTADO solo se entenderán cometidos por omisión cuando la no evitación del mismo, AL INFRINGIR UN ESPECIAL DEBER JURÍDICO DEL AUTOR, equivalga, según el sentido del texto de la Ley, a su causación. A tal efecto se equiparará la omisión a la acción: a) Cuando exista una específica OBLIGACIÓN LEGAL o CONTRACTUAL de actuar; b) Cuando el omitente HAYA CREADO UNA OCASIÓN DE RIESGO para el bien jurídicamente protegido mediante una acción u omisión precedente (injerencia).",
                    "REQUISITOS para la comisión por omisión: 1) POSICIÓN DE GARANTE (deber legal, contractual o por injerencia); 2) EVITABILIDAD del resultado por la acción omitida; 3) EQUIVALENCIA estructural y normativa entre la omisión y la acción positiva. Ejemplos: madre que no alimenta al bebé (deber legal art. 154 CC), médico que abandona al paciente (deber contractual), conductor que tras atropellar abandona a la víctima sin auxilio (injerencia: art. 195.3 CP — supuesto agravado de omisión del deber de socorro).",
                    "OBJETO del delito — distinciones: 1) OBJETO JURÍDICO (bien jurídico protegido por la norma, ej. vida en el homicidio); 2) OBJETO MATERIAL (cosa o persona sobre la que recae materialmente la acción, ej. cuerpo de la víctima). El bien jurídico es siempre INTANGIBLE; el objeto material es físico.",
                    "LUGAR Y TIEMPO de comisión del delito: teorías de la ACCIÓN (lugar/tiempo donde se realizó la conducta), del RESULTADO (donde se produjo el resultado) y de la UBICUIDAD (cualquiera de los dos lugares). Art. 7 CP sigue la teoría de la ACCIÓN a efectos temporales (los delitos se consideran cometidos en el momento en que el sujeto ejecuta la acción u omite el acto que estaba obligado a realizar).",
                    "Truco examen: ART. 31 BIS = PJ responde por delitos en su NOMBRE/CUENTA y BENEFICIO. Exención con COMPLIANCE PROGRAM. NO responden el Estado/AAPP/Org. internacionales públicos. SÍ responden partidos y sindicatos. ART. 11 = comisión por omisión sólo si hay deber legal/contractual o INJERENCIA. Omisión propia: art. 195 socorro / art. 408 funcionario / art. 450 deber impedir delitos."
                ]

            {
                n: 27, b: "A", a: "Penal — Parte General", t: "Dolo, error de tipo, imprudencia", norma: "CP arts. 5, 12, 14", keys: ["dolo", "error tipo", "imprudencia grave/menos grave"], rel: [25, 29], d: 4, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444", rec: "",
                resumen: [
                    "PRINCIPIO DE RESPONSABILIDAD SUBJETIVA (art. 5 CP literal): NO HAY PENA SIN DOLO O IMPRUDENCIA. Excluye toda forma de responsabilidad objetiva o por el mero resultado (versari in re illicita). Es la base del juicio de IMPUTACIÓN SUBJETIVA dentro de la teoría del delito.",
                    "DOLO — concepto: conocer y querer la realización del tipo objetivo. ELEMENTO COGNOSCITIVO (conocimiento de los hechos típicos) + ELEMENTO VOLITIVO (voluntad de realizarlos). El CP NO DEFINE el dolo; la doctrina y jurisprudencia lo construyen.",
                    "CLASES DE DOLO — tres modalidades (jurisprudencia TS): 1) DOLO DIRECTO DE 1º GRADO (intencional o INTENCIONAL): el sujeto persigue directamente el resultado como FIN PRINCIPAL de su acción. Ejemplo: A dispara a B para matarle. 2) DOLO DIRECTO DE 2º GRADO o de CONSECUENCIAS NECESARIAS (mediato): el sujeto NO PERSIGUE el resultado pero SABE que se producirá con CERTEZA como consecuencia ligada a la acción. Ejemplo clásico (TS): el que pone una bomba en un avión para matar a un pasajero y sabe que matará a todos los demás (dolo directo 2º grado respecto a los demás). 3) DOLO EVENTUAL: el sujeto se REPRESENTA el resultado como POSIBLE o PROBABLE y, A PESAR DE ELLO, ACTÚA aceptando el riesgo.",
                    "TEORÍAS sobre el DOLO EVENTUAL (TS): a) TEORÍA DEL CONSENTIMIENTO o aprobación (clásica): se exige que el sujeto se conforme con el resultado, lo apruebe interiormente. b) TEORÍA DE LA PROBABILIDAD o representación: basta con que el sujeto se represente el resultado como muy probable y, pese a ello, actúe. La JURISPRUDENCIA del TS sigue mayoritariamente la TEORÍA DE LA PROBABILIDAD. LÍMITE inferior con la culpa consciente: en el dolo eventual el sujeto ACEPTA el resultado; en la culpa consciente CONFÍA en su no producción.",
                    "ERROR DE TIPO (art. 14.1 y 14.2 CP): es el desconocimiento o falsa representación de un elemento del tipo objetivo. Excluye el DOLO. Dos modalidades: a) INVENCIBLE: ni el más diligente cuidado habría permitido al sujeto evitarlo — EXCLUYE LA RESPONSABILIDAD CRIMINAL (impunidad); b) VENCIBLE: el sujeto habría podido evitarlo con la diligencia exigible — LA INFRACCIÓN SERÁ CASTIGADA, EN SU CASO, COMO IMPRUDENTE (sólo si existe la modalidad imprudente del delito; si no — impunidad).",
                    "ERROR sobre AGRAVANTE o CIRCUNSTANCIA QUE CUALIFICA (art. 14.2 CP): IMPEDIRÁ SU APRECIACIÓN (se castiga por el tipo base, sin la agravante). No se distingue vencible/invencible.",
                    "SUPUESTOS PARTICULARES de error de tipo: 1) ERROR IN OBIECTO (error sobre el OBJETO): A dispara a un muñeco creyendo que es persona — atipicidad; o viceversa, A dispara a una persona creyendo que es un jabalí — puede ser imprudencia. 2) ERROR IN PERSONA: A quiere matar a B y mata a C confundiéndolo con B — si ambos están equiparados típicamente, RESPONDE POR HOMICIDIO DOLOSO (irrelevante); si C es persona con título especial protegido (Rey, autoridad) puede plantearse desplazamiento. 3) ABERRATIO ICTUS o ERROR EN EL GOLPE: A dispara a B pero falla y mata a C que estaba al lado — doctrina dominante: tentativa dolosa contra B + homicidio imprudente respecto a C (concurso ideal).",
                    "DOLO ANTECEDENS y SUBSEQUENS: el dolo debe concurrir EN EL MOMENTO DE LA ACCIÓN. El dolo previo (antecedens) sin permanencia al hecho o el dolo posterior (subsequens) no fundamentan el dolo del tipo.",
                    "IMPRUDENCIA o CULPA — ART. 12 CP literal: las acciones u omisiones imprudentes SOLO SE CASTIGARÁN CUANDO EXPRESAMENTE LO DISPONGA LA LEY (sistema cerrado o de numerus clausus, frente al sistema abierto del Código de 1973).",
                    "ELEMENTOS de la IMPRUDENCIA: 1) infracción del DEBER OBJETIVO DE CUIDADO (la conducta no se ajusta a las pautas exigidas en el tráfico); 2) creación de un RIESGO PERMITIDO; 3) PRODUCCIÓN DE UN RESULTADO LESIVO; 4) IMPUTACIÓN OBJETIVA del resultado a la infracción del deber de cuidado (relación de riesgo).",
                    "CLASES de IMPRUDENCIA tras LO 1/2015 + LO 11/2022: 1) IMPRUDENCIA GRAVE (cuasi-dolo, infracción grave del deber de cuidado, equivalente al imprudente temerario en términos antiguos); 2) IMPRUDENCIA MENOS GRAVE (introducida por LO 1/2015 — escalon intermedio para homicidios y lesiones por tráfico, art. 142.2 y 152.2 CP); 3) IMPRUDENCIA LEVE: NO ES DELITO desde LO 1/2015 — sólo da lugar a responsabilidad civil ex art. 1902 CC.",
                    "REFORMA LO 11/2022 (mejora de la seguridad vial): introduce el concepto de IMPRUDENCIA MENOS GRAVE CUALIFICADA para conductores de vehículos a motor que CAUSEN LESIONES O HOMICIDIO concurriendo determinadas circunstancias (exceso de velocidad punible, alcohol/drogas, manejo del móvil) y considera estos supuestos AUTOMÁTICAMENTE como IMPRUDENCIA GRAVE.",
                    "CULPA CONSCIENTE vs INCONSCIENTE: a) CULPA CONSCIENTE (con representación): el sujeto SE REPRESENTA el resultado pero CONFÍA en su no producción por su pericia o las circunstancias. Frontera con el dolo eventual. b) CULPA INCONSCIENTE: el sujeto ni siquiera se representa el resultado pese a deber haberlo previsto.",
                    "PRETERINTENCIONALIDAD: el sujeto actúa dolosamente para producir un resultado, pero se produce otro más grave no querido (ej. golpea para lesionar y mata). El CP la trata como concurso ideal de delitos (delito doloso intentado + delito imprudente consumado) o como delito cualificado por el resultado en algunos tipos.",
                    "Truco examen: ART. 5 CP no hay pena sin dolo/imprudencia. Tres clases de DOLO (1º grado, consecuencias necesarias, eventual). DOLO EVENTUAL = ACEPTA / CULPA CONSCIENTE = CONFÍA EN LA NO PRODUCCIÓN. Error de tipo: INVENCIBLE = impunidad; VENCIBLE = imprudencia. ART. 12 CP imprudencia sólo si la ley lo dispone. Imprudencia LEVE ya NO es delito (sólo civil). LO 11/2022 = cualifica imprudencia conductores con alcohol/móvil/velocidad."
                ]
