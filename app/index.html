            {
                n: 28, b: "A", a: "Penal — Parte General", t: "Causas de exclusión de la antijuridicidad", norma: "CP art. 20.4-7", keys: ["legítima defensa", "estado de necesidad", "cumplimiento del deber"], rel: [25, 29], d: 3, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444", rec: "",
                resumen: [
                    "ANTIJURIDICIDAD: contrariedad de la conducta típica con el ordenamiento jurídico en su conjunto. La tipicidad es INDICIO de antijuridicidad. Solo se excluye por una CAUSA DE JUSTIFICACIÓN expresamente prevista. Efecto: si concurre, la conducta es LÍCITA — no hay delito — no genera responsabilidad civil derivada del delito (salvo art. 118 CP estado de necesidad, donde sí hay responsabilidad civil del beneficiario).",
                    "CAUSAS DE JUSTIFICACIÓN en el CP (art. 20): 4ª LEGÍTIMA DEFENSA; 5ª ESTADO DE NECESIDAD (justificante si bienes igual valor o el lesionado es de menor valor; exculpante si bienes iguales); 7ª CUMPLIMIENTO DE UN DEBER o EJERCICIO LEGÍTIMO DE UN DERECHO, OFICIO O CARGO. NO son causas de justificación: el miedo insuperable (20.6, exculpante) ni las causas de inimputabilidad (20.1-3).",
                    "LEGÍTIMA DEFENSA (art. 20.4ª CP — literal): está exento de responsabilidad criminal: 'El que obre en defensa de la persona o derechos propios o ajenos, siempre que concurran los requisitos siguientes: PRIMERO. Agresión ilegítima. En caso de defensa de los bienes se reputará agresión ilegítima el ataque a los mismos que constituya delito y los ponga en grave peligro de deterioro o pérdida inminentes. En caso de defensa de la morada o sus dependencias, se reputará agresión ilegítima la entrada indebida en aquélla o éstas. SEGUNDO. Necesidad racional del medio empleado para impedirla o repelerla. TERCERO. Falta de provocación suficiente por parte del defensor'.",
                    "REQUISITOS DE LA LEGÍTIMA DEFENSA — detalle: 1) AGRESIÓN ILEGÍTIMA: actual o inminente (no pasada ni futura), real (no putativa) y antijurídica. Es el requisito ESENCIAL: sin agresión ilegítima NO PUEDE APRECIARSE legítima defensa NI COMPLETA NI INCOMPLETA. 2) NECESIDAD RACIONAL DEL MEDIO empleado: proporcionalidad entre la agresión y la respuesta defensiva. La JURISPRUDENCIA atiende a un criterio EX ANTE (lo que un hombre medio prudente habría hecho en la situación del defensor). 3) FALTA DE PROVOCACIÓN SUFICIENTE: la provocación leve o no determinante de la agresión no la excluye.",
                    "LEGÍTIMA DEFENSA INCOMPLETA (art. 21.1ª CP): cuando concurre AGRESIÓN ILEGÍTIMA pero falta alguno de los otros dos requisitos (necesidad racional del medio o falta de provocación). Funciona como EXIMENTE INCOMPLETA y conlleva REBAJA DE LA PENA EN UNO O DOS GRADOS (art. 68 CP).",
                    "ESTADO DE NECESIDAD (art. 20.5ª CP — literal): está exento el que, en estado de necesidad, para evitar un MAL PROPIO O AJENO lesione un bien jurídico de otra persona o infrinja un deber, siempre que concurran los siguientes requisitos: 1º) que el MAL CAUSADO NO SEA MAYOR QUE EL QUE SE TRATE DE EVITAR; 2º) que la situación de NECESIDAD NO HAYA SIDO PROVOCADA INTENCIONADAMENTE por el sujeto; 3º) que el necesitado NO TENGA, POR SU OFICIO O CARGO, OBLIGACIÓN DE SACRIFICARSE.",
                    "ESTADO DE NECESIDAD — dos modalidades doctrinales: a) JUSTIFICANTE: cuando el mal causado es MENOR o EQUIVALENTE al evitado (excluye antijuridicidad); b) EXCULPANTE: cuando los bienes son de IGUAL VALOR (excluye sólo culpabilidad por ausencia de exigibilidad). Diferencia con legítima defensa: en el estado de necesidad NO HAY AGRESIÓN (es un peligro objetivo: enfermedad, incendio, hambre); el lesionado puede ser un tercero inocente.",
                    "CUMPLIMIENTO DE UN DEBER O EJERCICIO LEGÍTIMO DE DERECHO/OFICIO/CARGO (art. 20.7ª CP): justifica la conducta del FUNCIONARIO POLICIAL que utiliza fuerza/coacción al detener, al médico que opera con riesgo, al deportista que causa lesión en deporte reglamentado. CRITERIOS jurisprudenciales TS para el uso de la fuerza por funcionarios policiales (sentencia TS 4 dic 2020 y muchas anteriores): 1) que la actuación se realice en el ejercicio de su cargo; 2) que sea NECESARIA y PROPORCIONADA; 3) que existan principios de CONGRUENCIA, OPORTUNIDAD y PROPORCIONALIDAD (art. 5 LOFCS); 4) que el uso del arma de fuego se ajuste al art. 5.2.c LOFCS — grave riesgo para la vida o integridad propia o ajena y como último recurso (Principios de Naciones Unidas de 1990 sobre el empleo de la fuerza por funcionarios encargados de hacer cumplir la ley).",
                    "CONSENTIMIENTO del titular del bien jurídico: NO es una causa de justificación general en el CP español, pero opera como EXCLUYENTE DE TIPICIDAD en algunos delitos (ej. art. 234 hurto exige sin consentimiento) o ATENÚA en otros (ej. art. 156 CP esterilización consentida en personas con discapacidad). El CONSENTIMIENTO debe ser libre, expreso, prestado por persona capaz y anterior o simultáneo al hecho.",
                    "ASPECTOS COMUNES de las CAUSAS DE JUSTIFICACIÓN: 1) requieren ELEMENTO SUBJETIVO (el sujeto debe conocer la situación justificante — doctrina mayoritaria); 2) excluyen TANTO la responsabilidad PENAL como la CIVIL EX DELICTO; 3) la conducta es LÍCITA, por lo que tampoco cabe legítima defensa contra ella, ni participación delictiva, ni encubrimiento; 4) si concurren sus requisitos esenciales y faltan los accesorios, opera como EXIMENTE INCOMPLETA (art. 21.1ª) con rebaja de pena en 1-2 grados (art. 68).",
                    "OBEDIENCIA DEBIDA: derogada como eximente autónoma en el CP de 1995. Hoy se reconduce al art. 20.7ª (cumplimiento del deber). Las órdenes del superior NO justifican si son manifiestamente delictivas. Art. 410 CP castiga al funcionario que se NEGARE A CUMPLIR las órdenes; art. 411 EXIME al funcionario que se NEGARE A CUMPLIR órdenes constitutivas de DELITO.",
                    "RIESGOS PERMITIDOS y ADECUACIÓN SOCIAL: actividades arriesgadas socialmente toleradas (tráfico, deportes, intervenciones médicas) cuyo riesgo se considera dentro de los márgenes admisibles. NO constituyen causa de justificación stricto sensu pero excluyen la imputación objetiva del resultado.",
                    "Truco examen: 3 CAUSAS DE JUSTIFICACIÓN art. 20: 4ª LEGÍTIMA DEFENSA (3 requisitos, AGRESIÓN ILEGÍTIMA esencial); 5ª ESTADO DE NECESIDAD (3 requisitos, mal causado ≤ mal evitado); 7ª CUMPLIMIENTO DEL DEBER (clave para CNP — uso fuerza: congruencia + oportunidad + proporcionalidad). Eximentes INCOMPLETAS = rebaja 1-2 grados art. 68. La OBEDIENCIA DEBIDA NO exime de delito manifiesto."
                ]
            },
            {
                n: 29, b: "A", a: "Penal — Parte General", t: "Causas de exclusión de la culpabilidad. Error de prohibición", norma: "CP arts. 14, 19, 20", keys: ["inimputabilidad", "miedo insuperable", "error prohibición"], rel: [25, 27, 28], d: 4, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444", rec: "",
                resumen: [
                    "CULPABILIDAD: juicio personal de REPROCHE que el ordenamiento dirige al autor por haber realizado un hecho típico y antijurídico CUANDO PUDO Y DEBIÓ ACTUAR DE OTRO MODO. Tres elementos: 1) IMPUTABILIDAD (capacidad de comprender la ilícitud + capacidad de actuar conforme a esa comprensión); 2) CONOCIMIENTO DE LA ANTIJURIDICIDAD (potencial); 3) EXIGIBILIDAD DE OTRA CONDUCTA. Si falla alguno: no hay culpabilidad — no hay delito — pero SÍ cabe imponer una MEDIDA DE SEGURIDAD al inimputable peligroso.",
                    "INIMPUTABILIDAD — EXIMENTES del art. 20 CP. 1ª ANOMALÍA O ALTERACIÓN PSÍQUICA (art. 20.1ª CP): está exento el que al tiempo de cometer la infracción penal, A CAUSA DE CUALQUIER ANOMALÍA O ALTERACIÓN PSÍQUICA, no pueda comprender la ilicitud del hecho o actuar conforme a esa comprensión. El trastorno mental transitorio NO eximirá cuando hubiese sido provocado por el sujeto con el propósito de cometer el delito o hubiera previsto o debido prever su comisión (ACTIO LIBERA IN CAUSA — si te embriagas para matar, no te exime).",
                    "INIMPUTABILIDAD — 2ª INTOXICACIÓN PLENA (art. 20.2ª CP): el que al tiempo de cometer la infracción se halle en estado de INTOXICACIÓN PLENA por el consumo de bebidas alcohólicas, drogas tóxicas, estupefacientes, sustancias psicotrópicas u otras que produzcan efectos análogos, siempre que no haya sido buscado con el propósito de cometerla o no se hubiese previsto o debido prever su comisión, o se halle BAJO LA INFLUENCIA DE UN SÍNDROME DE ABSTINENCIA, a causa de su dependencia de tales sustancias, que le impida comprender la ilicitud del hecho o actuar conforme a esa comprensión.",
                    "INIMPUTABILIDAD — 3ª ALTERACIONES EN LA PERCEPCIÓN (art. 20.3ª CP): el que, por sufrir ALTERACIONES EN LA PERCEPCIÓN desde el NACIMIENTO o desde la INFANCIA, tenga alterada gravemente la conciencia de la realidad. Pensado para sordomudos sin instrucción o casos análogos.",
                    "MINORÍA DE EDAD PENAL (art. 19 CP): los MENORES DE 18 AÑOS no serán responsables criminalmente con arreglo al CP. Cuando un menor cometa un hecho delictivo podrá ser responsable con arreglo a lo dispuesto en la LO 5/2000 reguladora de la responsabilidad penal de los menores. Ámbito LO 5/2000: 14-17 años (dos tramos: 14-15 y 16-17 con medidas más graves). Menores de 14 años: TOTAL EXENCIÓN penal y aplicación del Código Civil y normas de protección del menor.",
                    "MIEDO INSUPERABLE (art. 20.6ª CP): está exento el que obre IMPULSADO POR MIEDO INSUPERABLE. Naturaleza: causa de INEXIGIBILIDAD (excluye culpabilidad, no antijuridicidad). Requisitos jurisprudenciales (TS): 1) existencia de un MAL REAL O APARENTE, AMENAZANTE para el sujeto; 2) que ese mal sea grave y serio; 3) INSUPERABILIDAD desde la perspectiva de un hombre medio en la situación del autor (no exige heroísmo, pero sí cierta resistencia); 4) ACTUALIDAD del mal.",
                    "ERROR DE PROHIBICIÓN (art. 14.3 CP — literal): el error invencible SOBRE LA ILÍCITUD DEL HECHO constitutivo de la infracción penal EXCLUYE LA RESPONSABILIDAD CRIMINAL. Si el error fuera vencible, se aplicará la pena INFERIOR EN UNO O DOS GRADOS.",
                    "DIFERENCIA ERROR DE TIPO vs ERROR DE PROHIBICIÓN: el ERROR DE TIPO (art. 14.1) recae sobre un elemento del TIPO OBJETIVO (no sé que la persona es funcionario); excluye el dolo. El ERROR DE PROHIBICIÓN (art. 14.3) recae sobre la ILÍCITUD del hecho (sé que mato a un funcionario, pero creo que actuar así es lícito); excluye la culpabilidad. Consecuencia: en el error de tipo invencible — IMPUNIDAD; vencible — IMPRUDENCIA. En el error de prohibición invencible — IMPUNIDAD; vencible — PENA INFERIOR EN 1 O 2 GRADOS (mantiene el delito doloso).",
                    "ERROR de prohibición — modalidades: a) DIRECTO: error sobre la prohibición misma (no sabe que conducir bajo efectos del alcohol es delito); b) INDIRECTO: error sobre la existencia o límites de una causa de justificación (creo que tengo legítima defensa cuando no la hay — 'defensa putativa').",
                    "EXIMENTES INCOMPLETAS (art. 21.1ª CP): las causas expresadas en el art. 20 cuando no concurrieren TODOS LOS REQUISITOS NECESARIOS PARA EXIMIR DE RESPONSABILIDAD. Aplica tanto a causas de justificación (legítima defensa incompleta, estado de necesidad incompleto) como a causas de inimputabilidad (anomalía psíquica incompleta = enfermo mental no pleno; intoxicación no plena = embriaguez no letargía). Efecto (art. 68 CP): rebaja de PENA EN UNO O DOS GRADOS, atendidos número y entidad de requisitos que falten.",
                    "CONCURRENCIA con ATENUANTES analogicas (art. 21.7ª CP): la conducta no cubierta por la eximente incompleta aún podría subsumirse en una ATENUANTE ANALÓGICA si la afectación a la culpabilidad es menor (ej. embriaguez no plena pero significativa = atenuante analógica a la 21.2ª).",
                    "EXIGIBILIDAD DE OTRA CONDUCTA — fundamento teórico de la culpabilidad. Causas de INEXIGIBILIDAD: miedo insuperable (20.6) y, doctrinalmente, el estado de necesidad EXCULPANTE (cuando los bienes son de igual valor). También el ENCUBRIMIENTO ENTRE PARIENTES (art. 454 CP — excusa absolutoria por inexigibilidad).",
                    "EXCUSAS ABSOLUTORIAS: razones de política criminal por las que se renuncia a la pena pese a la existencia de un hecho típico, antijurídico y culpable. Ejemplos: relaciones familiares en delitos patrimoniales (art. 268 CP — cónyuges no separados, ascendientes/descendientes y hermanos no incurren en responsabilidad criminal por hurto, estafa, apropiación indebida — sólo civil); encubrimiento entre parientes (art. 454); arrepentimiento espontáneo en delitos contra HP (art. 305.6 CP).",
                    "CONSECUENCIAS de la EXENCIÓN por inimputabilidad o miedo insuperable: aunque el sujeto NO responde penalmente, SÍ PUEDE IMPONÉRSELE UNA MEDIDA DE SEGURIDAD (arts. 95-108 CP) si concurre PELIGROSIDAD CRIMINAL. Las medidas pueden ser privativas de libertad (internamiento en centro psiquiátrico, deshabituación, educación especial) o NO privativas. Además, persiste la responsabilidad civil ex delicto (art. 118 CP — responden directamente los tutores/guardadores, en su caso).",
                    "Truco examen: 4 causas inimputabilidad (anomalía psíquica, intoxicación plena, alteraciones percepción, minoría edad) + miedo insuperable + error prohibición invencible. ACTIO LIBERA IN CAUSA elimina la eximente de intoxicación si te drogaste para delinquir. ERROR PROHIBICIÓN VENCIBLE = pena INFERIOR 1-2 GRADOS (no imprudencia). LO 5/2000 menores 14-17. Inimputable peligroso = medida seguridad arts. 95-108."
                ]

            {
                n: 30, b: "A", a: "Penal — Parte General", t: "Circunstancias modificativas: atenuantes, agravantes, parentesco", norma: "CP arts. 21-23", keys: ["atenuante", "agravante", "parentesco"], rel: [25, 33], d: 3, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444", rec: "",
                resumen: [
                    "CIRCUNSTANCIAS MODIFICATIVAS DE LA RESPONSABILIDAD CRIMINAL: hechos o situaciones que, sin alterar la naturaleza del delito, modifican la responsabilidad del autor INCREMENTANDO la pena (agravantes), DISMINUYÉNDOLA (atenuantes) o pudiendo hacer ambas (mixta de parentesco). Reguladas en arts. 21 a 23 CP. EFECTOS sobre la pena: arts. 65-68 CP.",
                    "ATENUANTES — art. 21 CP — son 7: 1ª) las causas expresadas en el art. 20 cuando NO CONCURRIEREN TODOS LOS REQUISITOS NECESARIOS para eximir (EXIMENTES INCOMPLETAS); 2ª) la de actuar el culpable A CAUSA DE SU GRAVE ADICCIÓN A LAS SUSTANCIAS mencionadas en el art. 20.2ª; 3ª) la de OBRAR POR CAUSAS O ESTÍMULOS TAN PODEROSOS que hayan producido ARREBATO, OBCECACIÓN u otro estado pasional de entidad semejante; 4ª) la de haber procedido el culpable, antes de conocer que el procedimiento judicial se dirige contra él, a CONFESAR LA INFRACCIÓN a las autoridades; 5ª) la de haber procedido el culpable a REPARAR EL DAÑO ocasionado a la víctima, o disminuir sus efectos, en cualquier momento del procedimiento y CON ANTERIORIDAD A LA CELEBRACIÓN DEL ACTO DEL JUICIO ORAL; 6ª) la DILACIÓN EXTRAORDINARIA E INDEBIDA en la tramitación del procedimiento, siempre que no sea atribuible al propio inculpado y que no guarde proporción con la complejidad de la causa; 7ª) CUALQUIER OTRA CIRCUNSTANCIA DE ANÁLOGA SIGNIFICACIÓN (ATENUANTE ANALÓGICA).",
                    "AGRAVANTES — art. 22 CP — son 8: 1ª) Ejecutar el hecho con ALEVOSÍA (asegurar el resultado eliminando defensa del ofendido); 2ª) Ejecutar el hecho mediante DISFRAZ, con ABUSO DE SUPERIORIDAD o aprovechando las CIRCUNSTANCIAS DE LUGAR, TIEMPO o AUXILIO DE OTRAS PERSONAS que debiliten la defensa del ofendido o faciliten la impunidad del delincuente; 3ª) Ejecutarlo mediante PRECIO, RECOMPENSA O PROMESA; 4ª) Cometer el delito por MOTIVOS RACISTAS, antisemitas u OTRA CLASE DE DISCRIMINACIÓN referente a la ideología, religión o creencias, etnia, raza, nación, sexo, ORIENTACIÓN O IDENTIDAD SEXUAL, RAZONES DE GÉNERO, ASPORENOFOBIA, enfermedad o discapacidad; 5ª) Aumentar deliberada e inhumanamente el SUFRIMIENTO de la víctima (ENSAÑAMIENTO); 6ª) Obrar con ABUSO DE CONFIANZA; 7ª) Prevalerse del CARÁCTER PÚBLICO que tenga el culpable; 8ª) Ser REINCIDENTE.",
                    "ALEVOSÍA (art. 22.1ª): hay alevosía cuando el culpable comete cualquiera de los delitos contra las personas EMPLEANDO EN LA EJECUCIÓN MEDIOS, MODOS O FORMAS QUE TIENDAN DIRECTA O ESPECIALMENTE A ASEGURARLA, SIN EL RIESGO QUE PARA SU PERSONA PUDIERA PROCEDER DE LA DEFENSA POR PARTE DEL OFENDIDO. La JURISPRUDENCIA TS distingue 3 modalidades: PROVISIONAL (ataque por sorpresa o emboscada), SÚBITA (ataque inopinado e inesperado a la víctima desprevenida), DE DESVALIMIENTO (víctima incapaz de defensa: niños, ancianos, dormidos, drogados). La alevosía CALIFICA el HOMICIDIO COMO ASESINATO (art. 139 CP).",
                    "REINCIDENCIA (art. 22.8ª CP): hay reincidencia cuando, al delinquir, el culpable haya sido CONDENADO EJECUTORIAMENTE por un delito comprendido en el MISMO TÍTULO DEL CP, siempre que sea DE LA MISMA NATURALEZA. NO se computarán los ANTECEDENTES PENALES CANCELADOS o que debieran serlo. Plazos de cancelación (art. 136 CP): penas leves 6 meses; menos graves 2-3 años; graves 3 años; graves superiores a 3 años 5 años; pena por delito doloso contra la vida e integridad/libertad sexual/violencia género/doméstica 10 años.",
                    "AGRAVANTE de DISCRIMINACIÓN (art. 22.4ª) — lista actualizada por LO 8/2021 y LO 10/2022: cubre RAZONES DE GÉNERO (no sólo sexo) y ASPORENOFOBIA. Su aplicación requiere que el móvil discriminatorio sea PROBADO como motor de la conducta (no basta el resultado lesivo de un grupo protegido).",
                    "CIRCUNSTANCIA MIXTA DE PARENTESCO (art. 23 CP): es CIRCUNSTANCIA QUE PUEDE ATENUAR O AGRAVAR LA RESPONSABILIDAD, según la NATURALEZA, LOS MOTIVOS Y LOS EFECTOS DEL DELITO, ser o haber sido el agraviado CÓNYUGE o persona que esté o haya estado ligada de forma estable por análoga relación de afectividad, o ser ASCENDIENTE, DESCENDIENTE O HERMANO POR NATURALEZA O ADOPCIÓN del ofensor o de su cónyuge o conviviente.",
                    "PARENTESCO COMO ATENUANTE: tradicionalmente en delitos patrimoniales (hurto, estafa) cuando hay un vínculo familiar atenuador. COMO AGRAVANTE: en delitos contra las personas (homicidio, lesiones), especialmente cuando hay relación de DEPENDENCIA o CONFIANZA. La jurisprudencia tras la entrada en vigor de la LO 1/2004 y reformas sucesivas tiende a aplicar el parentesco como AGRAVANTE en violencia de pareja y doméstica (sin perjuicio del subtipo agravado específico de los arts. 153, 173.2 CP).",
                    "REGLAS DE APLICACIÓN (arts. 65-68 CP). ART. 65 CP: las circunstancias agravantes o atenuantes que CONSISTAN EN LA DISPOSICIÓN MORAL DEL DELINCUENTE, EN SUS RELACIONES PARTICULARES con el ofendido o en otra causa PERSONAL servirán para AGRAVAR o ATENUAR LA RESPONSABILIDAD SOLO de aquellos en quienes concurran (incomunicabilidad). Las circunstancias que CONSISTAN EN LA EJECUCIÓN MATERIAL del hecho o EN LOS MEDIOS empleados servirán para agravar o atenuar la responsabilidad de los que hayan tenido conocimiento de ellas (comunicabilidad).",
                    "ART. 66 CP — REGLAS de individualización para delitos DOLOSOS: 1ª) UNA atenuante: mitad inferior de la pena; 2ª) DOS O MÁS atenuantes o una muy cualificada: pena inferior en UNO O DOS GRADOS; 3ª) UNA O DOS agravantes: mitad superior; 4ª) MÁS DE DOS agravantes sin atenuantes: pena superior en GRADO en su mitad inferior; 5ª) MULTIRREINCIDENCIA (reincidente con 3 delitos del mismo título y misma naturaleza ya ejecutoriamente condenado): pena SUPERIOR EN GRADO; 6ª) Cuando no concurran atenuantes ni agravantes: pena en la extensión que estimen adecuada, en atención a las circunstancias personales del delincuente y mayor o menor gravedad del hecho.",
                    "ART. 67 CP — PROHIBICIÓN DE BIS IN IDEM: las reglas del art. 66 no se aplicarán a las circunstancias agravantes o atenuantes que la Ley HAYA TENIDO EN CUENTA AL DESCRIBIR O SANCIONAR UNA INFRACCIÓN, ni a las que sean de tal manera inherentes al delito que sin la concurrencia de ellas no podría cometerse (inherencia).",
                    "EXIMENTES INCOMPLETAS — ART. 68 CP: en los casos previstos en la circunstancia primera del art. 21, los jueces o tribunales impondrán la PENA INFERIOR EN UNO O DOS GRADOS a la señalada por la Ley, atendidos el NUMERO Y LA ENTIDAD de los requisitos que falten o concurran, y las circunstancias personales de su autor.",
                    "ATENUANTES MUY CUALIFICADAS: la jurisprudencia TS reconoce que una atenuante puede ser MUY CUALIFICADA cuando concurre con una intensidad superior a la ordinaria. Efecto: equivale doblemente y permite la rebaja en GRADO (no sólo en mitad inferior).",
                    "Truco examen: 7 ATENUANTES + 8 AGRAVANTES + parentesco MIXTA. Diferencia ALEVOSÍA (homicidio en personas) vs ABUSO DE SUPERIORIDAD (agravante 22.2ª). Reincidencia requiere MISMO TÍTULO + MISMA NATURALEZA. Confesión ATENUA solo si ANTES de conocer procedimiento. Reparación daño: antes del JUICIO ORAL. ART. 66 dosimetría penal: 2 atenuantes o 1 muy cualificada = REBAJA 1-2 GRADOS. Eximente incompleta = SIEMPRE rebaja 1-2 grados."
                ]
            },
            { n: 31, b: "A", a: "Penal — Parte General", t: "Iter criminis. Tentativa. Autoría y participación", norma: "CP arts. 15-18, 27-31", keys: ["tentativa", "consumación", "autor", "cómplice"], rel: [25, 32], d: 4, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444", rec: "" },

            { n: 34, b: "A", a: "Penal — Parte Especial", t: "Homicidio, aborto, lesiones, manipulación genética", norma: "CP arts. 138-162", keys: ["homicidio", "asesinato", "lesiones", "aborto"], rel: [35, 36], d: 4, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444", rec: "" },
            { n: 35, b: "A", a: "Penal — Parte Especial", t: "Delitos contra la libertad. Odio. Tortura. Trata", norma: "CP arts. 163-177 bis", keys: ["detención ilegal", "amenazas", "odio", "trata"], rel: [16, 34, 36, 55], d: 4, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444", rec: "" },

            {
                n: 72, b: "C", a: "Contabilidad", t: "Contabilidad. Balance, PyG, IVA, IS", norma: "PGC RD 1514/2007", keys: ["activo", "pasivo", "balance", "IVA", "IS"], rel: [38], d: 4, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-2007-19884", rec: "https://www.icac.gob.es/",
                resumen: [
                    "Marco normativo. El Plan General de Contabilidad (PGC) se aprueba por RD 1514/2007. Existe una versión simplificada para pymes en el RD 1515/2007. El organismo regulador es el ICAC (Instituto de Contabilidad y Auditoría de Cuentas), adscrito al Ministerio de Economía.",
                    "Cuentas anuales obligatorias (PGC, parte 3ª): Balance, Cuenta de Pérdidas y Ganancias (PyG), Estado de Cambios en el Patrimonio Neto (ECPN), Estado de Flujos de Efectivo (EFE) y Memoria. Las pymes pueden omitir el EFE.",
                    "Balance — ecuación contable básica: Activo = Pasivo + Patrimonio Neto. Activo = bienes y derechos (lo que la empresa tiene y le deben). Pasivo = obligaciones con terceros (lo que debe). Patrimonio Neto = capital aportado por socios + reservas + resultado del ejercicio.",
                    "Activo se divide en no corriente (permanece más de 1 año: inmovilizado material, intangible, inversiones) y corriente (se convierte en dinero en menos de 1 año: existencias, clientes, tesorería). Pasivo igual: no corriente (deuda a más de 1 año) y corriente (deuda a corto plazo, proveedores).",
                    "Cuenta de Pérdidas y Ganancias: Ingresos − Gastos = Resultado del ejercicio. Si positivo, beneficio; si negativo, pérdida. Se elabora según el principio de devengo (se imputa cuando ocurre, no cuando se cobra/paga).",
                    "Principios contables (PGC, marco conceptual): empresa en funcionamiento, devengo, uniformidad, prudencia, no compensación, importancia relativa. En caso de conflicto entre principios prevalece el de imagen fiel.",
                    "IVA (Impuesto sobre el Valor Añadido) — Ley 37/1992. Impuesto indirecto que grava el consumo. Tipos vigentes en España: general 21 %, reducido 10 %, superreducido 4 %. El empresario actúa como recaudador: ingresa la diferencia entre IVA repercutido (cobrado a clientes) e IVA soportado (pagado a proveedores).",
                    "IS (Impuesto sobre Sociedades) — Ley 27/2014. Grava el beneficio de las personas jurídicas (sociedades). Tipo general 25 %. Empresas de nueva creación: 15 % los dos primeros ejercicios con beneficio. Período impositivo = ejercicio económico (normalmente año natural). Devengo: último día del período. Autoliquidación: modelo 200, plazo 25 días tras los 6 meses posteriores al cierre.",
                    "Truco examen: el IRPF (Ley 35/2006) grava a personas físicas; el IS grava a personas jurídicas. No confundir."
                ]
            },
            {
                n: 73, b: "C", a: "Redes", t: "Redes. OSI, TCP/IP, dispositivos, IPv4/IPv6, WiFi", norma: "—", keys: ["OSI", "TCP/IP", "router", "firewall", "IPv4", "IPv6", "WPA2"], rel: [74, 75, 77], d: 4, boe: "https://es.wikipedia.org/wiki/Modelo_OSI", rec: "https://www.incibe.es/",
                resumen: [
                    "Una red informática es un conjunto de equipos conectados que intercambian datos. Para que dos máquinas se entiendan necesitan reglas comunes llamadas protocolos.",
                    "Modelo OSI (Open Systems Interconnection) — norma ISO/IEC 7498 de 1984. Es teórico, divide la comunicación en 7 capas, de abajo a arriba: 1 Física, 2 Enlace de datos, 3 Red, 4 Transporte, 5 Sesión, 6 Presentación, 7 Aplicación. Mnemotécnica: F-E-R-T-S-P-A.",
                    "Modelo TCP/IP — el que se usa de verdad en Internet. Tiene 4 capas: Acceso al medio, Internet, Transporte, Aplicación. Cada capa de TCP/IP agrupa varias del OSI. TCP = Transmission Control Protocol; IP = Internet Protocol.",
                    "Dirección IPv4: 32 bits, escrita en 4 números de 0 a 255 separados por puntos (ej. 192.168.1.1). Permite unos 4.300 millones de direcciones. Se agotaron; por eso se creó IPv6.",
                    "Dirección IPv6: 128 bits, escrita en 8 grupos hexadecimales separados por dos puntos (ej. 2001:0db8::1). Permite 340 sextillones de direcciones. Convive con IPv4 (doble pila).",
                    "Quien reparte las direcciones IP en el mundo es la IANA. Reparte a 5 organismos regionales (RIR): RIPE NCC (Europa, Or. Medio, Asia central), ARIN (Norteamérica), LACNIC (Latinoamérica y Caribe), APNIC (Asia-Pacífico), AFRINIC (África). Pregunta clásica: a España le corresponde RIPE NCC.",
                    "Dispositivos de red: hub (concentrador, reenvía a todos), switch (conmutador, reenvía solo al destinatario por MAC), router (encaminador, conecta redes distintas usando IP), firewall (cortafuegos, filtra tráfico según reglas), proxy (intermediario que oculta o filtra), gateway (pasarela entre protocolos distintos).",
                    "WiFi — estándar IEEE 802.11. Versiones recientes: 802.11ac (WiFi 5, 5 GHz), 802.11ax (WiFi 6). Seguridad: WEP (obsoleto, roto), WPA, WPA2 (cifrado AES), WPA3 (actual, más seguro). En el examen suelen preguntar WPA2 vs WEP — WEP NO es seguro.",
                    "Tipos de red por tamaño: PAN (personal, Bluetooth), LAN (local, oficina), MAN (metropolitana, ciudad), WAN (amplia, Internet). VPN (Virtual Private Network) = túnel cifrado dentro de Internet para conectarse a una red privada."
                ]
            },
            {
                n: 74, b: "C", a: "Sistemas Operativos", t: "SO. Windows, Linux, macOS, iOS, Android. Sistemas de archivos", norma: "—", keys: ["SO", "Linux", "Windows", "iOS", "Android", "sistemas de archivos"], rel: [73, 77], d: 3, boe: "https://es.wikipedia.org/wiki/Sistema_operativo", rec: "",
                resumen: [
                    "Un Sistema Operativo (SO) es el programa básico que hace funcionar un ordenador o móvil. Gestiona la memoria, los procesos (programas en marcha), los archivos y los dispositivos (teclado, pantalla, red).",
                    "Funciones clásicas del SO: gestión de procesos, gestión de memoria, gestión de archivos, gestión de entrada/salida (E/S) y seguridad/usuarios. El núcleo se llama kernel.",
                    "SO para ordenadores: Windows (Microsoft, propietario, el más extendido en escritorio), macOS (Apple, basado en Unix, propietario), Linux (libre, código abierto, distribuciones: Ubuntu, Debian, Fedora, Red Hat). Windows y macOS son de pago en parte; Linux es gratis.",
                    "SO para móviles: Android (Google, basado en kernel Linux, código abierto AOSP) e iOS (Apple, propietario, solo en iPhone/iPad). Android tiene cuota dominante; iOS minoritaria pero relevante en peritaciones forenses.",
                    "Sistema de archivos = la forma en que el SO organiza los datos en el disco. Windows usa NTFS (actual) y FAT32/exFAT (compatibles, pendrives). Linux usa ext4 (estándar), Btrfs, XFS. macOS usa APFS (desde 2017) y HFS+ (antiguo). Android usa ext4 / F2FS. iOS usa APFS.",
                    "Software libre vs propietario: libre = se puede usar, estudiar, modificar y distribuir (Linux, GIMP, LibreOffice). Propietario = código cerrado, licencia restringida (Windows, Office, Photoshop). Open source no es exactamente igual que libre, pero en examen se tratan como sinónimos.",
                    "Para investigación policial importa: el sistema de archivos condiciona la recuperación forense. NTFS guarda metadatos detallados (MFT) muy útiles. APFS y FAT32 borran de forma distinta. La cadena de custodia digital exige clonar el disco antes de analizar (con hash MD5/SHA-256 para probar integridad).",
                    "Virtualización = ejecutar un SO dentro de otro mediante un hipervisor (VMware, VirtualBox, Hyper-V). Permite analizar malware sin infectar el equipo real."
                ]
            },
            {
                n: 75, b: "C", a: "Ciberseguridad", t: "Ciberdelincuencia. Malware, phishing, ransomware, APT, Kill Chain", norma: "CP arts. 197-201, 248, 264, 264 bis-quater", keys: ["phishing", "malware", "ransomware", "APT", "Cyber Kill Chain"], rel: [21, 73, 76, 77], d: 5, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444", rec: "https://www.incibe.es/aprendeciberseguridad",
                resumen: [
                    "Marco penal de la ciberdelincuencia (Código Penal): descubrimiento y revelación de secretos arts. 197-201 (incluye acceso no autorizado a datos personales); estafa informática art. 248.2; daños informáticos arts. 264 a 264 quater (afectar datos, sistemas o herramientas). Convenio de Budapest (2001) es la norma internacional de referencia.",
                    "Unidades policiales: en CNP la UCC (Unidad Central de Ciberdelincuencia), dentro de la UDEV de la Policía Judicial. En Guardia Civil, el GDT (Grupo de Delitos Telemáticos). A nivel estatal: INCIBE (Instituto Nacional de Ciberseguridad, dependiente del Min. Asuntos Económicos) y CCN-CERT (equipo de respuesta del CNI). No confundir: INCIBE = ciudadanos y empresas; CCN-CERT = administraciones públicas.",
                    "Malware = software malicioso. Tipos clásicos: virus (necesita un fichero huésped para replicarse), gusano o worm (se replica solo por red), troyano (se hace pasar por programa legítimo), spyware (espionaje), adware (publicidad), rootkit (oculta su presencia con privilegios de administrador), keylogger (captura pulsaciones de teclado).",
                    "Ransomware: cifra los archivos y exige rescate (rescate = ransom). Suele propagarse por phishing o explotando vulnerabilidades. Casos famosos: WannaCry (2017, explotaba EternalBlue), NotPetya, Ryuk, Conti. Recomendación oficial: NO pagar; denunciar y restaurar de copia de seguridad.",
                    "Phishing = engaño por correo o web fraudulenta para que la víctima entregue credenciales. Variantes: smishing (por SMS), vishing (por llamada de voz), spear phishing (dirigido a una persona concreta), whaling (dirigido a altos directivos), pharming (manipulación de DNS para redirigir).",
                    "APT (Advanced Persistent Threat) = amenaza persistente avanzada. Ataque sofisticado, normalmente patrocinado por un Estado o grupo organizado, dirigido a un objetivo concreto y mantenido en el tiempo de forma sigilosa. No es masivo, es selectivo.",
                    "Cyber Kill Chain (Lockheed Martin) — 7 fases de un ciberataque: 1) Reconocimiento, 2) Armamentización (weaponization), 3) Entrega (delivery), 4) Explotación, 5) Instalación, 6) Mando y control (C2 o C&C), 7) Acciones sobre objetivos. Mnemotécnica: R-A-E-E-I-C-A.",
                    "DoS (Denial of Service) = denegación de servicio: saturar un servidor para que deje de responder. DDoS (Distributed) = mismo ataque desde miles de equipos (botnet). Botnet = red de dispositivos infectados controlados de forma remota.",
                    "Buenas prácticas para examen: contraseñas robustas, doble factor de autenticación (2FA), actualizaciones, copias de seguridad 3-2-1 (3 copias, 2 soportes, 1 fuera del lugar), cifrado en tránsito (HTTPS, TLS) y en reposo, principio de mínimo privilegio."
                ]

        // F3 — You vs you, 4 weeks ago. Compares last 7 days to days 28-35 ago.
        // Returns null when there's no data in the older window so we can hide the card.
        function compareVsPast() {
            const hist = lsGet("test:history", []);
            const now = Date.now(), day = 86400000;
            const winNow = { start: now - 7 * day, end: now };
            const winThen = { start: now - 35 * day, end: now - 28 * day };
            function agg(w) {
                const items = hist.filter(h => h.date >= w.start && h.date < w.end);
                const preg = items.reduce((s, h) => s + (h.total || 0), 0);
                const ac = items.reduce((s, h) => s + (h.aciertos || 0), 0);
                const nota = items.length ? items.reduce((s, h) => s + (h.nota || 0), 0) / items.length : 0;
                return { tests: items.length, preg, accPct: preg ? (ac / preg) * 100 : 0, nota };
            }
            const a = agg(winNow), b = agg(winThen);
            if (b.tests === 0 && a.tests === 0) return null;
            return { now: a, then: b };
        }

autogobierno." }, { "id": "EE-P40-Q005", "src": "Ejecutiva P40 (Jurispol)", "n": 5, "e": "¿Qué requisito ha fijado el Tribunal Supremo como necesario para valorar la suficiencia de la prueba indiciaria en los supuestos en los que no existe prueba directa?", "o": ["Que existan, al menos, tres indicios.", "Son suficientes dos indicios si se demuestran mediante prueba directa.", "La pluralidad de indicios debe estar demostrada mediante prueba directa."], "c": 2, "d": "media", "t": 49, "x": "Requisitos: 1) Que exista una pluralidad de indicios. No puede precisarse, de antemano y en abstracto, su número 2) Que esta pluralidad de indicios estén demostrados mediante prueba directa. 3) Que de manera indispensable, entre el hecho demostrado o indicio y el que se trate de deducir haya un enlace preciso, concreto y directo según las reglas del criterio humano, y 4) Que el órgano judicial motive en su Sentencia el razonamiento de cómo ha llegado a la certeza del hecho presunto." }, { "id": "EE-P40-Q006", "src": "Ejecutiva P40 (Jurispol)", "n": 6, "e": "¿Qué finalidad debe perseguir el autor de un delito grave de falsedad documental tipificado en el Código Penal para que este sea considerado como un delito de terrorismo?", "o": ["La falsedad documental no es una tipología delictiva descrita en el artículo 573 del Código Penal.", "Desestabilizar, aunque sea de modo leve, las estructuras económicas o sociales del Estado.", "Que tenga por finalidad provocar un estado de terror en la población o en una parte de ella."], "c": 2, "d": "media", "t": 44, "x": "Artículo 573 del Código Penal 1. Se considerará delito de terrorismo la comisión de cualquier delito grave contra la vida o la integridad física, la libertad, la integridad moral, la libertad e indemnidad sexuales, el patrimonio, los recursos naturales o el medio ambiente, la salud pública, de riesgo catastrófico, incendio, de falsedad documental, contra la Corona, de atentado y tenencia, tráfico y depósito de armas, municiones o explosivos, previstos en el presente Código, y el apoderamiento de aeronaves, buques u otros medios de transporte colectivo o de mercancías, cuando se llevaran a cabo con cualquiera de las siguientes finalidades: 1.ª Subvertir el orden constitucional, o suprimir o desestabilizar gravemente el funcionamiento de las instituciones políticas o de las estructuras económicas o sociales del Estado, u obligar a los poderes públicos a realizar un acto o a abstenerse de hacerlo. 2.ª Alterar gravemente la paz pública. 3.ª Desestabilizar gravemente el funcionamiento de una organización internacional. 4.ª Provocar un estado de terror en la población o en una parte de ella." }, { "id": "EE-P40-Q007", "src": "Ejecutiva P40 (Jurispol)", "n": 7, "e": "El artículo 5 de la Ley Orgánica 2/86, de Fuerzas y Cuerpos de Seguridad, señala que sus miembros deben actuar con integridad y dignidad. En particular, deberán abstenerse de todo acto de corrupción y oponerse a él resueltamente. ¿A qué principio básico de actuación hace referencia?", "o": ["Relaciones con la comunidad.", "Dedicación profesional.", "Adecuación al ordenamiento jurídico."], "c": 2, "d": "facil", "t": 14, "x": "Ley Orgánica 2/1986, de 13 de marzo, de Fuerzas y Cuerpos de Seguridad. Artículo quinto. Son principios básicos de actuación de los miembros de las Fuerzas y Cuerpos de Seguridad los siguientes: 1. Adecuación al ordenamiento jurídico, especialmente c) Actuar con integridad y dignidad. En particular, deberán abstenerse de todo acto de corrupción y oponerse a él resueltamente." }, { "id": "EE-P40-Q008", "src": "Ejecutiva P40 (Jurispol)", "n": 8, "e": "¿Cómo se denomina al personal que presta servicio en la Administración Pública que, en virtud de nombramiento y con carácter no permanente, sólo realiza funciones expresamente calificadas como de confianza o asesoramiento especial, siendo retribuido con cargo a los créditos presupuestarios consignados para este fin?", "o": ["Personal eventual.", "Personal interino.", "Personal laboral por tiempo parcial."], "c": 0, "d": "facil", "t": 12, "x": "TREBEP: Artículo 12. Personal eventual: 1. Es personal eventual el que, en virtud de nombramiento y con carácter no permanente, sólo realiza funciones expresamente calificadas como de confianza o asesoramiento especial, siendo retribuido con cargo a los créditos presupuestarios consignados para este fin." }, { "id": "EE-P40-Q009", "src": "Ejecutiva P40 (Jurispol)", "n": 9, "e": "¿Cuál de las siguientes opciones es competencia exclusiva de la Policía Nacional según lo dispuesto en la L.O. 2/86, de Fuerzas y Cuerpos de Seguridad?", "o": ["La custodia de las costas, puertos, aeropuertos y centros e instalaciones que por su interés lo requieran.", "Velar por la protección y seguridad de altas personalidades.", "La investigación y persecución de los delitos relacionados con la droga."], "c": 2, "d": "facil", "t": 14, "x": "Ley Orgánica 2/1986, de 13 de marzo, de Fuerzas y Cuerpos de Seguridad Artículo doce. 1. Además de las funciones comunes establecidas en el artículo anterior, se establece la siguiente distribución material de competencias: A) Serán ejercidas por el Cuerpo Nacional de Policía: e) La investigación y persecución de los delitos relacionados con la droga." }, { "id": "EE-P40-Q010", "src": "Ejecutiva P40 (Jurispol)", "n": 10, "e": "¿Cómo se denominan las Constituciones que, por su forma, son mezcla de usos y costumbres sobre la manera de gobernarse de la nación y no se recogen en un pueblo concreto?", "o": ["Constitución consuetudinaria.", "Constitución otorgada.", "Constitución de soberanía nacional."], "c": 0, "d": "media", "t": 4, "x": "Las constituciones consuetudinarias se caracterizan por basarse en usos y costumbres sobre la forma de gobernarse, sin estar recogidas en un documento escrito formalmente y sin provenir directamente de un pueblo concreto." }, { "id": "EE-P40-Q011", "src": "Ejecutiva P40 (Jurispol)", "n": 11, "e": "El consumo de sustancias estupefacientes en un lugar público no es una conducta reprochable penalmente, sólo es sancionable administrativamente. Esta premisa es un claro ejemplo práctico del...", "o": ["Principio de proporcionalidad.", "Principio de retroactividad legal.", "Principio de mínima intervención."], "c": 2, "d": "facil", "t": 22, "x": "El principio de intervención mínima establece que el derecho penal debe ser el último recurso del Estado (última ratio) para proteger los bienes jurídicos más importantes, aplicando sanciones solo a las infracciones más graves y cuando no existan otros medios menos invasivos. Esto significa que el Estado solo debe recurrir a la sanción penal si otras ramas del derecho (como el administrativo o civil) son insuficientes. Características clave Subsidiario: El derecho penal solo debe aplicarse cuando el orden jurídico no puede ser preservado por otros medios menos drásticos. Fragmentario: El derecho penal no protege todos los comportamientos, sino solo aquellos que suponen los ataques más graves a los bienes jurídicos más relevantes para la sociedad." }, { "id": "EE-P40-Q012", "src": "Ejecutiva P40 (Jurispol)", "n": 12, "e": "¿Qué forma jurídica del Estado, según su organización territorial, adopta aquella que se caracteriza por tener como rasgo principal el concepto de Estado-miembro donde estos Estados miembros conservan una cuota de su propia soberanía, con sus propias instituciones y leyes?", "o": ["Estado regional.", "Estado unitario.", "Estado federal."], "c": 2, "d": "facil", "t": 7, "x": "Un Estado federal se caracteriza por estar compuesto por Estados miembros o entidades federadas que conservan parte de su soberanía, cuentan con instituciones propias y pueden tener leyes específicas dentro de su ámbito territorial." }, { "id": "EE-P40-Q013", "src": "Ejecutiva P40 (Jurispol)", "n": 13, "e": "¿Dónde se resolverán los conflictos de competencia que puedan producirse entre Juzgados o Tribunales de distinto orden jurisdiccional, integrados en el poder judicial?", "o": ["En una Sala especial del Tribunal Supremo.", "En el Tribunal Constitucional.", "En los Tribunales Superiores de Justicia."], "c": 0, "d": "media", "t": 45, "x": "Artículo 42 de la LOPJ: Los conflictos de competencia que puedan producirse entre Juzgados o Tribunales de distinto orden jurisdiccional, integrados en el Poder Judicial, se resolverán por una Sala especial del Tribunal Supremo, presidida por el Presidente y compuesta por dos Magistrados, uno por cada orden jurisdiccional en conflicto, que serán designados anualmente por la Sala de Gobierno. Actuará como Secretario de esta Sala especial el de Gobierno del Tribunal Supremo." }, { "id": "EE-P40-Q014", "src": "Ejecutiva P40 (Jurispol)", "n": 14, "e": "¿Cuál de estas circunstancias podrá atenuar la pena en los delitos de falsificación de moneda del artículo 386 del Código Penal?", "o": ["El que fabrique moneda falsa y la ponga en circulación.", "La tenencia de moneda falsa para su distribución, atendido el valor de esta y al grado de connivencia con el falsificador, alterador, introductor o exportador.", "El que transporte, expenda o distribuya moneda falsa o alterada con conocimiento de su falsedad."], "c": 1, "d": "facil", "t": 40, "x": "Artículo 386 del CP 1. Será castigado con la pena de prisión de ocho a doce años y multa del tanto al décuplo del valor aparente de la moneda: 1.º El que altere la moneda o fabrique moneda falsa. 2.º El que exporte moneda falsa o alterada o la importe a España o a cualquier otro Estado miembro de la Unión Europea. 3.º El que transporte, expenda o distribuya moneda falsa o alterada con conocimiento de su falsedad. 2. Si la moneda falsa fuera puesta en circulación se impondrá la pena en su mitad superior. La tenencia, recepción u obtención de moneda falsa para su expedición o distribución o puesta en circulación será castigada con la pena inferior en uno o dos grados, atendiendo al valor de aquélla y al grado de connivencia con el falsificador, alterador, introductor o exportador." }, { "id": "EE-P40-Q015", "src": "Ejecutiva P40 (Jurispol)", "n": 15, "e": "¿Qué requisito debe darse para que sea ilícita la difusión pública a través de una red social de contenidos específicamente destinados a promover, fomentar o incitar al suicidio?", "o": ["Que la incitación vaya dirigida a personas menores de edad.", "Que la incitación vaya dirigida a una población, grupo étnico, cultural o religioso, o colectivo social o profesional.", "Que la incitación haya conllevado la consumación suicida de al menos una persona."], "c": 0, "d": "facil", "t": 34, "x": "Artículo 143 bis del CP La distribución o difusión pública a través de Internet, del teléfono o de cualquier otra tecnología de la información o de la comunicación de contenidos específicamente destinados a promover, fomentar o incitar al suicidio de personas menores de edad o personas con discapacidad necesitadas de especial protección será castigada con la pena de prisión de uno a cuatro años. Las autoridades judiciales ordenarán la adopción de las medidas necesarias para la retirada de los contenidos a los que se refiere el párrafo anterior, para la interrupción de los servicios que ofrezcan predominantemente dichos contenidos o para el bloqueo de unos y otros cuando radiquen en el extranjero." }, { "id": "EE-P40-Q016", "src": "Ejecutiva P40 (Jurispol)", "n": 16, "e": "Respecto al cómputo de plazos establecido en el artículo 30 de la Ley 39/2015, del Procedimiento Administrativo Común de las Administraciones Públicas, siempre que por Ley o en el Derecho de la Unión Europea no se exprese otro cómputo, cuando los plazos se señalen por días:", "o": ["Se entiende que estos son siempre naturales, para que sean considerados como hábiles deberá hacerse constar en las correspondientes notificaciones.", "Los plazos expresados en días se contarán a partir del mismo día en que tenga lugar la notificación o publicación del acto administrativo.", "Se entiende que estos son hábiles, excluyéndose del cómputo los sábados, los domingos y los declarados festivos."], "c": 2, "d": "facil", "t": 10, "x": "Según el artículo 30 de la Ley 39/2015, cuando los plazos se expresan en días y no se indica otra cosa, se consideran días hábiles, es decir, se excluyen del cómputo los sábados, domingos y festivos." }, { "id": "EE-P40-Q017", "src": "Ejecutiva P40 (Jurispol)", "n": 17, "e": "Los servicios de vigilancia y protección referidos a las actividades que desarrollan los servicios de seguridad privada se prestarán por vigilantes de seguridad, con carácter general, en el interior de los edificios, instalaciones o propiedades y en sus accesos, sin perjuicio de que puedan prestarse fuera de estos espacios sin necesidad de autorización previa, incluso en vías o espacios públicos:", "o": ["En la vigilancia y protección de los medios de transporte y de sus infraestructuras.", "La vigilancia en polígonos industriales y urbanizaciones delimitados.", "La vigilancia y protección en recintos y espacios abiertos que se encuentren delimitados."], "c": 0, "d": "media", "t": 18, "x": "Según la Ley de Seguridad Privada, los servicios de vigilancia y protección realizados por vigilantes de seguridad se prestan principalmente en el interior de edificios, instalaciones o propiedades y en sus accesos. Sin embargo, pueden prestarse fuera de estos espacios sin necesidad de autorización previa únicamente en determinados supuestos, como es el caso de la vigilancia y protección de medios de transporte y de sus infraestructuras." }, { "id": "EE-P40-Q018", "src": "Ejecutiva P40 (Jurispol)", "n": 18, "e": "El que, con ánimo de lucro, obligare a otro, con violencia o intimidación, a realizar u omitir un acto o negocio jurídico en perjuicio de su patrimonio o del de un tercero, comete un delito de:", "o": ["Extorsión.", "Coacciones.", "Robo con violencia."], "c": 0, "d": "facil", "t": 38, "x": "Artículo 243 del Código Penal El que, con ánimo de lucro, obligare a otro, con violencia o intimidación, a realizar u omitir un acto o negocio jurídico en perjuicio de su patrimonio o del de un tercero, será castigado con la pena de prisión de uno a cinco años, sin perjuicio de las que pudieran imponerse por los actos de violencia física realizados." }, { "id": "EE-P40-Q019", "src": "Ejecutiva P40 (Jurispol)", "n": 19, "e": "Dos funcionarios de la Policía Nacional detienen a un menor con 15 años que ha colocado un paquete con explosivos en una estación de tren. Tras realizar las gestiones necesarias para el esclarecimiento de los hechos y la detención del resto de personas implicadas, deciden solicitar la incomunicación del menor.", "o": ["No se puede incomunicar al menor de edad, aunque sea responsable del delito, por lo que cometerán un delito de privación de libertad.", "La actuación es correcta, la incomunicación cabe en cualquier circunstancia por delito de terrorismo, aunque se trate de un menor de edad.", "Quedan protegidas las garantías constitucionales del detenido, ya que al tener 15 años no se puede solicitar la incomunicación del menor."], "c": 2, "d": "media", "t": 48, "x": "Solo puede incomunicarse a mayores de 16 años, por ello las alternativas a) y b) Artículo 509 LECRIM 1. El juez de instrucción o tribunal podrá acordar excepcionalmente, mediante resolución motivada, la detención o prisión incomunicadas cuando concurra alguna de las siguientes circunstancias: a) necesidad urgente de evitar graves consecuencias que puedan poner en peligro la vida, la libertad o la integridad física de una persona, o b) necesidad urgente de una actuación inmediata de los jueces de instrucción para evitar comprometer de modo grave el proceso penal. 2. La incomunicación durará el tiempo estrictamente necesario para practicar con urgencia diligencias tendentes a evitar los peligros a que se refiere el apartado anterior. La incomunicación no podrá extenderse más allá de cinco días. En los casos en que la prisión se acuerde en causa por alguno de los delitos a que se refiere el artículo 384 bis u otros delitos cometidos concertadamente y de forma organizada por dos o más personas, la incomunicación podrá prorrogarse por otro plazo no superior a cinco días. 3. El auto en el que sea acordada la incomunicación o, en su caso, su prórroga deberá expresar los motivos por los que haya sido adoptada la medida. 4. En ningún caso podrán ser objeto de detención incomunicada los menores de dieciséis años." }, { "id": "EE-P40-Q020", "src": "Ejecutiva P40 (Jurispol)", "n": 20, "e": "¿Qué órgano directivo de los indicados depende de la Secretaría de Estado de Seguridad?", "o": ["La Dirección General de Protección Civil y Emergencias.", "La Dirección General de Apoyo a Víctimas del Terrorismo.", "La Dirección General de Relaciones Internacionales y Extranjería."], "c": 2, "d": "facil", "t": 13, "x": "Real Decreto 207/2024, de 27 de febrero, por el que se desarrolla la estructura orgánica básica del Ministerio del Interior. 5. El Ministerio del Interior se estructura en los siguientes órganos: a) La Secretaría de Estado de Seguridad, órgano superior del que dependen los siguientes órganos directivos: 1.º La Dirección General de la Policía. 2.º La Dirección General de la Guardia Civil. 3.º La Dirección General de Relaciones Internacionales y Extranjería. 4.º La Dirección General de Coordinación y Estudios La mayor comunidad de opositores a Escala Ejecutiva. ¿Y DESPUÉS DEL EXAMEN QUÉ? APTO...                                                                                     SI EL EXAMEN NO HA SALIDO BIEN... SI  ERES           ENTREVISTA  EE40 CURSO                                                                      CURSO AVANZADO EE41 En Jurispol te preparamos para la entrevista personal con               Si el examen no salió como esperabas, no te rindas. Con el curso EE40, de la mano de un profesor que ha formado                 el Curso Avanzado EE41, pensado para quienes ya tienen parte de los tribunales oficiales.                                      experiencia en la go Penal. El socorrista tiene un especial deber jurídico, al exsistir una específica obligación contractual de actuar." }, { "id": "EE-P40-Q023", "src": "Ejecutiva P40 (Jurispol)", "n": 23, "e": "Respecto a la graduación en la imposición de las sanciones por la comisión de las infracciones tipificadas en la L.O. 4/15, de protección de la seguridad ciudadana:", "o": ["La comisión de una infracción determinará la imposición de la multa correspondiente en grado mínimo.", "Como norma general, la infracción se sancionará con la multa en grado medio.", "Dentro de los límites previstos para las infracciones graves y leves, las multas se dividirán en dos tramos, correspondiendo a los grados máximo y mínimo."], "c": 0, "d": "facil", "t": 19, "x": "Ley Orgánica 4/2015, de 30 de marzo, de protección de la seguridad ciudadana. Artículo 33. Graduación de las sanciones La comisión de una infracción determinará la imposición de la multa correspondiente en grado mínimo." }, { "id": "EE-P40-Q024", "src": "Ejecutiva P40 (Jurispol)", "n": 24, "e": "¿Cómo se denomina, dentro de la Comisaría General de Extranjería y Fronteras, a la unidad operativa móvil de control de fronteras, que actúa como refuerzo a las unidades territoriales y puestos fronterizos que lo demanden para el control de vehículos y personas?", "o": ["La Unidad Central de Repatriaciones (UCER).", "La Brigada de Respuesta a la Inmigración Clandestina (BRIC).", "La Brigada Central de Respuesta Fronteriza (BCRF)."], "c": 1, "d": "media", "t": 13, "x": "Orden INT/859/2023, de 21 de julio, por la que se desarrolla la estructura orgánica y funciones de los servicios centrales y territoriales de la Dirección General de la Policía. Brigada de Respuesta a la Inmigración Clandestina, que se configura como una unidad operativa móvil de control de fronteras a la que le corresponde el refuerzo de unidades territoriales y puestos fronterizos que lo demanden para el control de vehículos y personas, la lucha contra la inmigración ilegal y la trata de seres humanos, el apoyo en situaciones de crisis humanitarias, el control de entrada y salida del territorio nacional, el refuerzo de la cooperación con Francia y Portugal en las zonas fronterizas comunes, la prevención del orden público, la seguridad nacional, la salud pública y las relaciones internacionales" }, { "id": "EE-P40-Q025", "src": "Ejecutiva P40 (Jurispol)", "n": 25, "e": "Al particular que encerrare o detuviere a otro, privándole de su libertad se le impondrá la pena inferior en grado:", "o": ["Si diera libertad al encerrado o detenido dentro de los tres primeros días de su detención, sin haber logrado el objeto que se había propuesto.", "Si diera libertad al encerrado o detenido dentro de las primeras veinticuatro horas, haya o no logrado el objetivo propuesto.", "Si diera libertad al encerrado o detenido dentro de los dos días de su detención, aunque haya logrado el objetivo que se había propuesto."], "c": 0, "d": "media", "t": 35, "x": "Artículo 163 del Código Penal 1. El particular que encerrare o detuviere a otro, privándole de su libertad, será castigado con la pena de prisión de cuatro a seis años. 2. Si el culpable diera libertad al encerrado o detenido dentro de los tres primeros días de su detención, sin haber logrado el objeto que se había propuesto, se impondrá la pena inferior en grado. 3. Se impondrá la pena de prisión de cinco a ocho años si el encierro o detención ha durado más de quince días. 4. El particular que, fuera de los casos permitidos por las leyes, aprehendiere a una persona para presentarla inmediatamente a la autoridad, será castigado con la pena de multa de tres a seis meses." }, { "id": "EE-P40-Q026", "src": "Ejecutiva P40 (Jurispol)", "n": 26, "e": "Según lo dispuesto en la Ley 8/2011, por la que se establecen medidas para la protección de las infraestructuras críticas, ¿cuál NO es considerado un agente del Sistema de Protección de Infraestructuras Críticas?", "o": ["El Centro Nacional para la Protección de las Infraestructuras Críticas.", "La Secretaría de Estado de Seguridad del Ministerio del Interior.", "El Centro Interdepartamental de los Ministerios de Interior y Defensa."], "c": 2, "d": "facil", "t": 21, "x": "Según la Ley 8/2011, no existe en un “Centro Interdepartamental de los Ministerios de Interior y Defensa” como agente del sistema, por lo que esa opción es la que NO se considera agente." }, { "id": "EE-P40-Q027", "src": "Ejecutiva P40 (Jurispol)", "n": 27, "e": "Cuando hablamos del derecho formado por el conjunto de normas penales, nos estamos refiriendo al:", "o": ["Ius poenale.", "Ius puniendi.", "Derecho penal material."], "c": 0, "d": "media", "t": 1, "x": "Mientras el IUS PUNENDI es la forma de castigar, el IUS PENALE recoge el conjunto de normas que conforma penales que recogen tales consecuencias juridicas. El Derecho penal material, no deja de ser simplemente el Código Penal (Bacigulpo Sagesse)." }, { "id": "EE-P40-Q028", "src": "Ejecutiva P40 (Jurispol)", "n": 28, "e": "El principio de territorialidad en materia penal es consecuencia de…", "o": ["La soberanía nacional.", "El principio de legalidad.", "La protección de los intereses estatales."], "c": 0, "d": "facil", "t": 23, "x": "El principio de territorialidad en materia penal significa que España tiene competencia para castigar los delitos cometidos dentro de su territorio, con independencia de la nacionalidad del autor o de la víctima. Este principio emana directamente de la soberanía nacional, ya que cada Estado ejerce su poder jurisdiccional dentro de su propio territorio, y decide qué conductas son delictivas y cómo deben ser perseguidas cuando ocurren dentro de sus fronteras." }, { "id": "EE-P40-Q029", "src": "Ejecutiva P40 (Jurispol)", "n": 29, "e": "Conforme a lo tipificado en el artículo 30 del Código Penal, ¿quiénes NO responderán criminalmente en los delitos que se cometan utilizando medios o soportes de difusión mecánicos?", "o": ["Ni los cómplices ni quienes los hubieren favorecido personal o realmente.", "Los que cooperen a su ejecución con un acto sin el cual no se habría efectuado.", "Ambas son correctas."], "c": 0, "d": "facil", "t": 26, "x": "Artículo 30 Código Penal:1. En los delitos que se cometan utilizando medios o soportes de difusión mecánicos no responderán criminalmente ni los cómplices ni quienes los hubieren favorecido personal o realmente." }, { "id": "EE-P40-Q030", "src": "Ejecutiva P40 (Jurispol)", "n": 30, "e": "Un extranjero solicitante de protección internacional en España al que se le ha concedido la estancia en un centro de acogida de refugiados (CAR), ¿cuál es el plazo máximo, como norma general, que puede permanecer en este centro mientras se resuelve su solicitud?", "o": ["6 meses.", "3 meses.", "1 mes."], "c": 0, "d": "media", "t": 17, "x": "Artículo 15 de la Resolución 6 d ejulio de 1988 - La duración de estancia en los CAR (Centros de Acogida de Refugiados) será máxima de 6 meses, pudiendo tener una prórroga por una sola vez." }, { "id": "EE-P40-Q031", "src": "Ejecutiva P40 (Jurispol)", "n": 31, "e": "Conforme a lo estipulado en el artículo 23 de la Ley 40/2015, de Régimen Jurídico del Sector Público, ¿cuál NO es un motivo de abstención para intervenir en un procedimiento administrativo?:", "o": ["Haber intervenido como perito o como testigo en el procedimiento de que se trate.", "Tener un vínculo de parentesco de afinidad dentro del cuarto grado o de consanguinidad dentro del segundo.", "Ser administrador de una sociedad o entidad interesada."], "c": 1, "d": "dificil", "t": 10, "x": "Artículo 23 LRJSP. 2. Son motivos de abstención los siguientes: b) Tener un vínculo matrimonial o situación de hecho asimilable y el parentesco de consanguinidad dentro del cuarto grado o de afinidad dentro del segundo. Como puede apreciarse, los grados son incorrectos (consanguinidad es cuarto grado y afinidad segundo grado" }, { "id": "EE-P40-Q032", "src": "Ejecutiva P40 (Jurispol)", "n": 32, "e": "Respecto del delito de tortura, recogido en el artículo 174 del Código Penal, ¿quién puede ser sujeto activo?:", "o": ["Cualquier persona.", "La autoridad o funcionario público.", "Ambas son correctas."], "c": 1, "d": "facil", "t": 35, "x": "Artículo 174 del Código Penal 1. Comete tortura la autoridad o funcionario público que, abusando de su cargo, y con el fin de obtener una confesión o información de cualquier persona o de castigarla por cualquier hecho que haya cometido o se sospeche que ha cometido, o por cualquier razón basada en algún tipo de discriminación, la sometiere a condiciones o procedimientos que por su naturaleza, duración u otras circunstancias, le supongan sufrimientos físicos o mentales, la supresión o disminución de sus facultades de conocimiento, discernimiento o decisión o que, de cualquier otro modo, atenten contra su integridad moral. El culpable de tortura será castigado con la pena de prisión de dos a seis años si el atentado fuera grave, y de prisión de uno a tres años si no lo es. Además de las penas señaladas se impondrá, en todo caso, la pena de inhabilitación absoluta de ocho a 12 años. 2. En las mismas penas incurrirán, respectivamente, la autoridad o funcionario de instituciones penitenciarias o de centros de protección o corrección de menores que cometiere, respecto de detenidos, internos o presos, los actos a que se refiere el apartado anterior." }, { "id": "EE-P40-Q033", "src": "Ejecutiva P40 (Jurispol)", "n": 33, "e": "En relación con la organización territorial del Estado dispuesta en la Constitución española, ¿cuál es la afirmación correcta respecto al municipio?", "o": ["Los elementos que conforman el municipio son el territorio, la población y la organización.", "El gobierno y administración de los municipios corresponde a los alcaldes y al Pleno.", "El alcalde será siempre elegido por los vecinos del municipio mediante sufragio universal, igual, libre, indirecto y secreto."], "c": 0, "d": "facil", "t": 7, "x": "140 CE, «La Constitución garantiza la autonomía de los municipios. Estos gozarán de personalidad jurídica plena. “” Los Municipios son Entidades básicas de la organización territorial del Estado y cauces inmediatos de participación ciudadana en los asuntos públicos, que institucionalizan y gestionan con autonomía los intereses propios de las correspondientes colectividades (art. 1 Ley 7/1985). Son elementos de un municipio: − El territorio: término municipal donde el Ayuntamiento ejerce su competencia. − La población, formada por los residentes dentro del municipio, que están obligados a inscribirse en el padrón municipal." }, { "id": "EE-P40-Q034", "src": "Ejecutiva P40 (Jurispol)", "n": 34, "e": "Respecto a la pena de prisión permanente regulada en el artículo 36 del Código Penal, la clasificación del condenado en el tercer grado deberá ser autorizada por el tribunal previo pronóstico individualizado y favorable de reinserción social, oídos:", "o": ["El Ministerio Fiscal y el órgano jurisdiccional sentenciador.", "El Ministerio Fiscal e Instituciones Penitenciarias.", "Instituciones Penitenciarias y el órgano jurisdiccional instructor."], "c": 1, "d": "facil", "t": 33, "x": "Artículo 36. 1. La pena de prisión permanente será revisada de conformidad con lo dispuesto en el artículo 92. La clasificación del condenado en el tercer grado deberá ser autorizada por el tribunal previo pronóstico individualizado y favorable de reinserción social, oídos el Ministerio Fiscal e Instituciones Penitenciarias, y no podrá efectuarse: a) Hasta el cumplimiento de veinte años de prisión efectiva, en el caso de que el penado lo hubiera sido por un delito del Capítulo VII del Título XXII del Libro II de este Código. b) Hasta el cumplimiento de quince años de prisión efectiva, en el resto de los casos." }, { "id": "EE-P40-Q035", "src": "Ejecutiva P40 (Jurispol)", "n": 35, "e": "¿Qué requisito debe concurrir al menos para que el estado de necesidad pueda ser considerada como una eximente de la responsabilidad criminal?", "o": ["Que el mal causado no sea mayor que el que se trate de evitar.", "Que el necesitado obre impulsado por miedo insuperable.", "Que el necesitado tenga, por su oficio o cargo, obligación de sacrificarse."], "c": 0, "d": "facil", "t": 29, "x": "El estado de necesidad se recoge en el art. 20,5 del Código Penal. El mismo exige para su apreciación que el mal causado no sea mayor que el que se trata de evitar. De esta forma, si el mal causado es menor hablaremos de un estado de necesidad justificante, y si el mal causado es igual, estaremos ante un supuesto de estado de necesidad exculpante." }, { "id": "EE-P40-Q036", "src": "Ejecutiva P40 (Jurispol)", "n": 36, "e": "El “Procedimiento integral de la detención policial”, descrito en la Instrucción 10/2025, de la Secretaría de Estado de Seguridad, indica que la persona detenida tiene derecho a comunicarse telefónicamente con un tercero de su elección. ¿Cuál de las siguientes opciones es la correcta respecto a este derecho?:", "o": ["La llamada tendrá una duración mínima de cinco minutos.", "La persona detenida podrá efectuar la llamada por sí misma y en un lugar reservado sin la presencia de agentes de las Fuerzas y Cuerpos de Seguridad del Estado.", "La persona detenida deberá identificar al interlocutor, su lugar de residencia y manifestar el número de teléfono de la persona con quien quiera comunicarse."], "c": 2, "d": "media", "t": 48, "x": "INSTRUCCIÓN NÚM. 10/2025 DE LA SECRETARIA DE ESTADO DE SEGURIDAD POR EL QUE SE ACTUALIZA EL “PROCEDIMIENTO INTEGRAL DE LA DETENCIÓN POLICIAL”. Esta comunicación se llevará a cabo en presencia de una o un agente de las FCSE, facilitándole el uso de un teléfono oficial de la dependencia policial. La llamada será efectuada por la o el agente de las FCSE, quien comunicará al interlocutor desde dónde se realiza la llamada, la identidad de la persona que desea comunicarse con él o ella y le preguntará si desea atender la llamada durante la cual estará presente la o el agente policial. La llamada tendrá una duración máxima de cinco minutos." }, { "id": "EE-P40-Q037", "src": "Ejecutiva P40 (Jurispol)", "n": 37, "e": "De acuerdo con García, Gutiérrez y Carriedo (2003), en el contexto de la teoría Piagetiana, ¿cómo se denomina el proceso por el que el individuo obtiene conocimiento a partir de su experiencia directa con los objetos?:", "o": ["Abstracción simple.", "Abstracción reflexiva.", "Abstracción lógica."], "c": 0, "d": "dificil", "t": 60, "x": "Según García, Gutiérrez y Carriedo (2003), dentro de la teoría piagetiana, la abstracción simple es el proceso mediante el cual el individuo obtiene conocimiento a partir de la experiencia directa con los objetos, es decir, a través de la percepción y manipulación de los mismos. En ese mismo marco, la abstracción reflexiva (o reflexionante) es el proceso por el que el sujeto construye conocimiento a partir de la coordinación y reflexión sobre sus propias acciones/operaciones al interactuar con los objetos: aquí la fuente no está “en el objeto”, sino en el sujeto (por ejemplo, el concepto de número no se “ve” en los objetos, sino que se construye al reflexionar sobre las coordinaciones realizadas)." }, { "id": "EE-P40-Q038", "src": "Ejecutiva P40 (Jurispol)", "n": 38, "e": "Conforme a lo establecido en la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, ¿a qué edad puede una persona dar consentimiento para el tratamiento de sus datos personales?:", "o": ["12 años.", "14 años.", "16 años."], "c": 1, "d": "facil", "t": 20, "x": "Según el artículo 7 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales (LOPDGDD): “”El tratamiento de los datos personales de un menor de edad fundado en el consentimiento solo será lícito cuando sea mayor de catorce años.””" }, { "id": "EE-P40-Q039", "src": "Ejecutiva P40 (Jurispol)", "n": 39, "e": "¿En qué supuesto se agravará la pena en los delitos de falso testimonio?:", "o": ["Si el falso testimonio se diera en contra del reo en causa criminal por delito.", "Si es cometido por un perito que, faltando sustancialmente a la verdad, la altere con reticencias, inexactitudes o silenciando hechos o datos relevantes que le fueran conocidos.", "Ninguna es correcta."], "c": 0, "d": "facil", "t": 41, "x": "Estamos ante el 458.2 del Código Penal, castigándose con prisión de 1 a 3 años y multa de 6 a 12 meses." }, { "id": "EE-P40-Q040", "src": "Ejecutiva P40 (Jurispol)", "n": 40, "e": "Según lo dispuesto en el artículo 276 de la Ley de Enjuiciamiento Criminal, ¿cuál es el plazo del que dispone un heredero para sostener una querella presentada por un familiar fallecido?", "o": ["10 días siguientes a la notificación del auto en el que el Juez o el Tribunal lo hubiera acordado.", "15 días desde el fallecimiento del familiar.", "30 días siguientes a la citación que le da conocimiento de la querella."], "c": 2, "d": "dificil", "t": 47, "x": "276 LECRIM Se tendrá también por abandonada la querella cuando, por muerte o por haberse incapacitado el querellante para continuar la acción, no compareciere ninguno de sus herederos o representantes legales a sostenerla dentro de los treinta días siguientes a la citación que al efecto se les hará dándoles conocimiento de la querella." }, { "id": "EE-P40-Q041", "src": "Ejecutiva P40 (Jurispol)", "n": 41, "e": "¿Cuál de los siguientes delitos NO se encuentra recogido entre los delitos contra la Administración de Justicia del Título XX del Código Penal?:", "o": ["El falso testimonio.", "El de desobediencia y denegación de auxilio.", "El quebrantamiento de condena."], "c": 1, "d": "media", "t": 42, "x": "En este caso la opcion BRAVO, se incardina en los delitos contra la Administración Pública, Títutlo XIX." }, { "id": "EE-P40-Q042", "src": "Ejecutiva P40 (Jurispol)", "n": 42, "e": "A tenor de lo dispuesto en la Ley 27/2014, del Impuesto de Sociedades, serán contribuyentes del Impuesto:", "o": ["Las sociedades civiles que no tengan objeto mercantil con residencia en territorio nacional.", "Las uniones temporales de empresas (UTE) tengan o no residencia en territorio nacional.", "Las personas jurídicas, cuando estas tengan su residencia en territorio nacional."], "c": 2, "d": "facil", "t": 72, "x": "Según el artículo 7 de la Ley 27/2014, de 27 de noviembre, del Impuesto sobre Sociedades, son contribuyentes del impuesto, entre otros: “”Las personas jurídicas, excluidas las sociedades civiles que no tengan objeto mercantil, cuando tengan su residencia en territorio español.”””" }, { "id": "EE-P40-Q043", "src": "Ejecutiva P40 (Jurispol)", "n": 43, "e": "¿Qué competencia tiene atribuida el Área de asistencia letrada dependiente de la Subdirección General de Recursos Humanos y Formación?:", "o": ["La tramitación de los recursos administrativos en materia de personal.", "La defensa legal de los miembros de la Policía Nacional por actuaciones derivadas de la prestación del servicio.", "La asistencia jurídica de los miembros de la Policía Nacional en activo exclusivamente."], "c": 1, "d": "dificil", "t": 13, "x": "Orden INT/859/2023, de 21 de julio, por la que se desarrolla la estructura orgánica y funciones de los servicios centrales y territoriales de la Dirección General de la Policía. 2.º El Área de Asistencia Letrada. Le compete la defensa legal del funcionariado de la Dirección General de la Policía por actuaciones derivadas de la prestación del servicio" }, { "id": "EE-P40-Q044", "src": "Ejecutiva P40 (Jurispol)", "n": 44, "e": "¿En qué Título del Código Penal están tipificados los delitos contra las relaciones familiares?:", "o": ["XII.", "XI.", "X."], "c": 0, "d": "facil", "t": 37, "x": "TÍTULO XII. Delitos contra las relaciones familiares" }, { "id": "EE-P40-Q045", "src": "Ejecutiva P40 (Jurispol)", "n": 45, "e": "Para descartar el dolo eventual y considerar que se da imprudencia consciente respecto de un determinado resultado:", "o": ["Basta con que el autor desee que ese resultado no se produzca, con independencia de que no se atribuya ninguna capacidad de dominio del curso causal para evitarlo.", "Es necesario que el autor, pese a concebir dicho resultado como posible, confíe en que no se va a producir porque se atribuye un dominio del curso causal que le permitirá evitarlo.", "Es necesario que el resultado no sea la meta directa que persigue el autor, pero sí una consecuencia necesariamente unida a dicho objetivo."], "c": 1, "d": "media", "t": 27, "x": "La jurisprudencia ha construido dos tesis principales que marcan la diferencia entre la culpa consciente y el dolo eventual (Sentencias del Tribunal Supremo 41/2014 de 29 de enero ó 419/2015 de 12 de junio, entre otras). En el dolo eventual, el autor se representa como probable la producción del resultado dañoso protegido por la norma penal, pero continúa adelante sin importarle o no la causación del mismo, aceptando de todos modos tal resultado representado en la mente del autor. En la culpa consciente, en cambio, no se quiere causar la lesión aunque también se advierte su posibilidad y, pese a ello, se actúa. Es decir, se advierte el peligro, pero se confía que no se va a producir el resultado." }, { "id": "EE-P40-Q046", "src": "Ejecutiva P40 (Jurispol)", "n": 46, "e": "¿Cuál es la afirmación correcta sobre la adscripción de Unidades de la Policía Nacional a una Comunidad Autónoma?", "o": ["Dichas Unidades actuarán siempre bajo el mando de la Jefatura Superior de Policía respectiva.", "La adscripción deberá afectar a Unidades operativas completas y no a miembros individuales del citado Cuerpo.", "Las Unidades adscritas dependerán, orgánicamente, de las Autoridades de la Comunidad Autónoma, y funcionalmente del Ministerio del Interior."], "c": 1, "d": "facil", "t": 14, "x": "El Real Decreto 221/1991 establece que la adscripción de Unidades a las Comunidades Autonomas debe ser por unidades completas y nunca por miembros individuales, añadiendo que estos miembros serán elegidos de manera común por el concurso específico de méritos." }, { "id": "EE-P40-Q047", "src": "Ejecutiva P40 (Jurispol)", "n": 47, "e": "Como exponen, entre otros autores reconocidos, Chiquillo, Amaya y Curiel (2023), ¿cuál es el modelo de liderazgo que se enfoca en la capacidad del líder para inspirar y motivar a los subordinados a través de su visión y valores?", "o": ["Situacional.", "Transformacional.", "Carismático."], "c": 1, "d": "media", "t": 65, "x": "El liderazgo transformacional se caracteriza por la capacidad del líder para inspirar y motivar a los subordinados mediante una visión compartida, valores sólidos y el desarrollo personal y profesional de sus seguidores. Este modelo busca generar cambios positivos y un alto compromiso, tal como señalan autores como Chiquillo, Amaya y Curiel (2023)." }, { "id": "EE-P40-Q048", "src": "Ejecutiva P40 (Jurispol)", "n": 48, "e": "¿Quién tiene la obligación de promover e instar la declaración de ausencia legal de una persona según lo estipulado en el Código Civil?", "o": ["El Ministerio Fiscal únicamente si es en virtud de una denuncia.", "Los parientes consanguíneos o colaterales hasta el tercer grado.", "El cónyuge del ausente no separado legalmente."], "c": 2, "d": "facil", "t": 2, "x": "Artículo 182 del Código Civil Tiene la obligación de promover e instar la declaración de ausencia legal, sin orden de preferencia: Primero. El cónyuge del ausente no separado legalmente. Segundo. Los parientes consanguíneos hasta el cuarto grado. Tercero. El Ministerio fiscal de oficio o a virtud de denuncia. Podrá, también, pedir dicha declaración cualquier persona que racionalmente estime tener sobre los bienes del desaparecido algún derecho ejercitable en vida del mismo o dependiente de su muerte." }, { "id": "EE-P40-Q049", "src": "Ejecutiva P40 (Jurispol)", "n": 49, "e": "¿Cómo se denomina el registro regional de internet que se encarga de la atribución de direcciones IP en Europa, Oriente Medio y Asia Central?", "o": ["RIPE NCC.", "ARIN.", "LACNIC."], "c": 0, "d": "facil", "t": 73, "x": "Pregunta fácil explicada en clase y en temario. Se trata de RIR (Registros Regionales de Internet) que supervisan la asignación y el registro de recursos de números de Internet dentro de una Región particular del mundo, reconocidos por la IANA. RIPE Europa, Oriente Medio y Asia ARIN Norte América LACNIC Latino América y Caribe APNIC Asia y Oceanía AFRINIC África" }, { "id": "EE-P40-Q050", "src": "Ejecutiva P40 (Jurispol)", "n": 50, "e": "¿En qué condiciones, entre otras, pueden utilizar dispositivos de toma de imágenes y sonido de carácter móvil las Fuerzas y Cuerpos de Seguridad?", "o": ["La toma de imagen y sonido ha de ser conjunta y supeditada, en todo caso, cuando concurra un peligro o evento concreto.", "En caso de urgencia, será autorizada por el responsable operativo de las Fuerzas y Cuerpos de Seguridad y comunicada en el plazo máximo de 48 horas a la Delegación del Gobierno.", "Las autorizaciones podrán ser concedidas con carácter indefinido o permanente."], "c": 0, "d": "media", "t": 20, "x": "En este caso, la orgánica 4/1997 establece que la comunicación a Delegación del Gobierno se hace en plazo de 72 horas y no en plazo de 48 horas, como indica la opción BRAVO. Por otro lado, la autorización nunca será permanente como indica la opción CHARLIE." }, { "id": "EE-P40-Q051", "src": "Ejecutiva P40 (Jurispol)", "n": 51, "e": "Un conductor ignora una señal de tráfico en un paso de peatones y se estrella contra una moto que circulaba en el otro sentido, falleciendo los dos ocupantes de la motocicleta y resultando lesionado de gravedad un peatón que cruzaba en ese momento. Este comportamiento ha ocasionado dos muertes y una grave lesión.", "o": ["Se establece un concurso ideal de delitos.", "Se trata de un concurso real.", "Hay un delito continuado en concurso medial."], "c": 0, "d": "facil", "t": 34, "x": "En este caso tenemos una sola acción que provoca varias consecuencias penales, teniendo entonces un conc
