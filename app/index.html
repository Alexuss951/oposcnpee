                const budget = planWeekBudget(w);
                const temasHtml = w.temas.length
                    ? w.temas.map(tn => {
                        const t = TEMAS.find(x => x.n === tn); if (!t) return "";
                        const isDone = !!done[tn];
                        return `<span class="wk-tema ${isDone ? "done" : ""}" data-tema="${tn}" title="${escapeHtml(t.t)}">
            <span class="pill ${t.b}">${t.n}</span>${escapeHtml(t.t.length > 38 ? t.t.slice(0, 36) + "…" : t.t)}
          </span>`;
                    }).join("")
                    : `<span class="wk-note">${w.repaso ? "Semana de repaso · 0 temas nuevos" : ""}</span>`;
                const budgetLine = w.temas.length
                    ? `<div class="wk-min">⏱️ ${Math.round(budget.total / 60 * 10) / 10} h estimadas (A:${budget.byB.A} · B:${budget.byB.B} · C:${budget.byB.C} min)</div>`
                    : "";
                html += `
      <div class="plan-week ${state}">
        <div class="wk-head">
          <div>
            <div class="wk-title">W${w.w} · ${escapeHtml(w.title)}</div>
            <div class="wk-date">${planDateRangeLabel(w)}</div>
          </div>
          ${badge}
        </div>
        <div class="wk-note">${escapeHtml(w.note)}</div>
        <div class="wk-temas">${temasHtml}</div>
        ${budgetLine}
      </div>`;
            });
            body.innerHTML = html;

            body.querySelectorAll(".wk-tema[data-tema]").forEach(el => {
                const n = parseInt(el.dataset.tema, 10);
                let pressTimer = null;
                const toggle = (e) => { e.preventDefault(); e.stopPropagation(); togglePlanDone(n); renderPlanWeeks(); };
                el.addEventListener("click", e => {
                    if (e.shiftKey) { toggle(e); return; }
                    showView("temario"); openTema(n);
                });
                el.addEventListener("contextmenu", toggle);
                el.addEventListener("touchstart", () => {
                    pressTimer = setTimeout(() => { togglePlanDone(n); renderPlanWeeks(); pressTimer = null; }, 600);
                }, { passive: true });
                el.addEventListener("touchend", () => { if (pressTimer) clearTimeout(pressTimer); });
                el.addEventListener("touchmove", () => { if (pressTimer) clearTimeout(pressTimer); });
            });

            const cur = body.querySelector(".plan-week.current");
            if (cur) setTimeout(() => cur.scrollIntoView({ behavior: "smooth", block: "start" }), 100);
        }

        // ===== Sub-tab: Why (rationale, mirrors plan-estudio.md) =====
        function renderPlanWhy() {
            const body = $("planTabBody"); if (!body) return;
            body.innerHTML = `
    <div class="why-prose">
      <h3>¿Por qué este plan y no otro?</h3>
      <p>No estás siguiendo un orden de 1 a 81 ni un calendario inventado. Cada semana está colocada según <b>6 reglas con base científica</b>. Aquí tienes los argumentos para entender qué haces y por qué — para que adoptes el plan porque <i>tiene sentido</i>, no porque te lo digan.</p>

      <h3>1. Las 6 reglas que mueven el calendario</h3>
      <ol>
        <li><b>Andamiaje primero.</b> Constitución → Admin/AGE → LOFCS son el esqueleto donde cuelga el resto. Sin ellos, lo demás flota. Por eso ocupan las semanas 1-4.</li>
        <li><b>Interleaving (mezclar bloques).</b> Nunca 6 semanas seguidas de Penal. Cada semana mete Bloque A + B (+ C cuando toca). El cerebro discrimina mejor entre tipos de contenido cuando los alterna, y olvida menos. <span class="muted">(Rohrer & Taylor, 2007.)</span></li>
        <li><b>Cadenas temáticas.</b> Temas que se citan entre sí van juntos. Ejemplo: <code>14 LOFCS → 19 LSC → 18 Seguridad Privada → 44 atentados a la autoridad</code>.</li>
        <li><b>Lo abstracto en cabeza fresca.</b> Penal Parte General y Procesal — los más densos conceptualmente — van por la mañana (09:00-12:10). Lo concreto (delitos, extranjería, armas, tráfico) por la tarde.</li>
        <li><b>Psicología pronto (semana 1).</b> Los temas 57-58 (atención y memoria) literalmente te enseñan a estudiar mejor. Aplícalos desde el día 1 al resto del temario.</li>
        <li><b>Frecuencia ↔ repaso.</b> Lo que más cae en el examen (LOFCS, LSC, Procesal Penal, Parte Especial CP) lleva más repasos espaciados.</li>
      </ol>

      <h3>2. Las 6 fases</h3>
      <table>
        <thead><tr><th>Fase</th><th>Semanas</th><th>Foco</th><th>Tipo</th></tr></thead>
        <tbody>
          <tr><td>1. Cimientos</td><td>W1-4</td><td>CE, UE, Admin, LOFCS, LSC, DDHH, psico base</td><td>Avance puro</td></tr>
          <tr><td>2. Penal Gen + Soc</td><td>W5-9</td><td>Civil, Extranjería, CP arts. 1-180 + Sociales</td><td>Avance + 1 simulacro/sem</td></tr>
          <tr><td>3. Penal Esp + Procesal + Téc</td><td>W10-14</td><td>CP arts. 181-606 + LECrim + estadística/SO/redes</td><td>Avance + 2 simulacros/sem</td></tr>
          <tr><td>4. Cierre Bloque C</td><td>W15</td><td>Contabilidad, ciberseguridad, tráfico, armas</td><td>Último avance</td></tr>
          <tr><td>5. Repaso intensivo</td><td>W16-18</td><td>0 temas nuevos. Solo simulacros + fallos + SRS</td><td>Solo repaso</td></tr>
          <tr><td>6. Pulido</td><td>W19-21</td><td>Ligero, físico, sueño</td><td>Bajar intensidad</td></tr>
        </tbody>
      </table>

      <h3>3. ¿Por qué A:40, B:60, C:90 min/tema?</h3>
      <p>No todos los temas pesan lo mismo <i>para ti</i>. El plan aplica esta asimetría en el cálculo de horas por semana del calendario:</p>
      <table>
        <thead><tr><th>Bloque</th><th>Min/tema</th><th>Justificación</th></tr></thead>
        <tbody>
          <tr><td><b>A</b> Jurídicas (T1-53)</td><td>40</td><td>Ya manejas la dogmática por COIP/COGEP. El esfuerzo es memorizar literalidad española (artículos, plazos), no entender conceptos.</td></tr>
          <tr><td><b>B</b> Sociales (T54-68)</td><td>60</td><td>Conceptos nuevos (condicionamiento operante, validez vs fiabilidad, memoria episódica). Hay que asimilar el mecanismo antes de memorizar definiciones.</td></tr>
          <tr><td><b>C</b> Técnico-científicas (T69-81)</td><td>90</td><td>Sin base previa (redes, SO, ciber, contabilidad, armas). Necesitas glosario + analogía + ejemplo + esquema antes de memorizar.</td></tr>
        </tbody>
      </table>

      <h3>4. La plantilla del día (L-V)</h3>
      <table>
        <thead><tr><th>Hora</th><th>Bloque</th><th>Por qué a esta hora</th></tr></thead>
        <tbody>
          <tr><td>06:30-07:30</td><td><b>Físico</b> (rotación L:agilidad / M:barra / X:agilidad / J:barra / V:1000 m)</td><td>Lo primero del día. Adherencia máxima (nada lo interrumpe), libera cortisol matutino, y el resto del día tienes la cabeza despejada. Las pruebas físicas son eliminatorias.</td></tr>
          <tr><td>07:30-09:00</td><td><b>Ducha + desayuno</b></td><td>Proteína + carbo lento para reponer tras el físico. Cafeína 90-120 min después de despertar (Huberman) = ventana óptima.</td></tr>
          <tr><td>09:00-10:30</td><td><b>Estudio profundo (1.ª mitad)</b> · tema abstracto (1 h 30)</td><td>Mente fresca y caliente del físico = peak para penal general, procesal, derechos, redes.</td></tr>
          <tr><td>10:30-10:40</td><td><b>Snack movimiento · 10 min</b></td><td>Cuello, hombros, escaleras, agua. <b>No te sientes más de 90 min seguidos.</b> Estudios de ergonomía: postura estática &gt; 90 min dispara dolor lumbar y caída de atención.</td></tr>
          <tr><td>10:40-12:10</td><td><b>Estudio profundo (2.ª mitad)</b> (1 h 30)</td><td>Cierre del bloque exigente antes de comer.</td></tr>
          <tr><td>12:10-12:30</td><td>Pausa larga · aire libre</td><td>Mirar lejos (regla 20/20/20 ocular). Caminar.</td></tr>
          <tr><td>12:30-14:00</td><td>Comida + descanso</td><td>Sin pantallas. Siesta corta opcional (≤ 20 min).</td></tr>
          <tr><td>14:00-15:15</td><td><b>Estudio aplicado (1.ª mitad)</b> · tema concreto (1 h 15)</td><td>Post-comida = peor para abstracto, suficiente para delitos concretos, extranjería, armas.</td></tr>
          <tr><td>15:15-15:25</td><td><b>Snack movimiento · 10 min</b></td><td>Sentadillas suaves + estiramiento de psoas y cadera (clave si estudias sentada todo el día). Hidratar.</td></tr>
          <tr><td>15:25-16:40</td><td><b>Estudio aplicado (2.ª mitad)</b> (1 h 15)</td><td>Cierre del bloque concreto.</td></tr>
          <tr><td>16:40-17:00</td><td>Pausa</td><td>Caminar, hidratar, mirar lejos.</td></tr>
          <tr><td>17:00-18:00</td><td><b>SRS + 30 preguntas tipo test</b> (1 h)</td><td>Repaso espaciado (Ebbinghaus) + práctica de recuperación (<i>testing effect</i>): hace más por la memoria que releer.</td></tr>
        </tbody>
      </table>
      <p><b>Sábado</b> (5 h estudio + 1 h físico): físico 06:30-07:30, repaso 09:00-10:00, snack 10:00-10:10, simulacro 10:10-11:10, tiempo personal, comida, reescritura de esquemas 14:30-17:10 (con snack en medio), test 17:10-18:00.<br>
      <b>Domingo</b>: descanso total. Nada de temario. Vida personal, deporte ligero, dormir.</p>
      <p><b>Snacks de movimiento — por qué.</b> Sentarse seguido más de 90 min hace dos cosas malas: (1) baja la oxigenación cerebral y la atención se desploma — los bloques de estudio largos rinden menos por hora que dos cortos con pausa, y (2) acumula tensión en lumbar, cervical y psoas, que es lo que te empieza a doler la 3.ª semana de oposición seria y termina pasando factura. Cada snack son 10 min de pie: 2 min movilidad cervical y hombros, 3-4 min subir/bajar escaleras o sentadillas suaves, 2 min estirar caderas, hidratación. <b>No es opcional.</b></p>

      <h3>5. Atomic Habits (James Clear) aplicado a esto</h3>
      <div class="quote">"What gets measured gets managed." — Peter Drucker, citado por James Clear en <i>Atomic Habits</i>.</div>
      <p>El tracker de la pestaña <b>🏠 Inicio</b> existe por dos razones medibles:</p>
      <ul>
        <li><b>Ver el contador subir</b> crea el hábito (refuerzo inmediato cada vez que sumas minutos).</li>
        <li><b>Ver la cadena de días</b> lo mantiene. Romper la cadena pesa psicológicamente más que la motivación del día.</li>
      </ul>
      <p><b>Regla práctica:</b> objetivo mínimo 5 h registradas L-V, 2 h sáb. Si un día caes a 0, no se rompe nada. Pero <b>nunca dos días seguidos a cero</b> — ese es el único límite duro.</p>

      <h3>6. Por qué la fase 5 (W16-18) no añade temas</h3>
      <p>En las últimas 6 semanas del plan, el avance se detiene. Suena contraintuitivo, pero es lo correcto: a estas alturas <b>el problema no es lo que no sabes, es lo que se te olvida</b>. Cada hora invertida en simulacros + revisión de fallos rinde más que una hora de tema nuevo. La curva del olvido se combate repitiendo, no añadiendo.</p>

      <h3>7. Por qué la fase 6 (W19-21) baja intensidad</h3>
      <p>Tres semanas antes del examen, el rendimiento depende más del <b>sueño y la frescura mental</b> que de horas extra. Llegar exhausto al examen ha eliminado a más opositores que llegar con un 5% menos de temario.</p>

      <h3>8. Cómo usar el calendario de la app</h3>
      <ul>
        <li>Pestaña <b>📆 Calendario</b>: mueves mes a mes. Cada día está coloreado por la fase a la que pertenece. Pulsa un día para ver qué toca exactamente: bloque temporal, temas de la semana, plantilla horaria.</li>
        <li>Pestaña <b>📋 Semanas</b>: vista lineal de las 21 semanas con todos los temas. Tap a un chip de tema = abre el resumen. Long-press / click derecho / shift-click = marcar como hecho.</li>
        <li>Pestaña <b>📖 Por qué</b>: lo que estás leyendo ahora. Vuelve aquí cuando dudes de si una semana tiene sentido o de por qué hoy te toca lo que te toca.</li>
      </ul>

      <p class="muted">Versión completa, fuente humana del plan: <code>plan-estudio.md</code> en la raíz del repo.</p>
    </div>`;
        }

        // ====== TIME TRACKER (Atomic Habits style) ======
        // Stored as { "YYYY-MM-DD": minutes }
        function getTimeLog() { return lsGet("timelog", {}); }
        function addStudyMin(min) {
            const log = getTimeLog();
            const k = getToday().key;
            log[k] = Math.max(0, (log[k] || 0) + min);
            if (log[k] === 0) delete log[k];
            lsSet("timelog", log);
        }
        function todayMin() { return getTimeLog()[getToday().key] || 0; }
        function fmtMin(m) {
            if (m < 60) return m + " min";
            const h = Math.floor(m / 60), r = m % 60;
            return r ? `${h}h ${r}m` : `${h}h`;
        }
        function last7Days() {
            // Returns array of {key, label, min} oldest → newest, today last.
            const log = getTimeLog();
            const out = [];
            const days = ["D", "L", "M", "X", "J", "V", "S"];
            const now = new Date();
            for (let i = 6; i >= 0; i--) {
                const d = new Date(now); d.setDate(now.getDate() - i);
                const k = d.toISOString().slice(0, 10);
                out.push({ key: k, label: days[d.getDay()], min: log[k] || 0, isToday: i === 0 });
            }
            return out;
        }
        function weekTotalMin() { return last7Days().reduce((a, b) => a + b.min, 0); }

        function renderTracker() {
            const host = $("trackerHost"); if (!host) return;
            const today = todayMin();
            const days = last7Days();
            const week = weekTotalMin();
            // Use highest of (240, max of last 7) as bar scale, so visual stays meaningful.
            const peak = Math.max(240, ...days.map(d => d.min));
            const barsHtml = days.map(d => `
        <div>
          <div class="day">${d.label}</div>
          <div class="bar ${d.isToday ? "today" : ""}">
            ${d.min > 0 ? `<div class="fill" style="height:${Math.round((d.min / peak) * 100)}%"></div><span class="mins">${d.min}</span>` : ""}
          </div>
        </div>`).join("");
            host.innerHTML = `
    <div class="tracker">
      <div class="head">
        <span class="lbl">Tiempo de hoy</span>
        <span class="now">${fmtMin(today)}<small>· esta semana ${fmtMin(week)}</small></span>
      </div>
      <div class="add">
        <button data-add="15">+15</button>
        <button data-add="30">+30</button>
        <button data-add="45">+45</button>
        <button data-add="60">+60</button>
        <button data-add="90">+90</button>
        <button class="minus" data-add="-15" title="Restar 15 min">−15</button>
      </div>
      <div class="chain">${barsHtml}</div>
      <div class="totals">
        <span>Meta L-V: <b>5h/día</b></span>
        <span>Regla: nunca <b>2 días seguidos a 0</b></span>
      </div>
    </div>`;
            host.querySelectorAll("button[data-add]").forEach(b => {
                b.onclick = () => { addStudyMin(parseInt(b.dataset.add, 10)); renderTracker(); };
            });
        }

        // ====== BOOT ======
        applyTheme(lsGet("theme", "dark"));
        renderStreak();
        renderList();
        renderHome();

        const hash = location.hash;
        const mTema = hash.match(/^#tema-(\d+)$/);
        if (mTema) {
            showView("temario");
            openTema(parseInt(mTema[1], 10));
        } else if (hash === "#examenes") {
            showView("examenes");
        } else if (hash === "#temario") {
            showView("temario");
        } else if (hash === "#plan") {
            showView("plan");
        } else {
            showView("inicio");
        }
    </script>
