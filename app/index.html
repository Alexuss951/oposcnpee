l de la Dirección General de la Policía se encuentra la Comisaría Especial del Senado, que se enmarca dentro de la:", "o": ["Comisaría General de Seguridad Ciudadana.", "División de Operaciones y Transformación Digital.", "División de Personal.  10 PROMOCIÓN N.º 41 "], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q052", "src": "Básica P41 (MAD)", "n": 52, "e": "Según dispone el artículo 10 de la Ley Orgánica 4/2010, de 20 de mayo, del Régimen disci- plinario del Cuerpo Nacional de Policía, la sanción de traslado forzoso puede imponerse:", "o": ["Sólo por la comisión de una falta muy grave.", "Por la comisión de una falta grave o muy grave, en función de las circunstancias concurrentes.", "Sólo por la comisión de una falta grave."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q053", "src": "Básica P41 (MAD)", "n": 53, "e": "¿Qué país forma parte de la Unión Europea?", "o": ["Irlanda.", "Turquía.", "Escocia."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q054", "src": "Básica P41 (MAD)", "n": 54, "e": "Se impondrán las mismas penas del delito de atentado a quienes acometan, empleen vio- lencia o intimiden gravemente a:", "o": ["Personal de seguridad privada, debidamente identificado, que desarrolle actividades de seguri- dad privada en cooperación y bajo el mando de las Fuerzas y Cuerpos de Seguridad.", "Bomberos que estuvieran interviniendo con ocasión de un siniestro, calamidad pública o situa- ción de emergencia, con la finalidad de atentar contra su integridad física.", "Miembros del persona sanitario que estuvieran interviniendo con ocasión de un siniestro, cala- midad pública o situación de emergencia, con la finalizad de atenta contra su integridad física o moral."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q055", "src": "Básica P41 (MAD)", "n": 55, "e": "El Foro Social Mundial es un evento internacional que busca promover el diálogo y la re- flexión crítica sobre las alternativas al modelo económico neoliberal. Desde su primera edición, ha reunido movimientos sociales y organizaciones de todo el Mundo. ¿Dónde y el qué año se celebró el primer Foro Social Mundial?", "o": ["Bombay, India (2004).", "Porto Alegre, Brasil (2001).", "Salvador, Brasil (2018)."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q056", "src": "Básica P41 (MAD)", "n": 56, "e": "En virtud de lo establecido en el artículo 23 Ley 12/2009, de 30 de octubre, reguladora del derecho de asilo y la protección subsidiaria, el órgano competente para la tramitación de las solicitudes de protección internacional es:", "o": ["La Oficina de Protección Internacional.", "La Oficina de Asilo y Refugio.", "La Oficina de Extranjería."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q057", "src": "Básica P41 (MAD)", "n": 57, "e": "Visitar los lugares donde se encuentren o pudieran encontrarse personas privadas de su libertad en cada Estado Parte y hacer recomendaciones a los Estados Partes en cuanto a la pro- tección de las personas privadas de su libertad contra la tortura y otros tratos o penas crueles, inhumanos o degradantes, constituye un mandato de:", "o": ["El Subcomité para la Prevención de la Tortura.", "Amnistía Internacional.", "El Defensor del Pueblo."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q058", "src": "Básica P41 (MAD)", "n": 58, "e": "El Sr. Pérez, Oficial de Policía, destinado en un puesto de seguridad, no va provisto en el acto de servicio con el arma reglamentaria. Transcurridas varias horas realizando el servicio, el Comisario, Jefe de la Dependencia, se percata de la situación, no mediando autorización alguna para no portar el arma. Según la Ley Orgánica 4/2010 de 20 de mayo, del Régimen Disciplinario del Cuerpo Nacional de Policía, ¿Qué infracción disciplinaria está cometiendo el Sr. Pérez?", "o": ["Una falta leve.", "Una falta grave.", "Una falta muy grave.  11  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q059", "src": "Básica P41 (MAD)", "n": 59, "e": "¿Qué unidad, dentro de la Comisaría General de Policía Científica, será la encargada de la realización de los informes periciales en materia de falsificación documental?", "o": ["La Unidad Central de Análisis Científicos.", "La Unidad Central de Identificación.", "La Unidad Central de Criminalística."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q060", "src": "Básica P41 (MAD)", "n": 60, "e": "¿Por quién es nombrado el Presidente del Tribunal Constitucional?", "o": ["Por mayoría del Tribunal en pleno.", "Por el Rey.", "Por el Consejo General del Poder Judicial."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q061", "src": "Básica P41 (MAD)", "n": 61, "e": "En virtud de los dispuesto en la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, la situación en la que se encuentra una persona que sea, haya sido o pudiera ser tratada, en atención a su sexo, de manera menos favorable que otra en situa- ción comparable, se considera:", "o": ["Discriminación interseccional por razón de sexo.", "Discriminación directa por razón de sexo.", "Discriminación indirecta por razón de sexo."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q062", "src": "Básica P41 (MAD)", "n": 62, "e": "El delito de estafa incardinado dentro de los delitos contra el patrimonio y contra el orden socioeconómico, constituirá un tipo agravado que será castigado con penas de prisión de uno a seis años y multa de seis a doce meses, cuando el valor de la defraudación supere la cantidad de:", "o": ["25.000 euros.", "30.000 euros.", "50.000 euros."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q063", "src": "Básica P41 (MAD)", "n": 63, "e": "Respecto al delito de lesiones, ¿Cuál de las afirmaciones que se exponen es la correcta?", "o": ["En los delitos de lesiones, si ha mediado consentimiento de la víctima menor de edad, se impon- drá la pena inferior en uno o dos grados.", "Se considerarán cometidas por imprudencia grave las lesiones causadas por el que conduzca un vehículo a motor a una velocidad superior en sesenta kilómetros por hora en vía urbana.", "La provocación, la conspiración y la proposición para cometer un delito de lesiones no está pre- vista en el código penal."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q064", "src": "Básica P41 (MAD)", "n": 64, "e": "La tenencia de armas de fuego reglamentadas, careciendo de las licencias o permisos ne- cesarios, será castigada:", "o": ["Más gravemente si se tratara de armas cortas.", "Se castigará con la misma pena, independientemente se trate de armas cortas o armas largas.", "En el caso de las armas largas, su tenencia no constituye infracción penal, sino administrativa."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q065", "src": "Básica P41 (MAD)", "n": 65, "e": "Conforme dispone el Real Decreto 865/2001, de 20 de julio, por el que se aprueba el Re- glamento de reconocimiento del estatuto de apátrida, cuando la solicitud de reconocimiento del estatuto de apátrida se inicie por el interesado, será presentada ante:", "o": ["La Oficina de Asilo y Refugio.", "La Oficina de Asilo y Refugio o las Oficinas de Extranjería.", "La Oficina de Asilo y Refugio, las Oficinas de Extranjería o Comisarías de Policía.  12 PROMOCIÓN N.º 41 "], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q066", "src": "Básica P41 (MAD)", "n": 66, "e": "¿Cuál de las siguientes frases está escrita correctamente?", "o": ["Los lugareños veneran con devoción una antigua imagen de la Virgen albergada en la hermita.", "Los investigadores descubrieron una nueva especie de planta durante la expedición del onceavo mes.", "Las reacciones químicas exotérmicas liberan energía en forma de calor, mientras que las endotér- micas absorben energía del entorno."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q067", "src": "Básica P41 (MAD)", "n": 67, "e": "Conforme regula la Orden INT/2573/2015, los vehículos celulares para el transporte de deteni- dos, presos y penados de hasta nueve plazas, incluido el conductor y escolta irán provistos de una cli- matización que permita mantener una temperatura aproximada en los distintos habitáculos entre:", "o": ["15 ºC y 25ºC.", "18 ºC y 28ºC.", "20ºC y 30ºC."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q068", "src": "Básica P41 (MAD)", "n": 68, "e": "Un varón de 21 años de edad es detectado, por dos policías que están prestando servicio, fumando cannabis a las 16.00 horas en un parque situado en el Distrito de Chamartín. Acorde con la Ley Orgánica 4/2015, de 30 de marzo, de protección de seguridad ciudadana, ¿Qué tipo de infracción constituyen tales hechos?", "o": ["Infracción leve.", "Infracción menos grave.", "Infracción grave."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q069", "src": "Básica P41 (MAD)", "n": 69, "e": "¿Cuál es una de las funciones del Consejo de Policía?", "o": ["La emisión de informes en los expedientes disciplinarios que se instruyan por faltas graves contra cualquier miembro de la Policía Nacional.", "La participación en el establecimiento de los criterios generales de la acción sindical.", "El estudio de los datos relativos al personal que pasa a las situaciones de segunda actividad y jubilación por lesiones sufridas en acto de servicio."], "c": null, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q070", "src": "Básica P41 (MAD)", "n": 70, "e": "¿Qué tipo de droga es la mescalina?", "o": ["Perturbadora / alucinógena.", "Depresora.", "Estimulante."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q071", "src": "Básica P41 (MAD)", "n": 71, "e": "Según el artículo 55 de la Ley 40/2015 de Régimen Jurídico del Sector Público, se conside- ran órganos superiores en la organización central de la Administración General del Estado:", "o": ["Los Ministros, los Secretarios de Estado y los Subsecretarios.", "Los Ministros, los Secretarios de Estado y los Directores Generales.", "Los Ministros y los Secretarios de Estado."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q072", "src": "Básica P41 (MAD)", "n": 72, "e": "Conforme figura en la Constitución Española, y concretamente en el artículo 162.1 a), es- tán legitimados para interponer el recurso de inconstitucionalidad:", "o": ["Toda persona natural o jurídica que invoque un interés legítimo, así como el Defensor del Pueblo y el Ministerio Fiscal.", "El Defensor del Pueblo, el Ministerio Fiscal así como Jueces y Magistrados.", "El Presidente del Gobierno, el Defensor del Pueblo, 50 Diputados, 50 Senadores, los órganos cole- giados ejecutivos de las Comunidades Autónomas y, en su caso, las Asambleas de las mismas.  13  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q073", "src": "Básica P41 (MAD)", "n": 73, "e": "El Defensor del Pueblo, que ejercerá funciones del Mecanismo Nacional de Prevención de la Tortura, dará cuenta ante las Cortes Generales de las gestiones realizadas, en un informe que presentará ante las mismas de forma:", "o": ["Semestral.", "Anual.", "Bianual."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q074", "src": "Básica P41 (MAD)", "n": 74, "e": "Siempre que el interesado manifieste ser esa su voluntad, ¿Cómo se adquiere la vecindad civil?", "o": ["Por residencia continuada durante un año.", "Por residencia continuada durante dos años.", "Por residencia continuada durante cinco años."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q075", "src": "Básica P41 (MAD)", "n": 75, "e": "El nacimiento determina la personalidad, pero el concebido se tiene por nacido para to- dos los efectos que le sean favorables, siempre que nazca con las condiciones que expresa el Código Civil, concretamente en su artículo 30, que dice:", "o": ["Se reputará nacido el feto que tuviere figura humana y viviere veinticuatro horas enteramente desprendido del claustro materno.", "Para los efectos civiles, sólo se reputará nacido el feto que viviere veinticuatro horas enteramente deprendido del seno materno.", "La personalidad se adquiere en el momento del nacimiento con vida, una vez producido el entero desprendimiento del seno materno."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q076", "src": "Básica P41 (MAD)", "n": 76, "e": "¿Qué organismo recogido en el RD 2/2006, de 16 de enero, por el que se establecen nor- mas sobre prevención de riesgos laborales en la actividad de los funcionarios del Cuerpo Nacio- nal de Policía tiene la función de promover iniciativas sobre métodos y procedimientos para la efectiva prevención de los riesgos, proponiendo la mejora de las condiciones o la corrección de la existentes?", "o": ["La Comisión de seguridad y salud laboral policial.", "El Comité de seguridad y salud.", "El Servicio de prevención de riesgos laborales."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q077", "src": "Básica P41 (MAD)", "n": 77, "e": "Tal y como figura en el artículo 5 del Instrumento de ratificación del Protocolo facul- tativo a la Convención contra la tortura y otros tratos o penas crueles, inhumanos o degra- dantes, ¿de cuántos miembros estará compuesto el Subcomité para la Prevención, una vez que se haya registrado la quincuagésima ratificación del presente Protocolo o adhesión a él?", "o": ["10 miembros.", "15 miembros.", "25 miembros."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q078", "src": "Básica P41 (MAD)", "n": 78, "e": "El Tribunal del Jurado será competente para el conocimiento y fallo de las causas por los delitos tipificados en el Código Penal:", "o": ["Negociaciones prohibidas a funcionarios públicos.", "Prevaricación.", "Atentado a la Autoridad, funcionarios públicos o sus agentes.  14 PROMOCIÓN N.º 41 "], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q079", "src": "Básica P41 (MAD)", "n": 79, "e": "Las infracciones tipificadas en la Ley Orgánica 4/2015 de protección de seguridad ciuda- dana se clasifican en muy graves, graves y leves. Entre las infracciones graves se encuentra:", "o": ["La proyección de haces de luz, mediante cualquier tipo de dispositivo, sobre los pilotos o conduc- tores de medios de transporte que puedan deslumbrarles o distraer su atención y provocar accidentes.", "La celebración de espectáculos públicos o actividades recreativas quebrantando la prohibición o suspensión ordenada por al autoridad correspondiente por razones de seguridad pública.", "La perturbación del desarrollo de una reunión o manifestación lícita, cuando no constituya infrac- ción penal."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q080", "src": "Básica P41 (MAD)", "n": 80, "e": "¿Cuál de las siguientes leyes hace referencia a la Ley de promoción de la autonomía perso- nal y atención a las personas en situación de dependencia?", "o": ["Ley 39/2006.", "Ley 40/2006.", "Ley 41/2006."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q081", "src": "Básica P41 (MAD)", "n": 81, "e": "Para la concesión de la nacionalidad por residencia, bastará el tiempo de residencia de un año:", "o": ["Para aquellos que hayan obtenido la condición de refugiado.", "Para el que no haya ejercitado oportunamente la facultad de optar.", "Para el que haya estado sujeto legalmente a la tutela de un ciudadano o institución españoles durante cinco años consecutivos."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q082", "src": "Básica P41 (MAD)", "n": 82, "e": "El Tribunal de Justicia de la Unión Europea tiene su sede en:", "o": ["La Haya.", "Luxemburgo.", "Estrasburgo."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q083", "src": "Básica P41 (MAD)", "n": 83, "e": "El concepto relativo a «una imagen mental muy simplificada y generalizada basada en creencias compartidas y suelen exagerar un determinado rasgo que se cree que tiene el grupo en cuestión», corresponde a definición de:", "o": ["Prejuicio.", "Estereotipo.", "Dogmatismo."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q084", "src": "Básica P41 (MAD)", "n": 84, "e": "Según el artículo 16.2 de la LO 4/2015, de 30 de marzo, de protección de seguridad ciu- dadana, cuando no fuera posible la identificación por cualquier medio, los agentes, para impe- dir la comisión de un delito o al objeto de sancionar una infracción, podrán requerir a quienes no pudieran ser identificados que les acompañen a las dependencias policiales más próximas en las que se disponga de los medios adecuados para la práctica de esta diligencia, a los solo efectos de su identificación y por el tiempo estrictamente necesario, que en ningún caso podrá superar:", "o": ["6 horas.", "8 horas.", "9 horas.  15  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q085", "src": "Básica P41 (MAD)", "n": 85, "e": "Android es un sistema operativo que se diseñó especialmente para ser utilizado en dispo- sitivos móviles ¿En qué sistema operativo está basado?", "o": ["Windows.", "Núcleo Linux.", "Mac Os."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q086", "src": "Básica P41 (MAD)", "n": 86, "e": "Indique cuál de las siguientes frases está escrita correctamente:", "o": ["El reciclaje adecuado de deshechos electrónicos reduce la contaminación por metales pesados.", "Tras un largo día de trabajo, finalmente se sentó en el sillón y pudo disfrutar agusto de la tranqui- lidad del hogar.", "La genialidad de Salvador Dalí es un caso aparte en la historia del arte."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q087", "src": "Básica P41 (MAD)", "n": 87, "e": "¿Qué tipo de infracción constituye el hecho de consentir la inscripción de un extranjero en el Padrón Municipal por parte del titular de una vivienda habilitado para tal fin, cuando dicha vivienda no constituya el domicilio real del extranjero?", "o": ["Infracción leve.", "Infracción grave.", "Infracción muy grave."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q088", "src": "Básica P41 (MAD)", "n": 88, "e": "¿Cómo se denomina el sesgo cognitivo por el que un analista de inteligencia tiende a con- fiar más en la primera información que ha recibido para la toma posterior de decisiones en de- trimento de otras?", "o": ["Sesgo de punto ciego.", "Sesgo de efecto anclaje.", "Sesgo de compensación de riesgo."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q089", "src": "Básica P41 (MAD)", "n": 89, "e": "Señale cuál de las siguientes alternativas constituiría una agravante respecto del delito del descubrimiento y revelación de secretos, por parte de aquel que, sin consentimiento alguno, descubra los secretos o vulnere la intimidad de un tercero:", "o": ["Se cometa por persona encargadas o responsables de los ficheros, soportes informáticos, electró- nicos o telemáticos, archivos o registros.", "Aquel que, sin estar autorizado, se apodere, utilice o modifique, en perjuicio de un tercero, datos reservados de carácter personal o familiar de otro que se hallen registrados en ficheros o soportes in- formáticos, electrónicos o telemáticos, o en cualquier otro tipo de archivo o registro público.", "Aquel que, sin estar autorizado, acceda por cualquier medio datos reservados de carácter perso- nal o los altere o utilice en perjuicio del titular de los datos o de un tercero."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q090", "src": "Básica P41 (MAD)", "n": 90, "e": "De acuerdo con lo establecido en la Instrucción número 1/2024 de la Secretaría de Estado de Seguridad por la que se aprueba el «procedimiento integral de la detención policial», en rela- ción con el empleo de la fuerza en la detención, ¿Qué principio debe entenderse como «… la ne- cesidad o no de recurrir a la coacción física en la detención, de acuerdo con los datos conocidos sobre la situación y el sujeto en cuestión»? :", "o": ["Oportunidad.", "Congruencia.", "Proporcionalidad.  16 PROMOCIÓN N.º 41 "], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q091", "src": "Básica P41 (MAD)", "n": 91, "e": "La Ley de Enjuiciamiento Criminal, en su artículo 588 septies a, dice que el juez competente podrá autorizar la utilización de datos de identificación y códigos, así como la instalación de un software, que permitan, de forma remota y telemática, el examen a distancia y sin conocimiento del titular o usuario del contenido de un ordenador, dispositivo electrónico, sistema informático, instrumento de almace- namiento masivo de datos informáticos o base de datos, en la investigación de los siguientes delitos :", "o": ["Delitos contra menores o personas con capacidad modificada judicialmente.", "Delitos contra la libertad e indemnidad sexual.", "Delitos contra el orden público."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q092", "src": "Básica P41 (MAD)", "n": 92, "e": "En virtud de lo dispuesto en la Ley 12/2009 de 30 de octubre, ¿Quién podrá no admitir a trámite una solicitud de protección internacional presentada en un puesto fronterizo de aquella persona extranjeras que no reúna los requisitos necesarios para entrar en territorio español?", "o": ["El Ministro del Interior.", "El Jefe del Puesto Fronterizo.", "El Director General de la Policía."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q093", "src": "Básica P41 (MAD)", "n": 93, "e": "¿Qué herramienta OSINT permite visualizar de manera gráfica las relaciones entre perso- nas, empresas, páginas web, documentos a partir de información pública?", "o": ["Theharvester.", "Maltego.", "Cree.py."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q094", "src": "Básica P41 (MAD)", "n": 94, "e": "Conforme a la figura en el Código Civil, ¿Para qué personas NO será suficiente la residencia por dos años para la concesión de la nacionalidad española por residencia?", "o": ["Nacionales de origen de Andorra.", "Nacionales de origen de Portugal.", "Nacionales de origen de Mónaco."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q095", "src": "Básica P41 (MAD)", "n": 95, "e": "Dentro de la Comisaría General de Seguridad Ciudadana, la Oficina Nacional de Deportes, encargada entre otras cosas, de todas las funciones relacionadas con la prevención de la violen- cia en el deporte, depende de:", "o": ["Secretaría General.", "Unidad Central de Coordinación Operativa y Técnica.", "Unidad de Control Organizativo."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q096", "src": "Básica P41 (MAD)", "n": 96, "e": "Según el artículo 21 de la Constitución, que reconoce el derecho de reunión:", "o": ["El ejercicio del derecho de reunión pacifica y sin armas necesitará autorización previa.", "La reuniones deberán inscribirse en un registro a los solos efectos de publicidad.", "En el caso de reuniones en lugares de tránsito público y manifestaciones se dará comunicación previa a la autoridad."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q097", "src": "Básica P41 (MAD)", "n": 97, "e": "¿En virtud de qué Tratado se prevé el intercambio entre las Partes contratantes de perfiles de ADN, datos dactiloscópicos, registros de matriculación de vehículos y datos personales y no personales relacionados con la cooperación policial transfronteriza?", "o": ["Tratado de Prüm.", "Tratado de Lisboa.", "Tratado de Maastricht.  17  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q098", "src": "Básica P41 (MAD)", "n": 98, "e": "Según se establece en el artículo 167.1 de la Constitución Española, los proyectos de refor- ma constitucional deberán ser aprobados por:", "o": ["Mayoría absoluta de cada una de las Cámaras.", "Mayoría de tres quintos de cada una de las Cámaras.", "Mayoría de dos tercios de cada una de las Cámaras."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q099", "src": "Básica P41 (MAD)", "n": 99, "e": "En el cumplimiento de sus funciones, los funcionarios adscritos a Unidades de Policía Ju- dicial dependen:", "o": ["Orgánicamente del Ministerio del Interior.", "Orgánicamente del Ministerio de Justicia.", "Orgánicamente de los Jueces, Tribunales o Ministerio Fiscal que estén conociendo del asunto objeto de su investigación."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q100", "src": "Básica P41 (MAD)", "n": 100, "e": "Conforme a lo dispuesto en la Orden INT/859/2003, por la que se desarrolla la estructura or- gánica y funciones de los servicios centrales y territoriales de la Dirección General de la Policía, ¿Qué Unidad de la División de Cooperación Internacional se constituye como punto de contacto nacional designado para el intercambio de datos post-hit de perfiles de ADN y datos dactiloscópicos?:", "o": ["Oficina Central Nacional de Interpol.", "Unidad Nacional de Europol.", "Oficina Sirene.  18"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q001", "src": "Básica P42 (MAD)", "n": 1, "e": "Los poderes públicos promoverán las condiciones más favorables para una adecuada pro- moción profesional, social y humana de los miembros de las Fuerzas y Cuerpos de Seguridad de acuerdo con los principios de:", "o": ["Objetividad, igualdad de oportunidades, mérito y capacidad.", "Objetividad, mérito, igualdad de oportunidades y antigüedad.", "Igualdad de oportunidades, mérito, objetividad y antigüedad."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q002", "src": "Básica P42 (MAD)", "n": 2, "e": "La seguridad pública es competencia exclusiva del Estado. Su mantenimiento corresponde:", "o": ["Al Congreso de los Diputados.", "Al Gobierno de la Nación.", "Al Senado."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q003", "src": "Básica P42 (MAD)", "n": 3, "e": "Los ciudadanos tienen el derecho a participar en los asuntos públicos, directamente o por medio de representantes, libremente elegidos en elecciones periódicas por:", "o": ["Sufragio voluntario.", "Sufragio universal.", "Sufragio censitario."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q004", "src": "Básica P42 (MAD)", "n": 4, "e": "Un policía nacional sospecha que su pareja mantiene una relación con otra persona. Para asegurarse de la infidelidad, el policía accede sin autorización al correo personal electrónico de su pareja, confirmando sus sospechas tras leer el contenido de los mensajes.", "o": ["Existe un delito de descubrimiento y revelación de secretos.", "Se trata de un delito de violación de secreto profesional.", "Cometerá un delito de inviolabilidad de la correspondencia."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q005", "src": "Básica P42 (MAD)", "n": 5, "e": "Ante una solicitud de protección internacional presentada en un puesto fronterizo por una persona extranjera que no reúne los requisitos necesarios para entrar en territorio nacional, el Ministro del Interior deberá de notificar la resolución al interesado en el plazo máximo de:", "o": ["Dos días desde su presentación.", "Cuatro días desde su presentación.", "Ocho días desde su presentación."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q006", "src": "Básica P42 (MAD)", "n": 6, "e": "Cuando hablamos de la persona o cosa sobre la que recae el comportamiento penal, nos referimos a:", "o": ["Bien jurídico del delito.", "Objeto material del delito.", "Instrumento del delito.  3  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q007", "src": "Básica P42 (MAD)", "n": 7, "e": "Es una circunstancia agravante genérica recogida en el artículo 22 del Código Penal:", "o": ["Prevalerse del carácter privado que tenga el culpable.", "Obrar con abuso de confianza.", "Causar sufrimiento a la víctima."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q008", "src": "Básica P42 (MAD)", "n": 8, "e": "El acto fundacional del movimiento antiglobalización que se expresó, entre otras cosas, como resistencia a la globalización capitalista y a las contrarreformas neoliberales en los países imperialistas, se llamó:", "o": ["Batalla de Gotemburgo.", "Batalla de Salzburgo.", "Batalla de Seattle."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q009", "src": "Básica P42 (MAD)", "n": 9, "e": "Conforme a lo dispuesto en la LO 4/2015, de protección de la seguridad ciudadana, la pro- yección de haces de luz, mediante cualquier tipo de dispositivo, sobre miembros de las Fuerzas y Cuerpos de Seguridad para impedir o dificultar el ejercicio de sus funciones, constituye:", "o": ["Una infracción muy grave.", "Una infracción grave.", "Una infracción leve."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q010", "src": "Básica P42 (MAD)", "n": 10, "e": "La Unión Europea fue fundada en 1951 por seis países tras la Segunda Guerra Mundial, NO siendo uno de ellos:", "o": ["Luxemburgo", "Italia.", "Portugal."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q011", "src": "Básica P42 (MAD)", "n": 11, "e": "En el supuesto de que la víctima fuera menor de edad o tuviera la capacidad modificada judicialmente, las comunicaciones relacionadas con sus derechos básicos se harán conforme al Estatuto de la víctima:", "o": ["Únicamente al menor de edad víctima, en un lenguaje claro, sencillo y accesible.", "A su representante o a la persona que le asista.", "Las dos alternativas anteriores son incorrectas."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q012", "src": "Básica P42 (MAD)", "n": 12, "e": "Las Unidades adscritas a las Comunidades Autónomas dependerán funcionalmente de:", "o": ["Las autoridades de la Comunidad Autónoma.", "La División de Operaciones y Transformación Digital.", "Del Ministerio del Interior."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q013", "src": "Básica P42 (MAD)", "n": 13, "e": "Según lo dispuesto por la LO 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, ¿cuál es la opción correcta en relación al acceso a los datos personales de una persona fallecida si es solicitado por sus herederos o familiares?", "o": ["Los herederos del fallecido no podrán solicitar el acceso a los datos personales de aquella.", "El fallecido no puede designar a una persona que no sea familiar de primer grado para el acceso a sus datos.", "Aunque el fallecido hubiera prohibido expresamente el acceso a los herederos, estos podrán ac- ceder a los datos de carácter patrimonial del causante.  4 PROMOCIÓN N.º 42 "], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q014", "src": "Básica P42 (MAD)", "n": 14, "e": "En la LO 7/2021, de protección de datos personales tratados para fines de prevención, detección, investigación y enjuiciamiento de infracciones penales y de ejecución de sanciones penales ¿se establece alguna figura u órgano de asesoramiento y supervisión de los responsa- bles de la protección de datos?", "o": ["No, ya que la figura del responsable de protección de datos es la figura más representativa.", "Sí, el Delegado de protección de datos.", "Sí, el coordinador de protección de datos."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q015", "src": "Básica P42 (MAD)", "n": 15, "e": "Conforme dispone la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional, ¿de cuántas Salas se compone dicho Tribunal?", "o": ["Cinco Salas.", "Tres Salas.", "Dos Salas."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q016", "src": "Básica P42 (MAD)", "n": 16, "e": "David es detenido a las 22:00 horas en su domicilio y este considera que la detención se ha realizado de forma ilegal. Su abogado presenta la solicitud de habeas corpus en tiempo y forma ante el órgano habilitado a las 9:00 horas de la mañana del día siguiente. Desde que sea dictado el auto de incoación, ¿de qué plazo máximo dispondrá la autoridad judicial competente para dictar la resolución?", "o": ["72 horas.", "48 horas.", "24 horas."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q017", "src": "Básica P42 (MAD)", "n": 17, "e": "Según dispone el artículo 554 de la Ley de Enjuiciamiento Criminal, se reputan domicilio los siguientes, NO figurando en dicha relación:", "o": ["Los Palacios Reales, estén o no habitados por el Monarca al tiempo de la entrada o registro.", "El edificio o lugar cerrado, o la parte de él destinada principalmente a la habitación de cualquier español o extranjero residente en España y de su familia.", "Los buques de guerra."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q018", "src": "Básica P42 (MAD)", "n": 18, "e": "Según el Régimen disciplinario del Cuerpo Nacional de Policía, la sanción de traslado for- zoso puede imponerse:", "o": ["Solo por falta muy grave.", "Por falta grave o muy grave, en función de las circunstancias concurrentes.", "Solo por falta grave."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q019", "src": "Básica P42 (MAD)", "n": 19, "e": "Según la clasificación de las sectas que efectuó el sociólogo Bryan Wilson ¿cuál es aquella que se relaciona con el espiritismo, con lo sobrenatural, y el médium u oráculo son figuras fun- damentales dentro del grupo?", "o": ["Sectas reformistas.", "Sectas conversionistas.", "Sectas taumatúrgicas."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q020", "src": "Básica P42 (MAD)", "n": 20, "e": "¿Cuál es la actual ley que regula la protección a la seguridad ciudadana?", "o": ["Ley Ordinaria 4/2015, de 30 mayo, de protección de la seguridad ciudadana.", "Ley Orgánica 4/2015, de 30 marzo, de protección de la seguridad ciudadana.", "Ley Orgánica 4/2015, de 30 mayo, de protección de la seguridad ciudadana.  5  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q021", "src": "Básica P42 (MAD)", "n": 21, "e": "¿Cuáles de las siguientes personas físicas o jurídicas, que ejerzan actividades relevantes para la seguridad ciudadana, están sujetas a las obligaciones de registro documental e informa- ción en los términos que establezcan las disposiciones aplicables según la LO 4/2015, de protec- ción de la seguridad ciudadana?", "o": ["Centros gestores de residuos metálicos.", "Establecimientos de compraventa de joyas y metales.", "Ambas son correctas."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q022", "src": "Básica P42 (MAD)", "n": 22, "e": "La Jefatura de Unidades de Intervención Policial, depende de:", "o": ["Comisaría General de Seguridad Ciudadana.", "División de Operaciones y Transformación Digital a través de la Dirección Adjunta Operativa.", "De la Jefatura de Unidades Especiales."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q023", "src": "Básica P42 (MAD)", "n": 23, "e": "El extravío, pérdida o sustracción por simple negligencia, de los distintivos de identifica- ción, del arma reglamentaria o de cualquier otro medio o instrumento, que se hayan recibido o que se utilicen para el ejercicio de la función policial, recogido en Ley Orgánica 4/2010 del Régi- men disciplinario del Cuerpo Nacional de Policía, constituye:", "o": ["Una falta grave.", "Una falta leve.", "Una falta muy grave."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q024", "src": "Básica P42 (MAD)", "n": 24, "e": "Dentro del régimen sancionador de la LO 4/2000, de 11 de enero, sobre derechos y li- bertades de los extranjeros en España y su integración social, encontrarse irregularmente en territorio español por tener caducada la autorización de residencia más de tres meses, siempre que el interesado no hubiese solicitado la renovación de la misma en el plazo previsto reglamen- tariamente, constituye:", "o": ["Una infracción leve.", "Una infracción menos grave.", "Una infracción grave."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q025", "src": "Básica P42 (MAD)", "n": 25, "e": "En relación a lo dispuesto en el artículo 17 del Código Civil, son españoles de origen (con- teste la respuesta más acertada):", "o": ["Los nacidos en territorio nacional de padres extranjeros en cualquier caso.", "Los nacidos de padre o madre españoles.", "Los nacidos en territorio nacional."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q026", "src": "Básica P42 (MAD)", "n": 26, "e": "Es competencia exclusiva de la Policía Nacional:", "o": ["La conducción interurbana de presos.", "El resguardo fiscal del Estado.", "La expedición del Documento de Identidad."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q027", "src": "Básica P42 (MAD)", "n": 27, "e": "El máximo órgano de representatividad sindical dentro de la Policía Nacional es:", "o": ["El Consejo de Policía.", "Las Juntas de Seguridad.", "La Asamblea de sindicatos representativos.  6 PROMOCIÓN N.º 42 "], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q028", "src": "Básica P42 (MAD)", "n": 28, "e": "Según Fukuyama, ¿qué condiciones previas son necesarias para el crecimiento de la eco- nomía capitalista?", "o": ["Las democracias y los controles aduaneros.", "Las dictaduras de todo signo con equilibrio proteccionista", "El libre mercado y los sistemas políticos estables."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q029", "src": "Básica P42 (MAD)", "n": 29, "e": "El personal que desempeña funciones de seguridad privada que faltase al respeto a la dignidad o al honor de las personas, en qué infracción incurriría conforme a lo estipulado en la Ley 5/2014, de 4 de abril, de Seguridad Privada:", "o": ["Infracción leve.", "Infracción grave.", "Infracción muy grave."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q030", "src": "Básica P42 (MAD)", "n": 30, "e": "La policia ha detenido a un menor que tiene 15 años por un delito de terrorismo.", "o": ["Desde el primer momento estará incomunicado e inmediatamente se informará a Fiscalía.", "No puede ser objeto de incomunicación al tratarse de un menor de 15 años.", "Se le incomunica por el tiempo estrictamente necesario."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q031", "src": "Básica P42 (MAD)", "n": 31, "e": "Para habilitarse como guardapesca marítimo será necesario haberlo hecho previamente como:", "o": ["Vigilante de explosivos.", "Guarda rural.", "Guarda de caza."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q032", "src": "Básica P42 (MAD)", "n": 32, "e": "Los efectos económicos plenos, para el funcionario de carrera, comienzan a producirse desde:", "o": ["Recibir el nombramiento de la autoridad competente.", "Prestar el juramento o promesa legalmente establecida.", "Tomar posesión del cargo."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q033", "src": "Básica P42 (MAD)", "n": 33, "e": "Como órgano de asistencia inmediata a la personal titular de la Secretaría de Estado de Seguridad existe un Gabinete con nivel orgánico de:", "o": ["Subdirección general.", "Dirección general.", "Secretaría general técnica."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q034", "src": "Básica P42 (MAD)", "n": 34, "e": "Una pareja rompe su relación sentimental. Días después, por venganza y sin consenti- miento del hombre, la mujer difunde a través del móvil unas imágenes íntimas que la pareja se grabó en fechas anteriores.", "o": ["La mujer no incurre en responsabilidad penal, ya que la grabación de las imágenes íntimas fue consentida por ambos.", "Al difundir las imágenes, comete un delito de sabote informático atenuado por ser grabaciones consentidas.", "Hay un delito de descubrimiento y revelación de secretos, al menoscabar gravemente la intimidad del hombre con la divulgación de las imágenes.  7  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q035", "src": "Básica P42 (MAD)", "n": 35, "e": "El Centro de Comunicaciones Internacionales de la Policía Nacional está adscrito:", "o": ["A la Unidad de Coordinación Internacional.", "A la Oficina Central Nacional de INTERPOL.", "A la Secretaría General de la División de Cooperación Internacional."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q036", "src": "Básica P42 (MAD)", "n": 36, "e": "Cuál de las siguientes opciones NO puede ser ejercida por el Presidente del Gobierno en funciones:", "o": ["Dirigir la política de defensa.", "Interponer el recurso de inconstitucionalidad.", "Plantear la cuestión de confianza."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q037", "src": "Básica P42 (MAD)", "n": 37, "e": "¿Cuál de estos países NO forma parte en la actualidad de la Unión Europea?", "o": ["Portugal.", "Estonia.", "Noruega."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q038", "src": "Básica P42 (MAD)", "n": 38, "e": "¿En qué ámbito se aplica la orden de protección?", "o": ["En el ámbito de la violencia de género.", "En el ámbito de la violencia doméstica.", "En cualquiera de los dos ámbitos mencionados."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q039", "src": "Básica P42 (MAD)", "n": 39, "e": "El supremo órgano consultivo del Gobierno es:", "o": ["El Consejo de Gobierno.", "El Consejo de Ministros.", "El Consejo de Estado."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q040", "src": "Básica P42 (MAD)", "n": 40, "e": "La sede del Tribunal Europeo de Derechos Humanos, se encuentra en:", "o": ["Estrasburgo.", "Bruselas.", "Lyon."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q041", "src": "Básica P42 (MAD)", "n": 41, "e": "Un ciudadano, tras ser detenido por un presunto delito contra la seguridad vial y que es trasladado inmediatamente a dependencias policiales, no es informado de los derechos y razo- nes de su detención.", "o": ["El agente no incurre en conducta penal ni disciplinaria ya que es la policía la que decide el mo- mento correcto y adecuado para informar.", "Existe una detención ilegal, siempre que el detenido solicite conocer sus derechos ante la comi- sión de una infracción contra la seguridad vial.", "Comete un delito contra las garantías constitucionales por no informar inmediatamente y de for- ma comprensible de sus derechos al detenido."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q042", "src": "Básica P42 (MAD)", "n": 42, "e": "En virtud del nuevo Reglamento de extranjería, la duración de la autorización de residen- cia temporal por razón de arraigo familiar es de:", "o": ["Un año.", "Dos años.", "Cinco años.  8 PROMOCIÓN N.º 42 "], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q043", "src": "Básica P42 (MAD)", "n": 43, "e": "Al Área de retribuciones le compete gestionar las retribuciones correspondientes al per- sonal de la Dirección General de la Policía y depende de:", "o": ["La Secretaría General de la División de Personal.", "De la Unidad Económica de la División Económica y Técnica.", "De la Secretaría General de la Dirección Adjunta Operativa."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q044", "src": "Básica P42 (MAD)", "n": 44, "e": "Un policía quiere castigar a un detenido por un hurto cometido, para ello, baja a los cala- bozos y tras dejarle semidesnudo le introduce la cabeza en el inodoro varias veces. ¿Tiene res- ponsabilidad penal el policía por estos hechos?", "o": ["Sí, cometerá un delito de torturas.", "Sí, un delito leve de trato degradante.", "Sí, un delito de acoso profesional."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q045", "src": "Básica P42 (MAD)", "n": 45, "e": "¿En qué supuesto los agentes de la Policía Nacional podrán requerir a un sujeto que les acompañe a dependencias policiales para su identificación conforme a lo dispuesto en la LO 4/2015, de protección de la seguridad ciudadana?", "o": ["Cuando no porte su Documento Nacional de Identidad en formato físico.", "Cuando se niegue a identificarse y no sea posible su identificación por ningún medio.", "Las dos alternativas anteriores son falsas."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q046", "src": "Básica P42 (MAD)", "n": 46, "e": "Tres futbolistas en el vestuario, acuerdan cometer un robo violento en una joyería y re- suelven ejecutarlo la mañana siguiente. El entrenador al escuchar todo llama a la policía, la cual, tras comprobar la información en el vestuario, procede a la detención de los tres futbolistas.", "o": ["La detención es correcta al tratarse de una conspiración para cometer un robo.", "Es una provocación y no procede detención al no iniciarse la ejecución del robo.", "Hay proposición, pero no procede detención al no existir disponibilidad sobre las joyas."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q047", "src": "Básica P42 (MAD)", "n": 47, "e": "En el contexto de los sistemas operativos, ¿qué se entiende por «deadlock» (abrazo mortal)?:", "o": ["Un mecanismo de protección en la ejecución de un programa.", "Un estado en el que dos o más procesos no pueden continuar porque cada uno está esperando un recurso que posee otro.", "Un tipo de interrupción generada por el hardware."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q048", "src": "Básica P42 (MAD)", "n": 48, "e": "Las infracciones penales existentes en nuestro ordenamiento jurídico se contemplan:", "o": ["En el Código Penal únicamente.", "En el Código Penal y en el ámbito administrativo como es la Ley Orgánica de protección de seguridad.", "En el Código Penal y las leyes penales especiales."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q049", "src": "Básica P42 (MAD)", "n": 49, "e": "La Constitución Española se compone de:", "o": ["Un Título Preliminar, diez Títulos, 169 artículos, cuatro disposiciones adicionales, nueve transito- rias, un derogatoria y una final.", "Un Título Preliminar, once Títulos, 169 artículos, cuatro disposiciones adicionales, nueve transito- rias, un derogatoria y una final.", "Un Título Preliminar, diez Títulos, 169 artículos, cinco disposiciones adicionales, nueve transitorias, un derogatoria y una final.  9  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q050", "src": "Básica P42 (MAD)", "n": 50, "e": "¿Qué medida de las propuestas NO sirve para limitar la huella digital de una persona en redes sociales?", "o": ["La navegación en modo incógnito impide en todo caso la recopilación de información por terceros.", "Eliminar las cookies del navegador.", "Verificar la fiabilidad de las plataformas visitadas."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q051", "src": "Básica P42 (MAD)", "n": 51, "e": "La instalación de aparatos emisores de luces y señales acústicas especiales en vehículos prioritarios, de conformidad con lo dispuesto en las normas reguladoras de los vehículos, reque- rirá autorización de:", "o": ["La Jefatura Provincial de Tráfico correspondiente.", "La Dirección General de Tráfico.", "La Subdirección General de Gestión de la Movilidad y Tecnología."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q052", "src": "Básica P42 (MAD)", "n": 52, "e": "El foro institucional de participación de todas las administraciones públicas, así como de las organizaciones y entidades representativas de intereses sociales y ambientales en la elabora- ción y seguimiento de las políticas sobre cambio climático promovidas por el Estado Español es:", "o": ["El Consejo Nacional del Clima.", "La Comisión de Coordinación de Políticas de Cambio Climático.", "Oficina Española de Cambio Climático."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q053", "src": "Básica P42 (MAD)", "n": 53, "e": "El crecimiento vegetativo es el valor obtenido por la diferencia entre la tasa de natalidad y la tasa de mortalidad de una región determinada en un periodo concreto. Si decimos que en una población el crecimiento vegetativo es negativo, ¿a qué nos referimos?:", "o": ["A que el número de nacimientos es mayor que el número de muertes.", "A que el número de nacimientos es menor que el número de muertes.", "Significa que la tasa de natalidad y la tasa de mortalidad tienen el mismo número."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q054", "src": "Básica P42 (MAD)", "n": 54, "e": "Cuando se habla de un arma de fuego que después de cada disparo se recarga automá- ticamente y con la que solo es posible efectuar un disparo al accionar el disparador cada vez, estamos haciendo referencia a:", "o": ["Un arma automática.", "Un arma semiautomática.", "Un arma de repetición."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q055", "src": "Básica P42 (MAD)", "n": 55, "e": "Según el artículo 28.2 de la Ley Orgánica 4/2015, de protección de la seguridad ciuda- dana, la intervención de armas, explosivos, cartuchería y artículos pirotécnicos corresponde al Ministerio del Interior, que la ejerce a través de:", "o": ["La Dirección General de la Guardia Civil y la Dirección General de la Policía.", "La Dirección General de la Guardia Civil.", "La Dirección General de la Policía."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q056", "src": "Básica P42 (MAD)", "n": 56, "e": "Visitar los lugares donde se encuentren o pudieran encontrarse personas privadas de su libertad en cada Estado Parte y hacer recomendaciones a los Estados Partes en cuanto a la pro- tección de las personas privadas de su libertad contra la tortura y otros tratos o penas crueles, inhumanos o degradantes, es un mandato de:", "o": ["El Subcomité para la Prevención de la Tortura.", "Amnistía Internacional.", "El Defensor del Pueblo.  10 PROMOCIÓN N.º 42 "], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P42-Q057", "src": "Básica P42 (MAD)", "n": 57, "e": "¿Cuál de las siguientes frases está escrita correctamente?", "o": ["El artista se sentó frente al lienzo en blanco, con sus pinceles delante suya, listo para comenzar.", "Durante la tormenta varios árboles calleron sobre los coches estacionados.", "Mecano, La Unión y Gabinete Caligari reviven la nostalgia musical de los años 80."], "c": 2, "d": null, "t": null, "x": "             return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        // Friendly label + source tag for a URL. Avoids the misleading
        // "BOE / fuente oficial" caption when the link is actually wikipedia,
        // AEPD, EUR-Lex, an institutional homepage, etc.

            if (u.includes("guardiacivil.es")) return { ic: "👮", label: "Guardia Civil — Armas", src: "OFC" };
            if (u.includes("dgt.es")) return { ic: "🚦", label: "DGT — Tráfico", src: "OFC" };
            if (u.includes("interior.gob.es")) return { ic: "🏛️", label: "Ministerio del Interior", src: "OFC" };
            if (u.includes("mptfp.gob.es")) return { ic: "🏛️", label: "Función Pública", src: "OFC" };
            if (u.includes("icac.gob.es")) return { ic: "🏛️", label: "ICAC — Contabilidad", src: "OFC" };
            if (u.includes("ine.es")) return { ic: "📊", label: "INE — Estadística", src: "OFC" };
            if (u.includes("insst.es")) return { ic: "🛡️", label: "INSST — Prevención Riesgos", src: "OFC" };
            if (u.includes("defensordelpueblo")) return { ic: "⚖️", label: "Defensor del Pueblo", src: "OFC" };
            if (u.includes("proteccioncivil")) return { ic: "🚨", label: "Protección Civil", src: "OFC" };
            if (u.includes("violenciagenero")) return { ic: "🛡️", label: "Delegación Violencia de Género", src: "OFC" };
            if (u.includes("extranjeros.inclusion")) return { ic: "🌐", label: "Extranjería (Inclusión)", src: "OFC" };
            if (u.includes("acnur.org")) return { ic: "🌐", label: "ACNUR — Refugiados", src: "INT" };
            if (u.includes("un.org")) return { ic: "🌐", label: "ONU", src: "INT" };
            if (u.includes("icd.who.int")) return { ic: "🌐", label: "OMS — CIE-11", src: "INT" };
            if (u.includes("e-justice.europa.eu")) return { ic: "⚖️", label: "e-Justice EU", src: "EU" };
            if (u.includes("wikipedia.org")) return { ic: "📚", label: "Wikipedia — introducción al tema", src: "WIKI" };
            return { ic: "🔗", label: "Recurso externo", src: "" };
        }

        // ====== ENGINES (settings, today, streak, stats, marked, SRS) ======

        // --- Settings ---
        const SETTINGS_DEFAULTS = { dailyGoal: 20, examDate: "2026-10-15" };
        function getSettings() { return Object.assign({}, SETTINGS_DEFAULTS, lsGet("settings", {})); }
        function setSetting(k, v) { const s = getSettings(); s[k] = v; lsSet("settings", s); }

        // Days remaining until configured exam date. Negative if already passed.
        function daysToExam() {
            const d = getSettings().examDate;
            if (!d) return null;
            const target = new Date(d + "T08:00:00");
            if (isNaN(target.getTime())) return null;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const ms = target.getTime() - today.getTime();
            return Math.ceil(ms / 86400000);
        }

        // --- Today counter (key resets at midnight by date) ---
        function todayKey() {
            const d = new Date();
            return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
        }
        function getToday() {
            const t = lsGet("today", { d: "", answered: 0 });
            return (t.d !== todayKey()) ? { d: todayKey(), answered: 0 } : t;
        }
        function bumpToday(n) {
            const t = getToday();
            t.answered += n;
            lsSet("today", t);
        }

        // --- Streak: consecutive-day study habit ---
        function markActivity() {
            const s = lsGet("streak", { current: 0, longest: 0, lastDate: "" });
            const today = todayKey();
            if (s.lastDate === today) return;
            const y = new Date(); y.setDate(y.getDate() - 1);
            const yKey = y.getFullYear() + "-" + (y.getMonth() + 1) + "-" + y.getDate();
            s.current = (s.lastDate === yKey) ? (s.current || 0) + 1 : 1;
            s.longest = Math.max(s.longest || 0, s.current);
            s.lastDate = today;
            lsSet("streak", s);
        }

        // --- Per-question stats: byq[qid] = {seen, correct, wrong, blank, last, totalMs, lastMs} ---
        // totalMs and lastMs added in F1.1 (time per question). Older records lack them; treated as 0.
        function getStats() { return lsGet("stats:byq", {}); }
        function recordAttempt(qid, ans, correctIdx, elapsedMs) {
            const s = getStats();
            const r = s[qid] || { seen: 0, correct: 0, wrong: 0, blank: 0, last: 0, totalMs: 0, lastMs: 0 };
            r.seen++;
            if (ans === null) r.blank++;
            else if (ans === correctIdx) r.correct++;
            else r.wrong++;
            r.last = Date.now();
            if (typeof elapsedMs === "number" && elapsedMs > 0) {
                r.totalMs = (r.totalMs || 0) + elapsedMs;
                r.lastMs = elapsedMs;
            }
            s[qid] = r;
            lsSet("stats:byq", s);
        }
        function temaStats() {
            const byq = getStats();
            const out = {};
            for (const qid in byq) {
                const q = PREGUNTAS.find(x => x.id === qid);
                if (!q || q.t == null) continue;
                const r = byq[qid];
                const t = out[q.t] || { seen: 0, correct: 0, wrong: 0, blank: 0 };
                t.seen += r.seen; t.correct += r.correct; t.wrong += r.wrong; t.blank += r.blank;
                out[q.t] = t;
            }
            return out;
        }
        function weakTemas(minSeen) {
            const min = minSeen || 5;
            const ts = temaStats();
            return Object.entries(ts)
                .filter(([, v]) => v.seen >= min)
                .map(([n, v]) => ({ n: +n, acc: v.correct / v.seen, seen: v.seen }))
                .filter(x => x.acc < 0.6)
                .sort((a, b) => a.acc - b.acc);
        }
        function failedQids() {
            const byq = getStats();
            return Object.keys(byq).filter(qid => byq[qid].wrong > 0 && byq[qid].wrong >= byq[qid].correct);
        }

        // F1.4 — Per-bloque aggregated stats. Maps qid -> tema -> bloque (A|B|C).
        // Returns {A:{seen,correct,wrong,blank,totalMs}, B:..., C:..., U:...} where U = unmapped.
        function bloqueStats() {
            const byq = getStats();
            const temaB = new Map(TEMAS.map(t => [t.n, t.b]));
            const out = {
                A: { seen: 0, correct: 0, wrong: 0, blank: 0, totalMs: 0 },
                B: { seen: 0, correct: 0, wrong: 0, blank: 0, totalMs: 0 },
                C: { seen: 0, correct: 0, wrong: 0, blank: 0, totalMs: 0 },
            };
            for (const qid in byq) {
                const q = PREGUNTAS.find(x => x.id === qid);
                if (!q || q.t == null) continue;
                const b = temaB.get(q.t);
                if (!b || !out[b]) continue;
                const r = byq[qid];
                out[b].seen += r.seen;
                out[b].correct += r.correct;
                out[b].wrong += r.wrong;
                out[b].blank += r.blank;
                out[b].totalMs += (r.totalMs || 0);
            }
            return out;
        }

        // F1.2 — Error notebook (cuaderno de errores).
        // Storage shape: array of {date, qid, snippet, given, correct, tema, bloque, src, ms, examLabel, resolved}.
        // Cap at 500 most recent. Pushed automatically on finishExam for every wrong answer.
        const ERROR_LOG_CAP = 500;
        function getErrorLog() { return lsGet("errors:log", []); }
        function pushErrors(entries) {
            if (!entries || !entries.length) return;
            const cur = getErrorLog();
            // Newest first; cap.
            const next = entries.concat(cur).slice(0, ERROR_LOG_CAP);
            lsSet("errors:log", next);
        }
        function removeErrorAt(idx) {
            const cur = getErrorLog();
            cur.splice(idx, 1);
            lsSet("errors:log", cur);
        }
        function clearErrorLog() { lsSet("errors:log", []); }
        function toggleErrorResolved(idx) {
            const cur = getErrorLog();
            if (!cur[idx]) return;
            cur[idx].resolved = !cur[idx].resolved;
            lsSet("errors:log", cur);
        }
        // Count how many times the same qid appears in the log (any state).
        function errorCountByQid() {
            const out = new Map();
            for (const e of getErrorLog()) out.set(e.qid, (out.get(e.qid) || 0) + 1);
            return out;
        }

        // --- Persistent marked questions ---
        function getMarked() { return new Set(lsGet("marked", [])); }
        function isMarked(qid) { return getMarked().has(qid); }
        function toggleMarked(qid) {
            const s = getMarked();
            if (s.has(qid)) s.delete(qid); else s.add(qid);
            lsSet("marked", [...s]);
        }

        // --- Advanced per-question tags: 'dominada' | 'dudosa' | 'repasar' ---
        // Mutually exclusive labels users can set during/after answering. Independent
        // from the 🚩 mark flag (a question can be both marked and tagged).
        const TAG_ORDER = ["dominada", "dudosa", "repasar"];
        const TAG_META = {
            dominada: { lbl: "Dominada", icon: "✅", cls: "tag-ok" },
            dudosa: { lbl: "Dudosa", icon: "❓", cls: "tag-warn" },
            repasar: { lbl: "Repasar", icon: "🔁", cls: "tag-hot" },
        };
        function getQTags() { return lsGet("qtags", {}); }
        function getQTag(qid) { return getQTags()[qid] || null; }
        function setQTag(qid, tag) {
            const t = getQTags();
            if (!tag) delete t[qid]; else t[qid] = tag;
            lsSet("qtags", t);
        }

        // --- Personal notes per tema (textbox in tema detail) ---
        function getTemaNota(n) { return lsGet("nota:" + n, "") || ""; }
        function setTemaNota(n, txt) {
            if (txt && txt.trim()) lsSet("nota:" + n, txt);
            else lsDel("nota:" + n);
        }

        // --- SRS Leitner: 5 boxes with progressive intervals ---
        // Box 1 = today, 2 = 3d, 3 = 7d, 4 = 14d, 5 = 30d
        const SRS_INTERVALS = [0, 1, 3, 7, 14, 30];
        function getSRS() { return lsGet("srs", {}); }
        function srsUpdate(qid, correct) {
            const s = getSRS();
            const r = s[qid] || { box: 1, last: 0 };
            r.box = correct ? Math.min(5, r.box + 1) : 1;
            r.last = Date.now();
            s[qid] = r;
            lsSet("srs", s);
        }
        function srsDue() {
            const s = getSRS();
            const now = Date.now(), day = 86400000;
            const due = [];
            for (const qid in s) {
                const r = s[qid];
                const interval = SRS_INTERVALS[r.box] * day;
                if (now - r.last >= interval) due.push({ qid, box: r.box, last: r.last });
            }
            due.sort((a, b) => a.box - b.box || a.last - b.last);
            return due.map(x => x.qid);
        }
        // Count items in each Leitner box (1..5). Used by the home widget.
        function srsBoxCounts() {
            const s = getSRS();
            const c = [0, 0, 0, 0, 0];
            for (const qid in s) {
                const b = s[qid].box;
                if (b >= 1 && b <= 5) c[b - 1]++;
            }
            return c;
        }

        // --- F2 — Flashcards runner ---
        // Reuses the SRS Leitner engine via synthetic ids "fc:T<tema>:<index>" so flashcard
        // progress persists in the same 5-box store and is recalled like normal questions.
        const fcState = {
            tema: null,
            cards: [],
            order: [],
            i: 0,
            flipped: false,
            stats: { bad: 0, doubt: 0, good: 0 }
        };

        function fcId(tema, idx) { return `fc:T${tema}:${idx}`; }

        function startFlashcards(tema) {
            const cards = TEMA_FLASHCARDS[tema] || [];
            if (!cards.length) return;
            fcState.tema = tema;
            fcState.cards = cards;
            fcState.order = cards.map((_, i) => i).sort(() => Math.random() - 0.5);
            fcState.i = 0;
            fcState.flipped = false;
            fcState.stats = { bad: 0, doubt: 0, good: 0 };
            $("fcOverlay").classList.add("open");
            $("fcOverlay").setAttribute("aria-hidden", "false");
            const t = TEMAS.find(x => x.n === tema);
            $("fcTitle").textContent = t ? `Tema ${tema} — ${t.a}` : `Tema ${tema}`;
            renderFlashcard();
        }

        function closeFlashcards() {
            $("fcOverlay").classList.remove("open");
            $("fcOverlay").setAttribute("aria-hidden", "true");
        }

        function renderFlashcard() {
            const body = $("fcBody");
            const total = fcState.order.length;
            // session finished
            if (fcState.i >= total) {
                const s = fcState.stats;
                body.innerHTML = `
                    <div class="fc-done">
                        <h3>¡Repaso completo!</h3>
                        <div class="fc-stats">
                            <div><b style="color:#66cc88">${s.good}</b><span class="muted">fáciles</span></div>
                            <div><b style="color:#ffbb55">${s.doubt}</b><span class="muted">dudas</span></div>
                            <div><b style="color:#ff8888">${s.bad}</b><span class="muted">fallos</span></div>
                        </div>
                        <button class="cards-start" id="fcRestart">↻ Repetir las que fallaste</button>
                    </div>`;
                $("fcProgress").textContent = `${total}/${total}`;
                document.querySelectorAll('#fcActions button').forEach(b => b.disabled = true);
                const restart = $("fcRestart");
                if (restart) restart.addEventListener("click", () => {
                    // rebuild order keeping only the cards marked bad or doubt in this session
                    // simpler: just relaunch full deck if no fail tracking — keep MVP simple
                    startFlashcards(fcState.tema);
                });
                return;
            }
            const idx = fcState.order[fcState.i];
            const card = fcState.cards[idx];
            $("fcProgress").textContent = `${fcState.i + 1}/${total}`;
            if (!fcState.flipped) {
                body.innerHTML = `
                    <div class="fc-card" id="fcCard">
                        <div class="fc-face-label">Pregunta</div>
                        <div class="fc-face-content">${escapeHtml(card.front)}</div>
                        <div class="fc-flip-hint">Toca para ver la respuesta</div>
                    </div>`;
                document.querySelectorAll('#fcActions button').forEach(b => b.disabled = true);
            } else {
                body.innerHTML = `
                    <div class="fc-card" id="fcCard">
                        <div class="fc-face-label">Pregunta</div>
                        <div class="fc-face-content" style="font-size:14.5px;color:var(--muted)">${escapeHtml(card.front)}</div>
                        <div class="fc-face-label" style="margin-top:6px">Respuesta</div>
                        <div class="fc-face-content">${escapeHtml(card.back)}</div>
                    </div>`;
                document.querySelectorAll('#fcActions button').forEach(b => b.disabled = false);
            }
            const cardEl = $("fcCard");
            if (cardEl && !fcState.flipped) {
                cardEl.addEventListener("click", () => {
                    fcState.flipped = true;
                    renderFlashcard();
                });
            }
        }

        function fcAnswer(kind) {
            // kind: 'bad' | 'doubt' | 'good'
            if (!fcState.flipped) return;
            const idx = fcState.order[fcState.i];
            const id = fcId(fcState.tema, idx);
            // 'bad' and 'doubt' reset to box 1 (review soon); 'good' advances the box
            srsUpdate(id, kind === "good");
            fcState.stats[kind]++;
            fcState.i++;
            fcState.flipped = false;
            renderFlashcard();
        }

        // ====== STATE ======
        let currentFilter = "all";
        let currentQuery = "";
        let currentTema = null;

        // ====== VIEW ROUTER ======
        function showView(name) {
            document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
            const el = $("view-" + name);
            if (el) el.classList.add("active");
            document.querySelectorAll(".bottom-nav button, .sidebar button[data-view]").forEach(b => {
                b.classList.toggle("active", b.dataset.view === name);
            });
            if (name === "inicio") renderHome();
            if (name === "plan") renderPlan();
            if (name === "examenes") renderExamMenu();
            if (name === "errores") renderErrores();
            if (name === "ayuda") renderAyuda();
            if (name === "busqueda") renderBusqueda();
            if (name !== "temario") closeDetail();
            // update subtitle in header
            const sub = $("subtitle");
            if (sub) {
                sub.textContent =
                    name === "examenes" ? `Exámenes — ${PREGUNTAS_META.total} preguntas oficiales` :
                        name === "temario" ? "Temario — 81 temas · BOE 11-ago-2025" :
                            name === "plan" ? "Plan — 21 semanas · examen ~18 oct 2026" :
                                name === "errores" ? "Cuaderno de errores — repasa lo que fallaste" :
                                    name === "ayuda" ? "Ayuda — cómo usar la app" :
                                        name === "busqueda" ? "Buscar — temas, tips, flashcards y glosario" :
                                            "Tu panel de estudio";
            }
            // sync hash without scrolling
            const h = "#" + name;
            if (location.hash !== h) history.replaceState(null, "", h);
            window.scrollTo(0, 0);
        }

        // ====== TEMARIO ======
        const listEl = $("list"), emptyEl = $("empty"), qEl = $("q");
        const detailEl = $("detail"), detailContentEl = $("detailContent");
        const backBtn = $("back"), prevBtn = $("prev"), nextBtn = $("next");

        function renderList() {
            const q = currentQuery.toLowerCase().trim();
            const filtered = TEMAS.filter(t => {
                if (currentFilter !== "all" && t.b !== currentFilter) return false;
                if (!q) return true;
                const hay = (t.n + " " + t.t + " " + t.a + " " + t.norma + " " + t.keys.join(" ")).toLowerCase();
                return hay.includes(q);
            });

            if (filtered.length === 0) {
                listEl.innerHTML = "";
                emptyEl.hidden = false;
                return;
            }
            emptyEl.hidden = true;

            listEl.innerHTML = filtered.map(t => {
                const bn = { A: "Jur", B: "Soc", C: "Téc" }[t.b] || "";
                return `
    <div class="card" data-n="${t.n}">
      <div class="num ${t.b}">
        <span>${t.n}</span>
        <span class="bn">${bn}</span>
      </div>
      <div class="body">
        <div class="title">${escapeHtml(t.t)}</div>
        <div class="meta">
          <span class="badge">${escapeHtml(t.a)}</span>
          <span class="diff" title="Dificultad ${t.d}/5">
            ${[1, 2, 3, 4, 5].map(i => `<span class="${i <= t.d ? 'on' : ''}"></span>`).join("")}
          </span>
        </div>
      </div>
    </div>
  `;
            }).join("");

            listEl.querySelectorAll(".card").forEach(el => {
                el.addEventListener("click", () => openTema(parseInt(el.dataset.n, 10)));
            });
        }

        function openTema(n) {
            const t = TEMAS.find(x => x.n === n);
            if (!t) return;
            currentTema = t;

            const bloqueName = { A: "A · Ciencias Jurídicas", B: "B · Ciencias Sociales", C: "C · Técnico-Científicas" }[t.b];
            const linkHtml = (url) => {
                const i = linkInfo(url);
                if (!i) return "";
                return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">
      <span>${i.ic}</span><span>${escapeHtml(i.label)}</span>
      ${i.src ? `<span class="src">${i.src}</span>` : ""}
    </a>`;
            };

            detailContentEl.innerHTML = `
    <h2><span class="num ${t.b}" style="display:inline-flex;width:32px;height:32px;margin-right:8px;vertical-align:middle">${t.n}</span>${escapeHtml(t.t)}</h2>
    <div class="head-meta">
      <span>${escapeHtml(bloqueName)}</span>
      <span>·</span>
      <span>${escapeHtml(t.a)}</span>
      <span>·</span>
      <span>Dificultad ${t.d}/5</span>
    </div>

    <div class="resumen ${t.resumen ? '' : 'pending'}">
      ${t.resumen
                    ? (Array.isArray(t.resumen) ? t.resumen.map(p => `<p>${escapeHtml(p)}</p>`).join("") : `<p>${escapeHtml(t.resumen)}</p>`)
                    : "📝 Resumen pendiente — pronto disponible."}
    </div>

    <div class="detail-block">
      <h3>Norma principal</h3>
      <div class="norma-text">${escapeHtml(t.norma)}</div>
    </div>

    <div class="detail-block">
      <h3>Palabras clave</h3>
      <div class="keys">
        ${t.keys.map(k => `<span class="key">${escapeHtml(k)}</span>`).join("")}
      </div>
    </div>

    ${(t.boe || t.rec) ? `
    <div class="detail-block">
      <h3>Enlaces y documentación</h3>

                return { t, r, acc };
            }).filter(Boolean).sort((a, b) => a.acc - b.acc);

        function runBankSearch(query, out) {
            const q = (query || "").trim().toLowerCase();
            if (q.length < 3) { out.innerHTML = ""; return; }
            const hits = [];
            for (const p of PREGUNTAS) {
                const tema = p.t ? TEMAS.find(t => t.n === p.t) : null;
