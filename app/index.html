<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1f3a">
    <title>Oposición Inspector/a CNP — Temario</title>
    <style>
        /* ===== THEME TOKENS =====
     Dark = default. Light = added via [data-theme="light"] override below.
     Color roles:
       --accent  (yellow) : primary user action ONLY (Empezar / Terminar)
       --accent2 (blue)   : navigation, secondary actions, links
       --mark    (orange) : flagged/marked content
       --ok / --warn / --bad : status semantic
  */
        :root {
            --bg: #0b1f3a;
            --panel: #102a4d;
            --panel2: #16365f;
            --line: #234a7a;
            --text: #eaf1fb;
            --muted: #9fb4d4;
            --accent: #ffd24a;
            --accent-ink: #1a1a1a;
            --accent2: #7ab8ff;
            --accent2-ink: #0b1f3a;
            --mark: #ff9844;
            --mark-ink: #1a1a1a;
            --ok: #7ad19a;
            --warn: #ffb35a;
            --bad: #ff7a7a;
            --A: #7ab8ff;
            --B: #7ad19a;
            --C: #ffb35a;
            --nav-h: 60px;
            --side-w: 220px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --radius: 12px;
            --shadow-card: 0 1px 3px rgba(0, 0, 0, .25);
        }

        [data-theme="light"] {
            --bg: #f5f7fb;
            --panel: #ffffff;
            --panel2: #eef2f9;
            --line: #d3dcea;
            --text: #0f1c33;
            --muted: #5d6f8e;
            --accent: #e6a800;
            --accent-ink: #1a1a1a;
            --accent2: #1f6fd0;
            --accent2-ink: #ffffff;
            --mark: #d96a14;
            --mark-ink: #ffffff;
            --ok: #1f8a4c;
            --warn: #b25b00;
            --bad: #c43838;
            --A: #1f6fd0;
            --B: #1f8a4c;
            --C: #b25b00;
            --shadow-card: 0 1px 3px rgba(15, 28, 51, .08);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            min-height: 100vh;
            overscroll-behavior-y: none
        }

        body {
            padding-bottom: calc(var(--nav-h) + var(--safe-bottom))
        }

        a {
            color: var(--accent2);
            text-decoration: none;
            word-break: break-word
        }

        a:hover {
            text-decoration: underline
        }

        button {
            font-family: inherit
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition: none !important;
                animation: none !important
            }
        }

        ::selection {
            background: var(--accent2);
            color: var(--accent2-ink)
        }

        /* ===== HEADER ===== */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--panel);
            padding: 10px 16px;
            border-bottom: 1px solid var(--line);
            padding-top: max(10px, env(safe-area-inset-top));
            display: flex;
            align-items: center;
            gap: 10px
        }

        header .title-block {
            flex: 1;
            min-width: 0
        }

        header h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: .2px
        }

        header .sub {
            font-size: 11.5px;
            color: var(--muted);
            margin-top: 2px
        }

        header .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--text);
            width: 38px;
            height: 38px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1
        }

        .icon-btn:hover {
            background: var(--panel2)
        }

        .icon-btn.streak {
            width: auto;
            padding: 0 10px;
            gap: 5px;
            color: var(--mark);
            font-weight: 600;
            font-size: 13px
        }

        /* ===== VIEWS ===== */
        .view {
            display: none
        }

        .view.active {
            display: block
        }

        /* ===== BOTTOM NAVIGATION (mobile) ===== */
        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 40;
            background: var(--panel);
            border-top: 1px solid var(--line);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding-bottom: var(--safe-bottom)
        }

        .bottom-nav button {
            background: transparent;
            border: 0;
            color: var(--muted);
            padding: 10px 4px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            min-height: var(--nav-h);
            transition: color .15s
        }

        .bottom-nav button .ic {
            font-size: 19px;
            line-height: 1
        }

        .bottom-nav button.active {
            color: var(--accent2)
        }

        .bottom-nav button:active {
            background: var(--panel2)
        }

        /* ===== SIDEBAR (desktop) ===== */
        .sidebar {
            display: none
        }

        @media(min-width:900px) {
            body {
                padding-left: var(--side-w);
                padding-bottom: 0
            }

            .bottom-nav {
                display: none
            }

            .sidebar {
                display: flex;
                flex-direction: column;
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: var(--side-w);
                z-index: 50;
                background: var(--panel);
                border-right: 1px solid var(--line);
                padding: 14px 10px;
                padding-top: max(14px, env(safe-area-inset-top));
                gap: 4px
            }

            .sidebar .brand {
                font-weight: 700;
                font-size: 14px;
                padding: 6px 10px 14px;
                color: var(--accent);
                border-bottom: 1px solid var(--line);
                margin-bottom: 8px
            }

            .sidebar button {
                background: transparent;
                border: 0;
                color: var(--muted);
                text-align: left;
                padding: 11px 14px;
                border-radius: 8px;
                cursor: pointer;
                font-size: 14px;
                display: flex;
                align-items: center;
                gap: 10px;
                font-family: inherit
            }

            .sidebar button:hover {
                background: var(--panel2);
                color: var(--text)
            }

            .sidebar button.active {
                background: var(--panel2);
                color: var(--accent2);
                font-weight: 600
            }

            .sidebar button .ic {
                font-size: 18px;
                width: 22px;
                text-align: center
            }

            .sidebar .spacer {
                flex: 1
            }

            .sidebar .foot {
                font-size: 11px;
                color: var(--muted);
                padding: 10px 12px;
                border-top: 1px solid var(--line)
            }

            header {
                padding-left: 18px
            }
        }

        /* ===== HOME VIEW ===== */
        .home {
            padding: 14px;
            max-width: 900px;
            margin: 0 auto
        }

        .home .hero {
            background: linear-gradient(135deg, var(--panel) 0%, var(--panel2) 100%);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px
        }

        .home .hero h2 {
            margin: 0 0 4px;
            font-size: 17px;
            font-weight: 600
        }

        .home .hero .greet {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 12px
        }

        .home .hero .goal {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--muted)
        }

        .home .hero .goal .bar {
            flex: 1;
            height: 8px;
            background: var(--panel2);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid var(--line)
        }

        .home .hero .goal .bar>div {
            height: 100%;
            background: linear-gradient(90deg, var(--accent2), var(--ok));
            transition: width .4s
        }

        .home .hero .goal b {
            color: var(--text);
            font-weight: 600
        }

        .home .recommend {
            background: var(--panel);
            border: 1px solid var(--line);
            border-left: 3px solid var(--accent);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px
        }

        .home .recommend .body {
            flex: 1;
            min-width: 0
        }

        .home .recommend .body .label {
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 3px
        }

        .home .recommend .body .txt {
            font-size: 14px
        }

        .home .recommend button {
            background: var(--accent2);
            color: var(--accent2-ink);
            border: 0;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            min-height: 42px;
            flex-shrink: 0
        }

        .home .tiles {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 14px
        }

        @media(min-width:600px) {
            .home .tiles {
                grid-template-columns: repeat(4, 1fr)
            }
        }

        .home .tile {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            text-align: center
        }

        .home .tile .v {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.1;
            color: var(--text);
            font-variant-numeric: tabular-nums
        }

        .home .tile .l {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .4px;
            margin-top: 6px
        }

        .home .tile .v.ok {
            color: var(--ok)
        }

        .home .tile .v.warn {
            color: var(--warn)
        }

        .home .tile .v.bad {
            color: var(--bad)
        }

        /* F1.4 — per-bloque accuracy bars on home */
        /* === SRS memory widget === */
        .srs-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px;
            margin: 14px 0;
        }

        .srs-card .srs-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }

        .srs-card .srs-head h3 {
            margin: 0;
            font-size: 16px;
        }

        .srs-card .srs-sub {
            color: var(--muted);
            font-size: 12px;
        }

        .srs-due {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: var(--bg);
            border-radius: 10px;
            margin-bottom: 14px;
        }

        .srs-due .due-lbl {
            font-size: 13px;
            color: var(--muted);
        }

        .srs-due .due-n {
            font-size: 28px;
            font-weight: 800;
            margin-left: auto;
            line-height: 1;
        }

        .srs-due .due-n.ok {
            color: #4ade80;
        }

        .srs-due .due-n.warn {
            color: #fbbf24;
        }

        .srs-due .due-n.bad {
            color: #f87171;
        }

        .srs-due .due-go {
            background: var(--accent);
            color: #001018;
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .srs-due .due-zero {
            color: #4ade80;
            font-weight: 700;
            font-size: 13px;
        }

        .srs-empty {
            background: var(--bg);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
        }

        .srs-empty p {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
        }

        .srs-boxes {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            align-items: end;
        }

        .srs-box {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .srs-box .bx-track {
            width: 100%;
            height: 60px;
            background: var(--bg);
            border-radius: 6px;
            display: flex;
            align-items: flex-end;
            overflow: hidden;
        }

        .srs-box .bx-fill {
            width: 100%;
            background: linear-gradient(180deg, #38bdf8, #0ea5e9);
            min-height: 2px;
            border-radius: 6px 6px 0 0;
            transition: height .3s ease;
        }

        .srs-box.b1 .bx-fill {
            background: linear-gradient(180deg, #f87171, #ef4444);
        }

        .srs-box.b2 .bx-fill {
            background: linear-gradient(180deg, #fb923c, #f97316);
        }

        .srs-box.b3 .bx-fill {
            background: linear-gradient(180deg, #fbbf24, #f59e0b);
        }

        .srs-box.b4 .bx-fill {
            background: linear-gradient(180deg, #38bdf8, #0ea5e9);
        }

        .srs-box.b5 .bx-fill {
            background: linear-gradient(180deg, #4ade80, #22c55e);
        }

        .srs-box .bx-n {
            font-weight: 700;
            font-size: 14px;
        }

        .srs-box .bx-lbl {
            font-size: 10px;
            color: var(--muted);
            line-height: 1.2;
        }

        .srs-box .bx-lbl small {
            display: block;
            font-size: 9px;
            opacity: .7;
        }

        /* === Ayuda view === */
        #view-ayuda {
            padding: 14px
        }

        .ayuda-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--line);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch
        }

        .ayuda-tab {
            background: transparent;
            color: var(--muted);
            border: 0;
            border-bottom: 2px solid transparent;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
            min-height: 44px
        }

        .ayuda-tab.active {
            color: var(--text);
            border-bottom-color: var(--accent)
        }

        .ayuda-body {
            line-height: 1.6;
            max-width: 720px
        }

        .ayuda-body h4 {
            margin: 22px 0 6px;
            font-size: 15px
        }

        .ayuda-body ol,
        .ayuda-body ul {
            padding-left: 22px;
            margin: 8px 0
        }

        .ayuda-body li {
            margin-bottom: 6px;
            font-size: 14px
        }

        .ayuda-intro {
            color: var(--muted);
            margin: 0 0 14px
        }

        .news-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 14px
        }

        .news-list li {
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 3px solid var(--accent2);
            border-radius: 10px;
            padding: 12px 14px;
            margin: 0
        }

        .news-list .news-date {
            font-size: 11px;
            color: var(--muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em
        }

        .news-list h4 {
            margin: 6px 0;
            font-size: 15px
        }

        .news-list p {
            margin: 0;
            font-size: 14px
        }

        .gloss {
            margin: 0
        }

        .gloss dt {
            font-weight: 700;
            margin-top: 16px;
            font-size: 15px;
            color: var(--text)
        }

        .gloss dt:first-child {
            margin-top: 0
        }

        .gloss dd {
            margin: 4px 0 0;
            font-size: 14px;
            color: var(--text)
        }

        /* === Busqueda view === */
        #view-busqueda {
            padding: 14px
        }

        .bz-toolbar {
            position: sticky;
            top: 0;
            background: var(--bg);
            padding: 8px 0 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 2
        }

        #busquedaInput {
            flex: 1;
            min-height: 46px;
            padding: 10px 14px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit
        }

        #busquedaInput:focus {
            outline: none;
            border-color: var(--accent)
        }

        .bz-clear {
            width: 40px;
            min-height: 46px;
            background: var(--card);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer
        }

        .bz-summary {
            font-size: 13px;
            margin-bottom: 14px
        }

        .bz-summary.muted {
            color: var(--muted)
        }

        .bz-section {
            margin-bottom: 18px
        }

        .bz-section h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
            margin: 0 0 8px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .bz-section h3 .count {
            background: var(--panel);
            color: var(--text);
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 999px;
            font-weight: 700;
            text-transform: none
        }

        .bz-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .bz-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer
        }

        .bz-item:hover {
            border-color: var(--accent2)
        }

        .bz-item .num {
            min-width: 34px;
            height: 34px;
            border-radius: 8px;
            background: var(--panel);
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text)
        }

        .bz-item .num.A {
            background: rgba(96, 165, 250, .18);
            color: #60a5fa
        }

        .bz-item .num.B {
            background: rgba(167, 139, 250, .18);
            color: #a78bfa
        }

        .bz-item .num.C {
            background: rgba(74, 222, 128, .18);
            color: #4ade80
        }

        .bz-item .info {
            flex: 1;
            min-width: 0
        }

        .bz-item .title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 2px
        }

        .bz-item .meta {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5
        }

        .bz-tip .meta,
        .bz-fc .meta {
            color: var(--text)
        }

        .bz-gloss .gloss-term {
            min-width: 110px;
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px
        }

        .bz-gloss .gloss-term .b {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 999px;
            font-weight: 700
        }

        .bz-gloss .gloss-term .b.A {
            background: rgba(96, 165, 250, .18);
            color: #60a5fa
        }

        .bz-gloss .gloss-term .b.B {
            background: rgba(167, 139, 250, .18);
            color: #a78bfa
        }

        .bz-gloss .gloss-term .b.C {
            background: rgba(74, 222, 128, .18);
            color: #4ade80
        }

        .bz-gloss .gloss-ref {
            font-size: 12px;
            color: var(--accent);
            margin-top: 4px
        }

        .bz-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            background: var(--card);
            border: 1px dashed var(--line);
            border-radius: 10px
        }

        /* === Badges (hitos) === */
        .badges-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px;
            margin: 14px 0
        }

        .badges-card .bd-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 12px
        }

        .badges-card .bd-head h3 {
            margin: 0;
            font-size: 16px
        }

        .badges-card .bd-sub {
            color: var(--muted);
            font-size: 12px
        }

        .bd-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px
        }

        @media (min-width: 720px) {
            .bd-grid {
                grid-template-columns: repeat(6, 1fr)
            }
        }

        .bd-item {
            text-align: center;
            padding: 10px 6px;
            border-radius: 10px;
            background: var(--bg);
            border: 1px solid var(--line);
            cursor: help
        }

        .bd-item.on {
            background: linear-gradient(180deg, rgba(74, 222, 128, .12), rgba(34, 197, 94, .04));
            border-color: rgba(74, 222, 128, .35)
        }

        .bd-item.off {
            opacity: .42;
            filter: grayscale(.8)
        }

        .bd-icon {
            font-size: 26px;
            line-height: 1;
            margin-bottom: 4px
        }

        .bd-name {
            font-size: 11px;
            color: var(--text);
            line-height: 1.2
        }

        /* === You vs you === */
        .vs-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;

            background: var(--panel2);
            text-decoration: none;
            border-color: var(--accent2)
        }

        .links a .src {
            margin-left: auto;
            font-size: 10.5px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .4px;
            padding: 2px 6px;
            border: 1px solid var(--line);
            border-radius: 4px
        }

        .rel {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .rel button {
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--accent2);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            min-height: 38px;
            font-family: inherit
        }

        .rel button:hover {
            background: var(--panel2);
            border-color: var(--accent2)
        }

        .rel button.practice {
            background: var(--accent2);
            color: var(--accent2-ink);
            border-color: var(--accent2);
            font-weight: 600
        }

        /* ===== F2 — "No entiendo" tips and flashcards ===== */
        .tema-tips>h3,
        .tema-flashcards>h3 {
            border-bottom: none;
            padding-bottom: 0;
            margin: 0
        }

        .tips-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            min-height: 48px;
            text-transform: none;
            letter-spacing: 0
        }

        .tips-toggle:hover {
            background: var(--panel2);
            border-color: var(--accent2)
        }

        .tema-tips.empty .tips-toggle,
        .tema-flashcards.empty .tips-toggle {
            color: var(--muted);
            font-weight: 500
        }

        /* Personal notes per tema — collapsible textarea */
        .tema-notes .notes-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .tema-notes textarea {
            width: 100%;
            min-height: 11rem;
            box-sizing: border-box;
            padding: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            line-height: 1.5;
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            resize: vertical;
        }

        .tema-notes textarea:focus {
            outline: none;
            border-color: var(--accent2);
        }

        .tema-notes .notes-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--muted);
            gap: 12px;
            flex-wrap: wrap;
        }

        .tema-notes .notes-status {
            color: var(--accent2);
            font-weight: 600;
        }

        .tema-notes.has-note h3 .badge {
            color: var(--accent2);
        }

        .tips-toggle .ic {
            font-size: 18px
        }

        .tips-toggle .caret {
            margin-left: auto;
            font-size: 14px;
            transition: transform .15s ease
        }

        .tips-toggle.open .caret {
            transform: rotate(180deg)
        }

        .tips-toggle .badge {
            display: inline-block;
            background: var(--accent2);
            color: var(--accent2-ink);
            font-size: 11px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 999px;
            margin-left: 6px;
            vertical-align: middle
        }

        .tips-panel,
        .cards-panel {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .tips-panel[hidden],
        .cards-panel[hidden] {
            display: none
        }

        .tip-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-left: 3px solid var(--accent2);
            border-radius: 10px;
            padding: 12px 14px
        }

        .tip-q {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--text)
        }

        .tip-a {
            font-size: 14px;
            line-height: 1.55;
            color: var(--text)
        }

        .tip-empty {
            background: var(--panel);
            border: 1px dashed var(--line);
            border-radius: 10px;
            padding: 14px;
            text-align: center
        }

        .tip-empty p {
            margin: 0 0 6px;
            font-size: 13.5px
        }

        .tip-empty .muted {
            color: var(--muted);
            font-size: 12.5px
        }

        .cards-start {
            background: var(--accent2);
            color: var(--accent2-ink);
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            min-height: 46px;
            font-family: inherit
        }

        .cards-start:hover {
            opacity: .92
        }

        .cards-preview {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .cards-preview li {
            font-size: 13px;
            color: var(--muted);
            padding: 6px 10px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px
        }

        /* ===== F2 — Flashcards runner (full-screen overlay) ===== */
        .fc-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            display: none;
            flex-direction: column
        }

        .fc-overlay.open {
            display: flex
        }

        .fc-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            background: var(--panel)
        }

        .fc-head .fc-close {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer
        }

        .fc-head .fc-title {
            font-size: 14px;
            font-weight: 600;
            flex: 1
        }

        .fc-head .fc-progress {
            font-size: 13px;
            color: var(--muted);
            font-variant-numeric: tabular-nums
        }

        .fc-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto
        }

        .fc-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 28px 22px;
            max-width: 560px;
            width: 100%;
            min-height: 220px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .25);
            transition: transform .15s ease
        }

        .fc-card:hover {
            transform: translateY(-2px)
        }

        .fc-face-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--muted)
        }

        .fc-face-content {
            font-size: 17px;
            line-height: 1.5;
            color: var(--text)
        }

        .fc-flip-hint {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            margin-top: 8px
        }

        .fc-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 14px;
            border-top: 1px solid var(--line);
            background: var(--panel)
        }

        .fc-actions button {
            padding: 14px 8px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            min-height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px
        }

        .fc-actions .fc-ic {
            font-size: 20px
        }

        .fc-actions .fc-bad {
            border-color: #cc4444;
            color: #ff8888
        }

        .fc-actions .fc-doubt {
            border-color: #cc9944;
            color: #ffbb55
        }

        .fc-actions .fc-good {
            border-color: #44aa66;
            color: #66cc88
        }

        .fc-actions button:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        .fc-done {
            text-align: center;
            padding: 30px 20px
        }

        .fc-done h3 {
            font-size: 18px;
            margin: 0 0 10px
        }

        .fc-done .fc-stats {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin: 18px 0 22px;
            font-size: 14px
        }

        .fc-done .fc-stats b {
            font-size: 22px;
            display: block
        }

        /* ===== EXAMENES VIEW ===== */
        .exam-menu {
            padding: 14px;
            max-width: 900px;
            margin: 0 auto
        }

        .exam-hero {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px
        }

        .exam-hero h2 {
            margin: 0 0 6px;
            font-size: 17px
        }

        .exam-hero p {
            margin: 0;
            color: var(--muted);
            font-size: 13px
        }

        .exam-hero .stats {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 10px;
            font-size: 12.5px;
            color: var(--muted)
        }

        .exam-hero .stats b {
            color: var(--text);
            font-size: 15px
        }

        .resume-banner {
            background: var(--panel);
            border: 1px solid var(--accent2);
            border-left: 4px solid var(--accent);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }

        .resume-banner .txt {
            flex: 1;
            min-width: 160px;
            font-size: 13.5px
        }

        .resume-banner button {
            background: var(--accent2);
            color: #fff;
            border: 0;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            min-height: 42px
        }

        .resume-banner .discard {
            background: transparent;
            color: var(--muted);
            font-weight: 400;
            border: 1px solid var(--line)
        }

        .mode-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 14px
        }

        @media(min-width:640px) {
            .mode-grid {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        .mode-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: background .15s, transform .08s, border-color .15s;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            text-align: left;
            color: var(--text);
            font-family: inherit;
            font-size: 14px
        }

        .mode-card:active {
            transform: scale(.985);
            background: var(--panel2)
        }

        .mode-card:hover {
            border-color: var(--accent2)
        }

        .mode-card .ic {
            font-size: 24px;
            line-height: 1;
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--panel2);
            display: flex;
            align-items: center;
            justify-content: center
        }

        .mode-card .body {
            flex: 1;
            min-width: 0
        }

        .mode-card .body h3 {
            margin: 0 0 4px;
            font-size: 14.5px;
            color: var(--text);
            font-weight: 600
        }

        .mode-card .body p {
            margin: 0;
            font-size: 12.5px;
            color: var(--muted);
            line-height: 1.4
        }

        .mode-card .body .tag {
            display: inline-block;
            margin-top: 6px;
            font-size: 10.5px;
            padding: 1px 7px;
            border-radius: 4px;
            background: var(--panel2);
            color: var(--muted);
            border: 1px solid var(--line);
            text-transform: uppercase;
            letter-spacing: .4px
        }

        .exam-config {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px
        }

        .exam-config h3 {
            margin: 0 0 10px;
            font-size: 13px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .exam-config .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center
        }

        .exam-config label {
            font-size: 13px;
            color: var(--muted);
            min-width: 90px
        }

        .exam-config select,
        .exam-config input[type=number] {
            background: var(--panel2);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 14px;
            min-height: 40px;
            flex: 1;
            min-width: 140px;
            font-family: inherit
        }

        .exam-config .start-btn {
            background: var(--accent);
            color: var(--accent-ink);
            border: 0;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
            margin-top: 6px;
            min-height: 50px
        }

        .exam-config .start-btn:disabled {
            background: var(--line);
            color: var(--muted);
            cursor: not-allowed
        }

        .history {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            margin-top: 14px
        }

        .history h3 {
            margin: 0 0 10px;
            font-size: 13px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .history .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-top: 1px solid var(--line);
            font-size: 13.5px;
            gap: 10px
        }

        .history .row:first-of-type {
            border-top: 0
        }

        .history .row .meta {
            color: var(--muted);
            font-size: 12px
        }

        .history .nota {
            font-weight: 700;
            font-size: 16px;
            padding: 4px 10px;
            border-radius: 6px;
            background: var(--panel2);
            min-width: 50px;
            text-align: center
        }

        .nota.ok {
            color: var(--ok)
        }

        .nota.warn {
            color: var(--warn)
        }

        .nota.bad {
            color: var(--bad)
        }

        .history .empty-line {
            color: var(--muted);
            font-size: 13px;
            padding: 6px 0;
            text-align: center
        }

        /* ===== STATS / WEAK TOPICS ===== */
        .stats-list {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 6px 0;
            margin-bottom: 14px;
            overflow: hidden
        }

        .stats-list .row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-top: 1px solid var(--line);
            cursor: pointer
        }

        .stats-list .row:first-of-type {
            border-top: 0
        }

        .stats-list .row:hover {
            background: var(--panel2)
        }

        .stats-list .row .num {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0b1f3a;
            flex-shrink: 0
        }

        .stats-list .row .num.A {
            background: var(--A)
        }

        .stats-list .row .num.B {
            background: var(--B)
        }

        .stats-list .row .num.C {
            background: var(--C)
        }

        .stats-list .row .info {
            flex: 1;
            min-width: 0
        }

        .stats-list .row .info .t {
            font-size: 13.5px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .stats-list .row .info .m {
            font-size: 11.5px;
            color: var(--muted);
            margin-top: 2px
        }

        .stats-list .row .acc {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 6px;
            background: var(--panel2);
            min-width: 54px;
            text-align: center;
            flex-shrink: 0
        }

        .stats-list .row .acc.ok {
            color: var(--ok)
        }

        .stats-list .row .acc.warn {
            color: var(--warn)
        }

        .stats-list .row .acc.bad {
            color: var(--bad)
        }

        .stats-list .row .acc.none {
            color: var(--muted);
            font-weight: 400;
            font-size: 11px
        }

        /* ===== BANK SEARCH ===== */
        .bank-search {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px
        }

        .bank-search input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--panel2);
            color: var(--text);
            font-size: 15px;
            outline: none
        }

        .bank-search input:focus {
            border-color: var(--accent2)
        }

        .bank-search .results {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 60vh;
            overflow-y: auto
        }

        .bank-search .result {
            background: var(--panel2);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            cursor: pointer
        }

        .bank-search .result:hover {
            border-color: var(--accent2)
        }

        .bank-search .result .qid {
            font-family: ui-monospace, monospace;
            font-size: 10.5px;
            color: var(--muted);
            margin-right: 6px
        }

        .bank-search .result .stmt {
            display: block;
            margin-top: 3px;
            color: var(--text)
        }

        .bank-search .summary {
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px
        }

        /* ===== MARKED LIST ===== */
        .marked-list {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 6px 0;
            margin-bottom: 14px
        }

        .marked-list .row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            border-top: 1px solid var(--line);
            font-size: 13.5px
        }

        .marked-list .row:first-of-type {
            border-top: 0
        }

        .marked-list .row .body {
            flex: 1;
            min-width: 0
        }

        .marked-list .row .body .meta {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 3px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .marked-list .row .body .meta .qid {
            font-family: ui-monospace, monospace;
            background: var(--panel2);
            padding: 1px 5px;
            border-radius: 3px
        }

        .marked-list .row button {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--muted);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            flex-shrink: 0
        }

        /* ===== SETTINGS / EXPORT ===== */
        .settings-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px
        }

        .settings-card h3 {
            margin: 0 0 12px;
            font-size: 14px;
            font-weight: 600
        }

        .settings-card .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-top: 1px solid var(--line);
            flex-wrap: wrap
        }

        .settings-card .row:first-of-type {
            border-top: 0;
            padding-top: 0
        }

        .settings-card .row .lbl {
            flex: 1;
            min-width: 160px
        }

        .settings-card .row .lbl .t {
            font-size: 14px;
            font-weight: 500
        }

        .settings-card .row .lbl .d {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px
        }

        .settings-card .row .ctl {
            flex-shrink: 0
        }

        .settings-card button {
            background: var(--panel2);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            min-height: 40px;
            font-family: inherit
        }

        .settings-card button:hover {
            background: var(--line)
        }

        .settings-card button.primary {
            background: var(--accent2);
            color: var(--accent2-ink);
            border-color: var(--accent2);
            font-weight: 600
        }

        .settings-card button.danger {
            color: var(--bad);
            border-color: var(--bad)
        }

        .settings-card input[type=number] {
            background: var(--panel2);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 14px;
            width: 80px;
            font-family: inherit
        }

        .seg {
            display: inline-flex;
            background: var(--panel2);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 2px
        }

        .seg button {
            background: transparent;
            border: 0;
            color: var(--muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            min-height: 34px
        }

        .seg button.active {
            background: var(--accent2);
            color: var(--accent2-ink);
            font-weight: 600
        }

        /* Sub-view (overlay) inside exámenes for stats/marked/search/settings */
        .sub-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap
        }

        .sub-bar button {
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--panel2);
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color .15s, border-color .15s, background .15s
        }

        .sub-bar button:hover {
            color: var(--text);
            border-color: var(--muted)
        }

        .sub-bar button.active {
            background: var(--accent2);
            color: var(--accent2-ink);
            border-color: var(--accent2);
            font-weight: 600
        }

        .sub-bar button.back {
            flex-shrink: 0
        }

        .sub-bar h2 {
            margin: 0;
            font-size: 17px;
            font-weight: 600
        }

        /* ===== EXAM RUNNER OVERLAY ===== */
        .exam {
            position: fixed;
            inset: 0;
            background: var(--bg);
            overflow-y: auto;
            z-index: 70;
            display: none;
            flex-direction: column;
            padding-top: env(safe-area-inset-top);
            padding-bottom: var(--safe-bottom)
        }

        .exam.open {
            display: flex
        }

        /* exam-bar: ONE single horizontal line, no wrapping on phones */
        .exam-bar {
            position: sticky;
            top: 0;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            padding: 8px 10px;
            padding-top: max(8px, env(safe-area-inset-top));
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            min-height: 52px
        }

        .exam-bar .timer {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            font-size: 17px;
            padding: 4px 9px;
            border-radius: 6px;
            background: var(--panel2);
            min-width: 72px;
            text-align: center;
            flex-shrink: 0
        }

        .exam-bar .timer.warn {
            color: var(--warn)
        }

        .exam-bar .timer.bad {
            color: var(--bad);
            animation: pulse 1s infinite
        }

        @keyframes pulse {
            50% {
                opacity: .5
            }
        }

        .exam-bar .pos {
            font-size: 13px;
            color: var(--muted);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums
        }

        .exam-bar .right {
            margin-left: auto;
            display: flex;
            gap: 5px;
            flex-shrink: 0
        }

        .exam-bar button {
            background: var(--panel2);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12.5px;
            min-height: 36px;
            white-space: nowrap
        }

        .exam-bar .finish {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent);
            font-weight: 600
        }

        .exam-body {
            flex: 1;
            padding: 16px;
            max-width: 760px;
            width: 100%;
            margin: 0 auto
        }

        .exam-q-meta {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }

        .exam-q-meta .qid {
            padding: 2px 7px;
            border-radius: 5px;
            background: var(--panel2);
            font-family: ui-monospace, monospace;
            font-size: 11px
        }

        .exam-q-meta .mark-pill {
            background: var(--mark);
            color: var(--mark-ink);
            padding: 2px 7px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 11px
        }

        .exam-statement {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 12px
        }

        .exam-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px
        }

        .exam-option {
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--text);
            text-align: left;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 15px;
            line-height: 1.4;
            cursor: pointer;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            font-family: inherit;
            transition: background .12s, border-color .12s;
            min-height: 54px
        }

        .exam-option:active {
            background: var(--panel2)
        }

        .exam-option .letter {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--panel2);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0
        }

        .exam-option .text {
            flex: 1;
            min-width: 0
        }

        .exam-option.selected {
            border-color: var(--accent2);
            background: var(--panel2)
        }

        .exam-option.selected .letter {
            background: var(--accent2);
            color: var(--accent2-ink)
        }

        .exam-option.correct {
            border-color: var(--ok);
            background: rgba(122, 209, 154, .12)
        }

        .exam-option.correct .letter {
            background: var(--ok);
            color: #0b1f3a
        }

        .exam-option.wrong {
            border-color: var(--bad);
            background: rgba(255, 122, 122, .12)
        }

        .exam-option.wrong .letter {
            background: var(--bad);
            color: #fff
        }

        .exam-explain {
            background: var(--panel);
            border: 1px solid var(--line);
            border-left: 3px solid var(--accent2);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 13.5px;
            line-height: 1.5;
            margin-bottom: 10px;
            color: var(--muted)
        }

        .exam-explain b {
            color: var(--text)
        }

        .exam-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px
        }

        .exam-actions button {
            background: var(--panel2);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            min-height: 42px;
            font-family: inherit
        }

        .exam-actions .marked {
            background: var(--mark);
            color: var(--mark-ink);
            border-color: var(--mark);
            font-weight: 600
        }

        /* Tag chips inside the exam runner (Dominada / Dudosa / Repasar) */
        .exam-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 14px;
            padding: 8px 10px;
            background: var(--panel2);
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        .exam-tags .tag-lbl {
            font-size: 12px;
            color: var(--muted);
            margin-right: 4px;
        }

        .exam-tags .tag-btn {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--muted);
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            min-height: 32px;
        }

        .exam-tags .tag-btn:hover {
            color: var(--text);
            border-color: var(--text);
        }

        .exam-tags .tag-btn.active.tag-ok {
            background: #16a34a;
            color: #fff;
            border-color: #16a34a;
        }

        .exam-tags .tag-btn.active.tag-warn {
            background: #d97706;
            color: #fff;
            border-color: #d97706;
        }

        .exam-tags .tag-btn.active.tag-hot {
            background: #dc2626;
            color: #fff;
            border-color: #dc2626;
        }

        /* Tag pill in marcadas list */
        .marked-list .tag-pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 4px;
        }

        .marked-list .tag-pill.tag-ok {
            background: rgba(22, 163, 74, .18);
            color: #16a34a;
        }

        .marked-list .tag-pill.tag-warn {
            background: rgba(217, 119, 6, .18);
            color: #d97706;
        }

        .marked-list .tag-pill.tag-hot {
            background: rgba(220, 38, 38, .18);
            color: #dc2626;
        }

        .marked-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .marked-filters .filter-chip {
            background: var(--panel2);
            border: 1px solid var(--line);
            color: var(--muted);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }

        .marked-filters .filter-chip:hover {
            color: var(--text);
        }

        .marked-filters .filter-chip.active {
            background: var(--accent2);
            color: var(--bg);
            border-color: var(--accent2);
            font-weight: 700;
        }

        .marked-filters .filter-chip b {
            margin-left: 4px;
            font-variant-numeric: tabular-nums;
        }

        .exam-nav {
            position: sticky;
            bottom: 0;
            background: var(--panel);
            border-top: 1px solid var(--line);
            padding: 10px 12px;
            padding-bottom: max(10px, var(--safe-bottom));
            display: flex;
            gap: 8px;
            align-items: center
        }

        .exam-nav button {
            background: var(--panel2);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            min-height: 48px;
            flex: 1;
            font-family: inherit
        }

        .exam-nav button.primary {
            background: var(--accent2);
            color: var(--accent2-ink);
            border-color: var(--accent2);
            font-weight: 600
        }

        .exam-nav button:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        .exam-nav .pos-mid {
            flex: 0 0 auto;
            padding: 0 8px;
            font-size: 13px;
            color: var(--muted);
            font-variant-numeric: tabular-nums
        }

        /* Question palette (overview grid) */
        .palette {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
            gap: 6px;
            padding: 14px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            margin-bottom: 14px
        }

        .palette button {
            background: var(--panel2);
            border: 1px solid var(--line);
            color: var(--muted);
            padding: 8px 0;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            min-height: 38px;
            font-family: ui-monospace, monospace
        }

        .palette button.answered {
            background: var(--accent2);
            color: var(--accent2-ink);
            border-color: var(--accent2)
        }

        .palette button.marked {
            outline: 2px solid var(--mark);
            outline-offset: -2px
        }

        .palette button.current {
            box-shadow: 0 0 0 2px var(--accent) inset
        }

        .palette button.right {
            background: var(--ok);
            color: #0b1f3a;
            border-color: var(--ok)
        }

        .palette button.bad {
            background: var(--bad);
            color: #fff;
            border-color: var(--bad)
        }

        .palette button.blank {
            background: var(--panel2);
            color: var(--muted)
        }

        /* ===== RESULTS ===== */
        .results {
            padding: 18px;
            max-width: 720px;
            margin: 0 auto
        }

        .results .score {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 24px;
            text-align: center;
            margin-bottom: 14px
        }

        .results .nota-big {
            font-size: 56px;
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums
        }

        .results .nota-big.ok {
            color: var(--ok)
        }

        .results .nota-big.warn {
            color: var(--warn)
        }

        .results .nota-big.bad {
            color: var(--bad)
        }

        .results .nota-label {
            color: var(--muted);
            font-size: 13px;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .results .breakdown {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 14px
        }

        .results .breakdown div {
            padding: 10px;
            background: var(--panel2);
            border: 1px solid var(--line);
            border-radius: 8px
        }

        .results .breakdown b {
            display: block;
            font-size: 22px;
            line-height: 1.1;
            margin-bottom: 2px
        }

        .results .breakdown span {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .4px
        }

        .results .verdict {
            margin-top: 14px;
            font-size: 14px;
            color: var(--muted)
        }

        .results .formula {
            font-size: 11.5px;
            color: var(--muted);
            margin-top: 10px;
            font-family: ui-monospace, monospace
        }

        .results .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 14px
        }

        .results .actions button {
            flex: 1;
            min-width: 140px;
            background: var(--panel2);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            min-height: 48px;
            font-family: inherit
        }

        .results .actions button.primary {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent);
            font-weight: 600
        }

        /* Compact results — for short sessions (≤30 questions) */
        .results.compact {
            padding: 14px
        }

        .results.compact .score {
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left
        }

        .results.compact .score .left {
            flex: 0 0 auto
        }

        .results.compact .nota-big {
            font-size: 36px
        }

        .results.compact .nota-label {
            margin-top: 2px
        }

        .results.compact .breakdown {
            margin-top: 0;
            grid-template-columns: repeat(3, auto);
            flex: 1;
            gap: 6px
        }

        .results.compact .breakdown div {
            padding: 6px 10px
        }

        .results.compact .breakdown b {
            font-size: 16px
        }

        .results.compact .verdict,
        .results.compact .formula {
            margin-top: 8px;
            font-size: 12px
        }

        /* F1.1 — timing summary on results screen */
        .timing-card {
            margin-top: 12px;
            padding: 12px 14px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px
        }

        .timing-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 14px
        }

        .timing-row b {
            color: var(--accent);
            font-size: 16px
        }

        .timing-slow {
            margin-top: 10px;
            border-top: 1px dashed var(--line);
            padding-top: 10px
        }

        .timing-slow-title {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px
        }

        .timing-slow ul {
            margin: 0;
            padding-left: 0;
            list-style: none
        }

        .timing-slow li {
            font-size: 13px;
            padding: 4px 0;
            color: var(--text);
            border-bottom: 1px dotted var(--line)
        }

        .timing-slow li:last-child {
            border-bottom: 0
        }

        .timing-slow li b {
            color: var(--warn);
            margin-right: 6px
        }

        /* F1.3 — per-bloque breakdown on results */
        .block-break {
            margin-top: 12px;
            padding: 12px 14px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px
        }

        .bb-title {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .4px;
            margin-bottom: 8px
        }

        .bb-rows {
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .bb-row {
            display: grid;
            grid-template-columns: 28px 1fr 40px 50px;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            padding: 4px 0;
            border-bottom: 1px dotted var(--line)
        }

        .bb-row:last-child {
            border-bottom: 0
        }

        .bb-k {
            font-weight: 700;
            text-align: center;
            padding: 2px 0;
            border-radius: 6px;
            font-size: 12px
        }

        .bb-row.A .bb-k {
            background: rgba(120, 170, 255, .18);
            color: #9ec5ff
        }

        .bb-row.B .bb-k {
            background: rgba(170, 130, 255, .18);
            color: #c4a8ff
        }

        .bb-row.C .bb-k {
            background: rgba(255, 170, 120, .18);
            color: #ffc89e
        }

        .bb-nums b {
            font-variant-numeric: tabular-nums
        }

        .bb-nums b.ok {
            color: var(--ok)
        }

        .bb-nums b.bad {
            color: var(--bad)
        }

        .bb-nums b.muted {
            color: var(--muted)
        }

        .bb-n {
            color: var(--muted);
            text-align: right;
            font-size: 11px
        }

        .bb-acc {
            text-align: right;
            font-weight: 700;
            font-variant-numeric: tabular-nums
        }

        .bb-foot {
            margin-top: 6px;
            font-size: 10px;
            color: var(--muted);
            text-align: right
        }

        /* F1.3 — bubble answer sheet (one row per question, A/B/C bubbles) */
        .answer-sheet {
            margin-top: 12px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 0
        }

        .answer-sheet summary {
            padding: 12px 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            list-style: none;
            user-select: none
        }

        .answer-sheet summary::-webkit-details-marker {
            display: none
        }

        .answer-sheet[open] summary {
            border-bottom: 1px solid var(--line)
        }

        .sheet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
            gap: 6px;
            padding: 12px
        }

        .sheet-cell {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            border-radius: 6px;
            background: var(--panel);
            border: 1px solid var(--line);
            font-size: 11px
        }

        .sheet-cell .n {
            font-variant-numeric: tabular-nums;
            color: var(--muted);
            min-width: 18px;
            font-size: 10px
        }

        .sheet-cell .bubbles {
            display: flex;
            gap: 2px
        }

        .sheet-cell .b {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--card);
            border: 1px solid var(--line);
            font-size: 9px;
            color: var(--muted);
            font-weight: 700
        }

        .sheet-cell .b.c {
            border-color: var(--ok);
            color: var(--ok)
        }

        .sheet-cell .b.u {
            background: var(--bad);
            color: #fff;
            border-color: var(--bad)
        }

        .sheet-cell .b.c.u {
            background: var(--ok);
            color: #000;
            border-color: var(--ok)
        }

        .sheet-cell.ok {
            background: rgba(80, 200, 120, .08);
            border-color: rgba(80, 200, 120, .35)
        }

        .sheet-cell.bad {
            background: rgba(255, 80, 80, .08);
            border-color: rgba(255, 80, 80, .35)
        }

        .sheet-cell.blank {
            opacity: .55
        }

        .sheet-legend {
            display: flex;
            gap: 14px;
            padding: 8px 14px 12px;
            font-size: 11px;
            color: var(--muted);
            flex-wrap: wrap
        }

        .sheet-legend i.b {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
            border: 1px solid var(--line);
            background: var(--card)
        }

        .sheet-legend i.b.c {
            border-color: var(--ok)
        }

        .sheet-legend i.b.u {
            background: var(--bad);
            border-color: var(--bad)
        }

        .sheet-legend i.b.c.u {
            background: var(--ok);
            border-color: var(--ok)
        }

        footer {
            text-align: center;
            color: var(--muted);
            font-size: 11px;
            padding: 18px 12px;
            border-top: 1px solid var(--line);
            margin-top: 20px
        }

        /* ===== SUPPLEMENTAL — phase-2 classes injected by JS ===== */

        /* Daily-goal progress on the hero */
        .hero .goal {
            margin-top: 14px
        }

        .hero .goal-head {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px
        }

        .hero .goal-head b {
            color: var(--text)
        }

        .hero .goal-bar {
            height: 8px;
            background: rgba(255, 255, 255, .08);
            border-radius: 99px;
            overflow: hidden
        }

        [data-theme="light"] .hero .goal-bar {
            background: rgba(0, 0, 0, .06)
        }

        .hero .goal-fill {
            height: 100%;
            background: var(--accent2);
            border-radius: 99px;
            transition: width .3s
        }

        /* Hero countdown + day-of-week line */
        .home .hero .countdown {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            font-size: 12.5px;
            color: var(--muted);
            margin: 2px 0 12px
        }

            font-weight: 700;

        .ics-btn {
