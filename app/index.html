            {
                n: 1, b: "A", a: "Teoría del Derecho", t: "Ordenamiento jurídico y fuentes del Derecho", norma: "Código Civil (Título Preliminar)", keys: ["fuentes", "ley", "costumbre", "jurisprudencia", "TEDH", "TJUE"], rel: [4, 8, 9, 10], d: 3, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1889-4763", rec: "https://es.wikipedia.org/wiki/Fuentes_del_Derecho",
                resumen: [
                    "Fuentes del ordenamiento jurídico español (art. 1.1 CC): la LEY, la COSTUMBRE y los PRINCIPIOS GENERALES DEL DERECHO. Jerarquía estricta: carecen de validez las disposiciones que contradigan otra de rango superior (art. 1.2 CC).",
                    "Costumbre (art. 1.3 CC): rige sólo en defecto de ley aplicable, siempre que no sea contraria a la moral o al orden público y resulte PROBADA. Los usos jurídicos que no sean meramente interpretativos de una declaración de voluntad tendrán consideración de costumbre.",
                    "Principios generales del Derecho (art. 1.4 CC): se aplican en defecto de ley y costumbre, sin perjuicio de su carácter informador del ordenamiento.",
                    "Tratados internacionales (art. 1.5 CC + art. 96 CE): válidamente celebrados, una vez publicados oficialmente en España, forman parte del ordenamiento interno. Sólo podrán ser derogados, modificados o suspendidos en la forma prevista en los tratados o conforme a las normas generales de Derecho Internacional.",
                    "Jurisprudencia (art. 1.6 CC): NO es fuente formal; COMPLEMENTA el ordenamiento con la doctrina REITERADA del Tribunal Supremo al interpretar y aplicar la ley, la costumbre y los principios generales (se exigen 2 sentencias del TS en el mismo sentido).",
                    "Deber inexcusable de fallar (art. 1.7 CC): los Jueces y Tribunales tienen el deber inexcusable de resolver en todo caso los asuntos de que conozcan, ateniéndose al sistema de fuentes establecido.",
                    "Jerarquía normativa española: 1) Constitución; 2) Tratados internacionales; 3) Leyes orgánicas (mayoría absoluta Congreso, materias del art. 81 CE: DDFF, Estatutos, régimen electoral); 4) Leyes ordinarias, Decretos-leyes (art. 86 CE) y Decretos legislativos (arts. 82-85 CE); 5) Reglamentos por orden jerárquico: RD del Consejo de Ministros, RD del Presidente, Orden ministerial.",
                    "Decreto-ley (art. 86 CE): caso de extraordinaria y urgente necesidad. NO pueden afectar al ordenamiento de las instituciones básicas del Estado, a los DDFF y libertades del Título I, al régimen de las CCAA ni al Derecho electoral general. Convalidación o derogación por el Congreso en 30 días.",
                    "Decreto legislativo (arts. 82-85 CE): las Cortes delegan en el Gobierno mediante ley de bases (texto articulado) o ley ordinaria (texto refundido). No delegable: materias de ley orgánica.",
                    "Aplicación de las normas (art. 2 CC): las leyes entrarán en vigor a los 20 DÍAS de su completa publicación en el BOE, si en ellas no se dispone otra cosa. Las leyes sólo se derogan por otras posteriores (no por desuso). Las leyes no tendrán efecto retroactivo si no dispusieren lo contrario.",
                    "Interpretación (art. 3 CC): según el sentido propio de las palabras, el contexto, los antecedentes históricos y legislativos, y la realidad social del tiempo en que han de ser aplicadas, atendiendo fundamentalmente al espíritu y finalidad de la norma. La equidad habrá de ponderarse en la aplicación de las normas; las resoluciones de los tribunales sólo podrán descansar de manera exclusiva en ella cuando la ley expresamente lo permita.",
                    "Analogía (art. 4 CC): procederá la aplicación analógica cuando las normas no contemplen un supuesto específico, pero regulen otro semejante entre los que se aprecie identidad de razón. NO se aplican analógicamente las leyes penales, las excepcionales ni las de ámbito temporal.",
                    "Fraude de ley (art. 6.4 CC): los actos realizados al amparo del texto de una norma que persigan un resultado prohibido o contrario al ordenamiento se considerarán en fraude de ley y no impedirán la debida aplicación de la norma que se hubiere tratado de eludir.",
                    "Truco examen: distinguir IUS PUNIENDI (potestad sancionadora del Estado) vs IUS POENALE (conjunto de normas penales). Distinguir LEY (escrita, votada en Cortes) vs COSTUMBRE (no escrita, probada). La jurisprudencia COMPLEMENTA, no es fuente."
                ]
            },
            {
                n: 2, b: "A", a: "Derecho Civil — Persona", t: "La persona física y jurídica. Capacidad. Emancipación", norma: "Código Civil arts. 29-34, 314-324", keys: ["persona", "capacidad jurídica", "capacidad de obrar", "emancipación", "estado civil"], rel: [3], d: 2, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1889-4763", rec: "https://es.wikipedia.org/wiki/Persona_(Derecho)",
                resumen: [
                    "Personalidad civil (art. 29 CC): se adquiere en el momento del NACIMIENTO. El concebido se tiene por nacido para todos los efectos que le sean favorables, siempre que nazca con las condiciones del art. 30.",
                    "Requisito del art. 30 CC (redacción tras Ley 20/2011): la personalidad se adquiere en el momento del NACIMIENTO CON VIDA, una vez producido el ENTERO DESPRENDIMIENTO del seno materno. (Eliminado el requisito de las 24 horas de la redacción anterior).",
                    "Extinción (art. 32 CC): la personalidad civil se extingue por la MUERTE de la persona.",
                    "Premoriencia (art. 33 CC): si se duda, entre dos o más personas llamadas a sucederse, quién de ellas ha muerto primero, el que sostenga la muerte anterior de una o de otra debe probarla; a falta de prueba, se presumen muertas al mismo tiempo y no tiene lugar la transmisión de derechos de uno a otro (conmoriencia).",
                    "Persona jurídica (art. 35 CC): son personas jurídicas — 1.º Las corporaciones, asociaciones y fundaciones de interés público reconocidas por la ley; 2.º Las asociaciones de interés particular (civiles, mercantiles o industriales) a las que la ley conceda personalidad propia.",
                    "Capacidad de las personas jurídicas (art. 37 CC): la de las CORPORACIONES por las leyes que las hayan creado o reconocido; la de las ASOCIACIONES por sus ESTATUTOS; la de las FUNDACIONES por las reglas de su institución debidamente aprobadas por disposición administrativa cuando este requisito fuere necesario.",
                    "Mayoría de edad (art. 315 CC): la mayor edad empieza a los DIECIOCHO AÑOS cumplidos. Para el cómputo se incluirá completo el día del nacimiento.",
                    "Emancipación (art. 314 CC) — causas: 1.ª) Por mayor edad; 2.ª) Por concesión de los que ejerzan la patria potestad; 3.ª) Por concesión judicial. (La emancipación por matrimonio fue suprimida por la Ley 8/2021).",
                    "Emancipación por concesión paterna (art. 317 CC): requiere que el menor tenga 16 AÑOS cumplidos y la consienta. Se otorgará por ESCRITURA PÚBLICA o por COMPARECENCIA ante el Juez encargado del Registro.",
                    "Emancipación por concesión judicial (art. 320 CC): el Juez podrá conceder la emancipación a los hijos mayores de 16 años si éstos la pidieren y previa audiencia de los progenitores: a) Cuando quien ejerce la patria potestad contrajere nupcias o conviviere maritalmente con persona distinta del otro progenitor; b) Cuando los padres vivieren separados; c) Cuando concurra cualquier causa que entorpezca gravemente el ejercicio de la patria potestad.",
                    "Vida independiente (art. 319 CC): se reputará para todos los efectos como emancipado al hijo mayor de DIECISÉIS AÑOS que con el consentimiento de los padres viviere independientemente de ellos. Los padres podrán revocar este consentimiento.",
                    "Efectos de la emancipación (art. 323 CC): habilita al menor para regir su persona y bienes COMO SI FUERA MAYOR, pero hasta los 18 años NO podrá: tomar dinero a préstamo, gravar o enajenar bienes inmuebles y establecimientos mercantiles o industriales u objetos de extraordinario valor sin consentimiento de sus padres y, a falta de ambos, del CURADOR.",
                    "Ley 8/2021 (apoyo a personas con discapacidad): reformó el CC. Desaparecen los términos 'incapacitación' y 'tutela del mayor'; se sustituyen por MEDIDAS DE APOYO (voluntarias, guarda de hecho, curatela, defensor judicial). La regla es la curatela ASISTENCIAL; sólo excepcionalmente representativa.",
                    "Truco examen: la emancipación NUNCA es por matrimonio desde 2021. Mayoría de edad = 18 cumplidos, computado el día del nacimiento ÍNTEGRO. Persona física nace al desprenderse vivo; jurídica nace según sus estatutos/leyes."
                ]
            },
            {
                n: 3, b: "A", a: "Derecho Civil — Persona", t: "Nacionalidad, vecindad, domicilio, ausencia, muerte", norma: "Código Civil arts. 17-28, 40-42, 181-198", keys: ["nacionalidad", "doble nacionalidad", "refugiado", "apátrida", "premoriencia"], rel: [2, 15, 17], d: 2, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1889-4763", rec: "https://es.wikipedia.org/wiki/Nacionalidad_espa%C3%B1ola",
                resumen: [
                    "Nacionalidad española de ORIGEN (art. 17 CC): 1.º Nacidos de padre o madre españoles (IUS SANGUINIS); 2.º Nacidos en España de padres extranjeros si uno tiene también nacionalidad española; 3.º Nacidos en España de padres extranjeros si AMBOS carecen de nacionalidad o si la legislación de ninguno de ellos atribuye al hijo una nacionalidad (evita apatridia); 4.º Nacidos en España cuya filiación no resulte determinada (presunción IUS SOLI subsidiario).",
                    "Adopción (art. 19 CC): el extranjero menor de 18 años adoptado por español adquiere desde la adopción la nacionalidad española de origen. Si el adoptado es mayor de 18 podrá optar a la nacionalidad española de origen en el plazo de 2 AÑOS desde la adopción.",
                    "Adquisición por OPCIÓN (art. 20 CC): tienen derecho — a) las personas que estén o hayan estado sujetas a la patria potestad de un español; b) aquellas cuyo padre o madre hubiera sido originariamente español y nacido en España; c) las que se hallen en supuesto del art. 17.2 (filiación o nacimiento descubiertos después de los 18). Plazo: 2 años desde la emancipación o desde la declaración. Mayores de 14 + asistidos del representante. Mayores de 18 — por sí.",
                    "Adquisición por RESIDENCIA (art. 22 CC) — plazos: 10 AÑOS (regla general), 5 años (refugiados), 2 años (iberoamericanos, Andorra, Filipinas, Guinea Ecuatorial, Portugal y sefardíes), 1 año (nacido en territorio español; el que no haya ejercitado a tiempo la facultad de optar; el casado con español/a; viudo/a de español/a; nacido fuera de España de padre/madre que originariamente hubieran sido españoles). Residencia LEGAL, CONTINUADA e INMEDIATAMENTE ANTERIOR a la petición.",
                    "Requisitos (art. 22.4 CC): buena conducta cívica y SUFICIENTE GRADO DE INTEGRACIÓN en la sociedad española (examen CCSE + DELE A2, salvo iberoamericanos y excepciones).",
                    "Pérdida de la nacionalidad (art. 24 CC): los emancipados que residan habitualmente en el extranjero y adquieran voluntariamente otra nacionalidad o utilicen exclusivamente la extranjera. La pérdida se produce una vez transcurridos 3 AÑOS desde la adquisición o desde la emancipación. La adquiridos en países iberoamericanos, Andorra, Filipinas, Guinea Ecuatorial, Portugal o sefardíes NO produce pérdida (doble nacionalidad).",
                    "Vecindad civil (art. 14 CC): determina la sujeción al Derecho civil común o al especial o foral. Se adquiere: por nacimiento (de padres con esa vecindad), por opción (a los 14), por residencia de 2 años MANIFESTADA o 10 años continuados sin declaración en contrario.",
                    "Domicilio (art. 40 CC): el domicilio de las personas naturales es el lugar de su RESIDENCIA HABITUAL y, en su caso, el que determine la LECiv. El domicilio de los diplomáticos residentes por razón de su cargo en el extranjero, que gocen del derecho de extraterritorialidad, será el último que hubieren tenido en territorio español.",
                    "Domicilio persona jurídica (art. 41 CC): cuando ni la ley que las haya creado o reconocido ni los estatutos o las reglas de fundación fijaren el domicilio, se entenderá que lo tienen en el lugar en que se halle establecida su representación legal o donde ejerzan las principales funciones de su instituto.",
                    "Ausencia — DEFENSOR DEL DESAPARECIDO (art. 181 CC): cuando una persona haya desaparecido de su domicilio o último lugar de residencia sin que de ella se tenga noticias, podrá el Secretario judicial, a instancia de parte interesada o del Ministerio Fiscal, nombrar un defensor que ampare y represente al desaparecido.",
                    "Declaración de AUSENCIA LEGAL (art. 183 CC): procede transcurrido 1 AÑO desde las últimas noticias o, a falta de éstas, desde su desaparición, si no hubiese dejado apoderado con facultades de administración de todos sus bienes; 3 AÑOS si lo hubiese dejado.",
                    "Obligados a promover la declaración de ausencia (art. 182 CC) — SIN orden de preferencia: 1.º El cónyuge del ausente no separado legalmente; 2.º Los parientes consanguíneos hasta el 4.º grado; 3.º El Ministerio Fiscal de oficio o en virtud de denuncia.",
                    "Declaración de FALLECIMIENTO (arts. 193-194 CC): procede transcurridos 10 AÑOS desde las últimas noticias o, a falta de éstas, desde su desaparición. Plazo de 5 AÑOS si al expirar el ausente hubiese cumplido 75. Plazos especiales: 1 año desde el riesgo (siniestro con violencia o presencia en zona de guerra; subversión de naves o aeronaves cuyos restos no se hubieren hallado), 3 meses si pasaje confirmado.",
                    "Truco examen: AUSENCIA legal = 1 año (sin apoderado) / 3 años (con). FALLECIMIENTO = 10 años regla / 5 años si mayor 75 / 1 año siniestro / 3 meses pasaje. Nacionalidad por residencia 10 / 5 / 2 / 1."
                ]
            },
            {
                n: 4, b: "A", a: "Derecho Constitucional", t: "La Constitución: concepto, clases y reforma", norma: "CE 1978", keys: ["Constitución", "reforma constitucional", "norma jurídica"], rel: [1, 5, 6, 7, 43], d: 3, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229", rec: "https://www.congreso.es/constitucion/constitucion/indice",
                resumen: [
                    "CE 1978: aprobada por las Cortes el 31 oct 1978, ratificada en referéndum el 6 dic 1978, sancionada por el Rey el 27 dic 1978 y publicada en BOE el 29 dic 1978. Estructura: PREÁMBULO + 169 artículos (Título Preliminar + 10 Títulos) + 4 disposiciones adicionales + 9 transitorias + 1 derogatoria + 1 final.",
                    "Clases de Constituciones — por su FORMA: ESCRITAS (codificadas en un texto, como la española) vs CONSUETUDINARIAS (basadas en usos y costumbres, como la del Reino Unido; no recogidas en documento escrito formal).",
                    "Por su REFORMA: RÍGIDAS (procedimiento especial agravado, como la CE) vs FLEXIBLES (se reforman como una ley ordinaria). La CE es de las más rígidas del entorno europeo.",
                    "Por su ORIGEN: OTORGADAS (concedidas por el Monarca), PACTADAS (acuerdo Rey-pueblo) o IMPUESTAS/POPULARES (emanan del poder constituyente del pueblo — la CE 1978).",
                    "Por su EXTENSIÓN: BREVES (sólo principios, como la de EE.UU.) vs EXTENSAS (regulan en detalle, como la española).",
                    "Características de la CE: NORMATIVA (norma jurídica directamente aplicable, no programática), SUPREMA (jerarquía superior, art. 9.1 — los ciudadanos y los poderes públicos están sujetos a la Constitución), CONSENSUADA (fruto del pacto entre fuerzas políticas), ABIERTA (admite distintas opciones políticas).",
                    "Iniciativa de reforma constitucional (art. 166 + 87.1 y 2 CE): Gobierno, Congreso, Senado y Asambleas legislativas de las CCAA. NO cabe iniciativa legislativa popular para la reforma constitucional (art. 87.3 CE).",
                    "Procedimiento ORDINARIO de reforma (art. 167 CE): aprobación por mayoría de 3/5 de cada Cámara. Si no hay acuerdo, Comisión paritaria. Si el Senado no alcanza los 3/5 pero sí la mayoría absoluta, el Congreso podrá aprobar la reforma por mayoría de 2/3. Referéndum facultativo si lo solicitan 1/10 de los miembros de cualquier Cámara dentro de los 15 días siguientes a su aprobación.",
                    "Procedimiento AGRAVADO (art. 168 CE): se aplica cuando se propone revisión TOTAL o parcial que afecte al Título Preliminar, al Capítulo II Sección 1ª del Título I (DDFF y libertades públicas, arts. 15-29) o al Título II (la Corona). Pasos: 1) aprobación del principio por 2/3 de cada Cámara; 2) disolución inmediata de las Cortes; 3) las nuevas Cámaras elegidas deben ratificar la decisión y proceder al estudio del nuevo texto, que deberá ser aprobado por 2/3 de ambas Cámaras; 4) REFERÉNDUM OBLIGATORIO de ratificación.",
                    "Límites temporales (art. 169 CE): no podrá iniciarse la reforma constitucional en tiempo de GUERRA o de vigencia de alguno de los estados de ALARMA, EXCEPCIÓN o SITIO (art. 116).",
                    "Reformas efectuadas a la CE 1978: sólo DOS: (1) Art. 13.2 (1992, para permitir el sufragio pasivo de los extranjeros UE en municipales, tras Tratado de Maastricht); (2) Art. 135 (2011, estabilidad presupuestaria, prioridad absoluta del pago de la deuda pública).",
                    "Truco examen: la CE 1978 es RÍGIDA, ESCRITA y POPULAR. Reforma art. 168 = 2/3 + disolución + nuevas Cortes 2/3 + REFERÉNDUM OBLIGATORIO. Reforma art. 167 = 3/5 + referéndum si lo piden 1/10. Sólo 2 reformas: art. 13.2 y art. 135."
                ]
            },
            {
                n: 5, b: "A", a: "Derecho Constitucional", t: "Derechos fundamentales y libertades públicas", norma: "CE Título I (arts. 14-55)", keys: ["DDFF", "igualdad", "recurso amparo", "Defensor del Pueblo", "suspensión derechos"], rel: [4, 9, 43, 55], d: 4, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229", rec: "https://www.tribunalconstitucional.es/",
                resumen: [
                    "Título I CE 'De los derechos y deberes fundamentales' (arts. 10-55). Art. 10: dignidad de la persona, libre desarrollo de la personalidad, derechos inviolables, son fundamento del orden político. Interpretación conforme a la DUDH y Tratados internacionales ratificados.",
                    "Capítulo I (arts. 11-13) — DE LOS ESPAÑOLES Y LOS EXTRANJEROS: nacionalidad, mayoría de edad (18), derechos de los extranjeros (arts. 13.1 — gozan de las libertades del Título I en los términos de los tratados y la ley). Solo los españoles serán titulares del art. 23 (participación política), salvo el sufragio activo y pasivo en elecciones municipales por reciprocidad o tratado UE.",
                    "Capítulo II — DERECHOS Y LIBERTADES (arts. 14-38). Se divide en: Sección 1ª 'Derechos fundamentales y libertades públicas' (arts. 15-29) y Sección 2ª 'Derechos y deberes de los ciudadanos' (arts. 30-38). Art. 14: igualdad ante la ley (sin discriminación por nacimiento, raza, sexo, religión, opinión o circunstancia personal o social) — está al inicio del Capítulo, NO en la Sección 1ª.",
                    "Sección 1ª — DDFF (arts. 15-29): vida e integridad física y moral, libertad ideológica y religiosa, libertad y seguridad (art. 17 — detención máx. 72h), honor, intimidad y propia imagen (art. 18 — inviolabilidad domicilio y secreto comunicaciones), libertad de residencia y circulación (art. 19), libertades de expresión y comunicación (art. 20), reunión pacífica (art. 21), asociación (art. 22), participación política (art. 23), tutela judicial efectiva (art. 24), legalidad penal (art. 25), enseñanza y libertad de cátedra (art. 27), sindicación y huelga (art. 28), petición (art. 29).",
                    "Sección 2ª — Derechos y deberes ciudadanos (arts. 30-38): defender España (art. 30), tributos (art. 31), matrimonio (art. 32), propiedad y herencia (art. 33), fundación (art. 34), trabajo (art. 35), colegios profesionales (art. 36), negociación colectiva (art. 37), libertad de empresa (art. 38).",
                    "Capítulo III — PRINCIPIOS RECTORES de la política social y económica (arts. 39-52): NO son derechos subjetivos exigibles directamente; informan la legislación, la práctica judicial y la actuación de los poderes públicos; sólo podrán ser alegados ante la jurisdicción ordinaria de acuerdo con lo que dispongan las leyes que los desarrollen (art. 53.3).",
                    "Capítulo IV — GARANTÍAS de las libertades (arts. 53-54). Garantías GENERALES (art. 53.1): vinculan a todos los poderes públicos; sólo por LEY, que respete su contenido esencial; protección reforzada del art. 14 + Sección 1ª. Garantías ESPECÍFICAS de los arts. 14-30 (art. 53.2): procedimiento basado en los principios de PREFERENCIA Y SUMARIEDAD ante los tribunales ordinarios + RECURSO DE AMPARO ante el Tribunal Constitucional. Defensor del Pueblo (art. 54): alto comisionado de las Cortes; designado por éstas para la defensa de los derechos del Título I; supervisa la actividad de la Administración.",
                    "Desarrollo por LEY ORGÁNICA (art. 81 CE): los derechos fundamentales y libertades públicas (Sección 1ª) sólo pueden desarrollarse por LO. El régimen jurídico será objeto de regulación por ley orgánica (mayoría absoluta del Congreso).",
                    "Capítulo V — SUSPENSIÓN de derechos (art. 55). Suspensión COLECTIVA (art. 55.1): en estados de EXCEPCIÓN o SITIO podrán suspenderse arts. 17 (libertad personal — el plazo de 72h se amplía), 18.2 y 3 (domicilio y comunicaciones), 19, 20.1.a y d, 20.5, 21, 28.2 y 37.2. NUNCA el art. 17.3 (derechos del detenido) en estado de excepción.",
                    "Suspensión INDIVIDUAL (art. 55.2): una LO podrá determinar la forma y casos en que, de forma individual y con la necesaria intervención judicial y el adecuado control parlamentario, pueden ser suspendidos los arts. 17.2 (plazo 72h) y 18.2 y 3 (domicilio y secreto comunicaciones) para personas determinadas, en investigaciones de la actuación de bandas armadas o elementos TERRORISTAS. Su utilización injustificada o abusiva producirá responsabilidad penal.",
                    "Recurso de amparo (art. 161.1.b CE + LOTC): protege los arts. 14-30 frente a violaciones por disposiciones, actos jurídicos, omisiones o simple vía de hecho de los poderes públicos. Plazo: 30 días desde la notificación de la resolución que ponga fin al proceso judicial. Subsidiario (agotar la vía judicial previa).",
                    "Reformas constitucionales (recordatorio): solo 2 — art. 13.2 (1992, sufragio pasivo UE) y art. 135 (2011, estabilidad presupuestaria).",
                    "Truco examen: ART. 14 (igualdad) está al inicio del Capítulo II pero NO en la Sección 1ª; pese a ello, sí tiene amparo por la remisión del art. 53.2. Suspensión COLECTIVA = excepción/sitio. Suspensión INDIVIDUAL = LO + terrorismo + intervención judicial. Defensor del Pueblo = Cortes, no Gobierno."
                ]
            },
            {
                n: 6, b: "A", a: "Derecho Constitucional", t: "Órganos constitucionales", norma: "CE Títulos II-IX", keys: ["Corona", "Cortes", "Gobierno", "CGPJ", "TC"], rel: [4, 11, 43], d: 3, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229", rec: "https://www.congreso.es/",
                resumen: [
                    "TÍTULO II — DE LA CORONA (arts. 56-65). El Rey es el Jefe del Estado, símbolo de su unidad y permanencia, arbitra y modera el funcionamiento regular de las instituciones, asume la más alta representación en las relaciones internacionales. Su persona es INVIOLABLE y no está sujeta a responsabilidad (art. 56.3); sus actos estarán siempre REFRENDADOS (art. 64) por el Presidente del Gobierno, los ministros o el Presidente del Congreso (proposición y nombramiento del Presidente del Gobierno y disolución de Cortes art. 99).",
                    "Sucesión a la Corona (art. 57 CE): la Corona es hereditaria en los sucesores de S.M. Don Juan Carlos I, siguiendo el orden regular de primogenitura y representación; en igual grado, preferirá la línea anterior a las posteriores; en la misma línea, el grado más próximo al más remoto; en el mismo grado, el VARÓN A LA MUJER; en el mismo sexo, la persona de más edad a la de menos. El Príncipe heredero ostentará el título de PRÍNCIPE DE ASTURIAS.",
                    "REGENCIA (art. 59 CE): minoría del Rey — la ejercerá el padre o madre del Rey, en su defecto el pariente mayor de edad más próximo a suceder según el art. 57, durante el tiempo de la minoría. Si el Rey se INHABILITARE y la imposibilidad fuere reconocida por las Cortes Generales: entrará a ejercer inmediatamente la Regencia el PRÍNCIPE HEREDERO de la Corona, si fuera mayor de edad. Si no lo fuera, conforme al apartado anterior, hasta su mayoría. Si no hay persona a quien corresponda, las Cortes Generales designarán Regencia (1, 3 o 5 personas).",
                    "TUTELA del Rey menor (art. 60): la persona que el Rey difunto hubiese nombrado en su testamento, siempre que sea español de nacimiento; si no le hubiese nombrado, será tutor el padre o madre, mientras permanezcan viudos; en su defecto, será nombrado por las Cortes Generales. INCOMPATIBLE: cargo o representación política.",
                    "Funciones del Rey (art. 62): sancionar y promulgar las leyes; convocar y disolver las Cortes; convocar elecciones y referéndum; proponer al candidato a Presidente del Gobierno y nombrarlo; nombrar y separar miembros del Gobierno a propuesta del Presidente; expedir decretos acordados en Consejo de Ministros; mando supremo de las Fuerzas Armadas; ejercer el derecho de gracia (NO indultos generales); alto patronazgo de las Reales Academias.",
                    "TÍTULO III — CORTES GENERALES (arts. 66-96). Bicameralismo IMPERFECTO: Congreso de los Diputados (300-400, hoy 350; 4 años; circunscripción provincia) y Senado (cámara de representación territorial: 4 por provincia + insulares + CCAA designan 1 + 1 por millón). Inmunidad e inviolabilidad (art. 71). Reglamentos propios aprobados por mayoría absoluta.",
                    "TÍTULO IV — GOBIERNO Y ADMINISTRACIÓN (arts. 97-107). Gobierno = Presidente + Vicepresidentes (en su caso) + Ministros. Funciones (art. 97): dirige la política interior y exterior, la administración civil y militar y la defensa del Estado; ejerce la función ejecutiva y la potestad reglamentaria. Investidura (art. 99): el Rey propone candidato; el Congreso lo inviste por mayoría absoluta en 1ª votación o simple en 2ª (48 h después). Si no se logra en 2 meses desde la 1ª votación, disolución y nuevas elecciones.",
                    "Moción de censura (art. 113 CE): CONSTRUCTIVA — debe incluir candidato alternativo. Propuesta por al menos 1/10 de los diputados. Aprobación por mayoría ABSOLUTA del Congreso. Plazo: no se votará antes de 5 días desde su presentación; en los 2 primeros podrán presentarse mociones alternativas. Si no se aprueba, los signatarios no podrán presentar otra en el mismo periodo de sesiones.",
                    "Cuestión de confianza (art. 112): el Presidente, previa deliberación del Consejo de Ministros, puede plantearla sobre su programa o sobre una declaración de política general. La confianza se entiende otorgada cuando vote a favor la mayoría SIMPLE del Congreso.",
                    "TÍTULO VI — PODER JUDICIAL (arts. 117-127). Principios: independencia, inamovilidad, responsabilidad, sometimiento únicamente al imperio de la ley. Unidad jurisdiccional (excluida la militar en su ámbito y los estados de sitio). CONSEJO GENERAL DEL PODER JUDICIAL (art. 122): órgano de gobierno; 20 miembros + Presidente del TS que lo preside; nombrados por el Rey por 5 años (12 entre Jueces y Magistrados; 4 a propuesta del Congreso + 4 del Senado, ambos por 3/5).",
                    "MINISTERIO FISCAL (art. 124): promueve la acción de la justicia en defensa de la legalidad, los derechos de los ciudadanos y el interés público tutelado por la ley. Principios: UNIDAD de actuación y DEPENDENCIA JERÁRQUICA y sujeción en todo caso a los de LEGALIDAD e IMPARCIALIDAD. Fiscal General del Estado: nombrado por el Rey a propuesta del Gobierno, oído el CGPJ.",
                    "TÍTULO IX — TRIBUNAL CONSTITUCIONAL (arts. 159-165). 12 magistrados nombrados por el Rey: 4 a propuesta del Congreso por 3/5; 4 del Senado por 3/5; 2 del Gobierno; 2 del CGPJ. Mandato 9 años, renovados por terceras partes cada 3 años. Competencias (art. 161): recurso y cuestión de INCONSTITUCIONALIDAD (LO, leyes, normas con fuerza de ley); recurso de AMPARO; conflictos de competencia Estado-CCAA o entre CCAA; otras atribuciones LO.",
                    "OTROS órganos constitucionales: TRIBUNAL DE CUENTAS (art. 136 — supremo órgano fiscalizador de las cuentas y de la gestión económica del Estado; dependiente de las Cortes); CONSEJO DE ESTADO (art. 107 — supremo órgano consultivo del Gobierno); DEFENSOR DEL PUEBLO (art. 54 — alto comisionado de las Cortes).",
                    "Truco examen: Moción de censura es CONSTRUCTIVA y por MAYORÍA ABSOLUTA. TC = 12 magistrados / 9 años / 1/3 cada 3. CGPJ = 20 + Presidente TS / 5 años / 3/5 en cada Cámara. Refrendo del art. 64 SIEMPRE; sin refrendo carecen de validez."

            {
                n: 7, b: "A", a: "Derecho Constitucional", t: "Organización territorial. Estado autonómico", norma: "CE Título VIII", keys: ["CCAA", "autonomía local", "Estado regional"], rel: [4, 14], d: 3, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229", rec: "https://es.wikipedia.org/wiki/Organizaci%C3%B3n_territorial_de_Espa%C3%B1a",
                resumen: [
                    "Título VIII CE 'De la organización territorial del Estado' (arts. 137-158). El Estado se organiza territorialmente en MUNICIPIOS, en PROVINCIAS y en las COMUNIDADES AUTÓNOMAS que se constituyan (art. 137). Todas estas entidades gozan de AUTONOMÍA para la gestión de sus respectivos intereses.",
                    "Principios constitucionales (arts. 138-139): garantía de la realización efectiva del principio de SOLIDARIDAD entre las CCAA. Igualdad de derechos y obligaciones de los españoles en cualquier parte del territorio. Las diferencias entre los Estatutos NO podrán implicar privilegios económicos o sociales. Libertad de circulación y establecimiento.",
                    "FORMAS DEL ESTADO según la organización territorial: ESTADO UNITARIO (centralización completa, p. ej. Francia), ESTADO FEDERAL (entidades federadas o Estados-miembros conservan parte de su soberanía, p. ej. EE.UU., Alemania), ESTADO REGIONAL O AUTONÓMICO (España — descentralización política, las CCAA tienen autonomía política pero no soberanía), ESTADO CONFEDERAL (asociación de Estados soberanos).",
                    "MUNICIPIO (art. 140 CE): la Constitución garantiza la AUTONOMÍA de los municipios. Estos gozarán de personalidad jurídica plena. Su gobierno y administración corresponde a sus respectivos Ayuntamientos, integrados por los ALCALDES y los CONCEJALES. Los Concejales serán elegidos por sufragio universal, igual, libre, directo y secreto. Los Alcaldes serán elegidos por los Concejales o por los vecinos. Elementos: TERRITORIO, POBLACIÓN, ORGANIZACIÓN.",
                    "PROVINCIA (art. 141 CE): entidad local con personalidad jurídica propia, determinada por la agrupación de municipios y división territorial para el cumplimiento de las actividades del Estado. Su gobierno y administración estará encomendado a DIPUTACIONES u otras Corporaciones de carácter representativo. En los archipiélagos: islas — Cabildos Insulares (Canarias) y Consejos Insulares (Baleares).",
                    "Constitución de CCAA (arts. 143-144 CE) — vía LENTA o COMÚN (art. 143): provincias limítrofes con características históricas, culturales y económicas comunes, los territorios insulares y las provincias con entidad regional histórica. Iniciativa: todas las Diputaciones interesadas + 2/3 de los municipios cuya población represente al menos la mayoría del censo electoral de cada provincia.",
                    "Vía RÁPIDA O ESPECIAL (art. 151 CE): exige aprobación adicional por referéndum por mayoría absoluta del censo en cada provincia. Acceso reservado a los 'territorios históricos' (DT 2ª — Cataluña, País Vasco, Galicia, que habían plebiscitado anteriormente Estatutos). Andalucía la utilizó vía art. 151. Las demás CCAA fueron por el 143.",
                    "ESTATUTO DE AUTONOMÍA (art. 146 CE): el PROYECTO será elaborado por una ASAMBLEA compuesta por los miembros de la Diputación u órgano interinsular de las provincias afectadas y por los Diputados y Senadores elegidos en ellas, y será elevado a las Cortes Generales para su tramitación como ley.",
                    "Contenido del Estatuto (art. 147 CE): la denominación de la Comunidad; la delimitación de su territorio; la denominación, organización y sede de las instituciones autónomas propias; las competencias asumidas y las bases para el traspaso de los servicios correspondientes.",
                    "Reforma del Estatuto (art. 147.3): se ajustará al procedimiento establecido en los mismos y requerirá, en todo caso, la APROBACIÓN POR LAS CORTES GENERALES mediante ley orgánica.",
                    "COMPETENCIAS de las CCAA (art. 148 CE): organización de sus instituciones de autogobierno, alteraciones de los términos municipales en su territorio, ordenación del territorio, urbanismo y vivienda, obras públicas, ferrocarriles y carreteras de su ámbito, puertos y aeropuertos de refugio y deportivos, agricultura y ganadería, montes y aprovechamientos forestales, gestión en materia de protección del medio ambiente, fomento del desarrollo económico, artesanía, museos y bibliotecas de interés autonómico, patrimonio monumental, fomento de la cultura, promoción del deporte, asistencia social, sanidad e higiene, vigilancia y protección de sus edificios e instalaciones.",
                    "COMPETENCIAS EXCLUSIVAS DEL ESTADO (art. 149 CE): nacionalidad, inmigración, emigración, extranjería y derecho de asilo; relaciones internacionales; defensa y FFAA; Administración de Justicia; legislación mercantil, penal y penitenciaria, procesal; legislación laboral; legislación civil sin perjuicio de la conservación, modificación y desarrollo por las CCAA de los derechos civiles, forales o especiales; bases y coordinación de la planificación general de la actividad económica; régimen aduanero y arancelario; sistema monetario; Hacienda general y deuda del Estado; sanidad exterior; legislación básica y régimen económico de la Seguridad Social; bases del régimen jurídico de las AAPP; régimen electoral general; pesca marítima; marina mercante; ferrocarriles y transportes terrestres que transcurran por más de una CA; SEGURIDAD PÚBLICA, sin perjuicio de la posibilidad de creación de policías por las CCAA en la forma que se establezca en los respectivos Estatutos en el marco de lo que disponga una LO.",
                    "Cláusula RESIDUAL (art. 149.3 CE): las materias no atribuidas EXPRESAMENTE al Estado por la Constitución podrán corresponder a las CCAA en virtud de sus respectivos Estatutos. La competencia sobre las materias que no se hayan asumido por los Estatutos de Autonomía corresponderá al Estado.",
                    "Truco examen: Estado AUTONÓMICO ≠ federal. Municipios elementos = TERRITORIO + POBLACIÓN + ORGANIZACIÓN. CCAA constitución via 143 (lenta) o 151 (rápida, referéndum). SEGURIDAD PÚBLICA es exclusiva del Estado (art. 149.1.29ª) pero los Estatutos + LO pueden crear policías autonómicas."
                ]

                n: 8, b: "A", a: "Derecho UE", t: "Unión Europea. Tratados, Derecho derivado, Schengen", norma: "TFUE, TUE", keys: ["UE", "tratados", "Schengen", "JAI"], rel: [1, 9, 17, 24], d: 3, boe: "https://eur-lex.europa.eu/collection/eu-law/treaties.html", rec: "https://european-union.europa.eu/index_es",
                resumen: [
                    "UE — evolución de los tratados: TRATADO DE PARÍS 1951 (CECA, 6 países), TRATADOS DE ROMA 1957 (CEE + EURATOM), ACTA ÚNICA EUROPEA 1986 (mercado interior 1993), TRATADO DE MAASTRICHT 1992 (crea la UE, 3 pilares, ciudadanía europea, euro), TRATADO DE ÁMSTERDAM 1997, TRATADO DE NIZA 2001, TRATADO DE LISBOA 2007 (en vigor 1 dic 2009 — actual marco jurídico, da personalidad jurídica única a la UE, vincula la CDF).",
                    "DERECHO ORIGINARIO de la UE: los TRATADOS — Tratado de la Unión Europea (TUE) y Tratado de Funcionamiento de la UE (TFUE), junto con la Carta de Derechos Fundamentales (CDF, valor jurídico equivalente desde Lisboa) y los protocolos anexos.",
                    "DERECHO DERIVADO (art. 288 TFUE) — actos típicos: REGLAMENTO (alcance general, obligatorio en todos sus elementos, directamente aplicable en cada Estado miembro); DIRECTIVA (obliga al Estado miembro destinatario en cuanto al RESULTADO; deja a las autoridades nacionales la elección de la forma y los medios — requiere transposición); DECISIÓN (obligatoria en todos sus elementos; si designa destinatarios, sólo a éstos); RECOMENDACIONES y DICTÁMENES (no vinculantes).",
                    "COMPETENCIAS DE LA UE (arts. 2-6 TFUE) — EXCLUSIVAS (art. 3 TFUE, sólo la UE puede legislar): unión aduanera, normas de competencia para el mercado interior, política monetaria de los países euro, conservación de recursos biológicos marinos de la política pesquera común, política comercial común, celebración de acuerdos internacionales en ciertos supuestos.",
                    "COMPETENCIAS COMPARTIDAS (art. 4 TFUE): mercado interior, política social, cohesión económica social y territorial, agricultura y pesca (excluida conservación), medio ambiente, protección de consumidores, transportes, redes transeuropeas, energía, espacio de LIBERTAD, SEGURIDAD Y JUSTICIA, asuntos comunes de seguridad en sanidad pública.",
                    "COMPETENCIAS DE APOYO, COORDINACIÓN o COMPLEMENTO (art. 6 TFUE): protección y mejora de la salud humana, industria, cultura, turismo, educación, formación profesional, juventud y deporte, protección civil, cooperación administrativa.",
                    "INSTITUCIONES DE LA UE (art. 13 TUE) — 7: Parlamento Europeo (Estrasburgo; 705 escaños tras Brexit; 5 años; co-legislador), Consejo Europeo (Bruselas; Jefes de Estado o Gobierno + su Presidente + Presidente Comisión; define orientaciones políticas generales; NO ejerce función legislativa), Consejo de la UE (representa a los Estados; co-legislador), COMISIÓN EUROPEA (Bruselas; 27 comisionarios; defiende interés general; INICIATIVA legislativa; vigilancia aplicación tratados — 'guardiana de los tratados'), Tribunal de Justicia de la UE (Luxemburgo), Banco Central Europeo (Frankfurt), Tribunal de Cuentas (Luxemburgo).",
                    "PROCEDIMIENTO LEGISLATIVO ORDINARIO (art. 294 TFUE): codecisión entre Parlamento y Consejo, a propuesta de la Comisión. Hasta 3 lecturas; si no hay acuerdo, comité de conciliación. Es la regla general tras Lisboa.",
                    "ACERVO SCHENGEN: integrado en el Derecho de la UE por el Tratado de Ámsterdam (1997). Acuerdo de Schengen 1985 + Convenio de Aplicación 1990. Suprime los controles en las FRONTERAS INTERIORES y crea una frontera exterior común. Reglamento (UE) 2016/399 = Código de Fronteras Schengen.",
                    "ESPACIO SCHENGEN: 29 países (27 hoy + Suiza, Noruega, Islandia, Liechtenstein; Croacia se incorporó 2023; Bulgaria y Rumanía completaron por aire/mar 2024). NO participan plenamente: Irlanda (opt-out parcial); Chipre (aún por incorporar). El Reino Unido NO formaba parte. Sistema SIS (Sistema de Información Schengen), Visado Schengen tipo C.",
                    "COOPERACIÓN POLICIAL Y JUDICIAL (espacio de Libertad, Seguridad y Justicia — Título V TFUE): EUROPOL (Agencia UE para la cooperación policial, La Haya; coordinación y análisis), EUROJUST (Unidad de Cooperación Judicial Penal, La Haya; coordinación entre fiscales y jueces), FRONTEX (Agencia Europea de la Guardia de Fronteras y Costas, Varsovia), CEPOL (Agencia de la UE para la Formación Policial, Budapest).",
                    "PRINCIPIOS RECTORES (art. 5 TUE): atribución (la UE actúa dentro de los límites de las competencias que le atribuyen los Estados); SUBSIDIARIEDAD (en ámbitos no exclusivos, sólo si los objetivos no pueden ser alcanzados de manera suficiente por los Estados); PROPORCIONALIDAD (el contenido y forma no excederá lo necesario).",
                    "Truco examen: REGLAMENTO se aplica directamente; DIRECTIVA exige transposición. Competencias EXCLUSIVAS (mnemo 'UCA-MAR'): Unión aduanera, Competencia, Acuerdos internacionales, Monetaria euro, comercio Arancelario, Recursos marinos. SCHENGEN integrado en UE por Ámsterdam 1997. Comisión = 'guardiana de los tratados' y única con INICIATIVA legislativa."
                ]

            {
                n: 9, b: "A", a: "Derecho UE", t: "TEDH, TJUE y Fiscalía Europea", norma: "CEDH; Reglamento UE 2017/1939", keys: ["TEDH", "TJUE", "Fiscalía Europea", "CEDH"], rel: [1, 5, 8, 24], d: 3, boe: "https://www.echr.coe.int/", rec: "https://curia.europa.eu/",
                resumen: [
                    "OJO — distinguir TRES instituciones distintas, no confundirlas: CONSEJO DE EUROPA (Estrasburgo, 46 Estados — NO es UE; creó el CEDH y el TEDH); UNIÓN EUROPEA (Bruselas/Luxemburgo, 27 Estados; tiene el TJUE); y el CONSEJO EUROPEO (institución de la UE, jefes de Estado o Gobierno, Bruselas — distinto del Consejo de la UE).",
                    "CONVENIO EUROPEO DE DERECHOS HUMANOS (CEDH 1950): tratado del Consejo de Europa firmado en Roma. Protege derechos civiles y políticos. España lo ratificó en 1979. Es referencia interpretativa de los DDFF de la CE por el art. 10.2 CE.",
                    "TEDH — TRIBUNAL EUROPEO DE DERECHOS HUMANOS (Estrasburgo): órgano del Consejo de Europa, juzga las demandas por violaciones del CEDH. 46 jueces (uno por Estado miembro). Mandato: 9 AÑOS no renovables. Cualquier persona física, ONG o grupo de particulares puede presentar demanda individual (art. 34 CEDH) tras agotar las vías de recurso internas (6 meses, hoy 4 meses tras Protocolo 15).",
                    "Formaciones del TEDH: JUEZ ÚNICO (inadmisibilidad clara), COMITÉS (3 jueces; casos repetitivos), SALAS (7 jueces; casos ordinarios), GRAN SALA (17 jueces; cuestiones graves o pleno por desistimiento). Sus sentencias son DEFINITIVAS y vinculantes para el Estado condenado, pero NO anulan la sentencia nacional (España aprobó art. 5 bis LOPJ — recurso de revisión por sentencia TEDH).",
                    "TJUE — TRIBUNAL DE JUSTICIA DE LA UNIÓN EUROPEA (Luxemburgo): institución de la UE (art. 19 TUE). Garantiza el respeto del Derecho en la interpretación y aplicación de los Tratados. Está integrado por: TRIBUNAL DE JUSTICIA (1 juez por Estado miembro = 27 + 11 Abogados Generales; mandato 6 años renovables) y TRIBUNAL GENERAL (2 jueces por Estado = 54). El Tribunal de la Función Pública fue suprimido en 2016.",
                    "COMPETENCIAS del TJUE: RECURSO POR INCUMPLIMIENTO (Comisión o Estado vs Estado infractor); RECURSO DE ANULACIÓN (actos UE contrarios al Derecho de la UE); RECURSO POR OMISIÓN; RECURSO DE INDEMNIZACIÓN; CUESTIÓN PREJUDICIAL (art. 267 TFUE — los órganos jurisdiccionales nacionales pueden o deben — si son última instancia — plantear cuestiones de interpretación o validez al TJUE).",
                    "CUESTIÓN PREJUDICIAL: instrumento clave de cooperación entre jueces nacionales y TJUE. Garantiza la aplicación efectiva y homogénea del Derecho UE. Plantearla SUSPENDE el proceso nacional hasta la respuesta. La sentencia prejudicial vincula al juez que la planteó y a otros tribunales que enjuicien casos similares.",
                    "FISCALÍA EUROPEA — Reglamento (UE) 2017/1939 del Consejo, de 12 oct 2017, de COOPERACIÓN REFORZADA. Sede: LUXEMBURGO. Operativa desde 1 de junio de 2021. Participan 22 Estados (no Dinamarca, Hungría, Irlanda, Polonia y Suecia; Polonia y Suecia se han ido incorporando).",
                    "COMPETENCIA MATERIAL de la Fiscalía Europea (art. 22 Rgto 2017/1939): delitos que perjudican los intereses financieros de la UE — fraude (Directiva PIF 2017/1371), corrupción, blanqueo de capitales asociado, apropiación indebida de fondos UE, fraude transfronterizo del IVA (importe daño >10 millones €).",
                    "ESTRUCTURA de la Fiscalía Europea: NIVEL CENTRAL (Luxemburgo) — Fiscal General Europea (Laura Codruţa Kövesi; 7 años no renovables), 22 Fiscales Europeos (uno por Estado participante; mandato 6 años no renovables, prorrogable 3) y Salas Permanentes; NIVEL DESCENTRALIZADO — FISCALES EUROPEOS DELEGADOS en cada Estado (al menos 2 por país; en España son nombrados por el Fiscal General del Estado en colaboración con la Fiscalía Europea; LO 9/2021 y Ley 9/2021).",
                    "RELACIÓN entre los tres tribunales: ante la VIOLACIÓN DE UN DDFF de la CE, primero la vía judicial ordinaria → recurso de AMPARO ante el TC español → demanda ante el TEDH (Estrasburgo) si el DDFF está en el CEDH. Las cuestiones de aplicación del DERECHO UE se ventilan vía cuestión prejudicial al TJUE (Luxemburgo).",
                    "INTERPOL ≠ EUROPOL: INTERPOL es una organización INTERGUBERNAMENTAL global (196 países; sede Lyon, Francia; 1923; ICPO-INTERPOL). EUROPOL es una AGENCIA DE LA UE (La Haya, 1998). INTERPOL coordina mediante Notificaciones (Roja, Azul, Verde, Amarilla, Negra, Naranja, Morada, Especial). NO tiene poder ejecutivo.",
                    "Truco examen: TEDH = Consejo de Europa = Estrasburgo = CEDH = 46 jueces / 9 años. TJUE = UE = Luxemburgo = 27 jueces + 11 AG / 6 años. Fiscalía Europea = Luxemburgo = 22 Estados = Rgto 2017/1939 = delitos contra intereses financieros UE. NO confundir Consejo de Europa (46) con Consejo Europeo (UE, jefes Estado) ni Consejo de la UE (ministros)."
                ]

            {
                n: 10, b: "A", a: "Derecho Administrativo", t: "Derecho Administrativo. Acto y procedimiento", norma: "Ley 39/2015", keys: ["acto administrativo", "reglamento", "procedimiento", "nulidad"], rel: [1, 11, 12], d: 4, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565", rec: "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566",
                resumen: [
                    "DOS leyes complementarias de 1 oct 2015: LEY 39/2015 del Procedimiento Administrativo Común (LPAC) — regula las relaciones AAPP-ciudadano; y LEY 40/2015 de Régimen Jurídico del Sector Público (LRJSP) — regula la organización y funcionamiento interno de las AAPP. Sustituyen a la Ley 30/1992.",
                    "INTERESADOS (art. 4 LPAC): a) quienes lo promuevan como titulares de derechos o intereses legítimos individuales o colectivos; b) los que, sin haber iniciado el procedimiento, tengan derechos que puedan resultar afectados por la decisión; c) aquellos cuyos intereses legítimos, individuales o colectivos, puedan resultar afectados por la resolución y se personen en el procedimiento antes de que haya recaído resolución definitiva.",
                    "REPRESENTACIÓN (art. 5 LPAC): se presume para los actos y gestiones de mero trámite. Para formular solicitudes, presentar declaraciones responsables, comunicaciones, interponer recursos, desistir y renunciar a derechos: deberá ACREDITARSE.",
                    "DERECHOS DE LAS PERSONAS (art. 13 LPAC): a comunicarse con las AAPP mediante punto de acceso general electrónico; a ser asistido en el uso de medios electrónicos; al respeto de la intimidad, etc. Derecho A ELEGIR — los SUJETOS NO OBLIGADOS pueden elegir si se relacionan en papel o electrónicamente.",
                    "SUJETOS OBLIGADOS a relacionarse ELECTRÓNICAMENTE (art. 14 LPAC): a) personas JURÍDICAS; b) entidades sin personalidad jurídica; c) profesionales con colegiación obligatoria para los trámites de su actividad profesional; d) quienes representen a un interesado obligado; e) empleados de las AAPP para los trámites de su condición. Reglamento puede ampliar.",
                    "REGISTROS (art. 16 LPAC): registro electrónico general de cada Administración. Los documentos se pueden presentar: en los registros electrónicos; oficinas de Correos; representaciones diplomáticas u oficinas consulares; oficinas de asistencia en materia de registros; cualquier otro que establezcan las disposiciones vigentes.",
                    "CÓMPUTO DE PLAZOS (art. 30 LPAC): siempre que por Ley o en el Derecho de la UE no se exprese otra cosa, cuando los plazos se señalen por DÍAS se entiende que estos son HÁBILES, excluyéndose del cómputo los SÁBADOS, los DOMINGOS y los DECLARADOS FESTIVOS. Cuando se señalen por DÍAS NATURALES, se hará constar esta circunstancia en las correspondientes notificaciones. Los plazos por HORAS se cuentan de hora en hora y de minuto en minuto desde la hora y minuto en que tenga lugar la notificación o publicación.",
                    "Plazos por MESES o AÑOS (art. 30.4): se computan a partir del día siguiente a aquel en que tenga lugar la notificación o publicación o desde el siguiente al que se produzca la estimación o desestimación por silencio. Si en el mes de vencimiento no hubiera día equivalente, se entenderá el último del mes. Cuando el último día sea inhábil, se entenderá prorrogado al primer día hábil siguiente.",
                    "PLAZOS de tramitación (art. 21 LPAC): la Administración está obligada a dictar RESOLUCIÓN EXPRESA y notificarla en TODOS los procedimientos cualquiera que sea su forma de iniciación. Plazo MÁXIMO: el que fije la norma; si no, 3 MESES. Plazo máximo de notificación: 10 días. Puede ampliarse el plazo (art. 32): no más de la MITAD del plazo establecido, mediante motivación y notificada antes del vencimiento.",
                    "SILENCIO ADMINISTRATIVO (arts. 24-25 LPAC). En procedimientos iniciados a SOLICITUD del interesado: silencio POSITIVO (estimatorio) — regla general. EXCEPCIONES (silencio negativo): cuando una norma con rango de ley o de Derecho UE lo establezca; procedimientos de ejercicio de derecho de petición (art. 29 CE); procedimientos cuya estimación tuviera como consecuencia que se transfirieran al solicitante o terceros facultades relativas al dominio público o al servicio público; procedimientos de IMPUGNACIÓN de actos y disposiciones; procedimientos de RESPONSABILIDAD PATRIMONIAL.",
                    "En procedimientos iniciados de OFICIO: si tienen efectos favorables — silencio NEGATIVO. Si pudieran ser efectos desfavorables o sancionadores — CADUCIDAD del procedimiento (art. 25).",
                    "NULIDAD de PLENO DERECHO (art. 47.1 LPAC) — supuestos taxativos: a) lesionen DDFF y libertades susceptibles de amparo; b) dictados por órgano MANIFIESTAMENTE INCOMPETENTE por razón de materia o territorio; c) tengan contenido imposible; d) sean constitutivos de INFRACCIÓN PENAL o se dicten como consecuencia de ésta; e) dictados PRESCINDIENDO TOTAL Y ABSOLUTAMENTE del procedimiento legalmente establecido o de las normas que contienen las reglas esenciales para la formación de la voluntad de órganos colegiados; f) actos expresos o presuntos contrarios al ordenamiento por los que se adquieran facultades o derechos cuando se CAREZCA DE LOS REQUISITOS ESENCIALES para su adquisición; g) cualquier otro que se establezca expresamente en una disposición con rango de ley.",
                    "ANULABILIDAD (art. 48 LPAC): los demás actos que incurran en cualquier infracción del ordenamiento, incluso la desviación de poder. NO son anulables: defectos de forma sólo cuando carezca de los requisitos formales indispensables para alcanzar su fin o den lugar a la indefensión; ni la realización fuera de plazo (salvo que el término sea esencial).",
                    "RECURSOS ADMINISTRATIVOS (arts. 112-126 LPAC): RECURSO DE ALZADA (1 mes si el acto es expreso; 3 meses si presunto) ante el superior jerárquico del que lo dictó; resuelve en 3 meses; agota la vía administrativa. RECURSO POTESTATIVO DE REPOSICIÓN (1 mes acto expreso) ante el mismo órgano que dictó el acto que pone fin a la vía administrativa; resuelve en 1 mes. RECURSO EXTRAORDINARIO DE REVISIÓN (4 años desde la notificación si los documentos eran de valor esencial, error de hecho, o documentos esenciales que aparezcan) ante el órgano administrativo que lo dictó.",

                n: 11, b: "A", a: "Derecho Administrativo", t: "Gobierno y AGE", norma: "Ley 50/1997; Ley 40/2015", keys: ["Gobierno", "AGE", "órganos superiores y directivos"], rel: [6, 10, 12, 13], d: 3, boe: "https://www.boe.es/buscar/act.php?id=BOE-A-1997-24902", rec: "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566",
                resumen: [
                    "DOS leyes básicas: LEY 50/1997 del Gobierno (regula composición, organización y funciones del Gobierno, su Presidente y Vicepresidentes); y LEY 40/2015 de Régimen Jurídico del Sector Público (LRJSP) (regula AGE, organismos públicos, sector público institucional, relaciones interadministrativas, responsabilidad patrimonial).",
                    "COMPOSICIÓN del Gobierno (art. 1 L 50/1997): el PRESIDENTE, el o los VICEPRESIDENTES (en su caso) y los MINISTROS. Funciones: dirige la política interior y exterior, la administración civil y militar y la defensa del Estado; ejerce la función ejecutiva y la potestad reglamentaria (art. 97 CE).",
                    "PRESIDENTE DEL GOBIERNO (art. 2 L 50/1997): dirige la acción del Gobierno y coordina las funciones de los demás miembros, sin perjuicio de la competencia y responsabilidad directa de éstos en su gestión. Funciones exclusivas: representar al Gobierno, establecer el programa político, plantear cuestión de confianza, proponer al Rey la disolución de las Cortes o convocatoria de referéndum, dirigir la política de defensa.",
                    "VICEPRESIDENTES (art. 3): a quienes corresponda les corresponderá el ejercicio de las funciones que les encomiende el Presidente. Cuando exista, suple al Presidente en caso de vacante, ausencia o enfermedad.",
                    "CONSEJO DE MINISTROS (art. 5 L 50/1997): órgano colegiado del Gobierno. Funciones: aprobar los proyectos de Ley y elevarlos al Congreso, aprobar el proyecto de Presupuestos, aprobar Reales Decretos-leyes y Decretos legislativos, acordar la negociación y firma de tratados internacionales, declarar los estados de alarma y excepción y proponer al Congreso el estado de sitio, disponer la emisión de Deuda Pública, aprobar la estructura orgánica de los departamentos ministeriales, crear, modificar y suprimir Comisiones Delegadas.",
                    "COMISIONES DELEGADAS del Gobierno (art. 6 L 50/1997): se crean por RD del Consejo de Ministros a propuesta del Presidente. Estudian, en su ámbito propio, las cuestiones de carácter general que tengan relación con varios de los Departamentos ministeriales que las integren; resuelven asuntos que afecten a más de un Ministerio y no requieran ser elevados al Consejo de Ministros.",
                    "CESE del Gobierno (art. 101 CE + art. 22 L 50/1997): por celebración de elecciones generales; pérdida de la confianza parlamentaria (moción de censura o cuestión de confianza perdida); dimisión o fallecimiento del Presidente. El Gobierno cesante continúa en FUNCIONES hasta la toma de posesión del nuevo Gobierno (art. 21 L 50/1997 — limitaciones: no podrá aprobar el proyecto de Ley de Presupuestos ni presentar proyectos de ley al Congreso; el Presidente no puede plantear cuestión de confianza, proponer al Rey la disolución de las Cortes ni someter consultas a referéndum).",
                    "ADMINISTRACIÓN GENERAL DEL ESTADO (AGE) — estructura (Ley 40/2015 arts. 54 y ss.): se organiza en MINISTERIOS, comprendiendo cada uno uno o varios sectores funcionalmente homogéneos de actividad administrativa. La organización se ajusta al principio de división funcional en Departamentos ministeriales y al principio de gestión territorial integrada en Delegaciones del Gobierno.",
                    "ÓRGANOS SUPERIORES de la AGE (art. 55.2 LRJSP): los MINISTROS y los SECRETARIOS DE ESTADO. Establecen los planes de actuación y son nombrados al margen de la carrera funcionarial (cargo político).",
                    "ÓRGANOS DIRECTIVOS de la AGE (art. 55.3): los Subsecretarios y Secretarios Generales; los Secretarios Generales Técnicos y Directores Generales; los Subdirectores Generales. Tienen la consideración de altos cargos, salvo los Subdirectores Generales y asimilados. Su designación se hace entre funcionarios de carrera del subgrupo A1, salvo Secretarías Generales y Direcciones Generales (no funcionarios cuando lo permita el RD de estructura).",
                    "MINISTROS (art. 61 LRJSP): titulares de su Departamento; ejercen la potestad reglamentaria en las materias propias de su Departamento. Nombrados y separados por el Rey a propuesta del Presidente del Gobierno.",
                    "SECRETARIOS DE ESTADO (art. 62): órganos directamente responsables de la ejecución de la acción del Gobierno en un sector de actividad específico; dependen directamente del Ministro. Subsecretario (art. 63): ostenta la representación ordinaria del Ministerio; dirige los servicios comunes; ejerce la jefatura superior del personal.",
                    "ÓRGANOS TERRITORIALES (arts. 69-79 LRJSP): DELEGADOS DEL GOBIERNO en cada CCAA (rango Subsecretario; dependen orgánicamente del Presidente del Gobierno y funcionalmente del Ministerio competente); SUBDELEGADOS del Gobierno en cada PROVINCIA (rango Subdirector General; dependen del Delegado); DIRECTORES INSULARES en las islas.",
                    "ESTADOS DE ALARMA, EXCEPCIÓN Y SITIO (art. 116 CE + LO 4/1981): ALARMA — declara el GOBIERNO por decreto del Consejo de Ministros, máximo 15 días (prórroga con autorización del Congreso). EXCEPCIÓN — declara el GOBIERNO previa autorización del Congreso, máximo 30 días (prorrogable 30 más). SITIO — declara la MAYORÍA ABSOLUTA del Congreso a propuesta exclusiva del Gobierno. NUNCA podrá disolverse el Congreso mientras estén declarados.",
                    "Truco examen: Gobierno cesa por 4 causas (elecciones, moción, cuestión perdida, dimisión/muerte). Gobierno EN FUNCIONES NO presenta proyectos de ley ni Presupuestos. Órganos SUPERIORES = Ministros + Secretarios de Estado (2). Órganos DIRECTIVOS = Subsecretarios, Secretarios Generales, SG Técnicos, DG, Subdirectores Generales. Alarma 15 días / Excepción 30+30 / Sitio mayoría absoluta Congreso."

                    "CLASES DE EMPLEADOS PÚBLICOS (art. 8 EBEP) — 4 categorías: a) FUNCIONARIOS DE CARRERA (relación estatutaria, permanente, retribuida); b) FUNCIONARIOS INTERINOS (razones expresamente justificadas de necesidad y urgencia, para tareas de funcionarios de carrera); c) PERSONAL LABORAL (fijo, indefinido o temporal); d) PERSONAL EVENTUAL (sólo realiza FUNCIONES DE CONFIANZA O ASESORAMIENTO ESPECIAL, no permanente, nombramiento y cese libre del órgano que lo nombra).",
                    "GRUPOS DE CLASIFICACIóN (art. 76 EBEP) según titulación: GRUPO A — subgrupo A1 (Título universitario de Grado, Licenciado, Ingeniero, Arquitecto) y A2 (Título de Grado o Diplomado, Ing. Técnico, Arq. Técnico); GRUPO B — Técnico Superior de Formación Profesional; GRUPO C — subgrupo C1 (Título de Bachiller o Técnico) y C2 (graduado en ESO). El Cuerpo Nacional de Policía EJECUTIVA = A2; Inspector/a tras curso = A1.",

                    "EXCEDENCIA voluntaria por interés particular (art. 89.2 EBEP): exige haber prestado servicios efectivos en cualquier AAPP durante mínimo 5 AÑOS inmediatamente anteriores. Duración mínima de la situación: 2 AÑOS. No devenga retribuciones ni cotiza a SS, ni se computa a efectos de antigüedad ni derechos en régimen de SS.",
                    "DERECHOS INDIVIDUALES (art. 14 EBEP): inamovilidad en la condición de funcionario de carrera; al desempeño efectivo de las funciones; a la progresión en la carrera profesional; a percibir retribuciones e indemnizaciones por razón del servicio; a la formación; al respeto de su intimidad, orientación sexual, propia imagen y dignidad en el trabajo, no discriminación y acoso; a la jornada y vacaciones; a la jubilación; etc.",
                    "DERECHOS COLECTIVOS (art. 15 EBEP): libertad sindical; negociación colectiva y participación en la determinación de las condiciones de trabajo; ejercicio de la huelga, con la garantía del mantenimiento de los servicios esenciales de la comunidad; planteamiento de conflictos colectivos de trabajo; reunión.",
                    "DEBERES — CÓDIGO DE CONDUCTA (arts. 52-54 EBEP). Principios ÉTICOS (art. 53): actuarán con respeto a la CE, neutralidad, transparencia, ejemplaridad, austeridad, accesibilidad, eficacia, honradez, promoción del entorno cultural y medioambiental, respeto a la igualdad. Principios de CONDUCTA (art. 54): tratarán con atención y respeto a los ciudadanos, a sus superiores y a sus compañeros; cumplirán con diligencia las tareas, no usarán medios de la AAPP para fines particulares, deberán garantizar el secreto de las materias clasificadas.",
                    "RÉGIMEN DISCIPLINARIO (arts. 93-98 EBEP) — faltas MUY GRAVES (art. 95.2): incumplimiento del deber de respeto a la CE y a los respectivos Estatutos, toda actuación que suponga discriminación, acoso laboral, abandono del servicio, adopción de acuerdos manifiestamente ilegales, publicación o utilización indebida de la documentación reservada, notoria falta de rendimiento, prevalimiento de la condición para obtener un beneficio indebido, obstaculizar el derecho a la huelga.",
                    "SANCIONES (art. 96): por faltas muy graves — SEPARACIÓN DEL SERVICIO (funcionarios) o despido disciplinario (laboral); suspensión firme de funciones (máximo 6 AÑOS); traslado forzoso con o sin cambio de localidad; demerito (consistente en penalización a efectos de carrera o promoción).",
                    "PRESCRIPCIÓN (art. 97 EBEP): faltas MUY GRAVES — 3 AÑOS; GRAVES — 2 AÑOS; LEVES — 6 MESES. Las sanciones impuestas por faltas muy graves prescribirán a los 3 años; las impuestas por faltas graves, a los 2 años; y las impuestas por faltas leves, al año.",

                    "NATURALEZA (art. 9 LOFCS): el CNP es un INSTITUTO ARMADO de naturaleza CIVIL, dependiente del Ministro del Interior. La GC es un Instituto Armado de naturaleza MILITAR, dependiente del Ministro del Interior en el desempeño de sus funciones y del Ministro de Defensa en cumplimiento de las misiones militares.",
                    "PRINCIPIOS BÁSICOS DE ACTUACIÓN (art. 5 LOFCS) — caen literal: 1) ADECUACIÓN AL ORDENAMIENTO JURÍDICO (ejercer la función con absoluto respeto a la CE; actuar con neutralidad política e imparcialidad; sin discriminación; con integridad y dignidad; oposición a la corrupción; con subordinación a la autoridad y obediencia a las órdenes recibidas, salvo que constituyan delito o sean contrarias a la CE); 2) RELACIONES CON LA COMUNIDAD; 3) TRATAMIENTO DE DETENIDOS (identificarse como agentes; velar por la vida e integridad; cumplir y observar los plazos y requisitos del ordenamiento); 4) DEDICACIÓN PROFESIONAL; 5) SECRETO PROFESIONAL; 6) RESPONSABILIDAD (personal y directa).",
                    "FUNCIONES COMUNES de las FCS (art. 11 LOFCS): a) velar por el cumplimiento de las Leyes y disposiciones generales; b) auxiliar y proteger a las personas y asegurar la conservación y custodia de los bienes que se encuentren en situación de peligro; c) vigilar y proteger los edificios e instalaciones públicos que lo requieran; d) velar por la PROTECCIÓN Y SEGURIDAD DE ALTAS PERSONALIDADES; e) mantener y restablecer, en su caso, el orden y la seguridad ciudadana; f) prevenir la comisión de actos delictivos; g) investigar los delitos para descubrir y detener a los presuntos culpables; h) captar, recibir y analizar cuantos datos tengan interés para el orden y la seguridad pública; i) colaborar con los servicios de Protección Civil.",
                    "COMPETENCIAS EXCLUSIVAS del CNP (art. 12.1.A LOFCS): a) EXPEDICIÓN del DNI y de los PASAPORTES; b) CONTROL DE ENTRADA Y SALIDA del territorio nacional de españoles y extranjeros; c) las previstas en la legislación sobre EXTRANJERÍA, refugio y asilo, extradición, expulsión, emigración e inmigración; d) vigilancia e inspección del cumplimiento de la normativa en materia de JUEGO; e) investigación y persecución de los delitos relacionados con la DROGA; f) colaborar y prestar auxilio a las Policías extranjeras (INTERPOL); g) control de SEGURIDAD PRIVADA.",
                    "COMPETENCIAS EXCLUSIVAS de la GUARDIA CIVIL (art. 12.1.B LOFCS): a) ARMAS Y EXPLOSIVOS; b) RESGUARDO FISCAL del Estado y actuaciones encaminadas a evitar y perseguir el contrabando; c) VIGILANCIA DEL TRÁFICO, tránsito y transporte en las VÍAS PÚBLICAS INTERURBANAS; d) custodia de vías de comunicación terrestre, costas, fronteras, puertos, aeropuertos y centros e instalaciones que por su interés lo requieran; e) velar por el cumplimiento de las disposiciones tendentes a la conservación de la naturaleza y medio ambiente (SEPRONA), de los recursos hidráulicos y de la riqueza cinegética, piscicola, forestal y de cualquier otra índole; f) la conducción interurbana de presos y detenidos.",
                    "COMPETENCIAS de las POLICÍAS LOCALES (art. 53 LOFCS): proteger autoridades de las Corporaciones Locales y vigilancia de sus edificios; ordenar, señalizar y dirigir el TRÁFICO en el casco urbano; instruir atestados por accidentes de circulación en el casco urbano; POLICÍA ADMINISTRATIVA (ordenanzas y bandos); participar en las funciones de POLICÍA JUDICIAL; auxilio en accidentes y catástrofes; diligencias de prevención y cuantas actuaciones tiendan a evitar la comisión de actos delictivos; vigilar los espacios públicos; cooperar en la resolución de conflictos privados cuando sean requeridos.",
                    "JUNTA DE SEGURIDAD (art. 50 LOFCS): órgano paritario Estado-CCAA. Se constituye SIEMPRE QUE la Comunidad Autónoma DISPONGA DE CUERPOS DE POLICÍA PROPIOS (Ertzaintza, Mossos, Pol. Foral Navarra). Su función: coordinar la actuación de las policías autonómicas con las del Estado.",
                    "ADSCRIPCIÓN DE UNIDADES del CNP a una CCAA (art. 47 LOFCS): la adscripción deberá afectar a UNIDADES OPERATIVAS COMPLETAS y NO a miembros individuales del Cuerpo. La unidad adscrita actúa bajo la dependencia de la CCAA en las funciones que se le encomienden, pero conserva su integridad orgánica.",
                    "ESCALAS Y CATEGORÍAS del CNP (art. 17 LOFCS y LO 9/2015 de Régimen de Personal): 4 escalas — 1) SUPERIOR (Comisario Principal, Comisario; subgrupo A1); 2) EJECUTIVA (Inspector Jefe, Inspector; subgrupo A2 → A1 tras curso, oposición de la opositora); 3) SUBINSPECCIÓN (Subinspector; subgrupo A2); 4) BÁSICA (Oficial de Policía, Policía; subgrupo C1).",
                    "DERECHOS de los miembros del CNP (LO 9/2015, arts. 26 y ss.): sindicación (con limitaciones — sindicatos exclusivos del CNP); negociación colectiva limitada; ASOCIACIÓN profesional. NO DERECHO DE HUELGA ni a acciones sustitutivas. CONSEJO DE POLICÍA (órgano de participación; paritario entre Administración y representantes elegidos por los funcionarios; lo preside el Ministro del Interior o persona en quien delegue).",
                    "RÉGIMEN DISCIPLINARIO del CNP (LO 4/2010, de 20 mayo): faltas MUY GRAVES (sanción: SEPARACIÓN DEL SERVICIO o suspensión de funciones de 3 meses y 1 día a 6 años); GRAVES (suspensión hasta 3 meses o pérdida de 5 a 20 días de remuneración y suspensión de funciones; traslado forzoso); LEVES (apercibimiento; suspensión de funciones hasta 5 días o pérdida de remuneración hasta 4 días). Prescripción: MG 3 años / G 2 años / L 1 MES.",
                    "Truco examen: CNP = civil + Ministerio Interior. GC = militar + Interior (servicio) + Defensa (militar). Principios básicos art. 5 caen LITERAL — memoriza el orden (1 Adecuación / 2 Relaciones / 3 Detenidos / 4 Dedicación / 5 Secreto / 6 Responsabilidad). DROGA = CNP exclusivo. ARMAS Y EXPLOSIVOS = GC exclusivo. TRÁFICO INTERURBANO = GC. URBANO = Policía Local."
                ]
