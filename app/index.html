37 (MAD)", "n": 81, "e": "Si hablamos de las teorías explicativas de la delincuencia, la Teoría de la Anomia concreta- mente se relaciona con las teorías:", "o": ["Biológicas.", "Psicológicas.", "Sociológicas."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q082", "src": "Básica P37 (MAD)", "n": 82, "e": "El artículo 252 del Tratado de Funcionamiento de la Unión Europea establece que:", "o": ["El Tribunal de Justicia de la Unión Europea estará asistido por nueve abogados generales. Si el Tribunal de Justicia lo solicitare, el Consejo, por mayoría cualificada podrá aumentar el número de abogados generales.", "El Tribunal de Justicia estará asistido por ocho abogados generales. Si el Tribunal de Justicia lo solicitare, el Consejo, por unanimidad, podrá aumentar el número de abogados generales.", "El Tribunal de Justicia estará asistido por seis abogados generales. Si el Tribunal de Justicia lo soli- citare, el Consejo, por unanimidad, podrá aumentar el número de abogados generales. ¡Ojo! Esta pregunta fue impugnada.  14 PROMOCIÓN N.º 37 "], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q083", "src": "Básica P37 (MAD)", "n": 83, "e": "Es correcto afirmar que:", "o": ["A los funcionarios interinos, no les será aplicable, en tanto y cuanto no sean funcionarios de carre- ra, el régimen general de los funcionarios de carrera.", "La selección de funcionarios interinos habrá de realizarse mediante procedimientos ágiles que respetarán los principios de igualdad, profesionalidad, capacitación y publicidad.", "Las plazas vacantes desempeñadas por funcionarios interinos deberán incluirse en la oferta de empleo correspondiente al ejercicio en que se produce su nombramiento y, si no fuera posible, en la siguiente, salvo que se decida su amortización."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q084", "src": "Básica P37 (MAD)", "n": 84, "e": "Los extranjeros que se hallen en España conforme a lo previsto en la Ley Orgánica 4/2000, de 11 de enero, sobre derechos y libertades de los extranjeros en España y su integración social, tienen derecho a circular libremente por el territorio español y a elegir su residencia, si bien po- drán establecerse medidas limitativas específicas cuando:", "o": ["Se acuerden en la declaración de estado de alarma, excepción o de sitio, en los términos previstos en la Constitución.", "Se determine excepcionalmente por razones de seguridad nacional, por resolución del Secretario de Estado que corresponda.", "Ninguna respuesta es correcta."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q085", "src": "Básica P37 (MAD)", "n": 85, "e": "Según la Ley 12/2009 reguladora del derecho de asilo, es correcto afirmar sobre la presentación de la solicitud, mediante comparecencia, para el reconocimiento de la protección internacional que:", "o": ["Deberá efectuarse sin demora y en todo caso en el plazo máximo de quince días desde la entrada en el territorio español o, en todo caso, desde que se produzcan los acontecimientos que justifiquen el temor fundado de persecución o daños graves.", "Deberá efectuarse sin demora y en todo caso en el plazo máximo de veinte días desde la entrada en el territorio español o, en todo caso, desde que se produzcan los acontecimientos que justifiquen el temor fundado de persecución o daños graves.", "Deberá en todo caso en el plazo máximo de un mes desde la entrada en el territorio español o, en todo caso, desde que se produzcan los acontecimientos que justifiquen el temor fundado de persecu- ción o daños graves."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q086", "src": "Básica P37 (MAD)", "n": 86, "e": "¿A qué autor de los siguientes se le atribuye la Teoría de la disonancia cognitiva?", "o": ["Festinger.", "Allport.", "Vander Zanden."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q087", "src": "Básica P37 (MAD)", "n": 87, "e": "El incumplimiento de las medidas impuestas por razón de seguridad pública, de presenta- ción periódica o de alejamiento de fronteras o núcleos de población concretados singularmente, es una infracción:", "o": ["Leve.", "Grave.", "Muy grave."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q088", "src": "Básica P37 (MAD)", "n": 88, "e": "¿Cuántos años de ejercicio profesional se requiere para ser miembro del Tribunal Consti- tucional?", "o": ["5.", "10.", "15.  15  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q089", "src": "Básica P37 (MAD)", "n": 89, "e": "La Ley Orgánica 1/2004, de 28 de diciembre, de Medidas de Protección Integral contra la Violencia de Género, crea la figura de:", "o": ["Delegado de la Oficina Nacional de derechos humanos de la Policía Nacional.", "Delegado de la Oficina Nacional para la Igualdad de Género.", "Fiscal contra la violencia sobre la mujer."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q090", "src": "Básica P37 (MAD)", "n": 90, "e": "¿Cuál es la sede del Banco Central Europeo?:", "o": ["Francfort del Meno (Alemania).", "Luxemburgo (Luxemburgo)", "Bruselas (Bélgica)."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q091", "src": "Básica P37 (MAD)", "n": 91, "e": "Cuando hablamos de seguridad activa y pasiva de un vehículo, la función principal de un dibujo de neumáticos es, canalizar y evacuar el agua de la superficie del suelo, siendo su profun- didad, según la legislación vigente de:", "o": ["Al menos 1,6 mm.", "Al menos 0,6 mm.", "Al menos 1,6 cm."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q092", "src": "Básica P37 (MAD)", "n": 92, "e": "¿En qué grupo de drogas según el efecto en el Sistema Nervioso Central clasificaríamos “la teofilina”?:", "o": ["Depresoras.", "Estimulantes.", "Perturbadoras."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q093", "src": "Básica P37 (MAD)", "n": 93, "e": "Según el artículo 283 de la LECr, constituirán la Policía Judicial y serán auxiliares de los Jueces y Tribunales competentes en materia penal y del Ministerio fiscal:", "o": ["Los Guardias de montes, campos y sembrados, jurados o confirmados por la Administración.", "Los Tenientes de Alcalde.", "Ambas son correctas."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q094", "src": "Básica P37 (MAD)", "n": 94, "e": "La aplicación de correo Thunderbird:", "o": ["Permite importar los contactos y macros de Microsoft OUTLOOK, pero no el calendario.", "Permite importar los contactos, las macros y el calendario de Microsoft OUTLOOK.", "Permite configurar múltiples cuentas de correo y administrar múltiples calendarios. ¡Ojo! Esta pregunta fue impugnada."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q095", "src": "Básica P37 (MAD)", "n": 95, "e": "En las reuniones para elegir a los miembros del Comité contra la Tortura de las Naciones Unidad, el quórum se formará alcanzando:", "o": ["Un tercio de los Estados parte.", "Dos tercios de los Estados partes.", "Ninguna es correcta."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q096", "src": "Básica P37 (MAD)", "n": 96, "e": "Cuando un poseedor de licencia de armas tipo F pierde su habilitación deportiva, perderá también su licencia y deberá entregar las armas en la Intervención de Armas correspondiente. ¿Cuánto tiempo podrán permanecer allí?:", "o": ["Un máximo de un año.", "Hasta que recupere su habilitación deportiva.", "6 meses, y si el interesado no ha recobrado su licencia o transferido el arma, se someterá a subasta.  16 PROMOCIÓN N.º 37 "], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q097", "src": "Básica P37 (MAD)", "n": 97, "e": "Según la Constitución Española, el principio por el cual el Estado es el encargado de velar por el establecimiento de un equilibrio económico, adecuado y justo entre las diversas partes del territorio español, y atendiendo en particular a las circunstancias del hecho insular.", "o": ["Se denomina principio de igualdad y viene recogido en el artículo 139 de la Constitución Española.", "Se denomina principio de equidad y viene recogido en el artículo 137 de la Constitución Española.", "Se denomina principio de solidaridad y viene recogido en el artículo 138 de la Constitución Española."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q098", "src": "Básica P37 (MAD)", "n": 98, "e": "Según el artículo 69 de la Ley Orgánica 9/2015, de 28 de julio, de Régimen de Personal de la Policía Nacional, en caso de que un funcionario desee pasar a segunda actividad a petición propia, deberá cumplir los siguientes requisitos de edad:", "o": ["Escala superior: 64 años, Escala Subinspección 60 años.", "Escala Ejecutiva 65 años, Escala Básica 56 años.", "Escala superior: 62 años, Escala Básica 58 años."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q099", "src": "Básica P37 (MAD)", "n": 99, "e": "El conjunto de varios núcleos urbanos inicialmente independientes y contiguos por sus márgenes que al crecer acaban formando una unidad funcional, recibe el nombre de:", "o": ["Pluriurbanización.", "Conurbación.", "Sobreurbanización."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q100", "src": "Básica P37 (MAD)", "n": 100, "e": "El organismo de la Unión Europea encargado de ofrecer información sólida e independiente sobre el medio ambiente, siendo la fuente principal de información para los responsables del desa- rrollo, la aprobación, la ejecución y la evaluación de las políticas medioambientales se denomina:", "o": ["AEMA (Agencia Europea de Medio Ambiente) cuya sede se encuentra en Copenhague.", "OEMA (Organización Europea para el Medio Ambiente) cuya sede se encuentra en Dublín.", "IEME (Instituto Europeo de Medio Ambiente) cuya sede se encuentra en Berlín.  17"], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q001", "src": "Básica P38 (MAD)", "n": 1, "e": "En el caso de nacimiento fuera de un centro hospitalario cuanto tiempo se dispone para declarar el nacimiento en el Registro Civil:", "o": ["72 horas.", "7 días.", "10 días."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q002", "src": "Básica P38 (MAD)", "n": 2, "e": "Según el art. 26 del Código Civil, indique cuál de los siguientes es un requisito para recupe- rar la nacionalidad española tras haberla perdido previamente:", "o": ["Entrar voluntariamente al servicio de las armas o ejercer cargo político en España.", "Declarar ante el encargado del Registro Civil su voluntad de recuperar la nacionalidad española.", "Llevar al menos dos años casado con español o española y no estuviere separado legalmente o de hecho."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q003", "src": "Básica P38 (MAD)", "n": 3, "e": "La Constitución Española recoge en su articulado el derecho a la propiedad privada y a la herencia, concretamente como:", "o": ["Derechos fundamentales y libertades públicas.", "Derechos y deberes de los ciudadanos.", "Principios rectores de la política social y económica."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q004", "src": "Básica P38 (MAD)", "n": 4, "e": "De acuerdo con el Preámbulo, ¿Quién aprueba y quién ratifica la CE?", "o": ["El rey aprueba y el pueblo ratifica.", "El Congreso aprueba y el pueblo ratifica.", "Las Cortes aprueban y el pueblo español ratifica."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q005", "src": "Básica P38 (MAD)", "n": 5, "e": "El tratamiento de los datos personales de un menor de edad, ¿Cuándo se puede fundar en su consentimiento?:", "o": ["Solo cuando conste el consentimiento de los titulares de la patria potestad.", "Únicamente cuando sea mayor de catorce años.", "Cuando sea mayor de catorce años y conste autorización de los titulares de la patria potestad.  3  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q006", "src": "Básica P38 (MAD)", "n": 6, "e": "La Constitución reconoce y garantiza el derecho a la autonomía de las nacionalidades y regiones que integran la Nación española y la solidaridad entre todas ellas, estableciendo al respecto:", "o": ["Que el Estado garantiza esa realización efectiva velando por el establecimiento de un equilibrio económico adecuado y justo entre todas ellas, sin atender a ninguna particularidad.", "Que el Estado garantiza esa realización efectiva velando por el establecimiento de un equilibrio económico adecuado y justo, y atendiendo en particular a las circunstancias del hecho insular.", "Que el Estado garantiza el principio de solidaridad velando por el establecimiento de un equili- brio que implique proporcionalidad económica y social entre las distintas Comunidades Autónomas."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q007", "src": "Básica P38 (MAD)", "n": 7, "e": "¿Cuándo será sometida a referéndum, para su ratificación, una reforma constitucional aprobada por las Cortes Generales?:", "o": ["Cuando así lo soliciten, dentro de los 20 días siguientes a su aprobación un tercio de los miembros de cualquiera de las Cámaras.", "Cuando así lo soliciten, dentro de los 20 días siguientes a su aprobación una décima parte de los miembros de cualquiera de las Cámaras.", "Cuando así lo soliciten, dentro de los 15 días siguientes a su aprobación una décima parte de los miembros de cualquiera de las Cámaras."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q008", "src": "Básica P38 (MAD)", "n": 8, "e": "Según el artículo 73 de la Constitución Española:", "o": ["Las Cámaras se reunirán anualmente en dos períodos ordinarios de sesiones: el primero, de octu- bre a diciembre, y el segundo, de febrero a junio.", "Las Cámaras podrán reunirse en sesiones extraordinarias a petición del Gobierno, de la Diputa- ción Permanente o de la mayoría simple de los miembros de cualquiera de las Cámaras.", "Las sesiones extraordinarias deberán convocarse sobre un orden del día determinado y serán clausuradas una vez que éste haya sido agotado."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q009", "src": "Básica P38 (MAD)", "n": 9, "e": "Las características fundamentales de los reglamentos europeos son:", "o": ["Son actos jurídicos de carácter obligatorio, aplicación automática y uniforme para todos los Esta- dos miembros.", "Son actos jurídicos de carácter vinculante, aplicable a uno o varios países de los Estados miem- bros.", "Son actos de carácter vinculante siempre y cuando hayan sido traspuestos al Derecho nacional."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q010", "src": "Básica P38 (MAD)", "n": 10, "e": "La Unión Europea fue reconocida en 2012 por haber contribuido al avance de la reconcilia- ción, la democracia y los Derechos Humanos en Europa, ¿Qué galardón recibió?", "o": ["El Premio Sájarov.", "El Premio Carlomagno.", "Premio Nobel de la Paz."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q011", "src": "Básica P38 (MAD)", "n": 11, "e": "El Gobierno en funciones no podrá ejercer las siguientes facultades: Presentar proyectos de Ley al Congreso de los Diputados o, en su caso, al Senado y:", "o": ["Aprobar el Proyecto de Ley de Presupuestos Generales del Estado.", "Proponer al Rey el nombramiento de Ministros.", "Sugerir cuestión de confianza.  4 PROMOCIÓN N.º 38 "], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q012", "src": "Básica P38 (MAD)", "n": 12, "e": "El Consejo Europeo:", "o": ["Ejercerá funciones legislativas.", "Se reunirá solo una vez cada semestre, aunque el Presidente puede convocar una reunión ex- traordinaria cuando la situación lo exija.", "Elegirá a su Presidente por mayoría cualificada para un mandato de dos años y medio, que podrá renovarse una sola vez."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q013", "src": "Básica P38 (MAD)", "n": 13, "e": "La propuesta y ejecución de la política del Gobierno en materia de, entre otros, familia, de protección del menor y de juventud, ¿a qué ministerio corresponde?:", "o": ["Al Ministerio de Derechos Sociales y Agenda 2030.", "Ministerio de Inclusión, Seguridad Social y Migraciones.", "Ministerio de Sanidad, Consumo y Bienestar Social."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q014", "src": "Básica P38 (MAD)", "n": 14, "e": "Entre las competencias del Delegado del Gobierno en las Comunidades Autónomas, se encuentra:", "o": ["Proteger el libre ejercicio de los derechos y libertades y garantizar la seguridad ciudadana, a través de los Subdelegados del Gobierno, bajo la dependencia funcional del Gobierno de la Nación.", "Proteger el libre ejercicio de los derechos y libertades y garantizar la seguridad ciudadana, a tra- vés de los Subdelegados del Gobierno y de las Fuerzas y Cuerpos de seguridad del Estado, bajo la de- pendencia funcional del Gobierno de la Nación.", "Proteger el libre ejercicio de los derechos y libertades y garantizar la seguridad ciudadana, a través de los Subdelegados del Gobierno y de las Fuerzas y Cuerpos de seguridad del Estado, cuya jefatura corresponderá al Delegado del Gobierno."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q015", "src": "Básica P38 (MAD)", "n": 15, "e": "Si como funcionario de carrera con nivel 17 paso a ocupar un puesto de nivel 20, ¿Cuánto tiempo tardare en consolidarlo?", "o": ["2 años.", "3 años.", "4 años."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q016", "src": "Básica P38 (MAD)", "n": 16, "e": "El personal con carácter no permanente que sólo realiza funciones de confianza o aseso- ramiento especial es:", "o": ["El personal laboral.", "El personal eventual.", "El personal interino."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q017", "src": "Básica P38 (MAD)", "n": 17, "e": "¿Cuál de las siguientes opciones no se contempla como situación administrativa de los Funcionarios de carrera en el Real Decreto Legislativo 5/2015, de 30 de octubre?", "o": ["Suspensión de funciones.", "Servicios especiales.", "Comisión de servicios."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q018", "src": "Básica P38 (MAD)", "n": 18, "e": "¿La gestión del programa de quejas y sugerencias en el que está incluida la Dirección Ge- neral de la Policía dimanante del Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, a qué órga- no dentro de la Secretaría de Estado de Seguridad le corresponde su gestión?", "o": ["Al Gabinete de Coordinación y Estudios.", "Inspección de Personal y Servicios de Seguridad.", "Subdirección General de Sistemas de Información y Comunicaciones para la Seguridad.  5  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q019", "src": "Básica P38 (MAD)", "n": 19, "e": "La Dirección General de Apoyo a las Víctimas del Terrorismo es un órgano directivo inte- grado en la:", "o": ["Subsecretaria del Interior.", "Secretaria General de Instituciones Penitenciarias.", "Secretaria de Estado de Seguridad."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q020", "src": "Básica P38 (MAD)", "n": 20, "e": "La convocatoria de los procesos selectivos de ingreso y promoción interna de la Policía Nacional corresponden:", "o": ["Al Secretario de Estado de Seguridad", "Al Director General de la Policía.", "Al Director General de la Policía corresponden los procesos selectivos de ingreso mientras que los de promoción interna, al Director Adjunto Operativo."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q021", "src": "Básica P38 (MAD)", "n": 21, "e": "Serán auxiliares de los Jueces y Tribunales competentes en materia penal y del M. Fiscal, a efectos de la investigación de los delitos y persecución de los delincuentes, constituyendo la Policía Judicial:", "o": ["Solo los miembros de las Fuerzas y Cuerpos de Seguridad.", "Solo los miembros de las Fuerzas y Cuerpos de Seguridad del Estado.", "También los funcionarios del Cuerpo especial de Prisiones."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q022", "src": "Básica P38 (MAD)", "n": 22, "e": "¿En qué Unidad se llevan a cabo investigaciones relacionadas con los Delitos de Corrup- ción en los Negocios del artículo 286.bis.4, que tipifica la predeterminación o alteración de en- cuentros deportivos?", "o": ["En la Oficina Nacional de Deportes de la Comisaría General de Seguridad Ciudadana.", "En el Centro Nacional para la Integridad en el Deporte y las Apuestas, dependiente de la Unidad Central de Delincuencia Especializada y Violenta.", "El la Brigada Central de Blanqueo de Capitales y Anticorrupción de la Unidad Central de Delin- cuencia Económica y Fiscal."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q023", "src": "Básica P38 (MAD)", "n": 23, "e": "De entre las funciones de las Fuerzas y Cuerpos de Seguridad del Estado, es competencia exclusiva de la Policía Nacional:", "o": ["Vigilar y proteger los edificios e instalaciones públicos que lo requieran.", "El control de entrada y salida del territorio nacional de españoles y extranjeros.", "Velar por la protección y seguridad de altas personalidades."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q024", "src": "Básica P38 (MAD)", "n": 24, "e": "El órgano creado para coordinar las políticas de seguridad pública del Estado y de las Co- munidades Autónomas es:", "o": ["La Junta de Seguridad, en aquellas Comunidades con Cuerpos de Policía propios.", "El Comité de expertos, formado por ocho integrantes, mitad del Estado y mitad de las Comunida- des Autónomas.", "El Consejo de Política de Seguridad."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q025", "src": "Básica P38 (MAD)", "n": 25, "e": "En qué principio básico de actuación se contempla el uso de armas:", "o": ["Adecuación al ordenamiento jurídico.", "Relaciones con la comunidad.", "Responsabilidad.  6 PROMOCIÓN N.º 38 "], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q026", "src": "Básica P38 (MAD)", "n": 26, "e": "Obtendrán la tarjeta de identidad de extranjero:", "o": ["Todos los extranjeros a los que se haya expedido un visado para permanecer en España por un periodo superior a seis meses.", "Todos los extranjeros a los que se haya expedido un visado para permanecer en España por un periodo superior a tres meses.", "Todos los extranjeros a los que se haya expedido un visado para permanecer en España por un periodo superior a 120 días."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q027", "src": "Básica P38 (MAD)", "n": 27, "e": "El Real Decreto 240/2007 será de aplicación:", "o": ["A Robert, ciudadano de origen británico.", "A Mai, de 20 años de edad, hija de un nacional vietnamita que se ha casado con una mujer española.", "A Taras, de 22 años de edad, hijo de un nacional ucraniano, registrado como pareja de hecho con una mujer española."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q028", "src": "Básica P38 (MAD)", "n": 28, "e": "Cuando entró en vigor el CAAS:", "o": ["Inmediatamente tras su firma.", "1990.", "1995."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q029", "src": "Básica P38 (MAD)", "n": 29, "e": "El ciudadano extranjero que, estando en posesión del título correspondiente, ha obteni- do una plaza como residente para la formación como especialista en cardiología, al realizar una actividad laboral derivada de dicha formación:", "o": ["Deberá solicitar personalmente la correspondiente autorización de trabajo por cuenta ajena.", "No será necesario que dispongan de la correspondiente autorización de trabajo, bastará con la autorización de estancia por estudios.", "El Centro docente donde desarrolle su actividad laboral deberá solicitar la correspondiente Auto- rización de trabajo por cuenta ajena."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q030", "src": "Básica P38 (MAD)", "n": 30, "e": "Durante el control de entrada en un puesto fronterizo se presenta un ciudadano extran- jero al que le consta una prohibición de entrada por un periodo de 3 años determinado en una resolución de expulsión anterior, habiendo cumplido ya 2 años de dicha prohibición. En este caso, el extranjero será objeto de:", "o": ["Devolución, al contravenir una prohibición de entrada.", "Denegación de entrada.", "Autorización de entrada al haber cumplido 2/3 de la prohibición de entrada impuesta."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q031", "src": "Básica P38 (MAD)", "n": 31, "e": "En relación a la prescripción de las infracciones y sanciones en materia de extranjería, re- cogidas en la Ley Orgánica 4/2000 de 11 de enero, sobre los derechos y libertades de los extran- jeros en España y su integración social, señale la respuesta correcta:", "o": ["Las infracciones muy graves prescribirán a los 3 años, las graves a los 2 años y las leves a los 6 meses.", "Las infracciones muy graves prescribirán a los 5 años, las graves a los 2 años y las leves a los 9 meses.", "Las infracciones muy graves prescribirán a los 5 años, las graves a los 3 años y las leves a los 10 meses."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q032", "src": "Básica P38 (MAD)", "n": 32, "e": "Si usted se encuentra prestando servicio en un puesto fronterizo, la actuación a llevar a cabo con un ciudadano no comunitario que no cumple los requisitos para entrar en España, sería la siguiente:", "o": ["Se lleva a cabo una devolución en frontera.", "Se le deniega la entrada en resolución motivada.", "Se le inicia un expediente de expulsión en base a la infracción 53.1 a) Encontrarse irregularmente en territorio español Ley Orgánica 4/2000, de 11 de enero, sobre derechos y libertades de los extranje- ros en España y su integración social.  7  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q033", "src": "Básica P38 (MAD)", "n": 33, "e": "Según la Convención sobre el Estatuto de los Apátridas, el apátrida que se encuentra le- galmente en España:", "o": ["En ningún caso podrá ser expulsado.", "Podrá ser expulsado por razones de seguridad nacional o de orden público.", "Podrá ser expulsado por razones de orden público, seguridad pública, seguridad nacional o salud pública."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q034", "src": "Básica P38 (MAD)", "n": 34, "e": "Cuando los Cuerpos y Fuerzas de Seguridad del Estado localicen a un extranjero indocu- mentado cuya minoría de edad no pueda ser establecida con seguridad, se le dará conocimiento:", "o": ["Al Juez de Menores, además de la atención inmediata que precise, de acuerdo con lo establecido en la legislación de protección jurídica del menor.", "Al Juez de Instrucción, ya que se desconoce la edad del extranjero indocumentado.", "Al Ministerio Fiscal."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q035", "src": "Básica P38 (MAD)", "n": 35, "e": "El Ministerio del Interior, de oficio o a petición del interesado, acordará la aplicación de la trami- tación de urgencia en la solicitud de protección internacional, previa notificación al interesado cuando:", "o": ["La persona solicitante con motivo justificado, presente su solicitud transcurrida el plazo de un mes.", "Cuando la solicitud de protección internacional se hubiese presentado en un Centro de Interna- miento de Extranjeros.", "Hayan sido formuladas por menores no acompañados."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q036", "src": "Básica P38 (MAD)", "n": 36, "e": "Según la Ley 5/2014 de Seguridad Privada cual es un servicio a ejercer con arma de fuego:", "o": ["Protección de buques pesqueros de bandera española.", "Vigilancia perimetral de centros penitenciarios, militares y policiales.", "Protección de eventos deportivos, o multitudinarios."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q037", "src": "Básica P38 (MAD)", "n": 37, "e": "Según lo recogido en la Ley 5/2014 de Seguridad Privada, en relación a la habilitación profesional, es correcto afirmar que:", "o": ["La habilitación de todo el personal de seguridad privada corresponderá a la Dirección General de la Policía.", "La habilitación de todo el personal de seguridad privada corresponderá a la Dirección General de la Po- licía, excepto la de los vigilantes de explosivos que corresponderá a la Dirección General de la Guardia Civil.", "La habilitación de todo el personal de seguridad privada corresponderá a la Dirección General de la Policía, excepto la de los guardas rurales y sus especialidades que corresponderá a la Dirección General de la Guardia Civil."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q038", "src": "Básica P38 (MAD)", "n": 38, "e": "El Documento Nacional de Identidad es:", "o": ["Un documento público y oficial con suficiente valor para la acreditación de la identidad y los datos personales de su titular.", "El documento público y oficial con valor por sí solo para la acreditación de la identidad y los datos personales de su titular.", "El único documento con suficiente valor por sí solo para la acreditación, a todos los efectos, de la identidad y los datos personales de su titular."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q039", "src": "Básica P38 (MAD)", "n": 39, "e": "Dentro del Régimen Sancionador de la LO 4/2015 de Seguridad Ciudadana, son órganos competentes en el ámbito de la Administración General del Estado:", "o": ["El Ministerio de Interior, para la sanción de todas las infracciones en grado máximo.", "El Ministerio de Interior, para la sanción de las infracciones muy graves en grado máximo.", "El Ministerio de Interior, para la sanción de las infracciones graves en grado máximo.  8 PROMOCIÓN N.º 38 "], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q040", "src": "Básica P38 (MAD)", "n": 40, "e": "Según el artículo 15 de la Ley Orgánica 4/2015 de Protección de la seguridad ciudadana.", "o": ["Los agentes de las Fuerzas y Cuerpos de Seguridad sólo podrán proceder a la entrada y registro en domicilio en los casos permitidos por la Constitución y en los términos que fije la presente Ley.", "Será causa legítima suficiente para la entrada en domicilio la necesidad de evitar daños inminentes.", "Para la entrada en edificios ocupados por organismos oficiales o entidades públicas, no será pre- ciso el consentimiento de la autoridad o funcionario que los tuviere a su cargo."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q041", "src": "Básica P38 (MAD)", "n": 41, "e": "Según el artículo 4.3 del Real Decreto 704/2011, de 20 de mayo, por el que se aprueba el Regla- mento de protección de las infraestructuras críticas, el Catálogo Nacional de Infraestructuras Estratégicas tiene, conforme a lo dispuesto en la legislación vigente en materia de secretos oficiales, la calificación de:", "o": ["Secreto.", "Confidencial.", "Clasificado."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q042", "src": "Básica P38 (MAD)", "n": 42, "e": "De acuerdo con la Ley 8/2011, por la que se establecen medidas para la protección de las infraestructuras críticas, diga a qué hace referencia la siguiente definición: “las instalaciones, redes, sistemas y equipos físicos y de tecnología de la información sobre las que descansa el fun- cionamiento de los servicios esenciales”.", "o": ["Infraestructuras estratégicas.", "Infraestructuras críticas.", "Infraestructuras esenciales."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q043", "src": "Básica P38 (MAD)", "n": 43, "e": "Juan con ánimo de acabar con la vida de Pedro, cambia, sin el conocimiento de nadie, por veneno los viales de insulina que le administra su enfermera María por ser diabético, llegando a producir la muerte de Pedro. ¿Cuál será la responsabilidad criminal de Juan y María?:", "o": ["Juan será inductor del hecho y María cooperadora necesaria.", "Juan será cooperador necesario y María la autora mediata.", "Ambos serán autores, si bien María carecerá de responsabilidad criminal."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q044", "src": "Básica P38 (MAD)", "n": 44, "e": "Es una circunstancia agravante de la responsabilidad criminal:", "o": ["Ejecutar el hecho con abuso de confianza, de forma que se debilite la defensa del ofendido o faci- lite la impunidad del delincuente.", "Cometer el delito por razones de aporofobia, independientemente de que tal circunstancia con- curra o no en la víctima.", "Aumentar inhumanamente el sufrimiento de la víctima, sea o no deliberado."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q045", "src": "Básica P38 (MAD)", "n": 45, "e": "De las circunstancias modificativas de la responsabilidad criminal que se indican, señale la correcta:", "o": ["Es una circunstancia agravante de la responsabilidad criminal ser menor de 18 años.", "Es una circunstancia eximente de la responsabilidad criminal el que obre impulsado por miedo insuperable.", "Es una circunstancia atenuante que el mal causado sea mayor que el que se intenta evitar."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q046", "src": "Básica P38 (MAD)", "n": 46, "e": "Adolfo, mayor de edad y en plenitud de sus facultades físicas y mentales, se apropia de la bicicleta de montaña de su vecino sin el consentimiento del mismo. Dicha bicicleta se encontra- ba aparcada en la puerta de su domicilio, cuatro horas más tarde, después de darse varios paseos por la ciudad la vuelve a dejar en el mismo lugar donde se la apropió, esta conducta constituirá:", "o": ["Un delito de hurto de uso de vehículo.", "Un delito de robo de uso de vehículo.", "Dicha conducta es atípica.  9  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q047", "src": "Básica P38 (MAD)", "n": 47, "e": "En el título primero: “del homicidio y sus formas” del Código penal se establece que sólo será perseguible mediante denuncia de la persona agraviada o su representante legal:", "o": ["El homicidio por imprudencia menos grave, cometido utilizando un vehículo a motor.", "El homicidio imprudente cuando se hubiera cometido utilizando un vehículo a motor.", "El homicidio cometido por imprudencia menos grave en el ámbito profesional."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q048", "src": "Básica P38 (MAD)", "n": 48, "e": "La cooperación NO necesaria o complicidad a la muerte del suicida es:", "o": ["Atípica, ya que se tipifica cualquier acto de colaboración activa.", "Punible, porque se tipifica la inducción y la cooperación, sea necesaria o no.", "Atípica, ya que solo se tipifica la inducción y cooperación necesaria."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q049", "src": "Básica P38 (MAD)", "n": 49, "e": "Andrés encierra a Juan privándole de su libertad, será castigado como autor de un delito de:", "o": ["Detención ilegal.", "Secuestro.", "Extorsión."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q050", "src": "Básica P38 (MAD)", "n": 50, "e": "Para ser sujeto activo del delito de tortura es necesaria:", "o": ["La relación de cónyuge o persona que esté o haya estado ligada de forma estable por análoga relación de afectividad.", "La condición de autoridad o funcionario público.", "La relación de dependencia jerárquica o laboral."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q051", "src": "Básica P38 (MAD)", "n": 51, "e": "El que ocupare, sin autorización debida, un inmueble, vivienda o edificio ajenos que no constituya morada, o se mantuviere en ellos contra la voluntad de su titular”, comete:", "o": ["Delito de Usurpación del art. 245 del Código Penal.", "Delito de Extorsión del art. 243 del Código Penal.", "Delito de Coacciones del art. 172 del Código Penal."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q052", "src": "Básica P38 (MAD)", "n": 52, "e": "Juan le realiza un ingreso de 5.000 Euros a Jorge para que le compre un coche. Jorge una vez que tiene el dinero en la cuenta decide quedarse con el mismo y no realizar la compra. ¿Qué delito podría estar cometiendo Juan?", "o": ["Estafa.", "Apropiación indebida.", "Un delito de Hurto."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q053", "src": "Básica P38 (MAD)", "n": 53, "e": "En el registro del vehículo de Tomás, el cual se encuentra conduciendo por la vía pública, se localizan tres armas cortas y dos largas careciendo el mismo de permisos o licencias:", "o": ["Tomas será autor de un delito de depósito de armas de fuego reglamentadas.", "Tomas será autor de dos delitos de tenencia de armas, uno por las armas cortas y otro por las armas largas.", "Tomas será autor de un delito de tenencia de armas castigándose con hasta dos años por encon- trarse con armas cortas.  10 PROMOCIÓN N.º 38 "], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q054", "src": "Básica P38 (MAD)", "n": 54, "e": "Según el TÍTULO XXII de los delitos contra el orden Público del Código Penal, que respues- ta es falsa:", "o": ["Se comete delito de atentado a los que agreden con violencia o intimidación grave, a un policía fuera de servicio al detener a un atracador.", "Se comete delito de atentado a los que agreden con violencia o intimidación grave, a un médico al comunicar el fallecimiento de una persona en el hospital.", "Se comete delito de atentado a los que agreden con violencia o intimidación grave, a un vigilante de seguridad debidamente acreditado cuando le impide la entrada en el metro a un pasajero."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q055", "src": "Básica P38 (MAD)", "n": 55, "e": "Si una persona llama al 091 para denunciar que han puesto una bomba en el instituto en el que estudia, y resulta ser falso, ¿qué delito comete?", "o": ["Desórdenes públicos.", "Denuncia falsa.", "No es un delito, es una infracción administrativa que se castiga con multa."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q056", "src": "Básica P38 (MAD)", "n": 56, "e": "Para proceder penalmente por los delitos informáticos:", "o": ["Se podrá proceder de oficio en todo caso.", "Será necesaria denuncia de la persona agraviada o de su representante legal.", "Se exigirá además querella del Ministerio Fiscal."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q057", "src": "Básica P38 (MAD)", "n": 57, "e": "La difusión no consentida de imágenes o grabaciones de carácter sexual, que se hubieran obtenido con consentimiento de la persona afectada y en su ámbito de privacidad, cuando su divulgación menoscabe gravemente la intimidad de esta persona, es la definición de:", "o": ["Sexting.", "Grooming.", "Intrusismo informático."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q058", "src": "Básica P38 (MAD)", "n": 58, "e": "Cuando un individuo accede al conjunto o parte de un sistema de información, vulneran- do las medidas de seguridad y sin estar debidamente autorizado, ¿estaría cometiendo un delito informático de los tipificados en el Código Penal?", "o": ["Sí, el simple acceso está penado aunque no se acceda a los datos.", "Sí, siempre que consiga acceder a los datos que contiene el sistema.", "Sí, siempre que consiga acceder a l sistema y divulgar los datos contenidos en este."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q059", "src": "Básica P38 (MAD)", "n": 59, "e": "En el procedimiento de Habeas Corpus:", "o": ["No es preceptiva la intervención de abogado y procurador.", "Es preceptiva la intervención de abogado y procurador.", "Será preceptiva sólo en los casos de delitos públicos."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q060", "src": "Básica P38 (MAD)", "n": 60, "e": "Según la LECrim quienes están exentos de la obligación de denunciar:", "o": ["El cónyuge del delincuente y sus ascendientes, descendientes y colaterales hasta tercer grado de parentesco inclusive.", "Los eclesiásticos y demás ministros de otros cultos, respecto a las noticias que les sean reveladas en el ejercicio de sus funciones de carácter religioso.", "Los impúberes y los que gocen del pleno uso de la razón.  11  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q061", "src": "Básica P38 (MAD)", "n": 61, "e": "El Tribunal del Jurado se compone de:", "o": ["Nueve jurados y un Magistrado integrante de la Audiencia Nacional. Al juicio asistirá además un jurado suplente.", "Nueve jurados y un Magistrado integrante de la Audiencia Provincial. Al juicio asistirán además dos jurados suplentes.", "Nueve jurados y un Magistrado integrante de la Audiencia Nacional. Al juicio asistirán además tres jurados suplentes."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q062", "src": "Básica P38 (MAD)", "n": 62, "e": "A tenor de lo dispuesto en la Ley 4/2015 del Estatuto de la víctima, los abogados y procu- radores no podrán dirigirse a las víctimas directas o indirectas de catástrofes para ofrecerles sus servicios profesionales, hasta transcurridos:", "o": ["30 días.", "45 días.", "60 días."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q063", "src": "Básica P38 (MAD)", "n": 63, "e": "En caso de tener que determinar qué medidas de protección deben ser adoptadas respecto a la víctima de un delito para evitar perjuicios relevantes que, de otro modo, pudieran derivar del pro- ceso, se realizará una valoración de sus circunstancias que tendrá especialmente en consideración:", "o": ["Si se trata de un delito violento.", "El nivel de madurez de la víctima.", "La integridad moral de la víctima."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q064", "src": "Básica P38 (MAD)", "n": 64, "e": "En relación a los derechos de las mujeres víctimas de violencia de género, se debe tener en cuenta la siguiente consideración respecto a la asistencia jurídica:", "o": ["Las víctimas de violencia de género tienen derecho a recibir asesoramiento jurídico solamente después de haber interpuesto denuncia.", "Las víctimas de violencia de género tienen derecho a recibir asesoramiento jurídico en el mo- mento inmediatamente previo a la interposición de la denuncia, sólo si solicitan un letrado particular.", "Las víctimas de violencia de género tienen derecho a recibir asesoramiento jurídico gratuito en el momento inmediatamente previo a la interposición de la denuncia."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q065", "src": "Básica P38 (MAD)", "n": 65, "e": "¿Cómo se denomina el instrumento promovido por el Ministerio de Igualdad para impli- car al conjunto de la sociedad en la lucha contra la violencia machista y extender la información necesaria para saber cómo actuar ante un caso de violencia contra las mujeres?:", "o": ["Punto rosa.", "Punto rojo.", "Punto violeta."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q066", "src": "Básica P38 (MAD)", "n": 66, "e": "La sede del Instituto Europeo de la Igualdad de Género (EIGE) se encuentra en:", "o": ["Praga (República Checa).", "Bucarest (Rumania).", "Vilna (Lituania)."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q067", "src": "Básica P38 (MAD)", "n": 67, "e": "La Ley 31/1995, de 8 de noviembre, de Prevención de Riesgos Laborales:", "o": ["No será de aplicación en aquellas actividades cuyas particularidades lo impidan en el ámbito de las funciones públicas como las actividades de policía, seguridad y resguardo aduanero.", "Se aplicará a todas las actividades independientemente de su desarrollo dentro del ámbito de la gestión pública o de la privada, a excepción de los centros y establecimientos militares.", "Se aplicará en todas las actividades laborales con la excepción del servicio del hogar familiar, cuyo titular está obligado al cuidado de sus empleados.  12 PROMOCIÓN N.º 38 "], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q068", "src": "Básica P38 (MAD)", "n": 68, "e": "Señale la respuesta errónea, respecto al principio de proporcionalidad, en la instalación de sistemas de grabación de imágenes y sonidos efectuada por las Fuerzas y Cuerpos de Seguri- dad, que deberán tener en cuenta.", "o": ["Asegurar la protección de los edificios o instalaciones propias.", "Asegurar la protección de edificios e instalaciones públicas y de sus accesos que estén bajo custodia.", "La protección y prevención frente a las amenazas contra la seguridad pública."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q069", "src": "Básica P38 (MAD)", "n": 69, "e": "El órgano científico técnico especializado, de la Administración General del Estado, que tiene como misión el análisis y estudio de las condiciones de seguridad y salud en el trabajo, así como la promoción y apoyo a la mejora de las mismas, es:", "o": ["El Instituto Nacional de Seguridad y Salud en el Trabajo.", "La Comisión Nacional de Seguridad y Salud en el Trabajo.", "La Inspección de Trabajo y Seguridad Social."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q070", "src": "Básica P38 (MAD)", "n": 70, "e": "De acuerdo con lo recogido en la Ley Orgánica 7/2021 de protección de datos personales tratados para fines de prevención, detección, investigación y enjuiciamiento de infracciones pe- nales y de ejecución de sanciones penales, se entiende por “encargado del tratamiento” a:", "o": ["Cualquier persona física o jurídica que tenga acceso a datos personales de terceros.", "La persona física o jurídica, autoridad pública, servicio u otro organismo que trate datos persona- les por cuenta del responsable del tratamiento.", "La persona responsable de la seguridad de las bases de datos que contienen los datos personales."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q071", "src": "Básica P38 (MAD)", "n": 71, "e": "El plazo de conservación de los datos personales con fines de prevención, detección, in- vestigación y enjuiciamiento de infracciones penales, será del tiempo necesario para esos fines y como máximo:", "o": ["3 años.", "15 años.", "20 años."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q072", "src": "Básica P38 (MAD)", "n": 72, "e": "Señale la respuesta correcta sobre el Mecanismo Nacional de Prevención contra la Tortura:", "o": ["Está compuesto por funcionarios de los Ministerios del Interior y de Justicia, coordinados por el Defensor del Pueblo.", "Se encarga de recepcionar y tramitar las denuncias que se reciben relacionadas con torturas.", "Realiza visitas preventivas a centros de privación de libertad dependientes de las distintas Admi- nistraciones Públicas españolas."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q073", "src": "Básica P38 (MAD)", "n": 73, "e": "En que se caracterizan una serie de derechos en la Declaración Universal de Derechos Hu- manos:", "o": ["Ser ilimitados.", "Ser inalienables.", "Ser personales."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q074", "src": "Básica P38 (MAD)", "n": 74, "e": "Es una característica de la Globalización:", "o": ["El reforzamiento de los logros laborales de los países desarrollados.", "La especialización y jerarquización de territorios por la aparición de las TIC y la mejora del transporte.", "Heterogeneidad en las pautas de comportamiento de la población mundial.  13  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q075", "src": "Básica P38 (MAD)", "n": 75, "e": "Cuando hablamos de los estudios de escala “F” nos podemos referir a:", "o": ["A los test de la escuela de Berkeley para medir tendencias potencialmente fascistas.", "Es la escala de medición de niveles de xenofobia de la escuela tradicional alemana.", "A los test elaborados por la universidad de Stanford sobre niveles de rechazo al género femenino."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q076", "src": "Básica P38 (MAD)", "n": 76, "e": "Dentro de la definición de“Género no-binario o genderqueer”se pueden incluir como tipo de modalidades para expresar su género:", "o": ["Agénero, bigénero, tercer sexo, transgénero y género fluido.", "Genero binario.", "Agénero, segundo sexo y transfóbico."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q077", "src": "Básica P38 (MAD)", "n": 77, "e": "Podemos definir las migraciones como:", "o": ["Desplazamiento de grandes grupos humanos de una zona geográfica a otra por un corto espacio de tiempo.", "Desplazamiento humano de un lugar a otro, siempre que dure más de un mes.", "Desplazamientos de la población de una delimitación geográfica a otra por un espacio de tiempo considerable e indefinido."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q078", "src": "Básica P38 (MAD)", "n": 78, "e": "Un saldo vegetativo negativo en una población indica que:", "o": ["Ha habido más defunciones que nacimientos.", "Ha habido más nacimientos que defunciones.", "La edad media de la población se ha reducido."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q079", "src": "Básica P38 (MAD)", "n": 79, "e": "¿Quién es el autor de la teoría de la asociación diferencial?:", "o": ["Hans Eysenck.", "Durkheim.", "Edwin Sutherland."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q080", "src": "Básica P38 (MAD)", "n": 80, "e": "El consumo de Ayahuasca, a causa de la presencia de la sustancia DMT (dimetiltriptami- na), tiene un efecto:", "o": ["Depresivo.", "Alucinógeno.", "Estimulante."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q081", "src": "Básica P38 (MAD)", "n": 81, "e": "A la relación entre la dosis en la que un determinado fármaco o droga es capaz de causar la muerte (dosis letal) o un efecto adverso, y la dosis del mismo que causa el efecto terapéutico deseado (dosis efectiva), se denomina:", "o": ["Tolerancia cruzada.", "Tolerancia inversa.", "Índice terapéutico."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q082", "src": "Básica P38 (MAD)", "n": 82, "e": "La propuesta y ejecución de la política del Gobierno en materia de lucha contra el cambio climático, prevención de la contaminación, protección del patrimonio natural, de la biodiversi- dad, de los bosques, del mar, agua y energía para la transición a un modelo productivo y social más ecológico, le corresponde a:", "o": ["El Ministerio de Medio Ambiente.", "El Ministerio para la Transición Ecológica y el Reto Demográfico.", "La Secretaría de Estado de medio ambiente.  14 PROMOCIÓN N.º 38 "], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q083", "src": "Básica P38 (MAD)", "n": 83, "e": "¿Los sobrenombres, apodos y seudónimos se escriben con la primera letra en mayúsculas?", "o": ["Sí, incluso el artículo que lo precede. Ej: Alfonso X El Sabio.", "No, ya que no es el nombre propio de persona, animal, cosa singularizada o nombre de divinidad. EJ: Alfonso X el sabio.", "Siempre, si bien el artículo que lo precede, en su caso, no se debe escribir con mayúscula. Ej.: Al- fonso X el Sabio."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q084", "src": "Básica P38 (MAD)", "n": 84, "e": "Un disco puede almacenar la información, entre otros, en los siguientes sistemas de archivos:", "o": ["NTFS, FAT, EXT4, APFS.", "NTFS, MACFS, EXT2, EXT4, FAT.", "NTFS, FAT, EXT, APFS, HDR."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q085", "src": "Básica P38 (MAD)", "n": 85, "e": "Entre las funciones del sistema operativo se encuentra:", "o": ["Gestionar la manera en que la información se almacena en dispositivos de entrada/salida.", "Ejecutar aplicaciones y software.", "A y B, y además gestionar la memoria del ordenador."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q086", "src": "Básica P38 (MAD)", "n": 86, "e": "Un firewall que ahora se considera “tradicional”, que permite o bloquea el tráfico en fun- ción del estado, el puerto y el protocolo y, además, monitorea toda la actividad desde la apertura hasta el cierre de una conexión, es un firewall:", "o": ["Proxy.", "De inspección activa.", "UTM."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q087", "src": "Básica P38 (MAD)", "n": 87, "e": "La diferencia entre PROXY y ROUTER es:", "o": ["ROUTER es la parte HARDWARE, mientras que PROXY se refiere a su parte SOFTWARE.", "PROXY trabaja a distinto nivel de pila de protocolo de interconexión que el ROUTER.", "El PROXY no puede albergar mecanismos de seguridad, mientras que el ROUTER implementa firewalls."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q088", "src": "Básica P38 (MAD)", "n": 88, "e": "Uno de los sistemas de evaluación más utilizado en el ciclo de Inteligencia es:", "o": ["4×4.", "3×3.", "5×5."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q089", "src": "Básica P38 (MAD)", "n": 89, "e": "Son redes de la DarkNet:", "o": ["Freenet,I2P, TOR, ZeroNet.", "Freenet, BYTE, TOR, ZeroNet.", "Arpanet, I2P, TOR, ZeroNet."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q090", "src": "Básica P38 (MAD)", "n": 90, "e": "La modalidad delictiva utilizada para dejar un servidor sin servicios es:", "o": ["Bootnet.", "DDOS.", "Ramsonware.  15  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q091", "src": "Básica P38 (MAD)", "n": 91, "e": "¿Cómo se denomina a la lectura no autorizada y almacenamiento de la información con- tenida en la banda magnética de las tarjetas bancarias, mediante la utilización de dispositivos electrónicos que simulan ser los autorizados, o por personas con acceso a estos medios de pago?:", "o": ["Shoofing.", "Skimming.", "Phishing."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q092", "src": "Básica P38 (MAD)", "n": 92, "e": "¿Qué es el flaming?:", "o": ["Situación consistente en una discusión que se lleva a cabo en línea (por medio de correos elec- trónicos, redes, blogs o foros). Y que toma un tono insultante o desagradable hacia una de las personas con el objetivo de crisparla.", "Consiste en el acceso no autorizado a la información guardada en los teléfonos móviles.", "Consiste en hacer llamadas telefónicas a las víctimas, en las que, por medio de una voz computa- rizada, se requiere la verificación de algunos datos personales y/o información bancaria."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q093", "src": "Básica P38 (MAD)", "n": 93, "e": "Una de las principales novedades incluidas en la redacción del Reglamento de Armas, es la inclusión de las armas:", "o": ["Artísticas.", "Acústicas.", "Detonadoras."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q094", "src": "Básica P38 (MAD)", "n": 94, "e": "Un arma de fuego larga rayada que puede reducirse su longitud a menos de 60 cm sin perder su funcionalidad por medio de una culata telescópica es:", "o": ["Un arma prohibida.", "Un arma prohibida excepto para funcionarios.", "Un arma permitida categoría 2.2."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q095", "src": "Básica P38 (MAD)", "n": 95, "e": "La utilización de la señal V-1:", "o": ["Requerirá autorización del Director General de la Policía.", "Requerirá autorización de la Dirección General del Tráfico.", "No requerirá autorización administrativa alguna."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q096", "src": "Básica P38 (MAD)", "n": 96, "e": "De acuerdo a lo establecido en el artículo 69 del Real Decreto 1428/2003, de 21 de noviem- bre, por el que se aprueba el Reglamento General de Circulación, cuando un vehículo de policía que manifiesta su presencia según lo dispuesto en el artículo 68.2 se sitúa detrás de cualquier otro vehículo y activa además un dispositivo de emisión de luz amarilla hacia adelante de forma intermitente o destellante, el conductor de éste deberá:", "o": ["Parar con las debidas precauciones en el lado izquierdo, delante o detrás del vehículo policial, en un lugar donde no genere mayores riesgos o molestias para el resto de los usuarios, y permanecerá en su interior.", "Detenerlo con las debidas precauciones en el lado derecho, delante del vehículo policial, en un lugar donde no genere mayores riesgos o molestias para el resto de los usuarios, y permanecerá en su interior.", "Parar o detenerlo con las debidas precauciones en el lado derecho o izquierdo, delante del vehí- culo policial, en un lugar donde no genere mayores riesgos o molestias para el resto de los usuarios, y permanecerá en su interior.  16 PROMOCIÓN N.º 38 "], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q097", "src": "Básica P38 (MAD)", "n": 97, "e": "¿Qué son los ADAS?", "o": ["Es el acrónimo en inglés de los Sistemas de Ayuda y Detección de Velocidad.", "Es el acrónimo en inglés de los Sistemas Avanzados de Ayuda a la Conducción.", "Hace referencia a la publicidad o anuncios relacionados con el sector de la automoción."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q098", "src": "Básica P38 (MAD)", "n": 98, "e": "Nicolás hace un año que obtuvo el permiso o licencia que le habilita para conducir. Mien- tras conducía un vehículo prioritario es sometido a pruebas de detección alcohólica. Indique la respuesta correcta:", "o": ["No podrá superar la tasa de alcohol en sangre de 0,5 gramos por litro, o de alcohol en aire espira- do superior a 0,25 miligramos por litro.", "No podrá superar la tasa de alcohol en sangre de 0,3 gramos por litro ni de alcohol en aire espi- rado de 0,15 miligramos por litro.", "Al ser vehículo prioritario, no podrá superar la tasa de alcohol en sangre de 0,0 gramos por litro ni de alcohol en aire espirado de 0,0 miligramos por litro."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q099", "src": "Básica P38 (MAD)", "n": 99, "e": "El conjunto de características técnicas de los vehículos cuyo objetivo es evitar la pérdida de control de su trayectoria por parte del conductor y la colisión con otros vehículos, personas, animales u objetos, es la definición de:", "o": ["Seguridad primaria.", "Seguridad secundaria.", "Seguridad terciaria."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P38-Q100", "src": "Básica P38 (MAD)", "n": 100, "e": "En el auxilio de un accidente, la norma PAS consiste en:", "o": ["Personación, auxilio y seguridad.", "Personarse, ayudar y socorrer.", "Proteger, avisar y socorrer.  17"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q001", "src": "Básica P39 (MAD)", "n": 1, "e": "Juan y Juana son una pareja, mayores de edad que rompen su relación por desavenencias, pero Juan había enviado anteriormente a Juana una serie de fotos y vídeos de alto contenido sexual, a tra- vés de la aplicación de mensajería WhatsApp. Juana tras la ruptura envió los vídeos a través de la men- cionada aplicación a sus amigos y conocidos. ¿Qué delito comete Juana según el Código Penal vigente?", "o": ["El delito de revelación de secretos.", "Ningún delito porque medió consentimiento por parte de Juan.", "El delito de descubrimiento."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q002", "src": "Básica P39 (MAD)", "n": 2, "e": "En relación al Régimen de Personal de la Policía Nacional, será competente para resolver sobre la solicitud de compatibilidad para un segundo puesto o actividad, tanto en el sector pú- blico como en el sector privado:", "o": ["El Ministro de Interior, a través del Secretario de Estado de Seguridad.", "El Ministerio de Hacienda y Administraciones Públicas, a propuesta del Director General de la Policía.", "El Director General de la Policía, a través del Delegado bajo la autoridad del Secretario y Ministerio de Interior."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q003", "src": "Básica P39 (MAD)", "n": 3, "e": "¿Cuál de las siguientes opciones es correcta?", "o": ["Lo planificamos a grosso modo, sin entrar en detalles.", "Lo planificamos grosso modo, sin entrar en detalles.", "Lo planificamos a groso modo, sin entrar en detalles."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q004", "src": "Básica P39 (MAD)", "n": 4, "e": "Señale el pretérito perfecto de subjuntivo del verbo “investigar”:", "o": ["Hubiera o hubiese investigado.", "Hubiere investigado.", "Haya investigado."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q005", "src": "Básica P39 (MAD)", "n": 5, "e": "El proceso de identificación de una infraestructura como crítica se realizará:", "o": ["Por el Centro Nacional para la Protección de las infraestructuras Críticas. (CNPIC)", "Por el Órgano Nacional de Control de Infraestructuras Críticas. (ONCIC)", "Por el Centro Español de Seguridad de Infraestructuras Críticas. (CESIC)"], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q006", "src": "Básica P39 (MAD)", "n": 6, "e": "Según la Declaración Universal de Derechos Humanos. ¿Cuál es el elemento natural y fun- damental de la sociedad?", "o": ["La familia.", "La libertad.", "El matrimonio.  3  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q007", "src": "Básica P39 (MAD)", "n": 7, "e": "¿Cuál es el lema de la Unión Europea?", "o": ["Fraternidad sin absorción, unión sin fusión.", "La unión hace la fuerza.", "Unida en la diversidad."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q008", "src": "Básica P39 (MAD)", "n": 8, "e": "Para encriptar la información de nuestro disco duro podemos hacer uso de las siguientes herramientas:", "o": ["LUKS, BITLOCKER, FILEVAULT.", "VERACRYPT, BITLOCKER, iVAULT2.", "TRUECRYPT, VERACRYPT, iVAULT2."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q009", "src": "Básica P39 (MAD)", "n": 9, "e": "Manolo, Policía Nacional que en el año 2019 fue condecorado con la encomienda a la de- dicación al servicio policial, ¿a cuántos días de vacaciones anuales tiene derecho actualmente?", "o": ["Veinticuatro días hábiles.", "Veinticinco días hábiles.", "Veintiséis días hábiles."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q010", "src": "Básica P39 (MAD)", "n": 10, "e": "Un BOT es un software malicioso que puede ser utilizado para:", "o": ["Enviar información robada.", "Infectar otros equipos de la red.", "Ambas, y además para enviar correo SPAM."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q011", "src": "Básica P39 (MAD)", "n": 11, "e": "¿Cuál de las siguientes opciones es correcta?", "o": ["Cuando vi a Marta la conminé a cejar en su actitud.", "Cuando vi a Marta le conminé a cejar en su actitud.", "Las dos frases anteriores son correctas."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q012", "src": "Básica P39 (MAD)", "n": 12, "e": "Durante el transcurso de una investigación penal, ¿puede estar presente acompañando a la víctima en un acto de declaración en sede policial un familiar suyo?", "o": ["Sí, no se le puede cercenar su derecho a ser acompañada por su representante procesal, legal y persona de su elección.", "No, tan solo tiene derecho a la presencia de su representante legal.", "Sí, salvo que de forma motivada se decida lo contrario por la autoridad o el funcionario competente."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q013", "src": "Básica P39 (MAD)", "n": 13, "e": "Según el R.D 1325/2003, de 24 de octubre:” los nacionales de un tercer país no miembro de la Unión Europea o apátridas que hayan debido abandonar su país o región de origen, o que hayan sido evacuados”, se corresponde con la definición de:", "o": ["Desplazados.", "Apátridas.", "Refugiados."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q014", "src": "Básica P39 (MAD)", "n": 14, "e": "María es víctima de violencia de género, tiene especial dificultad para obtener un empleo, pudiéndolo acreditar a través de Informe del Servicio Público de Empleo, además dos hijos me- nores a su cargo ¿De cuánto será la ayuda económica que reciba si le corresponde?", "o": ["Dieciocho meses de subsidio por desempleo.", "Doce meses de subsidio por desempleo.", "Veinticuatro meses de subsidio por desempleo.  4 PROMOCIÓN N.º 39 "], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q015", "src": "Básica P39 (MAD)", "n": 15, "e": "Podemos definir el “hate speech” como:", "o": ["Toda forma de expresión verbal que difunda, incite, promueva o justifique el odio racial, la xeno- fobia, el antisemitismo u otras formas de odio basadas en la intolerancia.", "Toda forma de expresión escrita que difunda, incite, promueva o justifique el odio racial, la xeno- fobia, el antisemitismo u otras formas de odio basadas en la intolerancia.", "Toda forma de expresión que difunda, incite, promueva o justifique el odio racial, la xenofobia, el antisemitismo u otras formas de odio basadas en la intolerancia."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q016", "src": "Básica P39 (MAD)", "n": 16, "e": "La Seguridad Pública es competencia exclusiva:", "o": ["Del Gobierno de la Nación.", "Del Estado.", "Del Rey."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q017", "src": "Básica P39 (MAD)", "n": 17, "e": "De acuerdo con el artículo 150 de la Constitución, el Estado podrá dictar leyes que esta- blezcan los principios necesarios para armonizar las disposiciones normativas de las Comunida- des Autónomas, aun en el caso de materias atribuidas a la competencia de estas, cuando así lo exija el interés general. ¿A quién corresponde la apreciación de esta necesidad?", "o": ["Al Congreso de los Diputados, por mayoría absoluta.", "A las Cortes Generales, por mayoría absoluta de cada cámara.", "Al Estado, mediante ley orgánica."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q018", "src": "Básica P39 (MAD)", "n": 18, "e": "Indique la opción correcta:", "o": ["Idiosincracia.", "Vicisitud.", "Beneficiencia."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q019", "src": "Básica P39 (MAD)", "n": 19, "e": "Una mujer extranjera víctima de violencia de género, que se encuentra en situación irre- gular, por infracción del artículo 53. 1. a) de la L.O. 4/2000 sobre derechos y libertades de los extranjeros y su integración social. ¿Cuándo podrá solicitar una autorización de residencia y tra- bajo por circunstancias excepcionales?", "o": ["Cuando se hubiera solicitado una orden de protección a su favor.", "Cuando se hubiese dictado una orden de protección a su favor.", "Cuando el procedimiento penal concluyera con una sentencia condenatoria."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q020", "src": "Básica P39 (MAD)", "n": 20, "e": "En el caso de que se detectase, dentro de territorio español, a un extranjero que haya con- travenido una prohibición de entrada en vigor (señale la respuesta correcta):", "o": ["Será preciso expediente de expulsión para poder proceder nuevamente a su expulsión.", "Se solicitará, a la autoridad judicial, la medida de internamiento para aquellos casos en los que la devolución no pudiera ejecutarse en el plazo de 72 horas.", "La devolución será acordada por la autoridad judicial competente para la expulsión."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q021", "src": "Básica P39 (MAD)", "n": 21, "e": "Con carácter general, cuál es el plazo máximo para la supresión de los datos personales tratados para fines de prevención, detección, investigación y enjuiciamiento de infracciones pe- nales y de ejecución de sanciones penales:", "o": ["15 años.", "20 años.", "25 años.  5  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q022", "src": "Básica P39 (MAD)", "n": 22, "e": "La sociedad dependiente del Ministerio de Asuntos Económicos y Transformación Digital a través de la Secretaría de Estado de Digitalización e Inteligencia Artificial y consolidada como entidad de referencia para el desarrollo de la ciberseguridad y de la confianza digital de ciuda- danos, red académica y de investigación, profesionales, empresas y especialmente para sectores estratégicos, se conoce como: ¡Cuidado! Esta pregunta en su redacción original está actualmente derogada.", "o": ["S3RC0N1.", "INCIBE.", "INTECO."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q023", "src": "Básica P39 (MAD)", "n": 23, "e": "Manolo, policía nacional, detiene al secuestrador de una menor que no han localizado, con el fin de obtener su localización somete al detenido a graves sufrimientos físicos y mentales, pero a pesar de ello no localizan a la menor:", "o": ["Manolo comete un delito de torturas consumado.", "Manolo comete un delito de torturas en grado de tentativa al no conseguir su objetivo.", "Manolo comete un delito de trato degradante del art 176 del código penal."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q024", "src": "Básica P39 (MAD)", "n": 24, "e": "Abayomi (egipcio) que residía en Egipto a cargo de su sobrina María (española), deciden trasladarse a España para fijar su residencia. ¿Qué documentación necesitarían para entrar en territorio español?", "o": ["El pasaporte o documento de identidad valido y en vigor, ya que Abayomi es familiar a cargo de un ciudadano de la Unión Europea.", "María necesitaría el pasaporte o documento de identidad valido y en vigor y Abayomi el visado y la tarjeta de residencia de familiar de ciudadano de la Unión.", "María necesitaría el pasaporte o documento de identidad valido y en vigor y Abayomi el pasapor- te en vigor y el visado de entrada."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q025", "src": "Básica P39 (MAD)", "n": 25, "e": "¿Cuál es la novedad introducida en el Código Penal por la Ley Orgánica 8/2021, de 4 de junio, de protección integral a la infancia y la adolescencia frente a la violencia, en relación a los delitos de homicidio y asesinato?", "o": ["Las personas condenadas por dichos delitos se les impondrá una medida de seguridad cuando la víctima sea una persona especialmente vulnerable por razón de su edad o discapacidad.", "El reo puede ser castigado con pena de prisión permanente revisable cuando la víctima sea me- nor de dieciséis años o una persona especialmente vulnerable por razón de la edad.", "Si la víctima y el autor de los delitos mencionados tuvieran un hijo o hija en común, la autoridad judicial impondrá, respecto de este, pena de privación de la patria potestad."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q026", "src": "Básica P39 (MAD)", "n": 26, "e": "La divisa constituida por dos ramas de laurel nervadas y frutadas, unidas por sus troncos corresponde a:", "o": ["A la Escala Superior, Ejecutiva y Subinspección.", "A la Escala Ejecutiva (primera y segunda categoría) y Subinspección.", "A la Escala Ejecutiva (segunda categoría) y Subinspección."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q027", "src": "Básica P39 (MAD)", "n": 27, "e": "Las deliberaciones del Consejo de Ministros serán:", "o": ["Clasificadas.", "Reservadas.", "Secretas.  6 PROMOCIÓN N.º 39 "], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q028", "src": "Básica P39 (MAD)", "n": 28, "e": "Juan es identificado por una dotación de Policía Nacional por consumo de estupefacien- tes en vía pública, por tal motivo es requerido por los agentes para que facilite su filiación con el fin de poder realizar un acta de propuesta de sanción en aplicación de la Ley Orgánica 4/2015, pero Juan manifiesta datos falsos o inexactos a los actuantes para evitar su identificación. ¿Qué dos propuestas de sanción se deben proponer a Juan en aplicación de la Ley Orgánica 4/2015 de protección de la seguridad ciudadana?", "o": ["Dos infracciones graves, artículo 36 apartados 16 y 6.", "Dos infracciones muy graves, artículo 35 apartados 3 y 4.", "Dos infracciones leves, artículo 37 apartados 17 y 4."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q029", "src": "Básica P39 (MAD)", "n": 29, "e": "¿Cuál de las siguientes opciones es correcta?", "o": ["Mi hermano es mayor que tú.", "Mi hermano es más mayor que tú.", "Las dos frases anteriores son correctas."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q030", "src": "Básica P39 (MAD)", "n": 30, "e": "Estando Usted prestando servicio, en un vehículo tipo Z de la Brigada Provincial de Se- guridad Ciudadana, y debido a la imposibilidad de identificar a una persona en la vía pública, conforme a la Ley Orgánica 4/2015, y en cuanto a la duración de la diligencia de identificación se establece que, por norma general:", "o": ["Será de 6 horas.", "Será de al menos de 6 horas.", "El tiempo estrictamente necesario."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q031", "src": "Básica P39 (MAD)", "n": 31, "e": "Usted prestando servicio como funcionario en la Oficina de Denuncias y Atención al Ciu- dadano, es conocedor que una persona víctima de un delito, una vez interpuesta la denuncia. Tiene derecho a:", "o": ["Que se le expida un certificado con un resumen de la denuncia.", "Que se le facilite el documento original de la denuncia que interpone.", "Que se le facilite copia de la denuncia debidamente certificada."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q032", "src": "Básica P39 (MAD)", "n": 32, "e": "El agente de Policía está obligado a detener cuando se de alguna de las siguientes circunstancias:", "o": ["Al que se fugare estando detenido o preso por causa pendiente.", "A toda persona a la que se impute un hecho punible.", "Al que no compareciera ante la autoridad judicial."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q033", "src": "Básica P39 (MAD)", "n": 33, "e": "La droga conocida como “droga de los pobres” que se obtiene mediante la mezcla de ha- chís y Rivotril (clonazepam), que produce efectos alucinógenos al ser mezclada con alcohol o pegamento es:", "o": ["Karkubi.", "Spice.", "Flakka."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q034", "src": "Básica P39 (MAD)", "n": 34, "e": "El concepto de salud según la OMS se engloba bajo los aspectos:", "o": ["Mental y físico.", "Ausencia de daño y enfermedad.", "Mental, físico y social.  7  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q035", "src": "Básica P39 (MAD)", "n": 35, "e": "En cuanto a la entrada en territorio nacional de una ciudadana de origen vietnamita, pa- reja de hecho de una ciudadana francesa, una vez que aquella se encuentra en posesión de su tarjeta de familiar de comunitario:", "o": ["Quedará exenta de la necesidad de visado, pero no de la estampación de sello de entrada.", "Quedará exenta de la necesidad de visado, así como de la estampación de sello de entrada.", "Quedará exenta de la estampación de sello de entrada, pero no de la necesidad de visado."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q036", "src": "Básica P39 (MAD)", "n": 36, "e": "La responsabilidad criminal se extingue:", "o": ["Por el cumplimiento de la reparación del daño.", "Por el indulto.", "Por la transformación, fusión, absorción o escisión de una persona jurídica."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q037", "src": "Básica P39 (MAD)", "n": 37, "e": "Conforme a las reglas ortográficas:", "o": ["La palabra biceps es llana, por lo tanto, no lleva tilde o acento ortográfico al terminar en la letra s.", "La palabra bíceps, es llana y lleva tilde o acento ortográfico porque la letra s final va precedida de otra consonante.", "Se puede escribir indistintamente biceps o bíceps al tratarse de una palabra llana procedente de otra lengua."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q038", "src": "Básica P39 (MAD)", "n": 38, "e": "Para la tenencia de un arma de fuego reglamentaria durante un viaje por España de un titular con residencia en un país miembro de la Unión Europea solamente será permitida si el interesado ha obtenido una autorización de la Dirección General de la Guardia Civil y de la auto- ridad competente del Estado de residencia. Dichas autorizaciones se harán constar en la Tarjeta Europea de armas de fuego y concederán:", "o": ["Para uno o varios viajes, por un plazo máximo de tres meses.", "Para uno o varios viajes, por un plazo máximo de seis meses.", "Para uno o varios viajes, por un plazo máximo de doce meses."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q039", "src": "Básica P39 (MAD)", "n": 39, "e": "¿Quién es competente para conocer del procedimiento de habeas corpus solicitado por un menor de edad de entre 14 y 18 años detenido?", "o": ["El Fiscal de Menores del lugar donde se halle detenido.", "El Juez de Menores del lugar donde se halle detenido.", "El Juez de Instrucción de guardia del lugar donde se halle detenido."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q040", "src": "Básica P39 (MAD)", "n": 40, "e": "¿Una tasa de crecimiento de población lenta o nula, de qué tipo de pirámides de edad es característica?", "o": ["Pirámides estacionarias.", "Pirámides expansivas.", "Pirámides isométricas."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q041", "src": "Básica P39 (MAD)", "n": 41, "e": "Señale la opción que considere incorrecta, si usted como policía lleva a cabo un registro corporal externo y superficial a una persona de distinto sexo:", "o": ["Como norma general no puedo llevarlo a cabo.", "Se llevarán a cabo con una injerencia mínima, y se realizarán del modo que cause el menor per- juicio a la intimidad y dignidad de la persona afectada.", "Los registros corporales externos y superficiales no podrán llevarse a cabo contra la voluntad del afectado.  8 PROMOCIÓN N.º 39 "], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q042", "src": "Básica P39 (MAD)", "n": 42, "e": "¿Qué es CEPOL y qué funciones realiza?", "o": ["Es una aplicación informática descentralizada que se utiliza para el intercambio de información urgente entre los países miembros firmantes.", "Es una agencia de la Unión Europea que se dedica a desarrollar y coordinar formación dirigida a agentes con funciones policiales.", "Es un sistema informático que emite alertas y contiene información sobre personas u objetos es- pecíficos, e instrucciones para las autoridades sobre las medidas que han de adoptarse cuando se haya dado con dicha persona u objeto."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q043", "src": "Básica P39 (MAD)", "n": 43, "e": "Pepe le dice a Juan que, o le devuelve el dinero que le prestó hace más de dos meses, o le denunciará al ayuntamiento por realizar obras sin licencia en su casa, Pepe será responsable de:", "o": ["Un delito de amenazas menos graves.", "Un delito de chantaje.", "No tendrá ninguna responsabilidad penal."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q044", "src": "Básica P39 (MAD)", "n": 44, "e": "El Comité español de ACNUR entiende por racismo simbólico:", "o": ["Es el tipo de racismo menos tolerante.", "Aboga por el derecho a ser iguales, pero con matices: el derecho a ser iguales existe, pero para ámbitos puntuales o ciertas situaciones.", "Es un tipo de racismo sutil porque generalmente es empleado por personas que están abierta- mente en contra del racismo y de los comportamientos racistas."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q045", "src": "Básica P39 (MAD)", "n": 45, "e": "Según nuestro Código Penal, la conspiración existe cuando se conciertan para la ejecución de un delito y resuelven ejecutarlo:", "o": ["Más de dos personas.", "Más de una persona.", "Con una persona es suficiente."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q046", "src": "Básica P39 (MAD)", "n": 46, "e": "Para cerrar una aplicación o ventana en Windows 10 y Mac por medio del teclado:", "o": ["En Mac pulse la combinación de teclas “Alt y F4”, mientras que en Windows, la combinación es ”Comando y Q”.", "En Windows pulse la combinación de teclas “Alt y f4”, mientras que en Mac, la combinación es ”Comando y Q”.", "En Windows pulse la combinación de teclas “Alt y F4”, mientras que en Mac, la combinación de teclas es “Alt y Q”."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q047", "src": "Básica P39 (MAD)", "n": 47, "e": "Según s
