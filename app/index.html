urso ideal de acciones." }, { "id": "EE-P40-Q052", "src": "Ejecutiva P40 (Jurispol)", "n": 52, "e": "¿En qué ámbito la Unión Europea tiene competencia exclusiva, a través de los Tratados, para promulgar leyes y los Estados miembros se limitarían a aplicar dicha legislación, a menos que la propia Unión Europea les autorice a aprobar algunas leyes en esa esfera?", "o": ["Industria.", "Unión aduanera.", "Protección civil."], "c": 1, "d": "media", "t": 8, "x": "La Unión, tiene una serie de competencias exclusivas: Unión Aduanera, normas de competencia, política monetaria, comercio, animales y vegetales marinos. Este próximo curso estrenaremos mejoras en la plataforma más completa del mercado. Nuestro Aula Virtual está pensado para exigirte al máximo y acompañarte en cada etapa del camino hasta convertirte en Inspector de Policía. Escala Ejecutiva" }, { "id": "EE-P40-Q053", "src": "Ejecutiva P40 (Jurispol)", "n": 53, "e": "Dentro del método científico, las variables clasificadas como cuantitativas pueden a su vez ser:", "o": ["Discretas y continuas.", "Dicotómicas o politómicas.", "Formales o informales."], "c": 0, "d": "facil", "t": 69, "x": "Dentro del método científico, las variables cuantitativas son aquellas que se expresan mediante números y representan cantidades o magnitudes medibles. Estas variables cuantitativas pueden clasificarse en dos grandes tipos: Variables cuantitativas discretas: Solo pueden tomar valores enteros, generalmente como resultado de conteos. Ejemplos: número de hijos, número de delitos, cantidad de policías. Variables cuantitativas continuas: Pueden tomar cualquier valor dentro de un intervalo, incluidos decimales o fracciones. Ejemplos: estatura, peso, tiempo de reacción, temperatura." }, { "id": "EE-P40-Q054", "src": "Ejecutiva P40 (Jurispol)", "n": 54, "e": "Según el Reglamento de armas, ¿a qué categoría pertenecen las armas inutilizadas?", "o": ["7ª categoría.", "8ª categoría.", "9ª categoría."], "c": 2, "d": "facil", "t": 81, "x": "Artículo 3 del Reglamento de Armas, del siguiente modo: 9.ª categoría Armas inutilizadas" }, { "id": "EE-P40-Q055", "src": "Ejecutiva P40 (Jurispol)", "n": 55, "e": "Como norma general y sin que hayan sido introducidos nuevos equipos de trabajo o se evidencie una inadecuación de los fines de protección requeridos, ¿cuál es el plazo que establece el RD 2/2006, por el que se establecen normas sobre prevención de riesgos laborales en la actividad de los funcionarios del Cuerpo Nacional de Policía, para proceder a revisar y actualizar la evaluación inicial de riesgos laborales?", "o": ["Cada tres años.", "Cada cuatro años.", "Cada cinco años."], "c": 1, "d": "facil", "t": 53, "x": "Real Decreto 2/2006, de 16 de enero, por el que se establecen normas sobre prevención de riesgos laborales en la actividad de los funcionarios del Cuerpo Nacional de Policía" }, { "id": "EE-P40-Q056", "src": "Ejecutiva P40 (Jurispol)", "n": 56, "e": "¿Qué visado autoriza el tránsito o la estancia en el territorio de los Estados miembros del espacio Schengen por un plazo de tiempo no superior a tres meses en un periodo de los seis meses a partir de la primera fecha de entrada en el territorio de los Estados miembros?", "o": ["El visado Schengen “TIPO A”.", "El visado Schengen “TIPO C”.", "El visado Schengen “TIPO D”."], "c": 1, "d": "facil", "t": 15, "x": "Visado de corta duración (Tipo C según denominación en el Código de Visados Schengen): que son válidos para una estancia hasta un máximo de noventa días por semestre, o en el caso de ser para tránsito por el tiempo necesario para realizar dicho tránsito." }, { "id": "EE-P40-Q057", "src": "Ejecutiva P40 (Jurispol)", "n": 57, "e": "Ante casos de urgente necesidad, ¿en qué circunstancia podrá la policía judicial registrar un dispositivo de almacenamiento masivo de información de un detenido sin la previa habilitación judicial?", "o": ["En ningún caso podrá registrar este dispositivo sin autorización judicial.", "Puede realizar el registro del dispositivo, con el deber de comunicarlo a la autoridad judicial en un plazo máximo de 72 horas.", "Podrá realizarlo siempre y cuando, además de la urgencia, se aprecie un interés constitucional legítimo y lo comunique inmediatamente, y en todo caso dentro del plazo máximo de 24 horas, a la autoridad judicial para su convalidación."], "c": 2, "d": "facil", "t": 50, "x": "588 SEXIES C En los casos de urgencia en que se aprecie un interés constitucional legítimo que haga imprescindible la medida, la Policía Judicial podrá llevar a cabo el examen directo de los datos contenidos en el dispositivo incautado, comunicándolo inmediatamente, y en todo caso dentro del plazo máximo de veinticuatro horas, por escrito motivado al juez competente, haciendo constar las razones que justificaron la adopción de la medida, la actuación realizada, la forma en que se ha efectuado y su resultado. El juez competente, también de forma motivada, revocará o confirmará tal actuación en un plazo máximo de 72 horas desde que fue ordenada la medida." }, { "id": "EE-P40-Q058", "src": "Ejecutiva P40 (Jurispol)", "n": 58, "e": "¿Cómo se denomina el órgano dependiente del Tribunal de Justicia de la Unión Europea que resuelve las cuestiones prejudiciales planteadas por los tribunales nacionales?", "o": ["El Tribunal de Justicia.", "El Tribunal General.", "El Tribunal de Instancia."], "c": 0, "d": "media", "t": 8, "x": "Una de las materias propias del Tribunal de Justicia de la Justicia de la UE, es la cuestion prejudicial. Para garantizar la aplicación efectiva y homogénea de la legislación de la Unión y evitar interpretaciones divergentes, los jueces nacionales pueden, y a veces deben, dirigirse al Tribunal de Justicia para solicitarle que precise una cuestión de interpretación del Derecho de la Unión." }, { "id": "EE-P40-Q059", "src": "Ejecutiva P40 (Jurispol)", "n": 59, "e": "Se pueden cometer por omisión impropia los delitos:", "o": ["Formales.", "De lesión.", "De mera actividad."], "c": 1, "d": "facil", "t": 26, "x": "Solamente los delitos de resultado, denominados también de lesión, pueden cometerse en comisión por omisión, u omisión impropia." }, { "id": "EE-P40-Q060", "src": "Ejecutiva P40 (Jurispol)", "n": 60, "e": "Según dispone la Ley Orgánica 5/2000, de 12 de enero, reguladora de la responsabilidad penal de los menores, ¿cuál es el tiempo máximo que puede durar una medida cautelar de internamiento de un menor?", "o": ["Seis meses, prorrogable por otros tres meses como máximo.", "Tres meses, sin posibilidad de prórroga alguna.", "La adopción de la medida cautelar de internamiento podrá mantenerse hasta la apertura del juicio oral."], "c": 0, "d": "media", "t": 46, "x": "Ley Orgánica 5/2000, de 12 de enero, reguladora de la responsabilidad penal de los menores Artículo 28. Reglas generales. 3. El tiempo máximo de la medida cautelar de internamiento será de seis meses, y podrá prorrogarse, a instancia del Ministerio Fiscal, previa audiencia del letrado del menor y mediante auto motivado, por otros tres meses como máximo" }, { "id": "EE-P40-Q061", "src": "Ejecutiva P40 (Jurispol)", "n": 61, "e": "El delito de robo con fuerza en las cosas absorbe, en principio, el delito de daños en cosa ajena, ello es así porque dichos delitos están en relación de:", "o": ["Alternatividad.", "Subsidiariedad.", "Consunción."], "c": 2, "d": "facil", "t": 38, "x": "En Derecho Penal, cuando un delito absorbe a otro porque este último se comete necesariamente como medio para ejecutar el primero, se dice que existe consunción." }, { "id": "EE-P40-Q062", "src": "Ejecutiva P40 (Jurispol)", "n": 62, "e": "Constituye un supuesto agravado de pornografía infantil del art. 189.2 del Código Penal español:", "o": ["Cuando se utilice a menores de diecisiete años.", "Cuando el culpable hubiere puesto en peligro, por imprudencia leve, la vida o salud de la víctima.", "Cuando el material pornográfico fuera de notoria importancia."], "c": 2, "d": "facil", "t": 36, "x": "Serán castigados con la pena de prisión de cinco a nueve años los que realicen los actos previstos en el apartado 1 de este artículo cuando concurra alguna de las circunstancias siguientes: e) Cuando el material pornográfico fuera de notoria importancia" }, { "id": "EE-P40-Q063", "src": "Ejecutiva P40 (Jurispol)", "n": 63, "e": "¿Qué tipo de infracción comete un vigilante de seguridad que actúa sin la debida uniformidad o medios, que reglamentariamente sean exigibles, en la prestación del servicio encomendado?", "o": ["Falta menos grave.", "Falta grave.", "Falta leve."], "c": 2, "d": "media", "t": 18, "x": "Cuando se actúa sin la debida uniformidad o medios reglamentariamente exigibles, la empresa de seguridad privada responsable comete una falta grave del art 57.2m), pero el vigilante que se haya prestando el servicio comete únicamente una falta leve del 58.3 a)." }, { "id": "EE-P40-Q064", "src": "Ejecutiva P40 (Jurispol)", "n": 64, "e": "La perturbación del desarrollo de una reunión o manifestación lícita, cuando no constituya infracción penal, constituye conforme a lo estipulado en la Ley Orgánica 4/2015, de Protección de la Seguridad Ciudadana, como una falta:", "o": ["Muy grave.", "Grave.", "Leve."], "c": 1, "d": "facil", "t": 19, "x": "Ley Orgánica 4/2015, de 30 de marzo, de protección de la seguridad ciudadana. Artículo 36. Infracciones graves. Son infracciones graves:8. La perturbación del desarrollo de una reunión o manifestación lícita, cuando no constituya infracción penal." }, { "id": "EE-P40-Q065", "src": "Ejecutiva P40 (Jurispol)", "n": 65, "e": "¿En qué supuesto el Código Penal castiga con mayor gravedad la caza y pesca prohibida?", "o": ["Cuando se trate de especies protegidas de fauna silvestre.", "Cuando se trate de especies catalogadas en peligro de extinción.", "Cuando se destruya o altere gravemente su hábitat."], "c": 1, "d": "facil", "t": 39, "x": "Artículo 335 del Código Penal “”El que cace o pesque especies protegidas de fauna silvestre será castigado con la pena de prisión de seis meses a dos años o multa de ocho a veinticuatro meses y, en todo caso, la inhabilitación especial para cazar o pescar por tiempo de uno a tres años.”” “”Se impondrá la pena en su mitad superior cuando se trate de especies o subespecies catalogadas en peligro de extinción.””" }, { "id": "EE-P40-Q066", "src": "Ejecutiva P40 (Jurispol)", "n": 66, "e": "De acuerdo con Sánchez-Elvira, Amor, Fernández y Olmedo (2003), entre los tipos de estabilidad aplicables al estudio de la inteligencia y de la personalidad, ¿cuál es la centrada en la persona y que indica la consistencia de un atributo o conducta a lo largo del tiempo de un individuo en particular?", "o": ["Estabilidad estructural.", "Estabilidad ipsativa.", "Estabilidad absoluta."], "c": 1, "d": "dificil", "t": 61, "x": "Según Sánchez-Elvira, Amor, Fernández y Olmedo (2003), la estabilidad ipsativa es la que está centrada en la persona y hace referencia a la consistencia de un atributo o conducta a lo largo del tiempo en un mismo individuo, comparando al sujeto consigo mismo." }, { "id": "EE-P40-Q067", "src": "Ejecutiva P40 (Jurispol)", "n": 67, "e": "¿Dónde se encuentra incardinado el Centro Nacional de Comunicaciones (CNC) dependiente de la Policía Nacional?", "o": ["División de Cooperación Internacional.", "Dirección General de la Policía.", "Unidad de Planificación Estratégica y Coordinación."], "c": 2, "d": "facil", "t": 13, "x": "Orden INT/28/2013, de 18 de enero, por la que se crea y regula la estructura del Centro Nacional de Comunicaciones y se determina su adscripción. Artículo 2. Adscripción: “”El Centro Nacional de Comunicaciones se adscribe a la Dirección General de la Policía, quedando encuadrado en la Unidad de Planificación Estratégica y Coordinación.””" }, { "id": "EE-P40-Q068", "src": "Ejecutiva P40 (Jurispol)", "n": 68, "e": "¿Qué afirmación es la correcta respecto a lo dispuesto en la Ley 2/86, de Fuerzas y Cuerpos de Seguridad, sobre la Junta de Seguridad como órgano de coordinación?", "o": ["Está presidida por el ministro del Interior.", "Estará integrada por cuatro representantes del Estado y cuatro de las Comunidades Autónomas.", "Que la Comunidad Autónoma donde pretenda constituirse disponga de Cuerpos de Policía propios."], "c": 2, "d": "facil", "t": 14, "x": "Ley Orgánica 2/1986, de 13 de marzo, de Fuerzas y Cuerpos de Seguridad. Artículo cincuenta. 1. En las Comunidades Autónomas que dispongan de Cuerpos de Policía propios podrá constituirse una Junta de Seguridad" }, { "id": "EE-P40-Q069", "src": "Ejecutiva P40 (Jurispol)", "n": 69, "e": "Dentro de los modelos de despliegue de cloud computing, ¿cuál es el que crea, gestiona y pertenece a una sola organización y se alojan de forma privada en sus propios centros de datos?", "o": ["Nube pública.", "Nube privada.", "Nube híbrida."], "c": 1, "d": "facil", "t": 73, "x": "En el modelo de nube privada, los recursos de computación (servidores, almacenamiento, redes, etc.) son utilizados exclusivamente por una sola organización, y esta puede gestionarlos internamente o mediante un tercero, pero siempre de forma privada y aislada del público general. Suele estar alojada en los propios centros de datos de la organización o en una infraestructura dedicada." }, { "id": "EE-P40-Q070", "src": "Ejecutiva P40 (Jurispol)", "n": 70, "e": "El Código comunitario sobre visados establece que los Estados miembros tomarán identificadores biométricos del solicitante, que comprenderán:", "o": ["Una fotografía y la impresión dactilar del dedo índice de cada mano de este.", "Una fotografía y diez impresiones dactilares de este.", "Una fotografía y la impresión dactilar del dedo índice derecho de este."], "c": 1, "d": "media", "t": 15, "x": "El artículo 13.1 del Código de Visados, establece que los Estados miembros tomarán identificadores biométricos del solicitante, que comprenderán una fotografía y diez impresiones dactilares de este, de conformidad con las garantías establecidas en el Convenio del Consejo de Europa para la protección de los derechos humanos y las libertades fundamentales, en la Carta de los Derechos Fundamentales de la Unión Europea y en la Convención de las Naciones Unidas sobre los Derechos del Niño." }, { "id": "EE-P40-Q071", "src": "Ejecutiva P40 (Jurispol)", "n": 71, "e": "El “test” es uno de los métodos de medida más empleados en ciencias sociales. Algunas de sus características son:", "o": ["Válido y relativo.", "Objetivo y susceptible de comparación.", "Fidedigno y aproximado."], "c": 1, "d": "facil", "t": 70, "x": "Un test se define como un instrumento de medición estandarizado que permite obtener información sobre características psicológicas, conductuales o sociales de un individuo. Sus principales características son objetividad y susceptible de comparación." }, { "id": "EE-P40-Q072", "src": "Ejecutiva P40 (Jurispol)", "n": 72, "e": "¿Qué valor representa el valor promedio que se espera obtener si se repite un experimento aleatorio muchas veces?", "o": ["La esperanza.", "La varianza.", "La desviación."], "c": 0, "d": "facil", "t": 71, "x": "En estadística y teoría de la probabilidad, la esperanza o valor esperado representa el valor promedio que se espera obtener si se repite un experimento aleatorio muchas veces." }, { "id": "EE-P40-Q073", "src": "Ejecutiva P40 (Jurispol)", "n": 73, "e": "Según exponen, entre otros, Bermúdez, Pérez y Sanjuán (2005), Eysenck propone un modelo jerárquico de la personalidad con diferentes niveles que van de lo más específico a lo más general. El primer nivel se encontraría representado por:", "o": ["Las respuestas específicas.", "Las respuestas habituales.", "La organización de actos habituales en rasgos."], "c": 0, "d": "facil", "t": 61, "x": "Según Eysenck, citado por Bermúdez, Pérez y Sanjuán (2005), su modelo jerárquico de la personalidad se organiza en niveles que van de lo más específico a lo más general: respuestas específicas, que son las conductas o actos individuales observables en situaciones concretas; respuestas habituales, que son los patrones de conducta repetidos por un individuo en distintas situaciones, y rasgos, referidos a la organización de actos habituales que reflejan tendencias estables de la personalidad." }, { "id": "EE-P40-Q074", "src": "Ejecutiva P40 (Jurispol)", "n": 74, "e": "¿Qué sistema operativo móvil mantiene su código fuente de código abierto?", "o": ["iOS.", "Android.", "Ambas son correctas."], "c": 1, "d": "facil", "t": 74, "x": "IOS se trata de un sistema operativo de la marca Apple destinado a dispositivos móviles de codigo cerrado. Android está basado en Linux y al igual que este se trata de uns sistema operativo para dispositivos móivles de código abierto." }, { "id": "EE-P40-Q075", "src": "Ejecutiva P40 (Jurispol)", "n": 75, "e": "¿Qué parte del diencéfalo se sitúa en la zona posterior dorsal, adyacente al mesencéfalo y se encuentra integrada por la habénula, la glándula pineal y la estría medular?", "o": ["El epitálamo.", "El tálamo.", "El subtálamo."], "c": 0, "d": "media", "t": 56, "x": "La parte del diencéfalo que se sitúa en la zona posterior dorsal, adyacente al mesencéfalo y que incluye la habénula, la glándula pineal y la estría medular es el Epitálamo, una región que regula los ritmos circadianos (sueño-vigilia) y el inicio del movimiento voluntario, conectando el hipotálamo con la parte anterior del tronco encefálico" }, { "id": "EE-P40-Q076", "src": "Ejecutiva P40 (Jurispol)", "n": 76, "e": "¿Cuál de las opciones propuestas es una circunstancia atenuante de la responsabilidad penal de las personas jurídicas, siempre y cuando lo realicen con posterioridad a la comisión del delito y a través de sus representantes legales?", "o": ["Haber procedido, antes del comienzo del juicio oral, a reparar o disminuir el daño causado por el delito.", "Haber colaborado en la investigación del hecho aportando pruebas, antes de conocer que el procedimiento judicial se dirige contra ella.", "Haber procedido en cualquier momento del procedimiento y con anterioridad al juicio oral a reparar o disminuir el daño causado por el delito."], "c": 2, "d": "facil", "t": 26, "x": "El artículo 31 quater del Código Penal, establece entre otros elementos, la de haber procedido el cualquier momento del procedimiento y con anterioridad al juicio oral a reparar o disminuir el daño causado por el delito. La opcion ALFA está incompleta y la opcion BRAVO realmente se realiza en cualquier parte del proceso, por ende, sí se conoce del procedimiento judicial." }, { "id": "EE-P40-Q077", "src": "Ejecutiva P40 (Jurispol)", "n": 77, "e": "Conforme a lo establecido en el Estatuto Básico del Empleado Público, ¿cuál es el procedimiento normal de provisión de puestos de trabajo en la Administración Pública que consiste en la valoración de los méritos y capacidades y, en su caso, aptitudes de los candidatos por órganos colegiados de carácter técnico?", "o": ["Por concurso.", "Libre designación.", "Ambas son incorrectas."], "c": 0, "d": "media", "t": 12, "x": "Artículo 79 TREBEP: 1. El concurso, como procedimiento normal de provisión de puestos de trabajo, consistirá en la valoración de los méritos y capacidades y, en su caso, aptitudes de los candidatos por órganos colegiados de carácter técnico. La composición de estos órganos responderá al principio de profesionalidad y especialización de sus miembros y se adecuará al criterio de paridad entre mujer y hombre. Su funcionamiento se ajustará a las reglas de imparcialidad y objetividad." }, { "id": "EE-P40-Q078", "src": "Ejecutiva P40 (Jurispol)", "n": 78, "e": "¿Qué medida puede ser eficaz para detectar, prevenir o dar respuesta ante un agente interno que, con acceso legítimo a la información de una empresa, utiliza este privilegio de manera indebida poniendo en riesgo la seguridad de la organización?", "o": ["Establecer una política de privilegios máximos a los usuarios.", "Asegurar que los empleados posean la mínima formación en seguridad digital.", "Monitorizar y registrar las actividades de los empleados."], "c": 2, "d": "facil", "t": 75, "x": "Se trata de un empleado malintencionado que dispone de acceso legítimo (esto es, que es necesario para llevar a cabo sus tareas) a la información, por lo que restringir los permisos o incrementar su formación no va a solventar este caso particular. Se debería implementar una solución UAM, de Monitorización de la Actividad de los Usarios que moritoriza y registra las actividades de los empleados, lo que permitiría descubrir a este empleado." }, { "id": "EE-P40-Q079", "src": "Ejecutiva P40 (Jurispol)", "n": 79, "e": "¿Quién será el encargado de elaborar el proyecto de Estatuto de una Comunidad Autónoma según lo dispuesto en el artículo 146 de la Constitución española?", "o": ["Un comité de expertos designados entre los miembros de las Cortes Generales y de la Diputación correspondiente.", "Una asamblea compuesta por los miembros de la Diputación u órgano interinsular de las provincias afectadas y por los Diputados y Senadores elegidos en ellas.", "Un comité de Senadores elegidos en las provincias de esa Diputación."], "c": 1, "d": "media", "t": 7, "x": "Artículo 146 El proyecto de Estatuto será elaborado por una asamblea compuesta por los miembros de la Diputación u órgano interinsular de las provincias afectadas y por los Diputados y Senadores elegidos en ellas y será elevado a las Cortes Generales para su tramitación como ley." }, { "id": "EE-P40-Q080", "src": "Ejecutiva P40 (Jurispol)", "n": 80, "e": "¿Qué característica presenta el método de investigación correlacional?", "o": ["Se enmarca en la metodología de investigación experimental.", "Su cometido es hallar explicaciones mediante el estudio de relaciones entre variables en marcos naturales, sin que exista la manipulación de dichas variables.", "Las variables a observar son manipulables."], "c": 1, "d": "facil", "t": 69, "x": "El método correlacional se centra en analizar la relación entre dos o más variables tal como ocurren de manera natural, sin manipularlas. Su objetivo es determinar si existe asociación y qué tipo de relación existe, pero no permite establecer causalidad directa." }, { "id": "EE-P40-Q081", "src": "Ejecutiva P40 (Jurispol)", "n": 81, "e": "Según el Real Decreto Legislativo 6/2015, que aprueba el texto refundido de la Ley sobre tráfico, circulación de vehículos a motor y seguridad vial, la competencia para sancionar las infracciones cometidas en vías interurbanas y travesías corresponde como norma general a:", "o": ["El Jefe de Tráfico de la provincia en la que se haya cometido el hecho.", "El Director del Centro de Tratamiento de Denuncias Automatizadas.", "Los alcaldes del término municipal donde se haya cometido el hecho."], "c": 0, "d": "facil", "t": 79, "x": "Artículo 84. Competencia: 1. La competencia para sancionar las infracciones cometidas en vías interurbanas y travesías corresponde al Jefe de Tráfico de la provincia en que se haya cometido el hecho. Si se trata de infracciones cometidas en el territorio de más de una provincia, la competencia para su sanción corresponde, en su caso, al Jefe de Tráfico de la provincia en que la infracción hubiera sido primeramente denunciada." }, { "id": "EE-P40-Q082", "src": "Ejecutiva P40 (Jurispol)", "n": 82, "e": "¿Requiere autorización administrativa la utilización de la señal luminosa V-1, que identifica a un vehículo como prioritario?", "o": ["Requerirá autorización si se encuentra instalada como elemento supletorio adicional o como elemento constructivo.", "No requerirá autorización administrativa tanto si se encuentra instalada como elemento supletorio adicional o como elemento constructivo.", "Requerirá autorización cuando la señal V-1 se encuentre instalada como elemento constructivo."], "c": 1, "d": "facil", "t": 80, "x": "Real Decreto 2822/1998, de 23 de diciembre, por el que se aprueba el Reglamento General de Vehículos V-1. VEHÍCULO PRIORITARIO 2. La utilización de la señal V-1 no requerirá autorización administrativa alguna, ya se encuentre instalado como elemento supletorio adicional o como elemento constructivo." }, { "id": "EE-P40-Q083", "src": "Ejecutiva P40 (Jurispol)", "n": 83, "e": "¿Qué nivel orgánico posee el titular del Centro de Inteligencia contra el Terrorismo y el Crimen Organizado (CITCO)?", "o": ["Director general.", "Subdirector general.", "Subsecretario."], "c": 1, "d": "facil", "t": 13, "x": "Real Decreto 207/2024 - El Real Decreto fija que el órgano CITCO, tiene rango de Subdirección General y que además está integrado en la Secretaría de Estado de Seguridad." }, { "id": "EE-P40-Q084", "src": "Ejecutiva P40 (Jurispol)", "n": 84, "e": "Según las definiciones recogidas en la Ley 31/1995, de Prevención de Riesgos Laborales, ¿qué se consideran como “daños derivados del trabajo”?", "o": ["La posibilidad de que un trabajador sufra un determinado daño derivado del trabajo.", "Las enfermedades, patologías o lesiones sufridas con motivo u ocasión del trabajo.", "Cualquier característica del puesto de trabajo que pueda tener una influencia significativa en la generación de riesgos para la seguridad y la salud del trabajador."], "c": 1, "d": "facil", "t": 53, "x": "Según la Ley 31/1995, de Prevención de Riesgos Laborales, se consideran “daños derivados del trabajo” aquellos efectos negativos sobre la salud del trabajador, como enfermedades, patologías o lesiones, que se producen con motivo u ocasión del trabajo." }, { "id": "EE-P40-Q085", "src": "Ejecutiva P40 (Jurispol)", "n": 85, "e": "Conforme a lo establecido en el Estatuto de la víctima del delito, las Oficinas de Asistencia a las Víctimas realizarán una valoración de sus circunstancias particulares, con la finalidad de determinar qué medidas de asistencia y apoyo deben ser prestadas a la víctima, entre la que NO se encuentra:", "o": ["El acompañamiento a juicio.", "La prestación de apoyo o asistencia psicológica.", "La gestión del resarcimiento económico a la víctima tras la sentencia condenatoria."], "c": 2, "d": "media", "t": 51, "x": "La gestión del resarcimiento económico tras la sentencia condenatoria no corresponde a estas oficinas; esa función se realiza a través de otros órganos judiciales o administrativos encargados de la ejecución de sentencias. Artículo 28.2 del Estatuto de la Víctima (Ley 4/2015): Las Oficinas de Asistencia a las Víctimas realizarán una valoración de sus circunstancias particulares, especialmente en lo relativo a las circunstancias a las que se refiere el apartado 2 del artículo 23, con la finalidad de determinar qué medidas de asistencia y apoyo deben ser prestadas a la víctima, entre las que se podrán incluir: a) La prestación de apoyo o asistencia psicológica. b) El acompañamiento a juicio. c) La información sobre los recursos psicosociales y asistenciales disponibles y, si la víctima lo solicita, derivación a los mismos. d) Las medidas especiales de apoyo que puedan resultar necesarias cuando se trate de una víctima con necesidades especiales de protección. e) La derivación a servicios de apoyo especializados." }, { "id": "EE-P40-Q086", "src": "Ejecutiva P40 (Jurispol)", "n": 86, "e": "¿En qué circunstancia podrá denegar una autoridad competente de ejecución española el reconocimiento de una orden europea de protección emitida por una autoridad competente de otro Estado miembro?", "o": ["Cuando el reconocimiento de la orden europea de protección vulnere el principio non bis in idem.", "Cuando la persona causante del peligro goce de inmunidad en el Estado de emisión.", "Cuando la medida de protección se refiera a un hecho que constituya infracción penal en el Derecho del Estado de ejecución."], "c": 0, "d": "facil", "t": 23, "x": "La 23/2014 establece que una de las condiciones que permite a España denegar la ejecución de la OEDE, se produce cuando la OEDE reclame hechos o bien ya juzgados o que incluso conforme al artículo 48.2.e, la persona buscada ya tenga otra resolucion definitiva por los mismos hechos que obstaculice el posterior ejercicio de diligencias penales." }, { "id": "EE-P40-Q087", "src": "Ejecutiva P40 (Jurispol)", "n": 87, "e": "La capacidad civil de las asociaciones, como persona jurídica, se regirán conforme a lo estipulado en el Código Civil:", "o": ["Por las reglas de su institución.", "Por sus estatutos.", "Por las leyes que las hayan creado o reconocido."], "c": 1, "d": "facil", "t": 2, "x": "Artículo 37 del Código Civil La capacidad civil de las corporaciones se regulará por las leyes que las hayan creado o reconocido; la de las asociaciones por sus estatutos, y las de las fundaciones por las reglas de su institución, debidamente aprobadas por disposición administrativa, cuando este requisito fuere necesario." }, { "id": "EE-P40-Q088", "src": "Ejecutiva P40 (Jurispol)", "n": 88, "e": "Dentro de la estructura de la Policía Nacional, ¿qué unidad es la encargada de la seguridad de los traslados de obras de arte que se determinen?", "o": ["La Brigada Central de Patrimonio Histórico.", "La Brigada Central de Protecciones Especiales.", "La Sección Operativa del Museo del Prado."], "c": 1, "d": "facil", "t": 13, "x": "Orden INT/859/2023, de 21 de julio, por la que se desarrolla la estructura orgánica y funciones de los servicios centrales y territoriales de la Dirección General de la Policía. 2.º La Brigada Central de Protecciones Especiales. Se encarga de la planificación y ejecución de los dispositivos de seguridad desarrollados para garantizar la protección integral de personalidades o delegaciones extranjeras durante su estancia en nuestro país, así como de la protección de testigos protegidos y la seguridad de los traslados de obras de arte que se determinen." }, { "id": "EE-P40-Q089", "src": "Ejecutiva P40 (Jurispol)", "n": 89, "e": "¿Qué documento debe llevar obligatoriamente un conductor, y estar en vigor, cuando conduce un vehículo a motor por una vía urbana?", "o": ["La póliza del seguro y el recibo del último pago.", "La tarjeta de inspección técnica del vehículo.", "Ambas son correctas."], "c": 1, "d": "media", "t": 78, "x": "Será obligatorio: Permiso de Conducir. Permiso de Circulación. Tarjeta ITV" }, { "id": "EE-P40-Q090", "src": "Ejecutiva P40 (Jurispol)", "n": 90, "e": "Gustavo P. L., miembro de las Fuerzas y Cuerpos de Seguridad del Estado, sufre una agresión ilegítima mientras se encuentra en el ejercicio de su profesión. En su reacción defensiva podrá alegar la concurrencia de:", "o": ["La legítima defensa.", "El cumplimiento de un deber o ejercicio legítimo de un derecho.", "Ambas respuestas son correctas."], "c": 1, "d": "media", "t": 28, "x": "Al tratarse de un miembro de las Fuerzas y Cuerpos de Seguridad del Estado en el ejercicio de sus funciones, quedará amparado bajo la eximente del artículo 20.7 CP." }, { "id": "EE-P40-Q091", "src": "Ejecutiva P40 (Jurispol)", "n": 91, "e": "Según lo dispuesto en el artículo 86 de la Constitución española sobre los Decretos-leyes, señale la respuesta correcta:", "o": ["Deben ser sometidos a debate y votación del Congreso de los Diputados en el plazo máximo de 15 días desde su presentación.", "No podrán afectar a los derechos, deberes y libertades de los ciudadanos recogidos en el Título I de la Constitución.", "Deben ser sometidos inmediatamente a debate y votación del Congreso de los Diputados y del Senado."], "c": 1, "d": "facil", "t": 1, "x": "Artículo 86 de la Constitución Española 1. En caso de extraordinaria y urgente necesidad, el Gobierno podrá dictar disposiciones legislativas provisionales que tomarán la forma de Decretos-leyes y que no podrán afectar al ordenamiento de las instituciones básicas del Estado, a los derechos, deberes y libertades de los ciudadanos regulados en el Título I, al régimen de las Comunidades Autónomas ni al Derecho electoral general. 2. Los Decretos-leyes deberán ser inmediatamente sometidos a debate y votación de totalidad al Congreso de los Diputados, convocado al efecto si no estuviere reunido, en el plazo de los treinta días siguientes a su promulgación. El Congreso habrá de pronunciarse expresamente dentro de dicho plazo sobre su convalidación o derogación, para lo cual el Reglamento establecerá un procedimiento especial y sumario. 3. Durante el plazo establecido en el apartado anterior, las Cortes podrán tramitarlos como proyectos de ley por el procedimiento de urgencia." }, { "id": "EE-P40-Q092", "src": "Ejecutiva P40 (Jurispol)", "n": 92, "e": "Atendiendo a lo expuesto por Belloch, Sandín y Ramos (2004), los síntomas propios de la esquizofrenia como delirios y alucinaciones, dado que podrían aparecer en otros trastornos, fueron catalogados por Eugen Bleuler como:", "o": ["Fundamentales.", "Básicos.", "Accesorios."], "c": 2, "d": "dificil", "t": 63, "x": "Al no ser sintomas específicos de la esquizofrania. Bleuner catalogó estos símtomas como accesorios." }, { "id": "EE-P40-Q093", "src": "Ejecutiva P40 (Jurispol)", "n": 93, "e": "De acuerdo con Fernández Trespalacios (2001), ¿cuáles son los modelos de atención que se caracterizan porque la información se procesa sin limitación hasta que llega a un canal único que sólo puede procesar una información a la vez?", "o": ["Modelos multicanales.", "Modelos de filtro.", "Modelos de procesado."], "c": 1, "d": "facil", "t": 57, "x": "Según Fernández Trespalacios (2001), los modelos de atención de tipo filtro se caracterizan porque la información se procesa sin limitación hasta que llega a un canal único que solo puede procesar una información a la vez." }, { "id": "EE-P40-Q094", "src": "Ejecutiva P40 (Jurispol)", "n": 94, "e": "En relación con lo dispuesto en el Código Civil sobre las fuentes del ordenamiento jurídico español, ¿cuál es la opción correcta?:", "o": ["La ley sólo regirá en defecto de la costumbre.", "La costumbre se aplicará en defecto de ley y de los principios generales del derecho, sin perjuicio de su carácter informador del ordenamiento jurídico.", "La costumbre sólo regirá en defecto de ley aplicable, siempre que no sea contraria a la moral o al orden público, y que resulte probada."], "c": 2, "d": "facil", "t": 1, "x": "Artículo 1.3: La costumbre sólo regirá en defecto de ley aplicable, siempre que no sea contraria a la moral o al orden público, y que resulte probada" }, { "id": "EE-P40-Q095", "src": "Ejecutiva P40 (Jurispol)", "n": 95, "e": "La Constitución española establece las reglas en las que se ejercerá la Regencia en el caso de que el Rey sea inhabilitado para el ejercicio de su autoridad y la imposibilidad fuera reconocida por las Cortes Generales. Responda la respuesta correcta:", "o": ["Entrará a ejercer inmediatamente la Regencia el Príncipe heredero, sea este mayor o menor de edad.", "Corresponderá al Príncipe heredero de la Corona, si fuera mayor de edad.", "Si el Príncipe heredero es menor de edad, corresponderá al designado por las Cortes Generales."], "c": 1, "d": "facil", "t": 6, "x": "Artículo 59 CE: 2. Si el Rey se inhabilitare para el ejercicio de su autoridad y la imposibilidad fuere reconocida por las Cortes Generales, entrará a ejercer inmediatamente la Regencia el Príncipe heredero de la Corona, si fuere mayor de edad. Si no lo fuere, se procederá de la manera prevista en el apartado anterior, hasta que el Príncipe heredero alcance la mayoría de edad" }, { "id": "EE-P40-Q096", "src": "Ejecutiva P40 (Jurispol)", "n": 96, "e": "¿Cómo se denomina al valor neto que posee una empresa, que resulta de la diferencia entre sus bienes y derechos, y sus deudas y obligaciones?:", "o": ["El balance.", "Patrimonio empresarial.", "El capital social."], "c": 1, "d": "facil", "t": 72, "x": "El patrimonio empresarial es el conjunto de bienes, derechos, deudas y obligaciones de una empresa, y su valor neto se calcula como: Patrimonio neto (Patrimonio Empresarial) = (Bienes + Derechos) – (Deudas + Obligaciones)" }, { "id": "EE-P40-Q097", "src": "Ejecutiva P40 (Jurispol)", "n": 97, "e": "¿Cuándo se iniciará el cumplimiento de la sanción de suspensión de las licencias, autorizaciones o permisos por una sanción prevista en la Ley Orgánica 4/15, de protección de la seguridad ciudadana?:", "o": ["Dos meses desde que la sanción haya adquirido firmeza en vía administrativa.", "El mismo día en el que la sanción haya adquirido firmeza en vía administrativa.", "Un mes desde que la sanción haya adquirido firmeza en vía administrativa."], "c": 2, "d": "media", "t": 19, "x": "Ley Orgánica 4/2015, de 30 de marzo, de protección de la seguridad ciudadana.Artículo 53. Ejecución de la sanción 2. El cumplimiento de la sanción de suspensión de las licencias, autorizaciones o permisos se iniciará transcurrido un mes desde que la sanción haya adquirido firmeza en vía administrativa." }, { "id": "EE-P40-Q098", "src": "Ejecutiva P40 (Jurispol)", "n": 98, "e": "Según lo dispuesto en el Esquema Nacional de Seguridad, los sistemas de información deben diseñarse y configurarse otorgando los mínimos privilegios necesarios para su correcto desempeño, lo que implica incorporar:", "o": ["La eliminación o desactivación, mediante el control de la configuración, de las funciones que sean innecesarias o inadecuadas al fin que se persigue.", "Las funciones de administración y registro de actividad serán las máximas posibles.", "El uso del sistema ha de ser complejo para evitar que una utilización insegura requiera de un acto inconsciente del usuario."], "c": 0, "d": "dificil", "t": 75, "x": "RD 311/2022, Art. 20. Artículo 20. Mínimo privilegio. Los sistemas de información deben diseñarse y configurarse otorgando los mínimos privilegios necesarios para su correcto desempeño, lo que implica incorporar los siguientes aspectos: a) El sistema proporcionará la funcionalidad imprescindible para que la organización alcance sus objetivos competenciales o contractuales. b) Las funciones de operación, administración y registro de actividad serán las mínimas necesarias, y se asegurará que sólo son desarrolladas por las personas autorizadas, desde emplazamientos o equipos asimismo autorizados; pudiendo exigirse, en su caso, restricciones de horario y puntos de acceso facultados. c) Se eliminarán o desactivarán, mediante el control de la configuración, las funciones que sean innecesarias o inadecuadas al fin que se persigue. El uso ordinario del sistema ha de ser sencillo y seguro, de forma que una utilización insegura requiera de un acto consciente por parte del usuario. d) Se aplicarán guías de configuración de seguridad para las diferentes tecnologías, adaptadas a la categorización del sistema, al efecto de eliminar o desactivar las funciones que sean innecesarias o inadecuadas." }, { "id": "EE-P40-Q099", "src": "Ejecutiva P40 (Jurispol)", "n": 99, "e": "De acuerdo con lo expuesto por León y Díaz (2005) en lo relativo a los síntomas indicadores del fenómeno de pensamiento grupal o groupthink, señalados por Janis (1972), ¿cuál se refiere a la tendencia del grupo a ser excesivamente optimistas haciéndoles obviar los riesgos y las consecuencias negativas del seleccionado curso de acción?:", "o": ["Racionalización colectiva.", "Ilusión de unanimidad.", "Ilusión de invulnerabilidad."], "c": 2, "d": "media", "t": 65, "x": "El grupo se percibe a sí mismo como demasiado fuerte y capaz de superar cualquier obstáculo, llevando a una euforia y optimismo exagerados que ocultan los peligros." }, { "id": "EE-P40-Q100", "src": "Ejecutiva P40 (Jurispol)", "n": 100, "e": "La minoría de edad penal como circunstancia eximente, se configura:", "o": ["Como presunción iuris et de iure.", "Como presunción iuris tantum.", "Se recoge en el artículo 20 del Código Penal."], "c": 0, "d": "dificil", "t": 29, "x": "La minoría de edad penal establece que los menores de 18 años no son penalmente responsables de los delitos. Se trata de una presunción absoluta (iuris et de iure), es decir, no admite prueba en contrario: nadie puede alegar que, a pesar de ser menor de 18 años, sí debería ser responsable penalmente. 428 PÁGINAS A DOBLE COLUMNA RESUMEN COMPLETO DE LOS 81 TEMAS ACTUALIZADOS ACCESO A SIMULACROS INÉDITOS APARTADOS PERSONALIZADOS PARA HACER SEGUIMIENTO +info en jurispol.com           912 170 132 Atención al Alumno 912 170 132  Acción Tutorial 664 12 00 00" }, { "id": "EB-P37-Q001", "src": "Básica P37 (MAD)", "n": 1, "e": "Según el art. 147 de la Constitución Española, la reforma de los Estatutos de Autonomía se ajustará al procedimiento establecido en los mismos y requerirá:", "o": ["En todo caso, la aprobación por las Cortes Generales, mediante Ley Ordinaria.", "En todo caso, la aprobación por las Cortes Generales, mediante Ley Orgánica.", "Dependiendo de lo establecido en el Estatuto, necesitará o no la aprobación de Las Cortes Generales."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q002", "src": "Básica P37 (MAD)", "n": 2, "e": "El Consejo de la Unión Europea se pronunciará.", "o": ["Por mayoría simple, excepto cuando los Tratados dispongan otra cosa.", "Por mayoría cualificada, excepto cuando los Tratados dispongan otra cosa.", "Siempre por mayoría simple. ¡Ojo! Esta pregunta fue impugnada."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q003", "src": "Básica P37 (MAD)", "n": 3, "e": "En relación a la Ley Orgánica 2/1986 de 13 de marzo de las Fuerzas y Cuerpos de Seguridad, cuáles son las implicaciones del secreto profesional para el personal funcionario:", "o": ["Deberán guardar riguroso secreto respecto de todas las informaciones que conozcan por razón o con ocasión del desempeño de sus funciones, no estando obligados a revelar las fuentes de información salvo que el ejercicio de sus funciones o las disposiciones de Ley les impongan actuar de otra manera.", "Deberán guardar riguroso secreto respecto de todas las informaciones que conozcan por razón o con ocasión del desempeño de sus funciones, no estando obligados a revelar las fuentes de infor- mación salvo que en el ejercicio de sus funciones y conjuntamente con las disposiciones de Ley les impongan actuar de otra manera.", "Deberán guardar riguroso secreto respecto de todas las informaciones que conozcan por razón o con ocasión del desempeño de sus funciones, estando obligados a revelar las fuentes de información salvo que el ejercicio de sus funciones o las disposiciones de Ley les impongan actuar de otra manera."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q004", "src": "Básica P37 (MAD)", "n": 4, "e": "Según del Código Penal, ¿hay tentativa de delito?:", "o": ["Cuando el sujeto da principio a la ejecución del delito directamente por hechos exteriores, practi- cando todos o parte de los actos que objetivamente deberían producir el resultado, y sin embargo éste no se produce por la voluntad del autor.", "Cuando el sujeto da principio a la ejecución del delito directamente por hechos exteriores, prac- ticando solo parte de los actos que objetivamente deberían producir el resultado, y sin embargo éste no se produce por causas independientes de la voluntad del autor.", "Cuando el sujeto da principio a la ejecución del delito directamente por hechos exteriores, practi- cando todos o parte de los actos que objetivamente deberían producir el resultado, y sin embargo éste no se produce por causas independientes de la voluntad del autor.  3  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q005", "src": "Básica P37 (MAD)", "n": 5, "e": "El segundo Foro Social Mundial de realizó en:", "o": ["Bombay, India, del 16 al 21 de enero de 2004.", "Porto Alegre, Brasil del 31 de enero al 05 de febrero de 2002.", "Nairobi (Kenia) del 20 al 25 de enero de 2007."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q006", "src": "Básica P37 (MAD)", "n": 6, "e": "Para la adquisición de la nacionalidad española por opción, carta de naturaleza o residen- cia, es necesario:", "o": ["Que el mayor de edad y capaz para prestar una declaración por sí, jure o prometa fidelidad al Rey y obediencia a la Constitución y a las leyes.", "Que el mayor de catorce años y capaz para prestar una declaración por sí, jure o prometa fidelidad al Rey y obediencia a la Constitución y a las leyes.", "Que el mayor de dieciséis años y capaz para prestar una declaración por sí, jure o prometa fideli- dad al Rey y obediencia a la Constitución y a las leyes."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q007", "src": "Básica P37 (MAD)", "n": 7, "e": "¿Cuál de los siguientes no es uno de los diecisiete objetivos de desarrollo sostenible de Na- ciones Unidas, recogidos en la Agenda 2030?", "o": ["Acción por el clima.", "Energía asequible y no contaminante.", "Educación en el voluntariado."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q008", "src": "Básica P37 (MAD)", "n": 8, "e": "De acuerdo a Microsoft y respecto al funcionamiento de su S.O. Windows ¿qué sistema de archivos es la mejor opción para volúmenes de unos 400 MB o más, dado que su rendimiento no se degrada con volúmenes grandes?", "o": ["FAT.", "HPFS.", "NTFS."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q009", "src": "Básica P37 (MAD)", "n": 9, "e": "Presentada una moción de censura, ¿Cuánto tiempo tiene que transcurrir desde esta pre- sentación para que pueda ser votada?:", "o": ["3 días.", "5 días.", "7 días."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q010", "src": "Básica P37 (MAD)", "n": 10, "e": "¿Cuál de las siguientes es una dirección IP válida para identificar una conexión a internet?", "o": ["85.256.0.119.", "335d:1db8:85a3::8a2e:0370:7332.", "Las dos son válidas."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q011", "src": "Básica P37 (MAD)", "n": 11, "e": "Cuando hablamos de un plano basado en el sistema hipodámico nos estamos refiriendo a un plano de tipo:", "o": ["Ortogonal.", "Radiocéntrico.", "Irregular."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q012", "src": "Básica P37 (MAD)", "n": 12, "e": "El Presidente del Tribunal Constitucional, será nombrado:", "o": ["Entre sus miembros por el Rey, a propuesta del mismo Tribunal en pleno y por un período de tres años.", "Entre sus miembros por el Rey, a propuesta del Gobierno y por un período de tres años.", "Entre sus miembros por el Rey, a propuesta del Gobierno y por un período de 4 años.  4 PROMOCIÓN N.º 37 "], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q013", "src": "Básica P37 (MAD)", "n": 13, "e": "El art. 103 de la Constitución Española establece que la Administración:", "o": ["Está sujeta al control parlamentario.", "Sirve con objetividad los intereses generales.", "Se encuentra bajo la dependencia del Gobierno."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q014", "src": "Básica P37 (MAD)", "n": 14, "e": "La Unidad Adscrita a la Fiscalía General del Estado, depende de:", "o": ["La Unidad Central de Delincuencia Económica y Fiscal.", "La Unidad Central de Drogas y Crimen Organizado.", "La Unidad Central de Delincuencia Especializada y Violenta."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q015", "src": "Básica P37 (MAD)", "n": 15, "e": "¿Tiene su dependencia directa de la Dirección Adjunta Operativa?:", "o": ["El Área de control de Gastos.", "El GOE.", "La División de Operaciones y Transformación Digital."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q016", "src": "Básica P37 (MAD)", "n": 16, "e": "Los requisitos generales para la obtención de la habilitación profesional para el personal de seguridad privada, señale la respuesta correcta:", "o": ["No haber sido sancionado en los dos o cuatro años anteriores por infracción grave o muy grave, respectivamente, en materia de seguridad privada.", "No haber sido condenado por intromisión ilegítima en el ámbito de la protección del derecho al honor, a la intimidad personal y familiar o a la propia imagen, vulneración del secreto de las comunica- ciones o de otros derechos fundamentales en los dos años anteriores.", "Ninguna es correcta."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q017", "src": "Básica P37 (MAD)", "n": 17, "e": "En España, el desarrollo y mantenimiento de un sistema rápido para la detección, inter- cambio de información, evaluación y respuesta frente a la aparición de las nuevas sustancias psicoactivas corresponde a:", "o": ["Sistema Español de Alerta Temprana (SEAT).", "Observatorio Español de las Drogas y las Adicciones (DGPNSD).", "Delegación del Gobierno para el Plan Nacional sobre Drogas."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q018", "src": "Básica P37 (MAD)", "n": 18, "e": "En el Open Office, para generar desde simples diagramas hasta ilustraciones 3D dinámi- cas, es necesario utilizar:", "o": ["Calc.", "Writer.", "Draw."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q019", "src": "Básica P37 (MAD)", "n": 19, "e": "De acuerdo al Real Decreto 734/2020, de 4 de agosto, ¿Cuál no es una función de la Secre- taría de Estado de Seguridad?", "o": ["La dirección del sistema Nacional de Protección de Infraestructuras críticas.", "La coordinación del ejercicio de las competencias de las Delegaciones y Subdelegaciones del Gobierno en materia de seguridad ciudadana.", "La coordinación y supervisión de las Policías Autonómicas."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q020", "src": "Básica P37 (MAD)", "n": 20, "e": "No depende de la Unidad Central de Delincuencia Económica y Fiscal:", "o": ["El Servicio de Control de Juegos de Azar.", "La Unidad Adscrita a la Fiscalía especial contra la Corrupción y la Criminalidad Organizada.", "La Brigada de Investigación del Banco de España.  5  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q021", "src": "Básica P37 (MAD)", "n": 21, "e": "Si un hombre agrede a su ex novia causándole lesiones que necesitan intervención quirúr- gica, es autor de:", "o": ["Un delito especial de violencia doméstica tipificado en el artículo 153.2 del Código Penal.", "Un delito de lesiones agravado por violencia de género del artículo 148.4 del Código Penal.", "Un delito de violencia de género tipificado en el artículo 153.1 del Código Penal."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q022", "src": "Básica P37 (MAD)", "n": 22, "e": "El modelo de interacción cuya principal finalidad consiste en explicar el origen de la di- ferenciación intergrupal mediante la integración de dos perspectivas: la interdependencia y la identidad social, las cuales aparentemente tienden a estar en conflicto, pertenece a:", "o": ["De Rabbie.", "De Worchel.", "De Chinoy."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q023", "src": "Básica P37 (MAD)", "n": 23, "e": "¿Cómo se abre el Explorador de Archivos en Windows?", "o": ["[Ctrl] + [Bloq. Mayús].", "[Símbolo de Windows] + [e].", "[Ctrl] + [Símbolo de Windows]."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q024", "src": "Básica P37 (MAD)", "n": 24, "e": "El artículo 30 del Código Civil dice:", "o": ["El nacimiento determina la personalidad.", "La personalidad se adquiere en el momento del nacimiento con vida, una vez producido el entero desprendimiento del seno materno.", "La personalidad civil se extingue con la muerte de la personas."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q025", "src": "Básica P37 (MAD)", "n": 25, "e": "¿Cuál de los siguientes no es un pasivo financiero?", "o": ["Créditos por operaciones comerciales.", "Deudas con entidades de crédito.", "Obligaciones y otros valores negociables emitidos."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q026", "src": "Básica P37 (MAD)", "n": 26, "e": "¿Cuál de los siguientes documentos no integra las cuentas anuales?", "o": ["La cuenta de pérdidas y ganancias.", "El libro mayor.", "El balance de situación."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q027", "src": "Básica P37 (MAD)", "n": 27, "e": "¿Cuál no es una unidad de energía?", "o": ["El julio.", "El electronvoltio.", "El newton."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q028", "src": "Básica P37 (MAD)", "n": 28, "e": "El Tribunal de Justicia de la Unión Europea estará compuesto por:", "o": ["Al menos de un juez y asistido por abogados.", "Al menos de un juez de cada país miembro y asistido por abogados generales.", "Doce jueces, designados por la Comisión Europea y asistido por abogados.  6 PROMOCIÓN N.º 37 "], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q029", "src": "Básica P37 (MAD)", "n": 29, "e": "El Secretariado del Gobierno, como órgano de apoyo del Consejo de Ministros, de las Co- misiones delegadas del Gobierno y de las Comisión General de Secretarios de Estado y Subsecre- tarios, ejercerá una de las siguientes funciones:", "o": ["Estudiar aquellos asuntos que, afectando a varios Ministerios, requieran la elaboración de una propuesta conjunta previa a su resolución por el Consejo de Ministros.", "Velar por la correcta y fiel publicación de las disposiciones y normas emanadas del Gobierno que deban insertarse en el «Boletín Oficial del Estado».", "Examinar las cuestiones de carácter general que tengan relación con varios de los Departamentos Ministeriales."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q030", "src": "Básica P37 (MAD)", "n": 30, "e": "El satélite cuyo periodo orbital es similar a la velocidad de rotación de la tierra se denomina:", "o": ["Heliosíncrono.", "Geoestacionario.", "Ninguna de las anteriores es correcta."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q031", "src": "Básica P37 (MAD)", "n": 31, "e": "¿Cuántas personas forman parte de la Junta de Coordinación y Régimen Interior del De- fensor del Pueblo?", "o": ["Dos.", "Tres.", "Cuatro."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q032", "src": "Básica P37 (MAD)", "n": 32, "e": "¿Cuál de las siguientes respuestas relativa a la excedencia voluntaria por interés particu- lar de un funcionario público, es correcta?", "o": ["Podrá declararse cuando al funcionario se le instruya un expediente disciplinario.", "La concesión quedará subordinada a las necesidades del servicio, debidamente motivadas.", "El funcionario devengará retribuciones y será compatible el tiempo que permanezca en esta si- tuación a efectos de trienios y derechos en el régimen de Seguridad Social que les sea de aplicación."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q033", "src": "Básica P37 (MAD)", "n": 33, "e": "Cuando un extranjero sea expulsado y suponga una amenaza para el orden público, la seguridad pública, la seguridad nacional o para la salud pública, podrá imponerse excepcional- mente un periodo de prohibición de entrada no superior a:", "o": ["Cinco años.", "Siete años.", "Diez años."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q034", "src": "Básica P37 (MAD)", "n": 34, "e": "Según el Real Decreto 734/2020, de 4 de agosto por el que se desarrolla la estructura or- gánica básica del Ministerio del Interior, La División de Operaciones y Transformación Digital.", "o": ["Depende de la Dirección General de la Policía, con nivel orgánico que se determine en el catálogo de puestos de trabajo.", "Depende de la Dirección Adjunta Operativa con nivel orgánico de Subdirección General.", "Depende de la Dirección Adjunta Operativa con nivel orgánico que se determine en el catálogo de puestos de trabajo."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q035", "src": "Básica P37 (MAD)", "n": 35, "e": "El Visado de residencia y trabajo de temporada de un extranjero:", "o": ["Habilita para trabajar por cuenta ajena hasta nueve meses en un período de doce meses consecutivos.", "Habilita para trabajar por cuenta ajena hasta seis meses en un período de doce meses consecutivos.", "Habilita para trabajar por cuenta propia hasta seis meses en un período de doce meses consecutivos.  7  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q036", "src": "Básica P37 (MAD)", "n": 36, "e": "Según Boninger, Krosnick, & Berent, existen tres factores que pueden jugar un papel clave en la determinación de la importancia de la actitud:", "o": ["El interés propio, la identificación social y la conexión entre actitudes y los valores.", "El interés del grupo social, la identificación social y la conexión entre actitudes y los valores", "El interés propio, la identificación con los valores y la conexión entre actitudes y los estereotipos."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q037", "src": "Básica P37 (MAD)", "n": 37, "e": "Según el Texto refundido de la Ley del Estatuto Básico del Empleado Público, las dispo- siciones de dicho Estatuto sólo se aplicarán directamente cuando así lo disponga su legislación específica al siguiente personal:", "o": ["Personal del Centro Nacional de Inteligencia, Personal militar de las Fuerzas Armadas, Personal de las Fuerzas y Cuerpos de Seguridad y Personal no retribuido por arancel.", "Personal del Centro Nacional de Inteligencia, Personal militar de las Fuerzas Armadas y Personal de las Fuerzas y Cuerpos de Seguridad.", "Personal del Centro Nacional de Inteligencia, Personal militar de las Fuerzas Armadas, Personal de las Fuerzas y Cuerpos de Seguridad y Personal funcionario las Delegaciones y Subdelegaciones del Gobierno de las Comunidades Autónomas."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q038", "src": "Básica P37 (MAD)", "n": 38, "e": "Según el artículo 18 de la Ley 12/2009, de 30 de octubre, reguladora del derecho de asilo y de la protección subsidiaria, serán obligaciones de los solicitantes de protección internacional:", "o": ["Proporcionar sus impresiones dactilares, permitir ser fotografiados y, en su caso, consentir que sean grabadas sus declaraciones, siempre que hayan sido previamente informados sobre este último extremo.", "Proporcionar sus impresiones dactilares, permitir ser fotografiados y, en su caso, consentir que sean grabadas sus declaraciones, sin necesidad de haber sido previamente informados sobre este último extremo.", "Informar sobre sus datos de contacto, incluyendo teléfono y correo electrónico."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q039", "src": "Básica P37 (MAD)", "n": 39, "e": "Conforme al artículo 6 del Código Civil:", "o": ["La ignorancia de las leyes no excusa de su cumplimiento. El error de derecho producirá únicamen- te aquellos efectos que las leyes determinen.", "Las leyes penales, las de policía y las de seguridad pública obligan a todos los que se hallen en territorio español.", "La Ley no ampara el abuso del derecho o el ejercicio antisocial del mismo. Todo acto u omisión que por la intención de su autor, por su objeto o por las circunstancias en que se realice sobrepase manifiestamente los límites normales del ejercicio de un derecho, con daño para tercero, dará lugar a la correspondiente indemnización y a la adopción de las medidas judiciales o administrativas que impidan la persistencia en el abuso."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q040", "src": "Básica P37 (MAD)", "n": 40, "e": "Según la Teoría del Aprendizaje Social de Bandura, la exposición a un modelo puede pro- ducir uno de los siguientes efectos:", "o": ["Modelado, inhibición o desinhibición de respuestas aprendidas previamente y facilitación o pro- vocación de respuestas existentes en nuestro repertorio de conductas.", "Imitación, inhibición o desinhibición y evitación.", "Imitación, inhibición o desinhibición de respuestas aprendidas previamente, y evitación de res- puestas existentes en nuestro repertorio de conductas."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q041", "src": "Básica P37 (MAD)", "n": 41, "e": "A lo largo del texto de la Constitución Española se hace referencia al término seguridad con distintas acepciones en los siguientes artículos:", "o": ["Seguridad jurídica garantizada en el artículo 104.", "Seguridad ciudadana garantizada en el artículo 9.", "Seguridad pública como competencia exclusiva del Estado en el artículo 149.1.29.  8 PROMOCIÓN N.º 37 "], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q042", "src": "Básica P37 (MAD)", "n": 42, "e": "Los miembros del Comité Europeo para la prevención de la Tortura, son elegidos por:", "o": ["Parlamento Europeo.", "Comisión Europea.", "Comité de Ministros del Consejo de Europa."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q043", "src": "Básica P37 (MAD)", "n": 43, "e": "Entre todos los ataques posibles que puede sufrir un usuario a través del navegador web nos encontramos:", "o": ["Mediante un exploit, el atacante se aprovecha de determinada vulnerabilidad para inyectar códi- go dañino en el equipo.", "Malvertising: esta vía de infección consiste en ejecutar código dañino por medio de anuncios, aparentemente inofensivos, distribuidos en un gran número de páginas.", "Ambas son correctas."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q044", "src": "Básica P37 (MAD)", "n": 44, "e": "Según señala el Informe Brundtland de 1987, la satisfacción de las necesidades del pre- sente sin comprometer las necesidades de las futuras generaciones, es la definición de:", "o": ["El desarrollo de la economía internacional.", "El desarrollo sostenible.", "La lucha nacional por el medio ambiente."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q045", "src": "Básica P37 (MAD)", "n": 45, "e": "Con respecto a la vecindad civil señale la afirmación correcta:", "o": ["Se adquiere por residencia continuada durante tres años, siempre que el interesado manifieste ser esa su voluntad.", "Si al nacer el hijo, o al ser adoptado, los padres tuvieren distinta vecindad civil, el hijo tendrá la que corresponda a aquél de los dos respecto del cual la filiación haya sido determinada antes.", "En todo caso, el hijo desde que cumpla dieciséis años y hasta que transcurra un año después de su emancipación podrá optar bien por la vecindad civil del lugar de su nacimiento, bien por la última vecindad de cualquiera de sus padres."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q046", "src": "Básica P37 (MAD)", "n": 46, "e": "El abogado designado para asistir a un detenido acudirá al centro de detención con la máxima premura, siempre dentro del plazo máximo de:", "o": ["Cinco horas desde la recepción del encargo.", "Ocho horas desde que se efectúe la comunicación al Colegio de Abogados.", "Tres horas desde la recepción del encargo."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q047", "src": "Básica P37 (MAD)", "n": 47, "e": "El artículo 9 de la Ley 31/1995, de 8 de noviembre, de prevención de Riesgos Laborales determina que la función de la vigilancia y control de la normativa sobre prevención de riesgos laborales corresponde:", "o": ["Al Instituto Nacional de Seguridad e Higiene en el Trabajo.", "A la Inspección de Trabajo y Seguridad Social.", "A la Comisión Nacional de Seguridad y Salud en el Trabajo."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q048", "src": "Básica P37 (MAD)", "n": 48, "e": "La teoría social formulada por R.E.Park y E.Burgess en la denominada Escuela de Chicago, se incluye en:", "o": ["Las teorías subculturales.", "Las teorías del proceso social.", "Las teorías ecológicas.  9  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q049", "src": "Básica P37 (MAD)", "n": 49, "e": "Se denomina periféricos a los aparatos y/o dispositivos auxiliares e independientes co- nectados a la unidad central de procesamiento de un ordenador. Son periféricos de entrada:", "o": ["Impresora y el módem", "Escáner y lector de tarjetas", "Grabadora y lápiz óptico ¡Ojo! Esta pregunta fue impugnada."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q050", "src": "Básica P37 (MAD)", "n": 50, "e": "De acuerdo con lo contemplado en la Instrucción Operativa de Prevención de Riesgos La- borales 003 de la Dirección General de la Policía, ¿Cuál de los siguientes supondrá que el vehícu- lo en cuestión no es apto para el servicio en tanto no se solucionen los fallos?:", "o": ["Niveles del aceite del motor, líquido refrigerante, líquido de frenos y líquido de dirección, compro- bando que se encuentran dentro de los márgenes de mínimo y máximo.", "Higiene y desinfección de los vehículos policiales.", "Comprobación de la existencia, funcionamiento y buen estado general de los complementos y herramientas del vehículo de dotación policial."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q051", "src": "Básica P37 (MAD)", "n": 51, "e": "En relación a los sensores, según el principio de funcionamiento, se consideran captadores activos:", "o": ["El radar y el lidar.", "Los sistemas fotográficos.", "Los espectrómetros de imagen."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q052", "src": "Básica P37 (MAD)", "n": 52, "e": "Según el Real Decreto 726/2020 de 4 de agosto, por el que se modifica el Reglamento de Armas, se entiende por “Desmilitarización”?:", "o": ["La actividad fabril cuyo objetivo es transformar en civil o desbaratar un arma de guerra.", "La actividad cuyo objetivo principal es la regularización administrativa de un arma de guerra.", "La actividad ejercida por los armeros en la modificación y manipulación de armas de guerra históricas."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q053", "src": "Básica P37 (MAD)", "n": 53, "e": "Dentro de la Comisaría General de Seguridad Ciudadana se encuentra la Oficina Nacional del Deporte, ¿Dónde se encuentra adscrita?", "o": ["Jefatura de Unidades Especiales.", "Unidad Central de Participación Ciudadana.", "Secretaría General."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q054", "src": "Básica P37 (MAD)", "n": 54, "e": "El proceso de integración de un individuo o grupo en la cultura y en la sociedad con las que entra en contacto se denomina:", "o": ["Enculturación.", "Transculturación.", "Aculturación."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q055", "src": "Básica P37 (MAD)", "n": 55, "e": "En relación con las normas técnicas que deben reunir los vehículos celulares para el trans- porte de detenidos, presos y penados de más de nueve plazas, incluido el conductor y escolta, sabe que, en el compartimento central las celdas:", "o": ["Dispondrán de una ventana en sentido horizontal no practicable, protegida por rejilla metálica y sin visibilidad del exterior al interior.", "Dispondrán de una ventana, protegida por rejilla metálica y en cualquier caso sus dimensiones mínimas serán de 15 centímetros en altura y 40 centímetros en longitud.", "Dispondrán de una ventana en sentido vertical no practicable, protegida por rejilla metálica, sin visibilidad del exterior al interior, cuyas dimensiones no permitan el paso de una persona.  10 PROMOCIÓN N.º 37 "], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q056", "src": "Básica P37 (MAD)", "n": 56, "e": "La actitud definida como la tendencia o predisposición adquirida y relativamente durade- ra a evaluar de determinado modo a una persona, suceso o situación, y actuar en consonancia con dicha evaluación, fue dada por:", "o": ["Jiménez Burillo.", "Vander Zanden.", "Zanjonc."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q057", "src": "Básica P37 (MAD)", "n": 57, "e": "En concreto, los instrumentos topográficos se limitan a la medida de coordenadas pola- res, ángulos y distancias, por lo que:", "o": ["Las coordenadas polares deben deducirse por cálculo a partir de las absolutas. Con ayuda de es- tos instrumentos podemos determinar distancias reducidas y acimutes.", "Las coordenadas cartesianas deben deducirse por cálculo a partir de las polares.", "Las coordenadas relativas deben deducirse por cálculo a partir de las cartesianas."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q058", "src": "Básica P37 (MAD)", "n": 58, "e": "En planimetría forense, el plano que además de la planta o vista interior de una habita- ción, nos muestra el cielo raso y las paredes adyacentes, corresponde con el tipo de plano:", "o": ["Abatido.", "De detalle.", "De localización."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q059", "src": "Básica P37 (MAD)", "n": 59, "e": "Dar lugar al extravío, pérdida o sustracción por negligencia inexcusable de los distintivos de identificación o del arma reglamentaria, es constitutivo de una falta.", "o": ["Muy grave.", "Leve.", "Grave."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q060", "src": "Básica P37 (MAD)", "n": 60, "e": "Según el art. 17 de la Convención contra la Tortura ¿Cuál es la composición del Comité contra la Tortura?", "o": ["10 expertos independientes.", "8 expertos en derechos humanos.", "15 altos funcionarios de la ONU, expertos en temas de tortura."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q061", "src": "Básica P37 (MAD)", "n": 61, "e": "Dentro de la gestión ambiental ¿Qué es el EMAS?", "o": ["Convenio Europeo sobre el control de Masas.", "Directiva Comunitaria sobre Asuntos de Seguridad.", "Sistema comunitario de ecogestión y auditoría."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q062", "src": "Básica P37 (MAD)", "n": 62, "e": "El arma de fuego que se recarga después de cada disparo, mediante un mecanismo accio- nado por el tirador que introduce en el cañón un cartucho colocado previamente en el depósito de municiones se denomina:", "o": ["De repetición.", "Semiautomática.", "Automática."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q063", "src": "Básica P37 (MAD)", "n": 63, "e": "De conformidad con el art. 165 de la Constitución:", "o": ["Una Ley Orgánica regulará el funcionamiento del Tribunal Constitucional, el estatuto de sus miem- bros, el procedimiento ante el mismo y las condiciones para el ejercicio de las acciones.", "Una Ley Orgánica regulará el funcionamiento del Tribunal Constitucional, el estatuto de sus miembros, el procedimiento ante el mismo, el régimen de incompatibilidad de sus miembros y las condiciones para el ejercicio de las acciones.", "Una Ley Orgánica regulará las competencias y funcionamiento del Tribunal Constitucional, el estatuto y requisitos de sus miembros, el procedimiento ante el mismo y las condiciones para el ejercicio de las elecciones.  11  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q064", "src": "Básica P37 (MAD)", "n": 64, "e": "Los dispositivos que permiten un punto de conexión del cableado para intercomunicar físicamente los ordenadores entre sí, se denominan:", "o": ["Hubs o concentradores.", "Tarjetas de red o Nic´s.", "Bridges."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q065", "src": "Básica P37 (MAD)", "n": 65, "e": "De conformidad con la Ley 23/2014, de 20 de noviembre, de reconocimiento mutuo de resoluciones penales en el ámbito en la Unión Europea:", "o": ["La competencia para la ejecución de una orden europea de detención y entrega de una persona mayor de edad corresponde siempre a los Juzgados Centrales de Instrucción.", "La competencia para la ejecución de una orden europea de detención y entrega corresponde al Juez o Tribunal que conozca de la causa.", "La competencia para la ejecución de una orden europea de detención y entrega de una persona mayor de edad corresponde a la Sala de lo Penal de la Audiencia Nacional cuando dicha persona del detenido no consienta la entrega."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q066", "src": "Básica P37 (MAD)", "n": 66, "e": "Dentro de la estructura administrativa y de gestión de Europol, el consejo de administra- ción compuesto por un representante de cada Estado miembro de la U.E., tiene un mandato de:", "o": ["Dos años prorrogables.", "Cuatro años prorrogables.", "Cinco años prorrogables."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q067", "src": "Básica P37 (MAD)", "n": 67, "e": "La red urbana de un territorio está formada por el conjunto de ciudades que hay en él y los flujos y relaciones que hay en ella; según su distribución adoptan diferentes formas: cuando las ciudades se acumulan en las costas y el interior queda bastante vacío, hablamos de:", "o": ["Red concentrada.", "Red radiocéntrica.", "Red dendrítica."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q068", "src": "Básica P37 (MAD)", "n": 68, "e": "La suplencia del Director Adjunto Operativo de la Policía Nacional corresponde, en caso de ausencia, vacancia o enfermedad:", "o": ["Al Jefe de la División de Operaciones y Transformación Digital.", "A quien corresponda según los criterios del art. 13 de la Ley 40/2015 de Régimen Jurídico del Sector Público y, en defecto de designación expresa, a los subdirectores generales por el orden en que aparecen mencionados en el Real Decreto 734/2020 de estructura orgánica básica del Ministerio del Interior.", "A quien corresponda según los criterios del art. 13 de la Ley 40/2015 de Régimen Jurídico del Sec- tor Público y, en caso de designación expresa, a los subdirectores generales por el orden en que apare- cen mencionados en el Real Decreto 734/2020 de estructura orgánica básica del Ministerio del Interior."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q069", "src": "Básica P37 (MAD)", "n": 69, "e": "Acorde al art. 86, de la Constitución española, en caso de extraordinaria y urgente necesi- dad, el Gobierno podrá dictar:", "o": ["Disposiciones legislativas provisionales en forma de Decretos legislativos.", "Disposiciones legislativas provisionales que tomarán la forma de Decretos-leyes.", "Disposiciones legislativas provisionales en forma de Decretos legislativos que en 30 días serán sometidos a votación del Congreso de Diputados.  12 PROMOCIÓN N.º 37 "], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q070", "src": "Básica P37 (MAD)", "n": 70, "e": "Según el Real Decreto 2/2006, por el que se establecen normas sobre prevención de ries- gos laborales en la actividad de los funcionarios de Policía Nacional, el sistema de prevención de riesgos se someterá a control periódico, mediante auditorías y evaluaciones, que serán realiza- das por la Inspección de Personal y Servicios de Seguridad de la Secretaría de Estado de Seguri- dad, que a dichos efectos podrá requerir el asesoramiento y colaboración:", "o": ["De los Comités de seguridad y salud laboral.", "De la Comisión de seguridad y salud laboral policial.", "Del Instituto Nacional de Seguridad e Higiene en el Trabajo."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q071", "src": "Básica P37 (MAD)", "n": 71, "e": "Según refiere la Ley Orgánica 2/1986, de Fuerzas y Cuerpos de Seguridad del Estado, aprobar los planes de coordinación en materia de seguridad y de infraestructura policial, es competencia:", "o": ["Del Consejo de Política de Seguridad.", "De la Junta de Gobierno, previo informe del Consejo Asesor.", "De los Órganos Colegiados, previo informe del Consejo de la Policía."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q072", "src": "Básica P37 (MAD)", "n": 72, "e": "Según lo recogido en la Ley 5/2014, de Seguridad Privada, a tal efecto, se entiende por prestadores de servicios de seguridad privada:", "o": ["El personal habilitado para el ejercicio de funciones de seguridad privada.", "El personal acreditado que desarrollen las tareas que les asigna esta ley.", "Profesores acreditados de centros de formación, ingenieros y técnicos que desarrollen las tareas que les asigna esta ley."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q073", "src": "Básica P37 (MAD)", "n": 73, "e": "Según el Art 18 del R.D. Legislativo 5/2015, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, al respecto de la promoción interna de los funcio- narios de carrera, es correcto afirmar que:", "o": ["Los funcionarios deberán poseer los requisitos exigidos para el ingreso, tener una antigüedad de, al menos, dos años de servicio activo en el inferior Subgrupo, o Grupo de clasificación profesional, en el supuesto de que éste no tenga Subgrupo y superar las correspondientes pruebas selectivas.", "Se articulará un sistema de grados, categorías o escalones de ascenso fijándose la remuneración a cada uno de ellos. Los ascensos serán consecutivos con carácter general, salvo en aquellos supuestos excepcionales en los que se prevea otra posibilidad.", "Se deberá valorar la trayectoria y actuación profesional, la calidad de los trabajos realizados, los conocimientos adquiridos y el resultado de la evaluación del desempeño. Podrán incluirse asimismo otros méritos y aptitudes por razón de la especificidad de la función desarrollada y la experiencia ad- quirida."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q074", "src": "Básica P37 (MAD)", "n": 74, "e": "En el procesador de textos, Microsoft Word, la tecla de función F12, sirve para acceder de forma inmediata al cuadro de diálogo de:", "o": ["Hipervínculo.", "Guardar como.", "Elementos rápidos."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q075", "src": "Básica P37 (MAD)", "n": 75, "e": "La transposición de la Directiva comunitaria 2002/73/CE, de igualdad de trato entre muje- res y hombres, se materializa en el marco legislativo español en la Ley Orgánica:", "o": ["1/2004, de 28 de diciembre.", "3/2007, de 22 de marzo.", "2/2010, de 3 de marzo.  13  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q076", "src": "Básica P37 (MAD)", "n": 76, "e": "El Foro Social Mundial se compone de 3 pilares fundamentales; el Consejo Internacional, la Secretaría y además:", "o": ["La Comisión del FSM.", "El Comité de las Regiones.", "Los Comités organizadores de cada evento anual."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q077", "src": "Básica P37 (MAD)", "n": 77, "e": "En la biotipología criminal, destaca dentro de la escuela alemana Ernest Kretschmer. Se- ñale la afirmación correcta:", "o": ["El tipo leptosomático: cuerpo alargado y delgado, cabeza pequeña, nariz puntiaguda. Su repre- sentación gráfica es una línea horizontal.", "El tipo pícnico: gran desarrollo de las cavidades viscerales, abdomen prominente, cabeza redonda y ancha, extremidades cortas y tendencia a la obesidad Su representación gráfica es circular.", "Isotímicos: apariencia hercúlea, son musculados, de mentalidad tosca, viciosos, perseverantes, impulsivos y violentos. Su representación geométrica corresponde con un cuadrado."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q078", "src": "Básica P37 (MAD)", "n": 78, "e": "Conforme al art. 11 de la LO 10/1995, del Código Penal, a tal efecto se equiparará la omi- sión a la acción:", "o": ["Cuando en el omitente no exista una específica obligación legal o contractual de actuar.", "Cuando el omitente ha resuelto cometer un delito invita a otra u otras personas a participar en él.", "Cuando el omitente haya creado una ocasión de riesgo para el bien jurídicamente protegido me- diante una acción u omisión precedente."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q079", "src": "Básica P37 (MAD)", "n": 79, "e": "Los Policías Nacionales tendrán consideración de servicio activo cuando se encuentren:", "o": ["En excedencia por cuidado de familiares.", "En el plazo posesorio por cese en un puesto de trabajo al haber obtenido otro mediante el proce- dimiento de provisión correspondiente.", "Las dos son correctas, siempre que en el caso de cuidado de familiares, lo sea por hijo menor de 3 años."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q080", "src": "Básica P37 (MAD)", "n": 80, "e": "El Tribunal del Jurado tendrá competencia para el conocimiento y fallo de las causas por los delitos:", "o": ["Contra la Seguridad Vial.", "Trafico de drogas.", "Asesinato."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P37-Q081", "src": "Básica P
