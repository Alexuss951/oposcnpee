e establece en el art. 2 del Estatuto de víctima del Delito, se entiende por víctima:", "o": ["Al representante legal del fallecido como víctima directa del delito.", "Tanto a la víctima directa del delito como a la víctima indirecta.", "Toda persona física o jurídica que ha sufrido daños o perjuicios sobre su persona o patrimonio."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q048", "src": "Básica P39 (MAD)", "n": 48, "e": "¿Cuál de las siguientes penas podrá imponerse a un menor con arreglo a la Ley Orgánica de la Responsabilidad Penal del Menor?", "o": ["Internamiento terapéutico en régimen cerrado, semi-abierto o abierto.", "Libertad vigilada o asistencia en un centro de día.", "Ninguna de las penas que se proponen.  9  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q049", "src": "Básica P39 (MAD)", "n": 49, "e": "¿En qué acción de las descritas posteriormente estaríamos ante un delito de hurto consumado?", "o": ["A le ha alquilado un coche a B valorado en 2.000 euros, por un año. Pero después del primer mes A le quita el coche a B de la calle donde lo tenía aparcado sin decirle nada a B.", "María se dedica a la limpieza de la casa de Lola dos días a la semana, pero es despedida. María como consecuencia de este despido y en venganza por el mismo, utiliza su llave de la casa y una noche entra y se lleva el dinero que María guardaba en una cómoda por importe de 1.000 Euros.", "Pepe y José con la intención de sustraer unos pantalones, acuden a un centro comercial donde quitan las alarmas a diferentes prendas de vestir valoradas en 700 Euros. Cuando se disponen a salir el guardia de seguridad los detiene."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q050", "src": "Básica P39 (MAD)", "n": 50, "e": "Los daños no personales o materiales que sufre un Policía en el trayecto de su domicilio a su lugar de trabajo, tienen la consideración:", "o": ["Daños producidos en acto de servicio.", "Daños producidos in itinere.", "El accidente in itinere sólo contempla lesiones corporales."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q051", "src": "Básica P39 (MAD)", "n": 51, "e": "De acuerdo con el Estatuto de la víctima del delito, ¿qué plazo dispone la víctima para interponer recurso?", "o": ["Cinco días contados desde la notificación.", "Diez días contados desde la notificación.", "Quince días desde la notificación."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q052", "src": "Básica P39 (MAD)", "n": 52, "e": "Las situaciones de violencia de género que dan lugar al reconocimiento de los derechos regulados en el capítulo II de la L.O. de Medidas de Protección Integral contra la Violencia de Gé- nero, se acreditarán mediante, señale la INCORRECTA:", "o": ["Una sentencia condenatoria por un delito de violencia de género.", "Una orden de protección.", "Una resolución administrativa que acuerde una medida cautelar a favor de la víctima."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q053", "src": "Básica P39 (MAD)", "n": 53, "e": "¿Quién tendrá las misiones de impulsar y coordinar las actuaciones en el ámbito de la Po- licía Nacional y la Guardia Civil para la visibilización y promoción del compromiso de las Fuerzas y Cuerpos de Seguridad del Estado en el respeto a los Derechos Humanos?", "o": ["El Defensor del Pueblo como Mecanismo Nacional de Prevención.", "El Subcomité para la Prevención de la tortura u otros tratos o penas crueles, inhumanos o degradantes.", "La Oficina Nacional de Garantía de los Derechos Humanos."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q054", "src": "Básica P39 (MAD)", "n": 54, "e": "En el RD 2/2006, por el que se establecen normas de prevención de riesgos laborales en la actividad de los funcionarios del Cuerpo Nacional de Policía, se regula la figura de los Delegados de Prevención, los cuales serán designados:", "o": ["Por las organizaciones sindicales con representación en el Consejo de Policía.", "Por la Unidad de Prevención de Riesgos Laborales y Acción Social perteneciente a la Subdirección General de Recursos Humanos y Formación.", "Por la Comisión de Seguridad y Salud laboral policial."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q055", "src": "Básica P39 (MAD)", "n": 55, "e": "Entre la normativa que regula la adquisición de la nacionalidad española, se encuentra:", "o": ["Constitución española, Código Civil y Ley de Memoria Democrática.", "Constitución española, Código Penal y Ley de Extranjería.", "Constitución española, Código Civil y Ley Orgánica del Registro Civil.  10 PROMOCIÓN N.º 39 "], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q056", "src": "Básica P39 (MAD)", "n": 56, "e": "Los conductores de vehículos prioritarios cuando circulen por autopista o autovía en servi- cio urgente y no comprometan la seguridad de ningún usuario, podrán con carácter excepcional:", "o": ["Circular en sentido contrario al correspondiente a la calzada, siempre que lo hagan por el carril izquierdo.", "Circular en sentido contrario al correspondiente a la calzada, siempre que lo hagan por el carril derecho.", "Dar media vuelta o marcha atrás."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q057", "src": "Básica P39 (MAD)", "n": 57, "e": "Manolo haciéndose pasar por revisor del gas consigue entrar en el domicilio de Pedro, le golpea y lo ata en una silla. Una vez que encuentra el dinero y las joyas Manolo deja a Pedro atado a una silla dos días hasta que lo encuentra una de sus hijas. ¿Qué delito cometería Manolo?", "o": ["Robo con intimidación.", "Robo con intimidación y secuestro.", "Robo con intimidación, secuestro y allanamiento de morada."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q058", "src": "Básica P39 (MAD)", "n": 58, "e": "¿Cómo se denomina al ataque informático que consiste en la infiltración de código mali- cioso que aprovecha errores y vulnerabilidades en una página web?", "o": ["Inyección SQL.", "Ransomware.", "Spear Phishing."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q059", "src": "Básica P39 (MAD)", "n": 59, "e": "El ejercicio de la potestad sancionadora por la comisión de las infracciones administra- tivas previstas en la Ley Orgánica 4/2000, de 11 de enero, se tramitará por los procedimientos:", "o": ["Ordinario, preferente y simplificado.", "Preferente, excluyente y simplificado.", "Ninguna es correcta."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q060", "src": "Básica P39 (MAD)", "n": 60, "e": "Cuando una persona estrechamente vinculada a una organización y que goza de acceso autorizado abusa de sus privilegios de acceso para afectar negativamente a la información o sistemas claves de la empresa, es lo que se denomina:", "o": ["Hacktivistas.", "Bussines Compromise.", "Insider threat."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q061", "src": "Básica P39 (MAD)", "n": 61, "e": "¿Cuál es el plazo máximo establecido para presentar una queja ante el Defensor del Pueblo?", "o": ["Seis meses desde que se tuviera conocimiento.", "Un año desde que se tuviera conocimiento.", "Dos años desde que se tuviera conocimiento."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q062", "src": "Básica P39 (MAD)", "n": 62, "e": "Los despachos de detectives privados y sus sucursales deberán cumplir las siguientes obligaciones generales:", "o": ["Llevar un libro-registro, con formato propio, en el que se anotará cada servicio de investigación contratado o subcontratado.", "Facilitar de forma inmediata a la autoridad judicial o a las Fuerzas y Cuerpos de Seguridad com- petentes las informaciones sobre hechos delictivos de que tuvieren conocimiento en relación con su trabajo o con las investigaciones que éstos estén llevando a cabo.", "Comunicar a la Dirección General de la Policía o, en su caso, al órgano autonómico competente todo cambio que afecte a su forma jurídica, denominación, composición, domicilio y sucursales en la forma que reglamentariamente se determine.  11  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q063", "src": "Básica P39 (MAD)", "n": 63, "e": "El plazo para resolver una petición de rehabilitación de la condición de funcionario es:", "o": ["3 meses.", "4 meses.", "6 meses."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q064", "src": "Básica P39 (MAD)", "n": 64, "e": "Una de las siguientes afirmaciones está relacionada con el término DNS:", "o": ["Servicio o servidor que traduce nombres inteligibles en direcciones IP.", "Consiste en un ataque de denegación de servicio.", "Añade la capa de seguridad que evita ataques de denegación de servicio."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q065", "src": "Básica P39 (MAD)", "n": 65, "e": "¿Qué son los CETI?", "o": ["Son Centros de Estancia Temporal de Inmigrantes gestionados por el Ministerio del Interior.", "Son Centros de Estancia Temporal de Inmigrantes gestionados por el Ministerio de Derechos So- ciales y Agenda 2030.", "Son Centros de Estancia Temporal de Inmigrantes gestionados por el Ministerio de Inclusión, Se- guridad Social y Migraciones."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q066", "src": "Básica P39 (MAD)", "n": 66, "e": "“A” invita a “B” a dar una paliza a un funcionario de policía que lo detuvo días atrás, apro- vechando un momento que el agente estaba fuera de servicio. “A” responderá de:", "o": ["Proposición al delito de lesiones.", "Provocación a los delitos de atentado y lesiones.", "Inducción al delito de atentado y lesiones."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q067", "src": "Básica P39 (MAD)", "n": 67, "e": "El título VIII de la Constitución Española:", "o": ["Recoge los principios de autonomía, de solidaridad e igualdad referentes a la organización terri- torial del estado.", "Recoge los principios de autonomía, de solidaridad e igualdad referentes a la Economía y Hacien- da, así como la centralización efectiva en diferentes entes administrativos.", "Recoge los principios rectores relativos al Tribunal Constitucional, su composición, legitimación y competencias."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q068", "src": "Básica P39 (MAD)", "n": 68, "e": "¿Cuál de las siguientes obras puede considerarse como un símbolo de los movimientos antiglobalización?", "o": ["La tierra es plana, de Thomas Friedman.", "No logo: el poder de las marcas, de Naomi Klein.", "El proteccionismo, de Jagdish Bhagwati."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q069", "src": "Básica P39 (MAD)", "n": 69, "e": "NO es un fin propio de la LO 4/2015, de 30 de marzo, de protección de la seguridad ciudadana:", "o": ["Contribuir a garantizar la seguridad pública, a prevenir infracciones y a aportar información a los procedimientos relacionados con sus actuaciones e investigaciones.", "La protección de las personas y los bienes, con especial atención a los menores y a las personas con discapacidad necesitadas de especial protección.", "La prevención de la comisión de delitos e infracciones administrativas directamente relacionadas.  12 PROMOCIÓN N.º 39 "], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q070", "src": "Básica P39 (MAD)", "n": 70, "e": "¿Qué tipo de señal en los vehículos policiales, consiste en la rotulación de los costados de los vehículos y añade la denominación y la imagen corporativa del cuerpo al que pertenece?", "o": ["V-3.", "V-1.", "V-4."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q071", "src": "Básica P39 (MAD)", "n": 71, "e": "Antonio sustrae un vehículo, fracturando la cerradura, una vez transcurridas 74 horas de- vuelve el coche al lugar de donde se lo llevó. Según el Código Penal, ¿qué delito ha cometido Antonio?", "o": ["Robo con fuerza.", "Hurto.", "Robo y hurto uso de vehículo."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q072", "src": "Básica P39 (MAD)", "n": 72, "e": "¿Cuál es el bien jurídico protegido en el delito de detención ilegal, según la jurisprudencia del Tribunal Supremo?", "o": ["La libertad de deambulación.", "La intimidad personal.", "La integridad moral."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q073", "src": "Básica P39 (MAD)", "n": 73, "e": "La señal luminosa de vehículo prioritario V-1, en una motocicleta, ¿dónde irá situada?", "o": ["Incrustada en la parte delantera, pudiendo sobresalir del carenado un máximo de 2 centímetros.", "En la parte delantera del plano superior del vehículo, por encima de la luz más alta.", "En la parte trasera, sobre un cabezal telescópico que permita elevarlo por encima de la parte más alta de ésta."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q074", "src": "Básica P39 (MAD)", "n": 74, "e": "El artículo 197.2 de la Ley Orgánica 10/1995, de 23 de noviembre, del Código Penal, pe- naliza el apoderamiento, utilización o modificación, en perjuicio de tercero, de datos reservados de carácter personal o familiar que se hallen registrados en ficheros o soportes informáticos, si bien, ¿cuáles de los siguientes entrarían dentro de la categoría de datos de carácter personal?", "o": ["La numeración de la matrícula de un vehículo.", "El seudónimo de una persona por el que habitualmente sea conocido.", "Ambas son correctas."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q075", "src": "Básica P39 (MAD)", "n": 75, "e": "¿Qué se entiende por cartuchería?", "o": ["Todo tipo de cartuchos dotados de vaina con pistón, fuego anular y cargados de pólvora que llevan proyectiles incorporados.", "Todo tipo de cartuchos dotados de vaina con pistón, fuego anular y cargados de pólvora, lleven o no proyectiles incorporados.", "El tipo de cartuchos dotados de vaina con pistón de fuego anular, lleven o no proyectiles incor- porados."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q076", "src": "Básica P39 (MAD)", "n": 76, "e": "Según la LO 4/2010 de Régimen Disciplinario de la Policía Nacional, será competente para la incoación de un procedimiento por falta leve:", "o": ["El Comisario, Jefe de la Comisaría de Distrito de Fuencarral- El Pardo.", "El Jefe de la División de Formación y Perfeccionamiento.", "Ambos tienen capacidad para la incoación del procedimiento por falta leve.  13  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q077", "src": "Básica P39 (MAD)", "n": 77, "e": "¿En qué acción se puede determinar la existencia de un Homicidio del art 138 del código penal?", "o": ["Cuando A tortura a B para obtener información acerca de su número secreto de su tarjeta de cré- dito para robarle y a causa de la tortura A muere.", "A quiere robar a B, por lo que le propina varias patadas en la zona abdominal para robarle la car- tera, dado que B padecía problemas médicos graves estos se le complican y fallece a los dos meses de la agresión.", "Al salir de una discoteca A que se encuentra en importante estado de intoxicación aborda a B y la intenta besar a la fuerza, B consigue zafarse y cuando A se está yendo del lugar, B coge una piedra del suelo y golpea a A en la cabeza causándole la muerte."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q078", "src": "Básica P39 (MAD)", "n": 78, "e": "En el desarrollo de una entrada y registro en domicilio, autorizado por la Autoridad Judi- cial, a Enrique se le interviene una escopeta de caza, cuyos cañones estaban recortados. Enrique podría ser autor de:", "o": ["Un delito de tenencia de armas prohibidas del art. 563 del CP.", "Un delito de tenencia de armas de fuego reglamentadas, sin licencia o permiso, del art. 564 del CP", "Una infracción administrativa de la Ley Orgánica 4/2015."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q079", "src": "Básica P39 (MAD)", "n": 79, "e": "Es responsable de la dirección, impulso y coordinación de las funciones policiales opera- tivas, de acuerdo con las directrices emanadas de la persona titular de la Dirección General de la Policía:", "o": ["Subdirección General de Logística e Innovación.", "Dirección Adjunta Operativa.", "Subdirección General de Recursos Humanos y Formación."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q080", "src": "Básica P39 (MAD)", "n": 80, "e": "Uno de los factores humanos más relevantes en la siniestralidad vial es el consumo de alcohol. A partir de qué tasa de alcohol no podrán circular por las vías objeto de la legislación sobre tráfico, circulación de vehículos a motor y seguridad vial, los conductores de vehículos ni los conductores de bicicletas:", "o": ["No podrán hacerlo con tasa de alcohol en sangre superior a 1,2 gramos por litro, o de alcohol en aire espirado superior a 0,25 miligramos por litro, para todos los conductores.", "Cuando se trate de servicio de urgencia o transportes especiales, los conductores no podrán hacerlo con una tasa de alcohol en sangre superior a 0,3 gramos por litro, o de alcohol en aire espirado superior a 0,15 miligramos por litro.", "Ninguna de las anteriores."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q081", "src": "Básica P39 (MAD)", "n": 81, "e": "Noor, de nacionalidad pakistaní, es adoptada por una familia española de Cuenca a la edad de 19 años. ¿Desde qué momento adquiere o podrá optar por la nacionalidad española de origen?", "o": ["Deberá inscribir un título en el Registro Civil para poder consolidarla a los diez años.", "Podrá optar a ella en el plazo de dos años a partir de la constitución de la adopción.", "La adquiere desde la adopción."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q082", "src": "Básica P39 (MAD)", "n": 82, "e": "El tratamiento de los datos personales de un menor de edad, conforme al art. 7 de la Ley Orgánica 3/2018, de 5 de diciembre, únicamente podrá fundarse en su consentimiento:", "o": ["Cuando sea mayor de catorce años.", "Únicamente cuando sea mayor de dieciséis años.", "Un menor de edad no puede dar su consentimiento.  14 PROMOCIÓN N.º 39 "], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q083", "src": "Básica P39 (MAD)", "n": 83, "e": "La ley 31/1995, de prevención de Riesgos Laborales, define el concepto “riesgo laboral” como:", "o": ["Las enfermedades, patologías o lesiones sufridas con motivo u ocasión del trabajo.", "La posibilidad de que un trabajador sufra un determinado daño derivado del trabajo.", "Aquel que resulte probable racionalmente que se materialice en un futuro inmediato y pueda suponer un daño grave para la salud de los trabajadores."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q084", "src": "Básica P39 (MAD)", "n": 84, "e": "¿Cuál es el órgano jurisdiccional competente para el enjuiciamiento de los delitos cometi- dos fuera del territorio nacional cuando la competencia pertenece a Tribunales españoles?", "o": ["Audiencia Provincial del lugar de detención del responsable.", "Tribunal Supremo.", "Sala Penal de la Audiencia Nacional."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q085", "src": "Básica P39 (MAD)", "n": 85, "e": "Según la Ley Orgánica 9/2015, de 28 de julio, de Régimen de Personal de la Policía Nacional ¿Cuántos funcionarios son necesarios para que las organizaciones sindicales repre- sentativas tengan derecho a que se les facilite un local adecuado para el ejercicio de sus actividades?:", "o": ["Más de 150 funcionarios.", "Más de 250 funcionarios.", "Más de 350 funcionarios."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q086", "src": "Básica P39 (MAD)", "n": 86, "e": "¿Cuál de las siguientes herramientas o servicios son utilizados para la implementación de un sistema OSINT?.", "o": ["Google, Bing, Yahoo, Ask", "Maltego.", "a y b son correctas."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P39-Q087", "src": "Básica P39 (MAD)", "n": 87, "e": "Indique la opción INCORRECTA en relación con la PCP:", "o": ["Se as Cámaras se reunirán en sesión conjunta para ejercer las competencias legislativas que el Título III atribuye expresamente a las Cortes Generales."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q021", "src": "Básica P40 (MAD)", "n": 21, "e": "En la organización territorial de la Administración General del Estado ¿Qué nivel tendrán los Subdelegados del Gobierno en las provincias?", "o": ["De Subdirectores generales.", "De Subsecretarios.", "De Directores generales."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q022", "src": "Básica P40 (MAD)", "n": 22, "e": "«Impedir, en el ejercicio de su actuación profesional, cualquier práctica abusiva, arbitraria o discriminatoria que entrañe violencia física o moral», se encuentra recogido en uno de los si- guientes principios básico de actuación:", "o": ["Adecuación al ordenamiento jurídico.", "Relaciones con la comunidad.", "Dedicación profesional."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q023", "src": "Básica P40 (MAD)", "n": 23, "e": "La Real Academia de la Lengua define como verbo incoativo al verbo que:", "o": ["Indica el comienzo de una acción.", "Se construye sin complemento directo.", "Expresa una acción que se compone de acciones repetidas."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q024", "src": "Básica P40 (MAD)", "n": 24, "e": "Si se causa a una persona una lesión que solo necesita una primera asistencia facultativa para su curación:", "o": ["Es un delito de lesiones.", "Es un delito leve de lesiones.", "No daría lugar a acción penal alguna."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q025", "src": "Básica P40 (MAD)", "n": 25, "e": "Dentro de los autores más importantes de la globalización, que autor introduce el término «ciudad global»:", "o": ["Theodore Levitt.", "Marshall Mcluhan.", "Saskia Sassen.  6 PROMOCIÓN N.º 40 "], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q026", "src": "Básica P40 (MAD)", "n": 26, "e": "¿ ncompletas o dependientes."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q032", "src": "Básica P40 (MAD)", "n": 32, "e": "En relación a la Ley Orgánica 9/2015, ¿en cuál de las siguientes situaciones administrativas tiene derecho un Policía Nacional a la reserva de su puesto de trabajo durante al menos dos años?", "o": ["Excedencia por cuidado de familiares.", "Excedencia por agrupación familiar.", "Excedencia por prestación de servicio en el sector público."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q033", "src": "Básica P40 (MAD)", "n": 33, "e": "Atendiendo al artículo 3 de la Ley 4/2023, de 28 de febrero, para la igualdad real y efectiva de las personas trans y para la garantía de los derechos de las personas LGTBI, la vivencia interna e individual del sexo tal y como cada persona la siente y autodefine pudiendo no corresponder con el sexo asignado al nacer, es la definición de:", "o": ["Expresión de género.", "Identidad sexual.", "Orientación sexual.  7  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q034", "src": "Básica P40 (MAD)", "n": 34, "e": "La Organización Internacional para las Migraciones (OIM) es creada en:", "o": ["1950.", "1951.", "1952."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q035", "src": "Básica P40 (MAD)", "n": 35, "e": "Un extranjero que entre en España con la finalidad de cursar o ampliar estudios en nues- tro país estará sometido al régimen de:", "o": ["Residencia temporal si el curso para el que estén matriculados dura más de 90 días.", "Residencia de larga duración cuando se trate de estudios universitarios que se desarrollan en varios cursos", "Régimen de estancia con una duración inicial igual a la del curso para el que está matriculado."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q036", "src": "Básica P40 (MAD)", "n": 36, "e": "Si nos referimos en un vehículo al «EDR» hacemos mención a:", "o": ["Los elementos obligatorios en el vehículo en el transporte de mercancías peligrosas.", "Una especie de «caja negra» encargada de recabar información para esclarecer las posibles cau- sas de un siniestro.", "Una solución de seguridad diseñada para detectar y bloquear amenazas, actuando como si fuera el antivirus para evitar intrusiones informáticas en el vehículo."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q037", "src": "Básica P40 (MAD)", "n": 37, "e": "El procedimiento mediante el cual se mide y valora la conducta profesional y el rendimien- to o el logro de resultados de los funcionarios públicos es:", "o": ["La evaluación del desempeño.", "La estadística laboral.", "La carrera profesional"], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q038", "src": "Básica P40 (MAD)", "n": 38, "e": "Señale la opción correcta sobre la vecindad civil:", "o": ["Se adquiere por residencia continuada durante un año, siempre que el interesado manifieste esa voluntad.", "El matrimonio no altera la vecindad civil.", "En caso de duda, prevalecerá la vecindad civil que corresponda al lugar de residencia."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q039", "src": "Básica P40 (MAD)", "n": 39, "e": "La L.O. 7/2021 de protección de datos personales tratados para fines de prevención, de- tección, investigación y enjuiciamiento de infracciones penales y de ejecución de sanciones pe- nales, en su artículo tercero hace alusión a los datos de personas fallecidas. En caso de falle- cimiento de menores, cuando sea el Ministerio Fiscal el que ejerza las facultades establecidas, podrá actuar.", "o": ["De oficio o a instancia de cualquier persona interesada.", "De oficio o a instancia de parte, cuando se trate de familiares de segundo grado.", "De oficio o a instancia de parte, cuando se trate del representante legal del menor."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q040", "src": "Básica P40 (MAD)", "n": 40, "e": "¿Cuál de las siguientes NO es un Área Especializada del Ministerio Fiscal?", "o": ["Medio Ambiente.", "Trata de Personas y Extranjería.", "Siniestralidad Laboral.  8 PROMOCIÓN N.º 40 "], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q041", "src": "Básica P40 (MAD)", "n": 41, "e": "Según se establece en el Reglamento de Armas, cuál de las siguientes afirmaciones es co- rrecta con respecto al arma de repetición:", "o": ["Arma de fuego que se recarga antes de cada disparo.", "Arma de fuego sin depósito de municiones.", "Arma de fuego que se recarga después de cada disparo, mediante un mecanismo accionado por el tirador que introduce en el cañón un cartucho colocado previamente en el depósito de municiones."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q042", "src": "Básica P40 (MAD)", "n": 42, "e": "Las quejas ante el Defensor del Pueblo, ¿Cuándo pueden ser presentadas?", "o": ["En el plazo máximo de dos años, contados a partir del momento en que tuviera conocimiento de los hechos objeto de la misma", "En el plazo máximo de un año, contado a partir del momento en que tuviera conocimiento de los hechos objeto de la misma.", "En el plazo máximo de tres años, contados a partir del momento en que se hubieran producido los hechos objeto de la misma."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q043", "src": "Básica P40 (MAD)", "n": 43, "e": "¿Cuál de los siguientes delitos NO está incardinado en el código penal como delito contra el orden público?", "o": ["Delito de rebelión.", "Delito de desórdenes públicos.", "Delito de atentado contra la autoridad, sus agentes y los funcionarios públicos."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q044", "src": "Básica P40 (MAD)", "n": 44, "e": "La suspensión de los derechos de reunión y manifestación podrá acordase:", "o": ["En el supuesto de declaración de los estados de alarma, excepción o sitio.", "Solo en los supuestos de declaración del estado de alarma o excepción.", "Solo en el supuesto de declaración del estado de excepción o de sitio."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q045", "src": "Básica P40 (MAD)", "n": 45, "e": "Dentro de una empresa de seguridad, en cuya plantilla están integrados ¿Quién realiza las funciones de organización, dirección e inspección del personal y servicios de seguridad privada?", "o": ["Directores de seguridad.", "Jefes de seguridad.", "Vigilantes de seguridad."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q046", "src": "Básica P40 (MAD)", "n": 46, "e": "¿Cuál de estas frases está escrita correctamente?", "o": ["No sabemos los porqués de su expulsión del equipo.", "Tras el desafortunado accidente, falleció debido a la inhalación de gases tóxicos.", "La gravedad del delito determinó que el juez le infringiera una dura pena de prisión."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q047", "src": "Básica P40 (MAD)", "n": 47, "e": "En aplicación de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Per- sonales y garantía de los derechos digitales. Los titulares de la patria potestad podrán ejercitar los derechos de acceso, rectificación, cancelación, oposición o cualesquiera otros que pudieran corresponderles.", "o": ["En nombre y representación de los menores de catorce años.", "En nombre y representación de los menores de dieciséis años.", "En nombre y representación de los menores de dieciocho años.  9  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q048", "src": "Básica P40 (MAD)", "n": 48, "e": "El que ocupare una vivienda, sin la debida autorización o se mantuviere en ella en contra la voluntad de su titular, cometera un delito de usurpación:", "o": ["Cuando la vivienda constituya morada.", "Cuando la vivienda no constituva morada.", "Al tratarse de una vivienda cometerá en todo caso, un delito de allanamiento de morada."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q049", "src": "Básica P40 (MAD)", "n": 49, "e": "«A» mediante un Killer USB inutiliza el ordenador de «» al obieto de dejar sus programas informáticos inoperativos, provocando que se suspendiese el servicio de metro en la hora punta. «A» responderá de:", "o": ["Delito de daños informático.", "Delito básico de daños.", "Delito de daños informático agravado"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q050", "src": "Básica P40 (MAD)", "n": 50, "e": "En las Comunidades Autónomas que dispongan de Cuerpos de Policía propios, la misión de coordinar la actuación de las Fuerzas y Cuerpos de Seguridad del Estado y de los Cuerpos de Policía de la Comunidad Autónoma corresponde a:", "o": ["La Junta de Seguridad.", "El Consejo de Política de Seguridad.", "La Junta autonómica de Seguridad."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q051", "src": "Básica P40 (MAD)", "n": 51, "e": "Conforme a la Orden INT/839/2023 de 21 de julio, por la que se desarrolla la estructura orgánica y funciones de los servicios centrales y territoriales de la Dirección General de la Policía, la Banda de Música de la Policía Nacional dependerá:", "o": ["Servicio de Protocolo de la Dirección General de la Policía incardinado en el área de Coordinación Institucional e Identidad Corporativa.", "Oficina de Marca de incardinado en el área de Coordinación Institucional e Identidad Corporativa.", "Unidad de Planificación Estratégica y Coordinación."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q052", "src": "Básica P40 (MAD)", "n": 52, "e": "En el actual Código Penal, el hurto será castigado con la pena de prisión de uno a tres años, conteste a la respuesta correcta:", "o": ["Cuando se trate de cosas de necesidad, pero no cause una situación de desabastecimiento.", "Cuando se sustraigan cosas de valor artístico, histórico, cultural o científico.", "Cuando se utilice a menores de dieciocho años para la comisión del delito."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q053", "src": "Básica P40 (MAD)", "n": 53, "e": "¿Quién declara la vacante en el cargo del Defensor del Pueblo por muerte, renuncia o ex- piración del plazo del mandato?", "o": ["El presidente del Congreso de los Diputados.", "Las tres quintas partes de los componentes de cada cámara.", "El presidente del Senado."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q054", "src": "Básica P40 (MAD)", "n": 54, "e": "La carencia de la autorización de residencia y trabajo, sin perjuicio de las responsabilida- des del empresario a que de lugar, incluidas las de Seguridad Social:", "o": ["Invalidará el contrato de trabajo con respecto a los derechos del trabajador extranjero.", "No invalidará el contrato de trabajo con respecto a los derechos del trabajador extranjero.", "Será obstáculo para la obtención de las prestaciones derivadas de supuestos contemplados por los convenios internacionales de protección de los trabajadores u otras que pudieran corresponderle, siempre que sean compatibles con su situación.  10 PROMOCIÓN N.º 40 "], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q055", "src": "Básica P40 (MAD)", "n": 55, "e": "En el artículo 16 de la Ley Orgánica 4/2015, de 30 de marzo, de protección de la seguri- dad ciudadana se establece, en cuanto a la identificación de personas, que se llevará un libro- registro en el que sólo se practicarán asientos relacionados con la seguridad ciudadana, ¿a qué autoridad y con qué periodicidad deberá remitir el órgano competente de la Administración extracto de las diligencias de identificación con expresión del tiempo utilizado en cada una de ellas?:", "o": ["Al Ministerio Fiscal trimestralmente.", "A la Autoridad Judicial mensualmente.", "Al Ministerio Fiscal mensualmente."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q056", "src": "Básica P40 (MAD)", "n": 56, "e": "El sistema de nombres de dominio, o DNS (Domain Name System) es un conjunto de pro- tocolos y servicios que nació con la finalidad de evitar a las personas usuarias el esfuerzo de tener que recordar una dirección IP. Atendiendo a sus funciones, ¿Qué tipos hay de servidores DNS?", "o": ["Maestros, esclavos y locales.", "Directos e indirectos.", "Prioritarios, anterior y posterior."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q057", "src": "Básica P40 (MAD)", "n": 57, "e": "Cuando hablamos del derecho a la intimidad, su vulneración mediante la intercepción de las comunicaciones o utilizando artificios técnicos de escucha, transmisión, grabación o repro- ducción del sonido o de la imagen, o de cualquier otra señal de comunicación, requerirá:", "o": ["Denuncia de la persona agraviada o de su representante legal", "Querella de la persona agraviada o de su representante legal", "Se podrá proceder de oficio en todos los casos"], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q058", "src": "Básica P40 (MAD)", "n": 58, "e": "Los informes de investigación elaborados por un detective privado deberá conservarse:", "o": ["Por un periodo máximo de cinco años", "Durante al menos tres años", "Hasta su entrega al cliente que los hubiera solicitado"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q059", "src": "Básica P40 (MAD)", "n": 59, "e": "El Tribunal de Justicia de la Unión Europea está compuesto por:", "o": ["Un Juez por Estado Miembro y está asimismo asistido por 27 abogados generales", "Dos Jueces por Estado miembro y están asimismo asistidos por 27 abogados generales", "Un Juez por Estado Miembro y está asimismo asistido por 11 abogados generales"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q060", "src": "Básica P40 (MAD)", "n": 60, "e": "Al valor de densidad de población, que se obtiene de dividir el número de habitantes en- tre la superficie en km2 de territorio, se le denomina también:", "o": ["Saldo vegetativo.", "Población relativa.", "Población absoluta."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q061", "src": "Básica P40 (MAD)", "n": 61, "e": "La coordinación de los Centros de Cooperación Policial y Aduanera le corresponde a:", "o": ["La Dirección General de Relaciones Internacionales y Extranjería.", "La Dirección General de Coordinación y Estadios.", "La Subdirección General de Cooperación Internacional.  11  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q062", "src": "Básica P40 (MAD)", "n": 62, "e": "Se está efectuando un registro domiciliario, con mandamiento de entrada y registro, por un presunto delito de explotación sexual. En el transcurso del registro y sin que hubiera previ- sión de ello, aparece un dispositivo de almacenamiento masivo de información digital que pu- dieran contener pruebas relevantes para los investigadores. ¿Cómo procederán los policías?:", "o": ["Consignarán en el acta la recogida del dispositivo para su posterior análisis, pues ya cuentan con el correspondiente mandamiento de entrada y registro.", "Necesitarán solicitar otra autorización al Juez competente para poder acceder al contenido de los datos del dispositivo, dado que en el mandamiento inicial no solicitaron este extremo.", "Como quiera que el mandamiento no contemplaba esta posibilidad, el ordenador no se podrá recoger."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q063", "src": "Básica P40 (MAD)", "n": 63, "e": "Cuando una persona o grupo en que se integra, debido a su relación con otra sobre la que concurra alguna de las causas de discriminación por razón de orientación e identidad sexual, expresión de género o características sexuales, es objeto de un trato discriminatorio, conforme a la Ley 4/2023, para la igualdad real y efectiva de las personas trans y para la garantía de los derechos de las personas LGTBI ¿de qué tipo de discriminación se trata?", "o": ["Discriminación indirecta.", "Discriminación por asociación.", "Discriminación por error."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q064", "src": "Básica P40 (MAD)", "n": 64, "e": "Las Comunidades Autónomas podrán solicitar del Gobierno de la Nación, a través del Mi- nisterio del Interior, la adscripción de Unidades del Cuerpo Nacional de Policía. Dicha adscrip- ción deberá respetar, entre otros, el siguiente principio:", "o": ["En cualquier momento podrán ser reemplazadas por otras, por decisión de las Autoridades estatales.", "Dichas Unidades actuarán siempre bajo el mando de sus Jefes naturales.", "Las Unidades adscritas dependerán, orgánicamente, de las Autoridades de la Comunidad Autó- noma, y funcionalmente del Ministerio del Interior."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q065", "src": "Básica P40 (MAD)", "n": 65, "e": "A finales de los años 70, Lawrence E. Cohen y Marcus Felson, establecieron que el delito se produce cuando coinciden tres elementos: el delincuente tiene una motivación para realizarlo, la víctima es algo alcanzable y el control social que protegería a la víctima falla. Esta teoría se llama:", "o": ["Teoría de las ventanas rotas.", "Teoría de las actividades cotidianas o rutinarias.", "Teoría de la elección racional."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q066", "src": "Básica P40 (MAD)", "n": 66, "e": "La provocación, la conspiración y la proposición para cometer delitos NO está penada ex- presamente en:", "o": ["Los delitos de lesiones.", "Los delitos de detención ilegal y secuestro.", "Los delitos de agresiones sexuales."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q067", "src": "Básica P40 (MAD)", "n": 67, "e": "Las medidas de vigilancia, prevención, protección o reacción a restar, de forma comple- mentaria a quellas previstas por los operadores críticos en cada una de las infraestructuras críti- cas, se contemplan en:", "o": ["Los Planes de Apoyo Operativo.", "Los Planes de Seguridad del Operador.", "Los Planes de Protección Específicos.  12 PROMOCIÓN N.º 40 "], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q068", "src": "Básica P40 (MAD)", "n": 68, "e": "El Presidente del Gobierno en funciones NO tiene la siguiente facultad:", "o": ["Aprobar el Proyecto de la Ley de Presupuestos Generales del Estado.", "Presentar proyectos de la ley al Senado.", "Proponer al Rey la disolución del Senado."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q069", "src": "Básica P40 (MAD)", "n": 69, "e": "De las siguientes afirmaciones respecto a la Unidad adscrita a la Policía Nacional de Gali- cia. ¿Cuál es la correcta?", "o": ["Depende orgánicamente de las autoridades de la Xunta de Galicia", "Depende orgánicamente del Ministerio del Interior", "Depende funcionalmente de la Jefatura Superior de Policía de Galicia"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q070", "src": "Básica P40 (MAD)", "n": 70, "e": "Si alguien quiere participar en una media maratón de su ciudad teniendo una marca den- tro de la mínima aceptada, pero dado su aspecto enfermizo le es negada la posibilidad de inscri- birse en dicha prueba, esto sería considerado:", "o": ["Discriminación por error.", "Discriminación por asociación.", "Discriminación interseccional."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q071", "src": "Básica P40 (MAD)", "n": 71, "e": "La dirección y coordinación de las actuaciones relacionadas con los precursores de dro- gas, los precursores de explosivos y el tratamiento de los datos del Sistema de Registro de Pasa- jeros (PNR) le corresponde a:", "o": ["Dirección General de la Policía.", "Inspección de Personal y Servicios de Seguridad.", "Secretaría de Estado de Seguridad"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q072", "src": "Básica P40 (MAD)", "n": 72, "e": "¿Según el RD 67/2010 sobre adaptación de la Prevención de Riesgos Laborales en la Admi- nistración General del Estado, el órgano específico de participación y negociación de las organi- zaciones sindicales en materia de prevención de riesgos laborales será:", "o": ["El Comité de Seguridad y Salud en el Trabajo.", "La Inspección de Personal y Servicios de Seguridad.", "La Comisión Técnica de Prevención de Riesgos Laborales."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q073", "src": "Básica P40 (MAD)", "n": 73, "e": "“El proceso a través del cual una determinada dosis de droga va produciendo un efec- to progresivamente menor a medida que se va repitiendo su administración o, lo que es lo mismo, un proceso que obliga a ir aumentando progresivamente la dosis según se repiten las administraciones para producir el efecto original” define, según Bandres, Compas y Valencoso (1986):", "o": ["La tolerancia.", "La dependencia.", "La adicción."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q074", "src": "Básica P40 (MAD)", "n": 74, "e": "¿Quién de las siguientes personas está obligado a denunciar?:", "o": ["El cónyuge del delincuente no separado legalmente o de hecho o la persona que conviva con él en análoga relación de afectividad, cuando se trate de un delito de robo con fuerza.", "El descendiente cuando se trate de un delito contra la hacienda pública.", "El ascendiente cuando se trate de un delito contra la trata de seres humanos.  13  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q075", "src": "Básica P40 (MAD)", "n": 75, "e": "¿Qué tipo de denuncia NO está regulada por la Ley de Enjuiciamiento Criminal?", "o": ["Denuncia verbal.", "Denuncia anónima o delación.", "Denuncia por mandato o representante."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q076", "src": "Básica P40 (MAD)", "n": 76, "e": "¿Cómo se denomina al empleado público que solo realiza funciones expresamente cali- ficadas como de confianza y asesoramiento especial, siendo retribuido con cargo a los créditos presupuestarios consignados para este fin?", "o": ["Funcionario interino.", "Personal laboral.", "Personal eventual."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q077", "src": "Básica P40 (MAD)", "n": 77, "e": "Para la concesión de la nacionalidad española por residencia, se requiere para las perso- nas que hayan obtenido la condición de refugiado una permanencia en España de:", "o": ["Diez años", "Cinco años", "Tres años"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q078", "src": "Básica P40 (MAD)", "n": 78, "e": "¿Cuál es la edad máxima de permanencia en el servicio activo de un funcionario público?:", "o": ["La correspondiente a la jubilación forzosa, sesenta y cinco años.", "Se podrá permanecer en servicio activo como máximo hasta los a setenta y dos años edad en los términos que se establezcan en las leyes de la función pública.", "Según la legislación vigente, un funcionario público podrá jubilarse máximo a los setenta años siempre que lo solicite y le sea concedido."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q079", "src": "Básica P40 (MAD)", "n": 79, "e": "Los funcionarios sancionados con traslado forzoso no podrán obtener un destino por nin- gún procedimiento en el centro, unidad o plantilla de la que fueron trasladados, en el período de:", "o": ["Tres años", "Uno a tres años", "Un año"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q080", "src": "Básica P40 (MAD)", "n": 80, "e": "Con relación a la Ley Orgánica 7/2021 y con carácter general, ¿Cuál es el plazo máximo para la supresión de los datos de carácter personal por parte de las autoridades competentes?:", "o": ["Tres años", "Dos años", "Veinte años"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q081", "src": "Básica P40 (MAD)", "n": 81, "e": "Indique, según la LO 4/2015 de protección de la seguridad ciudadana, qué tipo de infracción es la celebración de espectáculos públicos o actividades recreativas quebrantando la prohibición o suspensión ordenada por la autoridad correspondiente por razones de seguridad pública:", "o": ["Leve", "Grave", "Muy grave"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q082", "src": "Básica P40 (MAD)", "n": 82, "e": "El Consejo Asesor del Mecanismo Nacional de Prevención de la Tortura se reunirá:", "o": ["Al menos una vez al año", "Al menos dos veces al año", "Al menos una vez al trimestre  14 PROMOCIÓN N.º 40 "], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q083", "src": "Básica P40 (MAD)", "n": 83, "e": "Entre los principios generales de la acción preventiva de riesgos laborales está:", "o": ["Adoptar medidas que antepongan la protección individual a la colectiva", "Evaluar los riesgos que no se puedan evitar", "Combatir los riesgos cuando se originan, adaptando la persona al puesto de trabajo"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q084", "src": "Básica P40 (MAD)", "n": 84, "e": "La presidencia del Consejo Superior de Tráfico, Seguridad Vial y Movilidad Sostenible co- rresponde al:", "o": ["Secretario de Estado de Seguridad", "Subsecretario del Interior", "Ministro del Interior"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q085", "src": "Básica P40 (MAD)", "n": 85, "e": "En relación a las armas y armas de fuego reglamentadas, cuya adquisición, tenencia y uso pueden ser autorizados o permitidos con arreglo a lo dispuesto en la normativa vigente dentro de la categoría 7a encontramos:", "o": ["Armas acústicas y de salvas", "Las armas de sistema «Flobert»", "Las armas blancas y en general las de hoja cortante o punzante no prohibidas"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q086", "src": "Básica P40 (MAD)", "n": 86, "e": "¿Cuál de las siguientes aseveraciones es cierta a las disposiciones de la Ley 4/2015, de 27 abril, del Estatuto de la víctima del delito?:", "o": ["Serán aplicables a las víctimas de delitos cometidos en España o que puedan ser perseguidos en España, con independencia de su nacionalidad, de si son mayores o menores de edad o de si disfrutan o no de residencia legal.", "Las víctimas residentes en España no podrán presentar ante las autoridades españolas denuncias correspondientes a hechos delictivos que hubieran sido cometidos en el territorio de otros países de la Unión Europea.", "Para que sus disposiciones puedan ser aplicables a las víctimas de delitos cometidos en España o que puedan ser perseguidos en España se exige que las mismas tengan residencia legal en la"], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q087", "src": "Básica P40 (MAD)", "n": 87, "e": "Como miembro de la Policía Nacional es citado por el Servicio de Prevención de Riesgos Laborales de la Dirección General de la Policía para realizarle un reconocimiento médico. A este respecto ¿cuál de las afirmaciones siguientes es correcta?", "o": ["Los reconocimientos médicos requeridos por el Servicio de Prevención de Riesgos Laborales son de obligada asistencia.", "Las conclusiones de los reconocimientos médicos serán comunicadas a los responsables de la Dirección General de la Policía.", "Los resultados de las pruebas realizadas en el reconocimiento médico serán comunicados al fun- cionario a través de su responsable inmediato."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q088", "src": "Básica P40 (MAD)", "n": 88, "e": "Jennifer es colombiana y se encuentra trabajando en España sin haber solicitado autori- zación administrativa para trabajar por cuenta propia, pero cuenta con permiso de residencia temporal. En aplicación de la Ley Orgánica 4/2000, de 11 de enero, sobre derechos y libertades de los extranjeros en España y su integración social. ¿Qué tipo de infracción administrativa co- mete Jennifer?", "o": ["Infracción leve", "Infracción grave", "Infracción muy grave  15  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q089", "src": "Básica P40 (MAD)", "n": 89, "e": "En relación a la nacionalidad española, en el articulo 20 del Código Civil se establece que tienen derecho a optar a la misma:", "o": ["Aquellas cuyos parientes cercanos hubieren sido originariamente españoles.", "Las personas que estén o hayan estado sujetas a la patria potestad de un español.", "Aquellas cuyo padre o madre hubiere sido originariamente español y nacido en el extranjero."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q090", "src": "Básica P40 (MAD)", "n": 90, "e": "A Miguel, funcionario de policía, se le está instruyendo un expediente disciplinario por falta grave ¿Cuál será el plazo máximo para que el instructor del expediente ordene la práctica de cuantas diligencias considere oportunas para su resolución?", "o": ["20 días", "15 días", "10 días"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q091", "src": "Básica P40 (MAD)", "n": 91, "e": "Según la Ley 4/2015, los Abogados NO podrán dirigirse a las víctimas de catástro- fes, calamidades públicas u otros sucesos que hubieran producido un número elevado de víctimas y que puedan constituir delito para ofrecerles sus servicios profesionales, hasta transcurridos:", "o": ["25 días desde el hecho", "25 días desde que los servicios profesionales son solicitados por la víctima", "Esta prohibición quedará sin efecto si los servicios profesionales han sido expresamente solicita- dos por la víctima"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q092", "src": "Básica P40 (MAD)", "n": 92, "e": "En el ámbito del tribunal del Jurado, para declarar la culpabilidad del acusado son ne- cesarios:", "o": ["9 votos", "5 votos", "7 votos"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q093", "src": "Básica P40 (MAD)", "n": 93, "e": "Los asientos del libro-registro de identificaciones que se tienen en las dependencias po- liciales a que hace referencia el artículo 16.2 de la LO 4/2015, de 30 de marzo, de protección de seguridad ciudadana, se cancelarán de oficio:", "o": ["Al año", "A los 3 años", "A los 5 años"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q094", "src": "Básica P40 (MAD)", "n": 94, "e": "Según el Acervo Schengen un ciudadano francés que llegue al aeropuerto de Madrid-Ba- rajas procedente de Bolivia:", "o": ["Pasará un control sistemático", "Pasará una inspección minuciosa", "Pasará una inspección mínima"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q095", "src": "Básica P40 (MAD)", "n": 95, "e": "El delito de lesiones al feto según nuestro Código Penal, puede darse por:", "o": ["Por imprudencia grave", "Por imprudencia menos grave", "Sólo por dolo  16 PROMOCIÓN N.º 40 "], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q096", "src": "Básica P40 (MAD)", "n": 96, "e": "Carmen va a pasar las navidades a una casa antigua familiar, al llegar se da cuenta de que no tiene luz y decide ponerse en contacto con su sobrino Juan, el «manitas» de la familia. Juan, tras realizar distintas alteraciones en los cables exteriores e instalar un dispositivo cerca de los contadores, consigue arreglarlo, sin darse cuenta de que se ha enganchado a la luz de la casa vecina. ¿Podría darse un delito de defraudación de fluido eléctrico?:", "o": ["No, se necesita dolo.", "Sí, se ha instalado un dispositivo con el fin de «engancharse» a la luz y es en beneficio propio.", "Sí, además de lo anterior, causa un perjuicio económico a la casa vecina."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q097", "src": "Básica P40 (MAD)", "n": 97, "e": "Según la orden INT/859/2023,, que desarrolla la estructura orgánica y funciones de los servicios centrales y territoriales de la Dirección General de la Policía, ¿a qué unidad está adscrito el Interlocutor Policial Nacional Sanitario?", "o": ["Unidad de Prevención de Riesgos Laborales.", "Unidad de Protección Socio Sanitaria.", "Unidad Central de Seguridad Privada."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q098", "src": "Básica P40 (MAD)", "n": 98, "e": "A tenor de lo dispuesto en el texto de la Carta Magna, España se constituye en un Estado so- cial y democrático de Derecho, que propugna como valores superiores de su ordenamiento jurídico:", "o": ["La libertad, la solidaridad y la justicia.", "La libertad, la igualdad y la justicia.", "La libertad, la solidaridad y el pluralismo político."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q099", "src": "Básica P40 (MAD)", "n": 99, "e": "La expulsión llevará consigo la prohibición de entrada en territorio español. La duración de la prohibición se determinará en consideración a las circunstancias que concurran en cada caso y su vigencia no excederá de:", "o": ["Dos años.", "Tres años.", "Cinco años."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P40-Q100", "src": "Básica P40 (MAD)", "n": 100, "e": "Los hechos acaecidos ayer no han echo más que crear confusión.", "o": ["Los hechos acaecidos ayer no han echo más que crear confusión.", "En la feria de arte habían muchas personas admirando las obras expuestas.", "En la feria de arte habían muchas personas admirando las obras expuestas.  17"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q001", "src": "Básica P41 (MAD)", "n": 1, "e": "El Tratado de Funcionamiento de la Unión Europea dispone que para ejercer las competen- cias de la Unión, las instituciones adoptarán:", "o": ["Reglamentos, directivas y decisiones.", "Reglamentos, directivas, decisiones, recomendaciones y dictámenes.", "Reglamentos, directivas, decisiones y dictámenes."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q002", "src": "Básica P41 (MAD)", "n": 2, "e": "¿Qué movimiento social surge como rechazo a la propuesta de una Acuerdo Multilateral de Inversiones, realizada en el marco de la OCDE a comienzos de 1998, que debía ser firmado por los países más ricos del mundo con la pretensión de constituirse una especie de Constitución Mundial del Capital?", "o": ["El Movimiento Antiglobalización.", "El Fórum Social Mundial.", "El Foro de Davos."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q003", "src": "Básica P41 (MAD)", "n": 3, "e": "¿Por cuántas salas está integrado el Tribunal Supremo, en virtud de lo establecido en la LO 6/85 del Poder Judicial?", "o": ["5.", "4.", "3."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q004", "src": "Básica P41 (MAD)", "n": 4, "e": "¿Qué fobia predica el rechazo a la mezcla y a la convivencia intercultural y en consecuencia defiende sociedades limpias?", "o": ["Disfobia.", "Mesofobia.", "Bifobia."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q005", "src": "Básica P41 (MAD)", "n": 5, "e": "¿Quién se encarga de realizar las auditorías y evaluaciones del sistema de prevención de riesgos de la Policía Nacional?", "o": ["La Unidad Central de Planificación Estratégica y Coordinación.", "La Inspección de Personal y Servicios de Seguridad.", "La Unidad de Planificación de Recursos Humanos.  3  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q006", "src": "Básica P41 (MAD)", "n": 6, "e": "En relación con la medida de protección consistente en evitar el contacto visual entre la víctima y el supuesto autor de los hechos, incluso durante la práctica de la prueba, para lo cual podrá hacerse uso de las tecnologías de la comunicación, ¿durante qué fase podrán ser adoptadas según la Ley 4/2015?", "o": ["Durante la fase de investigación.", "Durante la fase de ejecución.", "Durante la fase de enjuiciamiento."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q007", "src": "Básica P41 (MAD)", "n": 7, "e": "¿Qué principio básico de actuación de los miembros de las Fuerzas y Cuerpos de Seguridad encuadraría dentro de la «Adecuación al ordenamiento jurídico»?", "o": ["Actuar con integridad y dignidad. En particular, deberán de abstenerse de todo acto de corrup- ción y oponerse a él resueltamente.", "Impedir, en el ejercicio de su actuación profesional, cualquier práctica abusiva, arbitraria o discri- minatoria que entrañe violencia física o moral.", "Los miembros de las Fuerzas y Cuerpos de Seguridad deberán identificarse debidamente como tales en el momento de efectuar la detención."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q008", "src": "Básica P41 (MAD)", "n": 8, "e": "El artículo 78 de la Constitución Española dice que en cada Cámara habrá una Diputación Permanente compuesta por:", "o": ["Un máximo de veintiún miembros, que representarán a los grupos parlamentarios en proporción a su importancia numérica.", "Un mínimo de veintiún miembros, que representarán a los grupos parlamentarios en proporción a su importancia numérica.", "Un mínimo de veintiún miembros, que representarán de forma paritaria a los grupos paramentarios."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q009", "src": "Básica P41 (MAD)", "n": 9, "e": "Conforme dispone el Código Penal, es una de las circunstancias que atenúa la responsabi- lidad criminal:", "o": ["Obrar por causas o estímulos tan poderosos que hayan producido arrebato, obcecación u otro estado pasional de entidad semejante.", "Obrar superado por miedo insuperable.", "El que al tiempo de cometer la infracción penal se halle en estado de intoxicación plena por el consumo de bebidas alcohólicas, drogas tóxicas, estupefacientes, sustancias psicotrópicas u otras que produzcan efectos análogos, siempre que no haya sido buscado con el propósito de cometerla o no se hubiese previsto o debido prever su comisión, o se halle bajo la influencia de un síndrome de absti- nencia, a causa de su dependencia de tales sustancias, que le impida comprender la ilicitud del hecho o actuar conforme a esa comprensión."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q010", "src": "Básica P41 (MAD)", "n": 10, "e": "Según la Orden INT/859/2023, de 21 de julio, por la que se desarrolla la estructura orgá- nica y funciones de los servicios centrales y territoriales de la Dirección General de la Policía, ¿de quién depende la Brigada Central de Fraudes Informáticos?", "o": ["De la Unidad de Investigación Tecnológica.", "De la Unidad Central de Ciberdelincuencia.", "De la División de Operaciones y Transformación Digital."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q011", "src": "Básica P41 (MAD)", "n": 11, "e": "Tal y como dispone el artículo 116.4 de la Constitución Española, el estado de sitio será declarado:", "o": ["Por la mayoría absoluta del Congreso de Diputados, a propuesta exclusiva del Presidente del Gobierno.", "Por el Gobierno mediante Decreto acordado en Consejo de Ministros, previa autorización del Congreso de Diputados.", "Por la mayoría absoluta del Congreso de los Diputados, a propuesta exclusiva del Gobierno.  4 PROMOCIÓN N.º 41 "], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q012", "src": "Básica P41 (MAD)", "n": 12, "e": "Dentro de los sistemas de seguridad en el vehículo, ¿Cuál no pertenece al sistema de se- guridad pasiva?", "o": ["Control de tracción.", "Airbag.", "Sistemas eCall de llamada de emergencia."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q013", "src": "Básica P41 (MAD)", "n": 13, "e": "¿Qué competencias, respecto al control y servicios privados de seguridad, de las expues- tas pueden ser desarrolladas en la comunidad autónoma de Cataluña por su policía autonómica?", "o": ["Ninguna, ya que el control y servicios privados de seguridad es competencia exclusiva de la Poli- cía Nacional.", "La habilitación de la uniformidad, distintivos y medios de defensa del personal de seguridad.", "La inspección y sanción de los centros de formación del personal de seguridad privada que ten- gan su sede en la comunidad autónoma de Cataluña."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q014", "src": "Básica P41 (MAD)", "n": 14, "e": "Según lo dispuesto en el artículo 29 de la Ley 50/1997, de 27 de noviembre, del Gobierno, ¿Cuál de las siguientes opciones no es correcta?", "o": ["El Gobierna está sujeto a la Constitución y al resto del ordenamiento jurídico en toda su actuación.", "Todos los actos y omisiones del Gobierno están sometidos al control político de las Cortes Generales.", "Los actos que constituyan una vía de hecho del Gobierno y de los órganos y autoridades regula- dos en la presente Ley son impugnables ante el Tribunal Constitucional."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q015", "src": "Básica P41 (MAD)", "n": 15, "e": "El que, sin hallarse autorizado, distrajere las aguas de uso público o privativo de su curso, o de su embalse natural o artificial, será castigado por un:", "o": ["Delito contra los recursos naturales.", "Delito contra el medio ambiente.", "Delito de usurpación."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q016", "src": "Básica P41 (MAD)", "n": 16, "e": "Las empresas de seguridad privada deberán obtener autorización administrativa para la prestación de servicios de seguridad privada, que tendrá una validez de:", "o": ["Cinco años.", "Diez años.", "Indefinida."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q017", "src": "Básica P41 (MAD)", "n": 17, "e": "Ejerce la coordinación de los Centros de Cooperación Policial y de Cooperación Policial y Aduanera:", "o": ["La Dirección General de Relaciones Internacionales y Extranjería.", "La Subdirección General de Cooperación Policial Internacional.", "La Dirección General de Coordinación y Estudios."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q018", "src": "Básica P41 (MAD)", "n": 18, "e": "¿Cómo se denomina la técnica por la cual un ciberdelincuente realiza una suplantación de identidad por nombre de dominio, la cual consiste en una relación falsa entre IP y nombre de dominio?", "o": ["Scareware.", "Session Hijacking.", "DNS spoofing.  5  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q019", "src": "Básica P41 (MAD)", "n": 19, "e": "Los ejes de actuación del Observatorio Español del Racismo y la Xenofobia se encuadran en la Estrategia Integral contra el racismo, la discriminación racial, la xenofobia y otras formas conexas de intolerancia, siendo las Fuerzas y Cuerpos de Seguridad uno de los ejes prioritarios donde se lleva a cabo varios proyectos, entre los que no se halla:", "o": ["PROXIMITY.", "FIRIR.", "PANDORA."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q020", "src": "Básica P41 (MAD)", "n": 20, "e": "La Ley 31/1995, de prevención de riesgos laborales, establece que el empresario aplicará las medidas que integran el deber general de prevención con arreglo a una serie de principios generales, ¿Cuál de los siguientes es uno de estos principios de la acción preventiva?", "o": ["Evaluar los riesgos que se puedan evitar.", "Adoptar medidas que antepongan la protección individual a la colectiva.", "Dar las debidas instrucciones a los trabajadores."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q021", "src": "Básica P41 (MAD)", "n": 21, "e": "Conforme dispone el artículo 6 del Real Decreto 207/2024, de 27 de febrero, por el que se desarrolla la estructura orgánica básica del Ministerio del Interior, ¿Cuál es el órgano de apoyo y asesoramiento a través del cual la persona titular de la Secretaría de Estado de Seguridad ejerce su función de coordinación y supervisión de la actuación de las Fuerzas y Cuerpos de Seguridad del Estado y de colaboración con las Policías Autonómicas y las Policías Locales?", "o": ["La Dirección General de Coordinación y Estudios.", "La Dirección General de Política Interior.", "La Secretaría General Técnica."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q022", "src": "Básica P41 (MAD)", "n": 22, "e": "Conforme a las publicaciones del Plan Nacional sobre Drogas, ¿Cuáles de las nuevas sus- tancias psicoactivas, asociadas a prácticas sexuales de riesgo, es un potente depresor del siste- ma nervioso central que inicialmente puede producir sensación de bienestar y euforia, es hidro- soluble y es conocido como «éxtasis líquido»?", "o": ["GHB.", "Ketamina.", "Poppers"], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q023", "src": "Básica P41 (MAD)", "n": 23, "e": "El artículo 4 del Real Decreto 137/1993, de 29 de enero, por el que se aprueba el Regla- mento de Armas, prohíbe la fabricación, importación, circulación, publicidad, compraventa, te- nencia y uso de las siguientes armas o de sus imitaciones:", "o": ["Las ballestas.", "Las pistolas y revólveres que lleven adaptado un culatín.", "Las armas inutilizadas."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q024", "src": "Básica P41 (MAD)", "n": 24, "e": "Según las clases de empleados públicos que efectúa el artículo 8 del Real Decreto Legis- lativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, se clasifican en:", "o": ["Funcionario laboral fijo, funcionario eventual y funcionario fijo-discontinuo.", "Funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual.", "Funcionarios de carrera, personal laboral, personal de Cuerpos Generales y personal del Cuerpo Superior de la Administración.  6 PROMOCIÓN N.º 41 "], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q025", "src": "Básica P41 (MAD)", "n": 25, "e": "La Oficina de Marca de la Policía Nacional está incardinada en:", "o": ["La Subdirección General de Recursos Humanos y Formación.", "La Subdirección General de Logística e Innovación.", "El Gabinete Técnico."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q026", "src": "Básica P41 (MAD)", "n": 26, "e": "Atendiendo a la Ley Orgánica 4/2015, de 30 marzo, de protección de la seguridad ciudada- na, al realizar un registro corporal externo se respetarán los principios de:", "o": ["Proporcionalidad, igualdad de trato, no discriminación e injerencia mínima.", "Necesidad, idoneidad, proporcionalidad, no discriminación.", "Proporcionalidad, igualdad de trato y necesidad."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q027", "src": "Básica P41 (MAD)", "n": 27, "e": "Según dispone el artículo 14 del Real Decreto 39/1997, por el que se aprueba el Regla- mento de los Servicios de Prevención, el empresario deberá constituir un servicio de prevención propio cuando se trate de empresas que cuenten con más de:", "o": ["150 trabajadores.", "250 trabajadores.", "500 trabajadores."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q028", "src": "Básica P41 (MAD)", "n": 28, "e": "La Comisión Nacional para la Protección de las Infraestructuras Críticas se creó como ór- gano colegiado adscrito a:", "o": ["Centro Nacional para la Protección de las Infraestructuras Críticas.", "A la Secretaría de Estado de Seguridad.", "Al Ministerio del Interior."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q029", "src": "Básica P41 (MAD)", "n": 29, "e": "Un individuo que paseando por la calle se encuentra un juego de llaves en el que en el llavero pone su dirección, el hombre se presenta en la dirección indicada, abre la puerta con las llaves que se ha encontrado y sustrae un teléfono móvil de un valor de 400 euros, posteriormente cierra la puerta y abandona el lugar, esta persona ¿Qué delito estaría come- tiendo?", "o": ["Delito de robo con fuerza en las cosas.", "Delito de hurto.", "Delito leve de hurto."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q030", "src": "Básica P41 (MAD)", "n": 30, "e": "¿A quién corresponde la función de actuar como Unidad Nacional de la Agencia de la Unión Europea para la Formación Policial (CEPOL)?", "o": ["La División de Formación y Perfeccionamiento de la Dirección General de la Policía.", "La Unidad de Coordinación Internacional de la División de Cooperación Internacional de la Direc- ción General de la Policía.", "La Dirección General de Coordinación y Estudios."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q031", "src": "Básica P41 (MAD)", "n": 31, "e": "Según la normativa española y el Reglamento de Armas, un arma antigua es aquella arma de fuego cuyo modelo o cuyo año de fabricación es anterior a la siguiente fecha:", "o": ["1 de enero de 1890.", "1 de enero de 1880.", "1 de enero de 1870.  7  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q032", "src": "Básica P41 (MAD)", "n": 32, "e": "Según se establece en la Constitución Española, el Defensor del Pueblo es designado para la defensa de los derechos comprendidos en el Título I de la Constitución Española, por:", "o": ["El Congreso de los Diputados.", "El Senado.", "Las Cortes Generales."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q033", "src": "Básica P41 (MAD)", "n": 33, "e": "Dentro del ciclo de la información, en la fase de obtención, cuando se refiere al término SIGINT, indique a qué hace referencia dicho término.", "o": ["Información procedente de fuentes técnicas.", "Información procedente de fuentes humanas.", "Información procedente del análisis de imágenes e información geográfica."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q034", "src": "Básica P41 (MAD)", "n": 34, "e": "¿Quién asume la gestión, asesoramiento y apoyo, a través de la Oficina del Policía, del personal adscrito a la Dirección General de la Policía?", "o": ["La Secretaría General del Gabinete Técnico.", "La Secretaría General de la División de Personal.", "La Secretaría General de la Subdirección General de Recursos Humanos y Formación."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q035", "src": "Básica P41 (MAD)", "n": 35, "e": "¿Cómo se denomina el fraude basado en la ingeniería social y en la suplantación de iden- tidad, que se realiza a través de llamadas telefónicas, donde el atacante suplanta la identidad de una empresa, organización o incluso de una persona de confianza, con el fin de obtener informa- ción personal de sus víctimas?", "o": ["Smishing.", "Phishing.", "Vishing."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q036", "src": "Básica P41 (MAD)", "n": 36, "e": "La Dirección General de la Policía garantiza la vigilancia periódica de la salud de los fun- cionarios del Cuerpo Nacional de Policía. Los reconocimientos médicos establecidos para la pre- vención de los riesgos inherentes a la función policial serán:", "o": ["Siempre de carácter voluntario y en todo caso se deberá optar por la realización de aquellos recono- cimientos o pruebas que causen las menores molestias al funcionario y que sean proporcionales al riesgo.", "Siempre de carácter obligatorio y la negativa injustificada a someterse a reconocimiento médico, prueba de alcoholemia o de detección de drogas tóxicas, estupefacientes o sustancias psicotrópicas, legítimamente ordenadas, a fin de constatar la capacidad psicofísica para prestar servicio, comportará una falta disciplinaria muy grave.", "Los reconocimientos médicos serán voluntarios, pudiendo resultar obligatorios en determinados casos."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q037", "src": "Básica P41 (MAD)", "n": 37, "e": "Para adquirirse la condición de funcionario de carrera se debe cumplir unos requisitos de forma sucesiva. Conforme dispone el Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, ¿Cuál de las alternativas propuestas es el último de lo requisitos que debe cumplir para ser nombrado como tal?", "o": ["Nombramiento por el órgano o autoridad competente, que será publicado en el Diario Oficial correspondiente.", "Acto de acatamiento de la Constitución, y, en su caso, del Estatuto de Autonomía correspondien- te y del resto del ordenamiento jurídico.", "Toma de posesión dentro del plazo que se establezca.  8 PROMOCIÓN N.º 41 "], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q038", "src": "Básica P41 (MAD)", "n": 38, "e": "Según la pertenencia a las distintas escalas, a los policías nacionales les corresponde el desempeño de las siguientes funciones:", "o": ["A la escala ejecutiva, la dirección de los servicios policiales.", "A la escala superior, el mando de los servicios policiales.", "A la escala de subinspección, la supervisión de los servicios policiales."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q039", "src": "Básica P41 (MAD)", "n": 39, "e": "La ONU aprobó la Agenda 2030 sobre el Desarrollo Sostenible, una oportunidad para que los países y sus sociedades emprendiesen un nuevo camino con el que mejorar la vida de todos, sin dejar a nadie atrás. ¿Cuál es el número de objetivos de la citada agenda?", "o": ["15 objetivos.", "16 objetivos.", "17 objetivos."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q040", "src": "Básica P41 (MAD)", "n": 40, "e": "El Catálogo Nacional de Infraestructuras Estratégicas tiene, conforme a lo dispuesto en la legislación vigente, la siguiente calificación:", "o": ["Confidencial.", "Reservado.", "Secreto."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q041", "src": "Básica P41 (MAD)", "n": 41, "e": "Cuando una persona solicita protección internacional, la intervención que se lleva a cabo a través de un itinerario de acogida se desarrolla en tres fases:", "o": ["Valoración inicial y derivación, acogida y autonomía.", "Actuación inicial y derivación, acogida y protección.", "Atención primaria y derivación, acogida e inclusión social."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q042", "src": "Básica P41 (MAD)", "n": 42, "e": "El aforismo «mullun crimen, nulla poena sine praevia lege» se utiliza en Derecho penal para expresar el principio de:", "o": ["Intervención mínima.", "Proporcionalidad.", "Legalidad."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q043", "src": "Básica P41 (MAD)", "n": 43, "e": "¿Qué tipo de visado es aquel que habilita a una persona extranjera para trabajar por cuen- ta ajena hasta nueve meses es un período de doce meses consecutivos?", "o": ["Visado de estancia.", "Visado de residencia y trabajo de temporada.", "Visado de tránsito."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q044", "src": "Básica P41 (MAD)", "n": 44, "e": "La Ley /2014, de 4 de abril, de Seguridad Privada, regula las obligaciones generales de los despachos de detectives privados, entre los que se encuentra:", "o": ["Facilitar de forma inmediata a la autoridad gubernativa o a las Fuerzas y Cuerpos de Seguridad competentes las informaciones sobre hechos administrativos de que tuvieren conocimiento en rela- ción con su trabajo.", "No informar a sus clientes sobre las incidencias relativas a los asuntos que les hubieren encargado.", "Formalizar por escrito un contrato por cada servicio de investigación que les sea encargado, co- municando su celebración al Ministerio del Interior o, en su caso, al órgano autonómico competente en la forma que reglamentariamente se determine.  9  ESCALA BÁSICA DE LA POLICÍA NACIONAL"], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q045", "src": "Básica P41 (MAD)", "n": 45, "e": "Aquel que con ánimo de lucro y valiéndose de alguna manipulación informática o artificio semejante, consigan una transferencia no consentida de cualquier activo patrimonial en perjui- cio de otro, estará cometiendo un delito de:", "o": ["Estafa.", "Apropiación indebida.", "Daños informáticos."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q046", "src": "Básica P41 (MAD)", "n": 46, "e": "Conforme dispone el Vigente Real Decreto 629/2022, de 26 de julio, podrán obtener una autorización de residencia, por un período de doce meses, los extranjeros que por arraigo para la formación acrediten la permanencia continuada en España durante un periodo mínimo de:", "o": ["Un año.", "Dos años.", "Tres años."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q047", "src": "Básica P41 (MAD)", "n": 47, "e": "¿En qué caso tienen los miembros de las Fuerzas y Cuerpos de Seguridad la consideración de autoridad?", "o": ["En ningún caso.", "Siempre que se hallen en el ejercicio de sus funciones.", "Al efecto de su protección penal, cuando se cometa delito de atentado, empleando en su eje- cución armas de fuego, explosivos u otros medios de agresión de análoga peligrosidad, que puedan poner en peligro grave la integridad física de los mismos."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q048", "src": "Básica P41 (MAD)", "n": 48, "e": "El Código Penal Español vigente establece que el asesinato será castigado con pena de prisión permanente revisable cuando concurra alguna de las circunstancias siguientes:", "o": ["Que la víctima sea menor de dieciocho años.", "Cuando el reo de asesinato hubiera sido condenado por la muerte de dos personas.", "Que el hecho sea subsiguiente a un delito contra la libertad sexual que el autor hubiere cometido sobre la víctima."], "c": 1, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q049", "src": "Básica P41 (MAD)", "n": 49, "e": "En los supuestos de vacante, ausencia o enfermedad de la persona titular de la Dirección Adjunta Operativa, corresponde a la suplencia en primer lugar a:", "o": ["La persona titular del Gabinete Técnico.", "La persona titular de la Subdirección General de Logística e Innovación.", "La persona titular de la Subdirección General de Recursos Humanos y Formación."], "c": 2, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q050", "src": "Básica P41 (MAD)", "n": 50, "e": "Los vehículos celulares para el transporte de detenidos, presos y penados de hasta nueve plazas, incluido el conductor y escolta, deberán estar dotados de:", "o": ["Un extintor de polvo de 6 kilogramos, situado de forma que sea fácilmente accesible a los miem- bros de la escolta.", "Un extintor de polvo de 8 kilogramos, situado de forma que sea fácilmente accesible a los miem- bros de la escolta.", "Un extintor de polvo de 12 kilogramos, situado de forma que sea fácilmente accesible a los miem- bros de la escolta."], "c": 0, "d": null, "t": null, "x": "" }, { "id": "EB-P41-Q051", "src": "Básica P41 (MAD)", "n": 51, "e": "En la organización centra
